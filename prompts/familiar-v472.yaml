  [Pads and Bass Intro: lush reverb pad bloom, Reese sub-roll enters, no drums yet, 8 bars]

  [Rolling Break Drops: liquid break kicks in under the groove, chalumeau enters low, 4 bars]

  [Verse 1: warm piano and rolling break, chalumeau countermelody, 12 bars]
