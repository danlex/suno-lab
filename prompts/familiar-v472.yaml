style: |
  Bittersweet-euphoric liquid drum and bass, total duration around 3:00, soaring emotive female vocal riding a rolling break at 176 BPM with a half-time harmonic feel — fast and floaty, deeply danceable. Polished studio mix in C-sharp major. Warm Reese sine sub-roll bass locks onto a half-time downbeat, lush reverb-drenched pads bloom wide on the stereo stage, a warm piano lays chord swells across the groove, and a chalumeau reed weaves a low jazzy countermelody beneath the vocal. Deep low-end definition from the rolling break, wide stereo stage on the pad layer. The vocal is full and ringing, not chopped — long sustained notes held over bass drops, syncopated pickups into rising stepwise lines. Longing at speed, uplift with an ache. No pipe organ, no distorted guitars, no neurofunk growl bass, no trap hi-hats, no rock drums.
title: "Familiar472"
