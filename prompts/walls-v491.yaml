style: "Confessional anthemic indie-rock with crushing quiet-loud dynamic contrast, polished studio mix with wide stereo stage, recorded at 127 BPM in B major. A close-mic slightly raspy male lead — doubting and intimate in whispered dry verses, fully committed and soaring in the explosive choruses. Gang backing vocals (\"whoa-oh\" singalong crowd) slam in with the chorus and carry the hook. Core bed: jangly clean electric guitar in the hushed verse, then a stacked fuzzy guitar wall detonates at every chorus. Driving electric bass, live rock drums, guitar-primary throughout. Deep low-end definition from the bass and kick in the loud sections. The song lives in the space between collapse and survival — scraped-thin exhaustion in the verse, cathartic defiant-hopeful release in the chorus. Warm tape saturation on the guitars, tight chamber reverb on the gang vocals. No synthesizers, no electronic drums, no orchestral strings, no EDM, no trap."

lyrics: |
  [Verse 1: hushed, dry close-mic — clean guitar only, almost whispered male vocal]
  I slept on the floor of a room that forgot my name
  Three in the morning, the ceiling was all I claimed
  I counted the cracks until the counting was all I knew
  Couldn't call it giving up — just couldn't call it through

  [Pre-Chorus: voice tightening, guitar barely rising]
  Something shifted in the plaster, something low
  Not a voice, not a light — just the room letting go

  [Chorus: full explosive — fuzzy stacked guitar wall slams in, live drums punch, gang vocals enter]
  I was almost gone and then the walls sang
  (whoa-oh — walls sang)
  Every hollow room remembered every broken thing
  (whoa-oh — walls sang)
  I was almost gone but the echo had my name
  And I'm standing in the wreckage of the almost, unashamed

  [Verse 2: hushed again — stark quiet-loud reset, intimate raspy vocal]
  I sold off the pieces that I thought were keeping me whole
  Traded every guardrail for the feeling of some control
  Didn't know a room could hold a man the way arms do
  But that night the walls were the only ones who knew

  [Pre-Chorus: voice tightening, guitar barely rising]
  Something pushed against the silence, something old
  Not a rescue, not a reason — just the room taking hold

  [Chorus: explosive — full fuzzy-guitar wall + gang vocals, live drums crashing]
  I was almost gone and then the walls sang
  (whoa-oh — walls sang)
  Every hollow room remembered every broken thing
  (whoa-oh — walls sang)
  I was almost gone but the echo had my name
  And I'm standing in the wreckage of the almost, unashamed

  [Bridge: stripped bare — single clean guitar + exposed male vocal, no drums, no fuzz]
  And I don't know what saves a man
  Maybe nothing does, maybe the room just can
  Carry what you can't — hold what won't hold
  Some things only bare walls know

  [Final Chorus 1 of 2: no comedown — full fuzzy-guitar wall detonates, live drums, gang vocals]
  I was almost gone and then the walls sang
  (whoa-oh — walls sang)
  Every hollow room remembered every broken thing
  (whoa-oh — walls sang)
  I was almost gone but the echo had my name
  And I'm standing in the wreckage of the almost, unashamed

  [Final Chorus 2 of 2: maximum sustained — gang vocals full, guitars wall, drums driving]
  I was almost gone and then the walls sang
  (whoa-oh — walls sang)
  Every hollow room remembered every broken thing
  (whoa-oh — walls sang)
  I was almost gone but I chose to stay and fight
  And I'm standing in the ringing of the almost — I'm alright

  [Outro: full-band sustained drive — guitars locked, bass walking, gang vocal repeats under]
  (whoa-oh — walls sang)
  (whoa-oh — walls sang)
  (walls sang)

  [End]

