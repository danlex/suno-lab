notes: |
  v491 TOURNAMENT WINNER (inline-judged 86/100; beat sibling candidate A "classic build + guitar solo" at 80 on a deeper/more vivid cohesive narrative, a stronger hook payoff, and a more distinctive/effective quiet-loud-quiet architecture). Lane: CONFESSIONAL / ANTHEMIC INDIE-ROCK (guitar-forward, male) — never used; the FIRST guitar-primary male rock lane of the v300+ era (all recent male lanes were groove/rhythm-primary). Maximum contrast to v490's bright uplifting FEMALE gospel-pop.

  HIGH VARIANCE: guitar-primary rock (not synth/organic-groove), close-mic raspy MALE (not belt-female), raw-confessional→cathartic mood, B major. Vocal-gender alternation M/F held across v477-v491. NOTE: deliberately dropped the researcher's suggested "gospel-choir surge" (too close to v490's choir) and used GANG/GROUP backing vocals ("whoa-oh" indie-stadium singalong) instead — keeps the guitar-rock identity clean and the contrast from v490 sharp. Accepted moderate danceability as the trade for the guitar-forward variance.

  HOOK: "I was almost gone and then the walls sang" (hook-writer 20/25) — the room itself echoing back as witness (spatial/involuntary, not a commanded crowd-uplift). Contour: stepped iambic rise "I was al-most gone" (B-B-D#-D#-F#), held "gone," pickup "and then the," octave LEAP to B5 on "WALLS" (anthem peak), "sang" drops a fourth to F# (dominant) held unresolved — a gap the GANG VOCALS fill with "(whoa-oh — walls sang)". Narrative ties the walls throughout ("the walls were the only ones who knew"; "Some things only bare walls know").

  ARCHITECTURE — QUIET-LOUD-QUIET dynamic + NO-COMEDOWN double final (no modulation): hushed dry close-mic verse → EXPLOSIVE fuzzy-guitar-wall + gang-vocal chorus (the classic indie/grunge dynamic lever) → 2nd hushed verse → chorus → STRIPPED bare bridge (clean guitar + naked vocal, doubt returns — NOT silence) → a NO-COMEDOWN DOUBLE final chorus that stays at max + driving outro. Climax is dynamic/arrangement, NO key change (deliberately dropped the researcher's suggested half-step lift, a penalized template).

  DURATION LEVER: the stripped bridge + the doubled final chorus + full outro + full sung arc; kept live throughout (the bridge is stripped, not silent — no truncation risk).

  INSTRUMENTS: jangly clean electric guitar (verse) → stacked fuzzy guitar wall (chorus) + driving electric bass + live rock drums + gang backing vocals. Guitar-primary (guitar-rock is a fresh lane vs the v483 shoegaze feedback-wall — this is jangly/anthemic, a different use). BPM 127 (novelty gap 274, near-virgin) and B major (novelty gap 31, bright anthemic — breaks the recent minor run) from the novelty surface, avoiding all recent keys/tempos.

  NEGATIVES AUDIT (feedback_negative_prompt_contradiction): does NOT exclude vocals/singing/guitar/electric-guitar/bass/drums (all core). Excludes synths/electronic-drums/EDM/trap + metal/screamo (keeps it indie-rock, not metal) + gospel-choir (to keep gang vocals, not a choir). English, no place-names.

  Style char count: 943.

