notes: |
  TECHNIQUE — THRENODY-TO-APOTHEOSIS ARC: A late-Romantic and cinematic formal cue structure built on two phases joined by a central crisis. A threnody is a formal lament — historically a genre of Greek dirge poetry and, in the orchestral tradition, a slow movement of grief and memorial weight. Here it functions as a structural opening: a solo instrument states a grief theme over a sustained orchestral bed, building emotional investment. The central crisis erupts and fragments that theme, creating maximum dissonance and dramatic debt. The apotheosis resolves the debt by returning the same melodic material transformed — lifted in key, reinstrumented in a warmer register, swelled to luminous fullness. The form's power comes from thematic identity across transformation: the listener recognizes the grief theme inside the glory statement, and the release is proportional to the debt. This concept was researched for its formal architecture; all named composers associated with the form (e.g. Górecki, Barber, Elgar) are excluded per the project blocklist, and this prompt does not reference any by name.

  DURATION DEFENSE: The last three cycles (v226, v232, v233) rendered short (under 1:35) because sparse experimental textures allowed Suno to "finish" once the primary texture established. This cycle counters with three overlapping defenses: (1) the full orchestra is present and active throughout — not a slow build but an active ensemble from bar one, creating ongoing timbral complexity Suno must continue rendering; (2) the threnody-to-apotheosis arc creates explicit structural "debt" — the apotheosis cannot arrive until the crisis has fired, and the crisis cannot fire until the threnody has established — Suno must follow the arc to its conclusion; (3) the lyrics sections are richly descriptive with 1–2 sentences of action and imagery each, giving the model more material to render against before it considers the piece complete. Target: 2:30–3:30 with ~3:00 nominal render.

  TRIO ROLE ASSIGNMENT:
  - OBOE D'AMORE (×8 total, last v219 — 15-gap): The threnody voice. Opens alone at 0:00, stating the grief theme in falling intervals over tremolo strings. This instrument's warm, slightly veiled tone sits between oboe brightness and English horn weight — ideal for a formal lament. It reappears briefly in the final settle as a memory echo.
  - MELLOTRON (×4 total, last v216 — 18-gap): The choral cushion and spectral texture layer. In the threnody it adds a slow, breath-like warmth beneath the oboe. During the crisis it shifts to a sharp spectral pad, holding harmonic center under the chaos. In the apotheosis it rises to a luminous lifted pad under the swell.
  - FLUGELHORN (×5 total, last v221 — 13-gap): The apotheosis voice. Emerges from the wreckage of the crisis as the transformed carrier of the grief theme. Its warm, round, centered tone is the antithesis of the crisis's sharp brass — the same brass family now reconciled to beauty. Carries the half-step-lifted theme over the full brass choir in the apotheosis.

  NOVELTY CLAIMS:
  - First THRENODY-TO-APOTHEOSIS ARC technique in the catalog.
  - OBOE D'AMORE at 15-gap (last v219), MELLOTRON at 18-gap (last v216, deepest gap of the three), FLUGELHORN at 13-gap (last v221).
  - 128 BPM: deep revival (last used at v96 — gap 138 versions). The moderate processional pulse is slow enough for the threnody to breathe, fast enough for the apotheosis to feel forward-driving without becoming march-like.
  - Key: D-sharp minor home → E minor with E-major coloration at apotheosis. Half-step lift coincides with theme transformation and reinstrumentation — three simultaneous payoff signals (key + instruments + register) landing at the same structural moment.
  - Scene: exile crossing a high mountain pass at nightfall — threnody = the long climb in failing light, crisis = the summit storm, apotheosis = the descent into the new valley as dawn breaks the cloud. Scene is new to the catalog (no recent uses of mountain-pass-at-nightfall, crossing-at-nightfall, or high-pass imagery in v200+).

