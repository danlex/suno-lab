notes: |
  v304 "Ukufa" — Zulu isicathamiya x cinematic orchestral ballad.
  CATALOG DEBUT: zero Bantu-language / Zulu-choral entries across all
  303 prior versions. 34th distinct language (isiZulu). 45th orthogonal
  voice (Zulu close-harmony male choral drone with stacked low-to-high
  chest resonance and solo cantor call).

  TECHNIQUE: Isicathamiya is a Zulu a cappella close-harmony tradition
  developed in the migrant labor hostels of southern Africa, later
  refined on competitive choir stages. Its signature is four-part
  male close-harmony — bass, baritone, second tenor, first tenor —
  stacked as one breathing body rather than stereo-distributed SATB
  rows. The bass-baritone layer forms a chest-resonant unison drone;
  the tenor voices thicken above; a solo cantor (iqembu leader) rides
  the top in call-and-response, his line more ornamented and free than
  the strict harmonic grid below. isiZulu phonetics contribute voiced
  fricative clusters (hl, dl) and lateral-click-adjacent consonant
  attacks (c, q, x) that give syllables a sharp percussive front edge
  unlike any smooth European choral blend. The tradition is distinct
  from Georgian three-voice polyphony (open-fifth convergence, female
  soprano arc), Bulgarian women's voices (dissonant seconds, female),
  and all 44 prior voices in the catalog.

  CONCEPT SOURCE: Isicathamiya four-part male close-harmony drone with
  solo cantor call-and-response, isiZulu sacred-mourning ballad at 74
  BPM, A minor natural, KwaZulu-Natal valley dusk scene, trio of uhadi
  mouth bow + bass flute pedal + string orchestra sustain.

  COMPOSER OMISSION CONFESSION: This concept echoes a close-harmony
  tradition whose most internationally celebrated ensemble and their
  longtime artistic director are withheld per artist-name blocklist
  discipline. The choral architecture — chest-resonant unison drone,
  stacked four-part harmony, call-and-response cantor — is the
  instrument, not any individual's compositional voice. The avoid list
  in exclude_styles blocks the specific proper nouns (ensemble name,
  personal name, record label era) that would trigger those artist-
  match auto-tags.

  DURATION STRATEGY: BPM 74 = slow-BPM territory (<=115 caps at ~3:30).
  Target: 3:00-3:15. Not fighting the ceiling — optimizing emotional
  density via harmonic layer accumulation instead. Playbook moves:
  - Parametrized colon-lyrics with bar counts per section
  - Three production tokens: "polished studio mix", "deep low-end
    definition", "lush acoustic ambience"
  - Three body voices: uhadi (plucked-mouth-bow body resonator) +
    bass flute (large-bore cylindrical body) + string orchestra
    sustain (string body section) — all three satisfy >=2 body voice
    rule; none spectral
  - Sentence case throughout style, no ALL-CAPS form labels
  - Atmospheric-first opening (KwaZulu-Natal valley dusk before
    production tokens)
  - No [Silence] metatag anywhere — hardened rule per v290+v303
    cross-genre confirmation; arc uses harmonic layering accumulation
    and reverse-peel coda instead
  - Sustained crescendo via layer accumulation: uhadi alone (8 bars)
    -> bass flute pedal added (6 bars) -> bass+baritone drone (8 bars)
    -> tenor thickens (8 bars) -> solo cantor call (10 bars) -> choir
    response + swell (12 bars) -> four-part convergence climax (14 bars)
    -> plateau reverse-peel (8 bars) -> uhadi reprise alone (6 bars)
  - Total lyric bars: 80 bars at 74 BPM targeting 3:00-3:15 wall clock

  INSTRUMENTS:
  - Uhadi (catalog debut, gap infinity, 303 cycles): Zulu mouth bow —
    a single-string bow resonated against the open mouth cavity,
    producing overtone-series partials by shaping the oral chamber.
    Dry percussive pluck on the string, bright harmonic shimmer above.
    Opens alone for 8 bars on root A, returns alone in the final
    6-bar coda. First appearance in 303-version catalog.
  - Bass flute (last v241, 62-cycle gap): large-bore flute pitched an
    octave below concert flute, dark tubular warmth, natural sustain on
    long low tones — ideal for a root-pedal drone beneath the choral
    mass. Returns after 62-cycle absence as the harmonic foundation
    pedal, entering under the uhadi at bar 9 and fading on the final
    tone in the coda.
  - String orchestra sustain (last v147, 156-cycle gap): full string
    section (violins, violas, cellos, basses) in long sustained bow
    strokes, no pizzicato, no ornament — pure harmonic cradle beneath
    the choral stack. Returns after 156-cycle absence; enters with the
    tenor layer at the fourth section, swells with choir response,
    holds at full sustain through climax convergence, then recedes with
    the plateau reverse-peel.

  VOICE DIFFERENTIATION — 45th orthogonal voice. Zulu isicathamiya
  four-part male close-harmony: bass+baritone chest-resonant unison
  drone + tenor harmonic layer + solo cantor. Distinct from all 44
  prior voices via: (1) chest-drone unison architecture — voices fused
  into one resonant body vs. stereo-distributed European SATB rows;
  (2) isiZulu phoneme inventory — voiced fricative clusters (hl, dl)
  and click-adjacent consonant attacks give syllables percussive
  front-edge no smooth-choral voice uses; (3) call-and-response
  cantor role — one voice rides freely above the stack, not a duet
  and not a solo aria; distinct from v303 Georgian polyphony (female
  soprano + open-fifth bani drone + ornamental middle), v298 Latin
  soprano bel canto, v300 two-voice duet, v302 Tamil nadaswaram.

  LANGUAGE: isiZulu — 34th distinct language. Vocabulary used:
  "ukufa" (death, the passing away), "umoya" (spirit, wind, breath),
  "izulu" (sky, heaven, the heavens), "ekhaya" (home, at home),
  "intaba" (mountain), "uthando" (love), "phakade" (forever, always),
  "ngiyabonga" (I give thanks, I am grateful), "uMama" (mother),
  "ubaba" (father), "buyela" (return, go back), "sikhumbula"
  (we remember, we miss). Sacred-mourning ballad concept: evening over
  the valley, ancestors in the wind, the passing returns to the sky but
  love remains forever — a funeral lament addressed to the departed
  parent, offering gratitude and farewell.

  BLOCK RATIONALE: exclude_styles blocks all identity-adjacent triggers
  that could drift the auto-classifier: Georgian/Bulgarian/Mongolian/
