notes: |
  Technique: broken-beat alt-R&B / neo-soul groove. The broken-beat technique
  places the snare an eighth note early relative to the four-on-the-floor grid,
  creating a displaced pocket that triggers a physical anticipation response —
  the body moves before the mind catches up. Extended jazz harmony (9th and 11th
  voicings) over a dry woody kick and melodic bass counter-line completes the
  groove signature. Zero prior catalog representation: the nearest neighbour is an
  orchestral neo-soul entry at v210, but this cycle is stripped and groove-first
  with no orchestra.

  Concept source: charts-informed original — current alt-R&B scene (2025-2026)
  prioritises rhythmic displacement and harmonic warmth over lyric density or
  orchestral scale. The composition defers to the groove as the star.

  This technique echoes a lineage of late-1990s UK broken-beat producers and
  early-2000s American neo-soul artists without naming any of them, per blocklist.

  Duration strategy: 169 BPM is unused in the catalog (new-bpm). At 169 BPM with
  a half-time feel, Suno reads a fast base clock but renders the groove at ~84 BPM
  felt pace — avoiding the slow-BPM ~3:30 cap while maintaining an unhurried
  neo-soul pocket. Timestamps anchor eight sections from 0:00 to 2:50 with the
  final lyric section at 2:50, late-section time anchor also stated in the style
  field ("final section at 2:35, fade near 2:55") per feedback_short_render_late_timestamp.
  No [Silence] metatag used — vulnerability peak at 2:05 Bridge conveyed via
  section label only, per feedback_silence_gate_truncates. Half-step key lift
  (D-sharp minor to E minor) at 2:35 final chorus for emotional lift. Production
  tokens: polished studio mix, warm tape saturation, deep low-end definition.
  Sentence case throughout. Atmospheric-first opening. Inline negatives preserve
  drums and synths (groove needs them) while targeting orchestral/cinematic drift.

  Instruments:
  - Tenor saxophone (gap 73): voice-like mid-register hook lines weaving between
    vocal phrases, warm breath tone with 9th/11th harmonic colour.
  - Trombone (gap 81): low-brass stabs and glissandi punctuating the offbeat
    pockets with groove punch — the most percussive element in the trio.
  - Mellotron (gap 74): warm, slightly worn sustained pad undertow giving the
    texture emotional weight without rising to orchestral swell.

  Novelty claims:
  - New technique: broken-beat alt-R&B / neo-soul groove (zero catalog precedent).
  - New BPM: 169 (unused in catalog).
  - New key pair: D-sharp minor to E minor.
  - New scene: close-mic'd groove room, rhythm-first alt-R&B.
  - Differentiated from: ballad (v327), indie-pop (v328), nu-disco (v329),
    folk-pop anthem (v330), dream-pop/shoegaze (v331).

  Style char count: 943. Lyrics char count: 978.

