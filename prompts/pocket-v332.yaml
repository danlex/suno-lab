name: "pocket-v332"
version: 332
title: "Pocket"
instrumental: false
vocal_gender: female

style: "Broken-beat alt-R&B neo-soul groove, intimate and soulful — a close dry room, warm lamp light, a voice inside a syncopated pocket that lands just before you expect it. Polished studio mix, warm tape saturation, deep low-end definition. D-sharp minor lifting to E minor near 2:35, fade near 2:55. 169 BPM half-time broken pocket, felt as unhurried neo-soul with snare displaced an eighth early. Dry woody kick and melodic bass counter-line anchor throughout. Tenor saxophone weaves voice-like lines between vocal phrases, warm breath tone with jazz harmonics. Trombone punches low-brass stabs and glissandi on the offbeat. Mellotron sustains a warm worn pad undertow beneath the harmony. Close-mic'd English female vocal, smooth mid-register with light falsetto flourishes, emotionally direct. Underscore for a groove-first intimate session scene. No orchestral strings, no cinematic swell, no four-on-the-floor, no autotune, no aggressive distortion."

lyrics: |
  [Groove intro, 0:00]

  [Verse 1, 0:10]
  You move like water on a borrowed clock
  Reading signals on a tilted rock
  The groove keeps pulling me along

  [Chorus, 0:35]
  Catch me in the pocket
  Swaying off the grid
  Everything I wanted
  Was exactly what you did

  [Verse 2 — trombone stabs, 1:00]
  You stayed inside the rhythm of my chest
  Displaced, half a step from free
  The off-beat is where we live

  [Pre-chorus — harmonies, 1:22]
  I don't need the perfect word
  Just the beat to be heard

  [Chorus — mellotron, 1:42]
  Catch me in the pocket
  Swaying off the grid
  Everything I wanted
  Was exactly what you did

  [Bridge — near-solo vocal, one chord, 2:05]
  Tell me where the off-beat goes
  When the groove fades
  Tell me where the love goes
  In the in-between space

  [Final chorus — E minor, half-step up, 2:35]
  Catch me in the pocket
  Swaying off the grid
  Everything I wanted
  Was exactly what you did
  Hold me in the off-beat
  Let the groove decide

  [Outro — groove fades, 2:50]
  In the pocket...

  [End]

