notes: |
  REDRAFT 2026-06-20: rewritten from the original Korean-language "Geurim" into
  ENGLISH lyrics per the English-or-French-only rule (feedback_english_french_only).
  Same musical concept retained — cinematic pop solo ballad, Rhodes electric piano +
  viola section countermelody + nylon-string guitar, F minor → F# minor half-step
  lift at the final chorus, 84 BPM, English-singing female airy lyric soprano,
  breath-forward close-mic with quiet devastation. Title changed to the single
  English word "Linger" (one-word titling rule).

  Concept: a late-evening longing scene — a city apartment at sunset, lights flickering
  on, an empty mug on the table, the precise moment of remembering someone who isn't
  coming back. The hook word "linger" carries the ache of absence and the lingering of
  memory; it doubles as the chorus refrain.

  Instruments:
  - Rhodes electric piano (warm chordal body-voice): opens the track alone for 15
    seconds, establishing the intimate register, then continues as harmonic foundation.
  - viola section (sustained countermelody): enters at the pre-chorus beneath the
    soprano, sustaining countermelody chords that build harmonic tension toward the
    chorus; a string tremolo thread adds density at the final chorus only.
  - nylon-string guitar (warm plucked body-voice): enters at chorus only, rounding the
    trio texture without displacing Rhodes or voice as the lead register.

  Vocal direction: English-singing female airy lyric soprano, breath-forward tone,
  emotional tremolo on sustained notes, intimate close-mic feel — cinematic pop solo
  ballad register with quiet devastation rather than operatic power.

  Duration strategy: VIRAL ARM cycle. Target 2:45–3:00, TikTok-optimized form factor.
  At 84 BPM the classifier may cap around 3:00–3:15; arc designed to feel complete
  within that window. NO [Silence] metatag per feedback_silence_gate_truncates.md.
  Colon-syntax lyrics with timestamp anchors, 2–6 word descriptor labels per
  feedback_lyrics_balance. Production tokens: polished studio mix, warm tape
  saturation, wide stereo stage. Sentence case throughout; no ALL-CAPS form labels.

