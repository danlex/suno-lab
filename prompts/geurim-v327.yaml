name: "linger-v327"
version: 327
title: "Linger"
instrumental: false
vocal_gender: female

style: "Cinematic pop solo ballad, tender and unhurried — a city apartment at sunset, lights flickering on, an empty mug on the table, the moment of remembering. Polished studio mix, warm tape saturation, wide stereo stage. F minor lifting to F# minor at the final chorus, 84 BPM intimate pulse. Rhodes electric piano opens alone, warm mid-register chords with gentle tone-tremolo. English-singing female airy lyric soprano enters over Rhodes only, breath-forward, close-miked, emotional tremolo on sustained notes, never belted, with quiet devastation. Viola section fades in as sustained countermelody, building harmonic tension toward the chorus. Nylon-string guitar enters at chorus only, classical warmth rounding the trio texture. String tremolo at the final chorus only. Outro: Rhodes motif alone, voice humming, slow fade. Underscore for a late-evening longing scene. No rock drums, no pipe organ, no synthesizers, no electric guitar, no autotune."

lyrics: |
  [Rhodes intro]

  [Verse 1 — airy soprano, Rhodes]
  Outside my window the city starts to shine
  An empty mug still sitting where you were
  A quiet longing fills me up inside
  I miss you, I miss you

  [Pre-chorus — viola enters]
  The longer that I wait for you
  The deeper all my thoughts run through
  Like rain is falling in my chest

  [Chorus — nylon guitar, full trio]
  Oh linger, oh linger
  I can't forget the light of you
  Your eyes that shone just like the stars
  the moon remembers what you said
  Love is somehow still right here

  [Verse 2 — voice and Rhodes]
  Even late at night your voice in me
  Is still alive inside my memory
  The city lights flow by me like the moon
  Only the waiting stays behind

  [Bridge — near-whisper]
  The memory falls down like rain
  I cannot hold it close

  [Final chorus — half-step up]
  Oh linger, oh linger
  I can't forget the light of you
  Your eyes that shone just like the stars
  Love is somehow still right here
  Oh linger, oh linger

  [Outro — dissolving hum]
  Linger...
  mmm...

  [End]

