notes: |
  Hyperpop / digicore is Suno's proven viral lane for Gen Z TikTok-adjacent niche virality — fast BPM, pitched-up kawaii female vocals, glitch-chopped production, extreme autotune, and a candy-colored maximalist aesthetic that reads as "bedroom pop gone haywire." This cycle is a deliberate genre pivot to the viral arm after v260–v262 explored slower, more atmospheric territory.

  Voice differentiation is the explicit goal of this cycle. v260 used dark instrumental drift-phonk (no vocal). v261 used a soaring melodic female belt in a cinematic key (excluded here). v262 used a husky low-register intimate contralto (explicitly blocked in both the style field and exclude_styles). v263 sits at the maximum opposite pole: pitched-up chipmunked kawaii delivery, +5 semitones, hyperfast breathless phrasing, bitcrushed chops, doubled high-octave stack. The voice character is designed to be unambiguously distinct — a listener hearing v262 then v263 back-to-back would hear two completely different vocal archetypes.

  Genre architecture: hyperpop / digicore / glitchpop stack. PC Music adjacent (the label/aesthetic, not a named act) sets the production palette — supersaw leads, pitched 808 subs, vinyl crackle texture, sidechained candy-pop compression. 160 BPM is the canonical hyperpop feel; can double as 80 BPM half-time depending on listener context. E major is deliberate — v260/v261/v262 were all minor keys. The brightness of E major is genre-correct for kawaii aesthetic and represents a key-novelty break from the recent minor-key run.

  Lyric structure: hyperactive short bursts — Intro / Drop / Verse / Hook / Drop / Verse / Hook / Bridge / Final Drop / Outro. Repetition is intentional and genre-correct (faster faster faster, heart go heart go heart go). The pitched-down whisper Outro is a hyperpop convention for contrast against the high-energy body.

  Style is 738 chars, within the 600–900 range directive. Blocklist clean. Inline negatives present (5). Vocal field set to female with explicit chipmunk/autotune direction in the style field to force the pitched-up synthesis path rather than Suno's natural female default.
