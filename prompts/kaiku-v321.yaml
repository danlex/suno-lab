style: "Atmospheric post-rock with Finnish soprano and neoclassical orchestral swell — midwinter Lapland treeline, breath against silver dawn, awe before something vast and permanent. Polished studio mix, wide stereo stage. A major lifting to Bb major at 2:20, 70 BPM. Lap steel guitar opens in shimmer over bowed singing bowl drone — spatially disorienting. Finnish soprano enters at 0:35 on open-vowel phrases: \"kaiku, valo on, taivas\" — real Finnish words as elemental presence-statements. Cello sul tasto joins at 1:10 in slow pizzicato heartbeat beneath the voice. Full string orchestra swells from near-silence at 1:40 — scale suddenly revealed. Half-step lift to Bb major at 2:20; bowed singing bowl re-enters through strings; soprano holds high. From 2:50 the orchestra drops to pianissimo, soprano resolves, lap steel alone fades. Film score for a Lapland awe scene. No drums, no electric bass, no pipe organ, no synthesizers, no electric guitar."

lyrics: |
  [Lap steel + singing bowl drone, 8 bars]
  (A major — shimmer alone, no vocals)

  [Finnish soprano enters — open vowels, 12 bars]
  Kaiku... kaiku...
  Valo on — valo on
  Taivas, taivas
  Ääni kaukana

  [Cello sul tasto pizzicato pulse, 12 bars]
  Kaiku, valo on
  Metsä on — maa on
  Vesi on, tuli on
  Ääni, ääni kaukana

  [Two-voice octave unison, 12 bars]
  Ilma on — taivas on
  Kaiku kestää
  Aurora — hiljaa
  Vuosi kestää

  [Full string orchestra swell — awe arrival, 20 bars]
  Kaiku! Valo on!
  Taivas — maa — vesi — tuli
  Ilma on kaukana
  Aurora kestää kestää

  [Half-step lift A to Bb major, 16 bars]
  Kaiku... kestää...
  Valo, valo on
  Aurora — taivas
  Hiljaa kaukana

  [Strings drop to pianissimo, 12 bars]
  Kaiku... valo...
  Hiljaa — hiljaa
  Maa on

  [Lap steel alone closes, 8 bars]
  (A major fading — no vocals)

  [End]

