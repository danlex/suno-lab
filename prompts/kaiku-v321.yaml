notes: |
  Atmospheric post-rock is a genre that discards conventional verse-chorus
  structure and lead vocals in favor of long instrumental builds that arrive at
  emotionally overwhelming peaks — the genre was pioneered by Scottish and
  Icelandic bands in the 1990s and 2000s. v321 "Kaiku" applies the v293 Vök
  recipe (atmospheric post-rock + vocal anchor + late orchestral swell, mean
  3:34 at v293) as a validated top-tier configuration, returning to it after
  27 cycles.

  Concept source (researcher): v321 repeats the v293 Vök recipe with two
  controlled substitutions — (1) Finnish real-language soprano replaces the
  v293 Hopelandic constructed-nonsense-language falsetto; (2) A major → Bb
  major replaces v293's G major; plus a new emotional pole: REVERENCE/AWE
  (first sight of something vast and permanent), distinct from v316 grief,
  v317 transcendence, v318 defiance, and v320 Liebestod.

  The voice and vocal philosophy here echo a tradition of Nordic female soprano
  art-song that goes unnamed per catalog discipline. Finnish phonology has open
  vowels (a, o, ä, ö, y) and agglutinative syllable structure that produces
  naturally vast, near-invented sonic quality to non-Finnish ears — ideal as
  atmospheric vocal color inside post-rock. Finnish vocabulary deployed:
  "kaiku" (echo/resonance), "valo on" (light is), "maa on" (earth is), "vesi
  on" (water is), "tuli on" (fire is), "ilma on" (air is), "taivas" (sky),
  "metsä" (forest), "ääni" (sound), "vuosi" (year), "kestää" (lasts/endures),
  "kaukana" (far away), "hiljaa" (quietly), "aurora". Phrases are elemental
  presence-statements — not full grammar, but identifiable Finnish words that
  scan as almost-invented to non-Finnish ears. This is the 60th orthogonal
  voice architecture: first Finnish soprano, first Finnish-language vocal,
  first lap-steel-paired soprano, different register and language from v293.

  Duration strategy: BPM 70 sits in the slow band (playbook rule 8: slow-BPM
  ceiling ~3:30). Recipe fidelity to v293 (also 70 BPM, mean 3:34) is the
  primary duration argument — Suno's post-rock classifier is what drove v293's
  duration, not bar count alone. Total lyric bar count: 100 bars across 8
  sections + End. Production tokens: polished studio mix, wide stereo stage,
  lush acoustic ambience (three tokens). Sentence case throughout; atmospheric-
  first opening with "Atmospheric post-rock" anchor in first sentence locking
  the v293 classifier. Colon-syntax lyrics with bar counts for per-section
  length scaffolding. NO [Silence] metatag anywhere per
  feedback_silence_gate_truncates.md. The density layering (lap steel alone →
  Finnish soprano enters → cello sul tasto → full string orchestra swell at
  1:40 → half-step lift at 2:20 → pianissimo withdrawal) is forward-motion
  arrival architecture, triggering the playbook rule 10 "forward-motion →
  full-tutti Drop" response from Suno's classifier. The bowed singing bowl
  re-entry at 2:20 functions as the Drop trigger without any silence gate.
  Three body-voice trio minimum honored: lap steel guitar (body — warm steel
  resonance), cello sul tasto (body — breathy near-bass pulse), plus the
  vocal. The singing bowl is the ≤1 spectral voice per playbook rule 5.

  Instruments with catalog gaps:
  - lap steel guitar (CATALOG DEBUT — gap 321, never used in 320 prior
    prompts): horizontal electric-acoustic guitar played with a metal slide,
    producing a shimmering, vowel-like sustain that defines atmospheric
    post-rock identity. Opens alone and provides the shimmer foundation
    throughout. Structural role: genre identity anchor and spatial horizon.
  - bowed singing bowl (CATALOG DEBUT — gap 321, never used in 320 prior
    prompts): Tibetan or crystal singing bowl bowed with a rosined stick
    rather than struck, producing a continuous spatial drone in the 1–4 kHz
    zone — the brain struggles to locate its origin, producing the same
    spatial-disorientation quality as a glass harmonica but with warmer,
    more resonant overtones. Role: drone foundation and re-entry signal at
    the half-step lift. Spectral voice (≤1 spectral per trio — honored).
  - cello sul tasto (last v303, gap 18 — fresh framing): cello bowed over
    the fingerboard rather than at the bridge, producing a soft, breathy,
    near-bass tone with reduced overtones and forward warmth. Used here
    in pizzicato heartbeat pulse entering at 1:10, providing intimate
    rhythmic life without drums or percussion. Fresh framing: v303 deployed
    it as bass-drone layer; here it is the sole rhythmic anchor.

  Novelty claims: voice-novelty (Finnish soprano — 60th orthogonal voice,
  first Finnish-language vocal in catalog; distinct from v293 Hopelandic
  falsetto by register, language type, and gender); concept-novelty
  (REVERENCE/AWE emotional pole — first sight of something vast and permanent,
  5th pole beyond v316–v320 grief/transcendence/defiance/Liebestod); instrument-
  novelty (lap steel guitar — catalog debut, gap 321; bowed singing bowl —
  catalog debut, gap 321); key-novelty (A major last v273, gap 48 — very fresh;
  Bb major last v269, gap 52 — very fresh); recipe-fidelity-test (v293 Vök
  validated top-tier recipe, 27-cycle gap, first repeat — controlled: same 70
  BPM, same atmospheric post-rock classifier, same late orchestral swell arc,
  different key/language/voice/instrument set); scene-novelty (Lapland treeline
  at midwinter dawn, awe before the vast and permanent — no prior Lapland or
  Finnish-landscape scene in catalog).

