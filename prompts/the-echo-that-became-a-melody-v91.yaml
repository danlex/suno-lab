notes: "v91 — MINIMALIST PHASING (TEMPORAL PROCESS). 11th axis. RESEARCH: Wikipedia Piano Phase, Steve Reich official site, Puget Sound music theory chapter 35.2 on Phase Shifting, Classic FM visualization, performer's guide. LEARNED: (1) Reich discovered phasing accidentally in 1965 with tape loops. (2) Two identical patterns in unison, one gradually speeds up until one beat ahead, creating: echo → doubling → complex ringing → return to unison. (3) The superimpositions form 'sub-melodies' or 'by-products' — melodies neither player is playing, emerging from the overlap. (4) Reich's 1968 essay: 'music as a gradual process' — the process IS the composition. IMPROVED: applied phasing to ORCHESTRAL setting — two celestas (uncommon pairing per user feedback) playing the pattern, while string orchestra sustains whatever emergent harmonies the phasing produces. The innovation axis is TEMPORAL PROCESS — not what is played or how, but the TIME-RELATIONSHIP between two identical parts creating something new. E major 96 BPM — faster than recent versions because phasing needs audible rhythmic pulse. Sources: Wikipedia, stevereich.com, Puget Sound music theory, Classic FM, escholarship.org performer's guide. 997 chars."
