notes: "v122 — ORCHESTRAL CONCERTO GROSSO. First concerto grosso form in 121 prior prompts. The concept: three solo instruments (concertino) play alone first, then the full orchestra (ripieno) answers and amplifies. The alternation between solo intimacy and orchestral power creates drama through contrast — fundamentally different from all prior forms which were about accumulation (build), transformation (variations), imitation (canon), or subtraction (dissolution). RESEARCH: MasterClass concerto grosso guide — small group (concertino) vs full orchestra (ripieno), melodic content passed among multiple soloists. Contemporary revival by Glass, Schnittke, Penderecki. Jessie Montgomery composed a modern concerto grosso. The form naturally supports film scoring: intimate solo passages = close-up, orchestral tutti = wide shot. INSTRUMENTS: Cor anglais (v104, 17-version gap) = English horn, warm pastoral double-reed, deeper and mellower than oboe. The 'longing' voice. Music box (v108, 13-version gap) = tiny crystalline mechanism, innocent childhood tones. The 'memory' voice. Added 'jazz, blues' to exclude_styles to prevent upright bass from triggering jazz. Upright bass (v109, 12-version gap) = acoustic plucked bass, woody and earthy. The 'foundation' voice. All three deep revivals (12-17 gaps). NOVELTY: B major = NEVER used (virgin key). 78 BPM = never used. Concerto grosso = new form. Nostalgia = new emotional territory (distinct from joy/solemnity/mystery/grief). 896 chars."
