name: "duro-v326"
version: 326
title: "Duro"
instrumental: false
vocal_gender: male

style: "Afro-soul cinematic ballad, tender and unhurried — a Lagos balcony at golden hour, slow ceiling fan, the city humming below while a man waits for a call that may not come. Polished studio mix, warm tape saturation, wide stereo stage. D minor lifting to Eb minor at the chorus, 92 BPM mid-tempo pulse. Talking drum opens alone — dry, present, pitch-bending Yoruba call into silence. Male Afro-soul tenor enters in Pidgin English, warm and intimate, never belted. Cello counterline shadows the vocal a third below in long sighing phrases, a second voice leaning close. Muted trumpet arrives mid-song — Harmon-mute tone, weaving between vocal lines as countermelody, not lead. Sparse string section swells at chorus only. The ending is recession: strings drop away, cello returns alone, talking drum closes the track. No guitars, no rock drums, no pipe organ, no synthesizers. Underscore for a Lagos golden-hour longing scene."

lyrics: |
  [Talking drum solo intro, 0:00-0:35]

  [Verse 1 — Pidgin vocal, cello counterline, 0:35-1:20]
  I dey here on the balcony
  the city slow beneath me
  golden hour na e dey go
  your name still on my screen, o
  wahala no catch me yet
  I dey wait, I dey wait
  ceiling fan dey turn
  ko ye mi why you quiet

  [Muted trumpet countermelody enters, 1:20-1:50]
  the trumpet dey call low
  se daada where you are
  I dey hold the evening still
  Lagos hum like prayer

  [Pre-chorus lift, 1:50-2:00]
  the light dey change now
  I feel the hour shift

  [Chorus 1 — Yoruba hook, half-step lift to Eb minor, 2:00-2:40]
  duro, duro
  the city waits with me
  duro, duro
  yawa no come near
  duro, duro
  the night still long
  se daada — se daada
  I dey wait for you

  [Stripped outro — cello alone, talking drum closes, 2:40-3:05]
  duro...
  I dey wait
  duro...

  [End]

