name: "exits412"
version: 412
style: "Anxious elation on a lurching Baltimore club floor — percussive, wired, never warm. 132 BPM, C minor. The signature Baltimore roll drives everything: a stuttered kick-fill pattern in 8/4 that lurches before it locks, chopped percussive snaps cracking on the offbeats, thumping club bass locking to the two-and-four. Never four-on-the-floor — the groove jerks and lurches in the breakbeat grid. A sung female melodic topline delivers the hook with real contour; a punched three-note chant answer fires on the back-beat, hard consonants cutting through the snap. At the climax fill-cascade acceleration takes over: the stuttered kick fills double and re-double every two bars, rolling faster into a sprint, the chant fracturing and doubling with the acceleration — kinetic and floor-driving. Underscore for anxious elation. No guitars, no rock drums, no pipe organ, no live band kit, no acoustic strings."
