notes: |
  Symphonic metal operatic ballad: a subgenre in which a classically-trained soprano is set against a large symphonic orchestra and heavy classical low-end, characterized by operatic vocal technique applied over dense orchestral mass. The genre originated in northern Europe in the 1990s and has become stable Suno v5.5 long-form classifier territory, consistently rendering 3:00+. The technique here is the "halo-voice variant": crystalline pure-tone soprano (minimal vibrato, choirboy-grown-into-woman timbre) over full strings, low brass, choir, and a three-instrument revival trio — with NO rhythm section (no guitar, no drums, no bass guitar). This is the replication test for v311's classifier-first hypothesis: same classifier territory (symphonic metal operatic ballad), different vocal architecture, different instrument trio, different scene.

  Concept source (researcher): "v312 REPLICATION TEST — same symphonic metal classifier as v311, but crystalline halo-voice soprano (not dramatic), no guitar/drums/bass. Trio: bass clarinet (gap 63) + French horn (gap 56) + vibraphone (gap 77). Nordic fjord scene at pre-dawn. C# minor → D minor half-step at 2:45, 92 BPM. Test whether long-form render holds without rhythm section."

  This prompt echoes the tradition of northern European symphonic vocal arrangers who layered pure-tone soprano voices over dense orchestral writing without a rock rhythm section — a body of work whose greatest practitioners go unnamed here per catalog discipline. The halo-voice architecture is distinct from v311's dramatic soprano (controlled legato power, vibrato-rich) and from v298's bel canto lyric soprano: it is lighter, purer, hovering rather than surging.

  Duration strategy: BPM 92 sits in the slow band; the BPM-duration ceiling applies (~3:30 max regardless of bar count per playbook rule 8). Duration argument rests on classifier lock: "symphonic metal operatic ballad" anchors the first sentence, matching v311's classifier exactly. Total lyric bar count is 120 bars across 8 sections; at the slow-BPM ceiling this targets 3:00–3:30. Production tokens applied: polished studio mix, Hollywood scoring stage, wide stereo stage, deep low-end definition, warm tape saturation. Sentence case throughout; atmospheric-first opening; colon-syntax lyrics with bar counts for per-section length scaffolding; NO [Silence] metatag (hardened rule per feedback_silence_gate_truncates.md). Two body voices in trio confirmed: bass clarinet (body) + French horn (body) + vibraphone (spectral-adjacent, lightweight shimmer role — only one spectral pick, compliant with playbook rule 5).

  Instruments with catalog gaps:
  - bass clarinet (last v249, gap 63 — deep revival): a low-register member of the clarinet family with a warm, woody, slightly hollow tone; plays an opening descent beneath the brass pad, reappears in counterpoint under the soprano at 2:20 as the intimacy move before the final lift.
  - French horn (last v256, gap 56 — deep revival): a wide-bore brass instrument with a warm, round mid-band tone; functions as the soprano's dialogue partner throughout, answering phrase-ends and merging with the soprano voice on the peak phrase at 2:45.
  - vibraphone (last v235, gap 77 — deepest revival in trio): a mallet percussion instrument with motorized resonators producing a gentle tremolo shimmer; used sparingly as punctuation in the opening and as the trailing shimmer in the final chord decay, never dominating the texture.

  Novelty claims: technique-novelty (symphonic metal operatic ballad without rhythm section — halo-voice variant, first in catalog); instrument-revival (bass clarinet, gap 63); instrument-revival (French horn, gap 56); instrument-revival (vibraphone, gap 77 — deepest revival in trio); BPM-novelty (92 BPM, last v295, gap 17 — fresh); key-novelty (C# minor last v297, gap 15 — fresh); scene-novelty (pre-dawn Nordic fjord, breath visible, granite cliffs, soprano over still water — no prior fjord-at-dawn scene in catalog); voice-novelty (crystalline halo-voice soprano distinct from v311 dramatic soprano and all 311 prior catalog entries); replication-test (classifier-first hypothesis from v311 tested with different vocal architecture, trio, and scene).

