name: "locket-v338"
version: 338
title: "Locket"
instrumental: false
vocal_gender: female

style: "Bright, confessional chamber-pop with a plucked bright-transient cimbalom attack cutting through a warm intimate small-string cushion. Polished studio mix, warm tape saturation, tight chamber reverb. A major lifting to B-flat major at the final chorus, 124 BPM mid-tempo. Cimbalom opens the song alone, its hammered plucked tone ringing clear before the strings enter; returns as ornamental glitter between phrases. Oboe threads a plaintive woodwind countermelody doubling the vocal in the refrain. Trumpet carries the brass hook with clear bright tone. Two-part close harmony in thirds — lead soprano and close second voice — exposed and dry. Dynamic contrast from sudden chamber reductions to bare unaccompanied voice. Instrumental chamber interlude near 1:40. Final chorus 2:30, ring-out near 2:55. Underscore for an intimate confessional-parlor scene. No pounding drums, no EDM drop, no distorted guitars, no autotune, no reverb-drenched vocal."

lyrics: |
  [Cimbalom intro, 0:00]

  [Verse — lead vocal, 0:12]
  I keep all your letters in a painted tin
  Every word you wrote still living under my skin
  The morning light falls thin across the floor

  [Refrain — two-part harmony, 0:28]
  Hold me like a locket, keep me close
  You are the one I counted on the most
  Fold me like a letter, soft and true
  Every gilded edge is you

  [Verse two — strings in, 0:52]
  I wore the ring you left beside the door
  The garden holds the shape of what we planned

  [Refrain — two-part harmony, 1:10]
  Hold me like a locket, keep me close
  You are the one I counted on the most
  Fold me like a letter, soft and true
  Every gilded edge is you

  [Chamber interlude — cimbalom, oboe, trumpet, 1:30]

  [Voice only — bare, 2:05]
  You are the one

  [Final refrain — full chamber, B-flat lift, 2:14]
  Hold me like a locket, keep me close
  You are the one I counted on the most
  Fold me like a letter, soft and true
  Every gilded edge, every gilded edge is you

  [Ring-out, 2:44]

  [End]

