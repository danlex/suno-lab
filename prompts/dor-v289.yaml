  manele de dor narrative — two years gone, Bucharest sleeps, can't
  sleep myself, cigarette and coffee, longing burns from inside, "the
  dor for you is killing me, when I hear you on the radio, come back,
  my soul waits for you." Evergreen Romanian-dor emotional core.

