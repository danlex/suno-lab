style: "Modern Romanian manele, emotional manele de dor, 113 BPM, A minor, Bucharest manea-de-suflet 3am. Male manele singer vocal — chest-rich passionate operatic-pop belt with Romanian/Romani phonetics, Eastern modal phrasing (Hijaz-influenced minor color), heavy Auto-Tune on emotional hooks, melismatic vocal runs with manele-melisma (microtonal slides), NOT Greek rebetiko, NOT Persian tahrir, NOT Türk trap, NOT Polish trap — Romanian manele signature with dor-driven passionate delivery. Production: oriental hammond organ riffs (signature manele), accordion counterpoint, saxophone improvisational fills, violin sustained pads in Eastern-modal color, modern trap drum kit, sliding 808 sub, off-beat hi-hat, heavy hall reverb, vinyl crackle. 2026 manele de dor, NOT old-school manele ţărănească, NOT muzică populară, NOT Eurovision kitsch. Bucharest mahala 3am, dor-soaked emotional manele. No muzică populară, no Eurovision kitsch."

lyrics: |
  [Intro]
  (hammond organ riff, accordion swirl)
  oh-oh, dor
  dorul meu

  [Verse 1] (chest-rich Romanian belt)
  doi ani au trecut și tu nu te-ai întors
  Bucureștiul doarme, eu nu pot să dorm
  fumez o țigară, beau o cafea
  dorul de tine mă arde pe dinăuntru

  [Pre-Hook]
  (manele melisma) oh-oh, dor
  dor, dorul de tine

  [Hook] (passionate belt with Eastern modal turn)
  dor, dor, dorul de tine mă omoară
  dor, dor, când te aud la radio
  dor, dor, fata mea, vino înapoi
  dor, dor, sufletul meu te așteaptă

  [Verse 2]
  WhatsApp-ul tăcut, ultima oară văzut
  Spotify-ul nostru, melodia noastră încă cântă
  prietenii zic să te uit
  dar dorul ăsta nu mă lasă

  [Hook]
  dor, dor, dorul de tine mă omoară
  dor, dor, sufletul meu te așteaptă

  [Bridge]
  (saxophone improvisation, hammond pad)
  [Vorbit] dorul ăsta, dorul ăsta
  ce să fac, ce să fac

  [Final Hook] (full passionate belt + 808 + hammond)
  dor (dor), dorul de tine mă omoară
  dor (dor), sufletul meu te așteaptă

  [Outro]
  (accordion fade) dor
  [End]

