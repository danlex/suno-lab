style: "Sertanejo universitário, modern Brazilian country, sofrência ballad, 88 BPM, G major, neon-lit boteco at 2am. Male DUO close harmony — lead tenor on verses + harmony baritone joining on the hook in thirds and sixths, warm chest-voice rural caipira accent, heartfelt phrasing with country-style cry on long notes, NOT solo, NOT shouty MC, NOT falsetto, NOT urban Brazilian — MALE DUO HARMONY architecture. Production: warm acoustic violão (nylon-string Brazilian guitar) strumming, sanfona (button accordion) holding the chord pad and weaving counter-lines, upright bass walking, light brushed snare rim-clicks, faint pedal steel cry. Interior-of-Brazil aesthetic — Goiás boteco at 2am, cerveja sweating on the table, lonely-after-the-girl-left mood. 2026 sertanejo TikTok lane, sofrência tradition. No urban funk carioca, no Bollywood, no orchestral, no big-room, no kawaii, no shouty MC."

lyrics: |
  [Intro]
  (acoustic guitar strum, sanfona swell)
  oh oh oh

  [Verse 1] (lead tenor)
  cheguei no boteco e pedi cerveja
  o garçom me olhou, sabia da história
  na mesa do canto, a cadeira vazia
  onde tu sentavas, hoje só memória

  [Pre-Hook] (harmony joins)
  ai ai ai, meu coração

  [Hook] (duo harmony, thirds and sixths)
  boteco vazio, copo na mão
  saudade gritando dentro do peito
  boteco vazio, sem teu coração
  sertanejo toca o nosso desfeito

  [Verse 2] (baritone leads)
  sanfoneiro tocou nossa canção
  o boteco parou pra me ver chorar
  cada bebida lembra a paixão
  cada acorde me leva a teu lugar

  [Hook] (duo)
  boteco vazio, copo na mão
  saudade gritando dentro do peito

  [Bridge]
  (acoustic + sanfona only)
  [Spoken duo] essa dor não passa
  só aumenta com a noite

  [Final Hook] (duo fortissimo)
  boteco vazio (vazio), copo na mão
  saudade gritando (gritando), dentro do peito

  [Outro]
  (sanfona fade) oh oh oh
  [End]

