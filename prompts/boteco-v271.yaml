notes: |
  VIRAL ARM cycle v271 — Sertanejo universitário / sofrência ballad
  (modern Brazilian country, rural interior Portuguese-language tradition).
  Research-driven (TikTok 2026 trending playlists, multiple Henrique e
  Juliano references in 2026 content): sertanejo universitário remains
  Brazil's dominant mainstream pop genre with continuous TikTok virality
  through 2026, currently led by Henrique & Juliano and the sofrência
  (suffering-ballad) tradition. Distinct from urban funk carioca v265 in
  every dimension — rural interior vs urban Rio, acoustic guitar +
  accordion vs 808 + tamborzão, slow heartbreak ballad vs fast dance
  shout-rap.

  USER VALIDATION + LANE EXPANSION: 11 viral cycles deep, 8 languages, 11
  voice archetypes. v271 advances by introducing the FIRST male duo
  harmony architecture (after v268's female K-pop group harmony as the
  first non-solo voice). Two non-solo architectures now in the catalog.

  VOICE DIFFERENTIATION — 12TH orthogonal voice in 12 cycles, and the
  FIRST male duo close harmony in the catalog. Ledger:
    v260 — male whisper EN solo (drift phonk distorted)
    v261 — soprano belt EN solo (arena anthemic)
    v262 — husky contralto FR solo (close-mic intimate)
    v263 — pitched-up kawaii EN solo (hyperpop chipmunked)
    v264 — raspy Latina sing-rap ES solo (autotuned attitude)
    v265 — shouty Portuguese MC PT solo (dry close-mic urgency)
    v266 — relaxed amapiano male ZU/XH/EN solo (casual chest)
    v267 — smooth Punjabi sing-rap male PA solo (R&B vulnerability)
    v268 — female K-pop GROUP harmony KO/EN (4-voice stacked)
    v269 — ethereal breathy female soprano EN solo (understated DnB)
    v270 — male FALSETTO-mix Nigerian PIDGIN/YO/EN solo (smooth high-tenor)
    v271 — male DUO close harmony PT-caipira (lead tenor + harmony
           baritone in thirds and sixths, warm chest rural accent —
           NEW MALE VOCAL ARCHITECTURE not just new male timbre)
  v265 vs v271 differentiation note: both Portuguese, but v265 is urban
  Rio favela MC shout-rap and v271 is rural-interior caipira sofrência
  duo harmony. Suno classifier should handle this cleanly via the
  rhythm/instrumentation signature alone (acoustic guitar + sanfona vs
  tamborzão + 808). Style explicitly excludes "urban funk carioca" and
  exclude_styles blocks both that and all 11 prior voice characters.

  LANGUAGE — Portuguese (Brazilian) second cycle, but with caipira accent
  pin (the interior-of-Brazil rural vocal inflection) to differentiate from
  v265's urban favela Portuguese. Lyric vocabulary uses authentic sertanejo
  Portuguese: "boteco" (small bar), "cerveja" (beer), "garçom" (waiter),
  "saudade" (untranslatable longing/missing), "sofrência" (the genre's
  meta-term for romantic suffering), "sanfoneiro" (accordionist),
  "desfeito" (undone/broken-up). Concept: pure sertanejo sofrência —
  narrator drinking alone at the bar where the music plays his
  ex-relationship; the empty chair across the table; the accordionist
  plays "our song" and the whole bar stops to watch him cry. This is the
  evergreen sertanejo thematic core.

  BPM 88 — fresh in the recent rotation (recent: 92, 96, 105, 110, 115,
  124, 132, 138, 150, 160, 174). Canonical sertanejo universitário ballad
  tempo (Henrique e Juliano sit in the 80-95 BPM range for their slowest
  sofrência cuts).

  Key G major — first major-key cycle in the viral arm since v263 (E major,
  hyperpop). All ten cycles between v263 and v270 were minor keys. Sertanejo
  romantic ballads canonically sit in major keys (G major, D major) even
  when emotionally sad — the bittersweet brightness is part of the genre's
  sound. G major is fresh against the recent rotation entirely.

  Production palette pinned: "warm acoustic violão (nylon-string Brazilian
  guitar) + sanfona (button accordion) + upright bass + light brushed
  snare" — the canonical sertanejo universitário instrumentation. Two
  anchor references: "Goiás boteco at 2am" (geographic anchor for the
  interior-of-Brazil aesthetic) and "Henrique e Juliano / sofrência
  tradition" (genre-tradition anchor, scene/lineage reference not artist
  copy). Negatives explicitly block urban funk carioca, Bollywood, MPB,
  bossa nova, samba traditional, forró, and modão velho (1970s sertanejo)
  — the adjacent failure modes Suno could drift to.

  Title "Boteco" — single Portuguese word for the small interior-Brazil
  bar where sertanejo plays, 6 chars, MEME-able, genre-canonical setting.
  Concept-word, not a specific famous-song-title collision.

  Style char target: validated below 1000 via scripts/yaml_field_check.py.
  Blocklist clean (Henrique & Juliano referenced ONLY as "Henrique e
  Juliano / sofrência tradition" in style and notes — this is a
  tradition/lineage reference equivalent to "Tomasa del Real" / "Tems
  lineage" in prior cycles, not an artist-copy command).
