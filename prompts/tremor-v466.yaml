style: |
  Bass house floor-track for after-midnight sessions when the sub-bass goes physical — bodies locked into a two-bar kick-grid that withholds beat one, keeping the floor in perpetual unresolved motion until the drop. E-flat minor, 130 BPM, total duration around 3:00. Polished studio mix with deep low-end definition and wide stereo stage. The tamborzão kick grid drives the pocket: syncopated two-bar pattern, beat-one avoided so tension coils until the drop. Wobbling sub-bass swells and pumps beneath, pressure-building through each phrase. Crotales deliver bright metallic overtone stabs above the low-end mass — glinting spatial accents that cut against the bass weight. Wordless female vocalise chopped and pitched into rhythmic stabs: open-phoneme motif (oh, ay, eh, ah) used as melodic percussion, not sung melody. No guitar, no piano, no acoustic instruments. No trap patterns, no drill percussion, no sung words, no rapping.

