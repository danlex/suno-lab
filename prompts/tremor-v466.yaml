notes: |
  v466 TOURNAMENT WINNER (inline-judged 77/100, tied with sibling Static466 at 77; won on danceability — our engagement signal — and render reliability vs Static's risky long-build/long-suspended-break). The run's first genuine FORM-BREAK: rhythm-primary, wordless-vocalise, NOT verse-chorus — a deliberate high-variance move after four sung songs (v462 speed garage, v463 dream-pop, v464 Afropiano soul, v465 new jack swing).

  FORM: four-part club structure — Grid -> Vocalise Hook -> Break -> Double Drop — how bass house / baile funk actually work on a floor. The primary material is RHYTHM, not melody or lyric narrative.

  TAMBORZÃO KICK GRID: a syncopated two-bar kick/snare pattern (forward-leaning, beat one often withheld so the groove feels perpetually unresolved), fused with bass house's sub-heavy aesthetic — physically propulsive without ever fully landing until the drop.

  VOCALISE AS INSTRUMENT: the female voice never sings words — an open-phoneme motif (oh, ay, eh, ah, hah) chopped and pitched as melodic percussion. Lyrics field is vocables + structural metatags only, no real words in any language (wordless vocables are explicitly permitted by the language rule).

  CROTALES: small antique cymbals (bright 4-6 kHz overtone stabs) provide the signature unusual color — their glinting high-frequency attack cuts through the sub-bass mass, the textural identity of the track (sub-bass wobble vs crotale stab).

  DOUBLE-DROP, NO MODULATION: the climax is a FILTER/DENSITY event (sidechain release + sub-bass thickness), not a key change — the correct climax mechanism for bass house. Single tonal center (E-flat minor) throughout.

  DURATION LEVER: the lyric-free [Break] (~30-45s of sub-bass drone + cymbal rolls) is the mid-song lever; Drop 2 is placed late (~2:30+) so the final payoff extends the render toward 3:00. 130 BPM sits in the proven duration band.

  Novelty: bass house × tamborzão grid is a catalog debut; wordless-vocalise-as-instrument form is new; crotales as bass-house accent is a fresh deployment; double-drop rhythm-primary structure is a form-break from the verse-chorus template.

  Style char count: 931.

