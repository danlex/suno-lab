name: "saunter-v346"
version: 346
title: "Saunter"
instrumental: false
vocal_gender: female

style: "Warm mid-tempo retro soul-funk with a greasy analog glow, targeting 3:00 to 3:30 on a deep pocket groove anchored by a brass ostinato returning every twenty seconds. Polished studio mix, wide stereo stage, warm tape saturation. Key of B-flat major, lifting a half-step to B major at the final hook return. 99 BPM. The trio: baritone saxophone on the low-brass groove with fat buzzy authority, cup-muted trumpet carrying the melodic hook with bright intimate edge, and clavinet laying the rhythmic comp that locks the pocket. Smooth female lead vocal, grown and self-assured — confident and right at home. Horn stabs punch on the two and four, clavinet chops snap, baritone saxophone hums underneath like the floor is moving. Afternoon light on parquet floors, warm air thick with tape hiss, brass sheen in the room. Underscore for a confident entrance scene, unhurried. No guitars, no rock drums, no pipe organ, no synthesizers, no electronic bass."

lyrics: |
  [Intro groove: brass ostinato, 0:00]

  [Verse 1: smooth female vocal, 0:18]
  I don't rush, I don't chase
  I move through the room at my own pace
  Every head turns, every eye stays
  Cause I carry what I know all my days

  [Hook: brass ostinato returns, 0:44]
  That's the groove, that's the feeling
  That's the sound that keeps you breathing
  (Yeah — right where it belongs)

  [Verse 2: deeper into the pocket, 1:04]
  Took some time to know my worth
  Smooth as brass on a warm afternoon
  I'm not done until this song is done

  [Hook: ostinato punches, 1:26]
  That's the groove, that's the feeling
  That's the sound that keeps you breathing
  (Yeah — right where it belongs)

  [Strip-down: bare clavinet and bass, 2:10]
  Just me and the low end now
  You hear that? Yeah, you know how

  [Full return B major: trio lifts, 2:25]
  That's the groove — half step higher
  Trumpet sharp, baritone on fire
  Clavinet snapping like a live wire
  (Take it home, all the way)

  [Outro groove: brass chord fade, 2:58]

  [End]

