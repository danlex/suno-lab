notes: |
  TECHNIQUE — Brass ostinato as primary hook: a repeating 2-bar horn-stab figure that serves as the structural and melodic anchor of the entire song, returning every 20–30 seconds rather than a conventional chorus. This technique comes from the horn-driven soul arranging tradition of the 1970s (without naming its architects), where the brass figure IS the memorable unit — not a melody sung over chords, but a rhythmic-harmonic gesture that the voice bounces off. The concept source for this cycle: mid-tempo soul-funk groove with brass ostinato hook, answering the June 2026 chart signal of confident analog warmth running to 3:30.

  NOVELTY — All three instruments are genuine first-ever uses in this 345-version catalog. Baritone saxophone (version 346 debut) anchors the low-brass groove with a weight and authority unavailable from tenor or alto; its first appearance here is the strongest novelty claim. Clavinet (version 346 debut) is the iconic percussive keyboard of 1970s funk, utterly distinct from electric piano or Hammond — its choppy rhythmic comp is what gives the groove its snap. Cup-muted trumpet (version 346 debut as this variant) occupies the hook register with a bright, slightly muffled edge that sits above the baritone without competing with the clavinet mid-register. All three are body voices, satisfying the two-body minimum with room to spare.

  BPM — 99 BPM last used at v209, a gap of 137 versions. Well into the mid-tempo soul pocket (the sweet spot for horn-driven soul-funk sits 90–105 BPM), and at this BPM the playbook ceiling is ~3:30 — which matches the duration target exactly.

  KEY — B-flat major (last used at v329, gap of 17 versions) is the horn player's home key: brass instruments are most resonant and natural here. The half-step lift to B major at the final hook return (2:25) is the emotional uplift moment; the strip-down around 2:10 (bare clavinet and bass, no brass) creates the tension that the full return resolves. No hard-stop gap markup used — the strip-down achieves contrast without triggering the truncation risk associated with gap metatags.

  DURATION STRATEGY — Timestamp labels with 2–6 word descriptors per feedback_lyrics_balance (no bare brackets, no prose-heavy brackets). Duration cue in first 200 chars of style ("3:00 to 3:30"). Ostinato returns every 20–30 seconds to sustain groove density and prevent truncation. Last vocal anchor at 2:25–2:58, outro at 2:58 — pushes the render window past the 3:00 floor.

  PRODUCTION TOKENS used: polished studio mix, wide stereo stage, warm tape saturation, tight chamber reverb, deep low-end definition, lush acoustic ambience — six tokens from the v5.5 reward set.

  STYLE — Sentence case throughout, atmospheric-first opening (genre + mood + duration cue in first sentence). 942 chars — within 700–950 target.

  SCENE — A confident woman crossing a sunlit room, unhurried, the groove already moving before she opens her mouth. Mid-afternoon soul club vibe, analog warmth, no irony.

