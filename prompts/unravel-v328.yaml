style: "Confessional indie-pop — a dim bedroom at first light, cold floor. Voice and lightly crunchy electric guitar arrive at beat one, the hook declared raw and close-miked before the room has settled. Polished studio mix, warm tape saturation, wide stereo stage. E major lifting to F major at the final chorus, 168 BPM notated in a half-time feel at 84-beat pulse. Celesta stitches bright shimmer between phrases; clarinet carries verses in warm chalumeau register just above the vocal; flugelhorn swells beneath choruses like a velvet undercurrent. Verses: voice, guitar, clarinet only. Pre-chorus assembles the trio. Bridge strips to voice over one sustained flugelhorn tone. Final chorus: three-voice harmony, celesta cascading, flugelhorn and clarinet locked beneath. Ends on a ringing guitar chord fade. Underscore for a raw confessional self-exposure scene. No rock drums, no pipe organ, no synthesizers, no orchestral brass section, no autotune."

lyrics: |
  [Chorus, voice and guitar, 0:00]
  I keep calling back
  Every little crack
  In the walls I built for me
  I can't take it back
  Every word, every act
  I gave you everything

  [Verse 1, clarinet enters, 0:22]
  Sunday morning light
  Your coffee going cold
  I practiced what I'd say
  But every word fell away

  [Pre-chorus, trio assembles, 0:52]
  I don't want to disappear
  I want to stay right here
  With all my edges showing

  [Chorus, celesta added, 1:05]
  I keep calling back
  Every little crack
  In the walls I built for me
  I can't take it back
  Every word, every act
  I gave you everything

  [Verse 2, stripped back, 1:27]
  Two years in a drawer
  Old photos on the floor
  I've changed too much to cover

  [Bridge, voice and flugelhorn, 1:52]
  Maybe this is who I am
  Still reaching through the dark
  Holding every piece of me

  [Final chorus, harmonies, half-step up, 2:15]
  I keep calling back
  Every little crack
  In the walls I built for me
  I can't take it back
  Every word, every act
  I gave you everything
  Oh, everything

  [End]

