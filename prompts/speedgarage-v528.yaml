notes: |
  Speed garage (also called bassline house or UK garage) is a late-1990s British dance genre built on a skippy, swung 4x4 kick pattern, a prominent detuned reese sub-bass, and chopped or pitched diva vocal samples — the bassline carries the melody weight while the kick stays relentlessly forward. The genre defined the sound of UK warehouse raves from roughly 1997-2001 before fracturing into grime and UK funky.

  Concept source: 2am warehouse drop architecture — medical-crisis-as-euphoria image where "fever break" mirrors the physical sensation of a rave drop, with the sung falling fifth in the hook landing in unison with the reese sub-bass interval.

  The trio is all electronic-native body voices: wobbling reese sub-bass (detuned oscillator pair, the melodic anchor), rave organ stabs (off-beat mid-range punch, characteristic of the genre), and skippy 4x4 garage kick (the swung timing signature that distinguishes speed garage from straight techno). No spectral instruments — full body voice count.

  Duration strategy: parametrized colon-syntax lyrics with bar counts (8+16+8+16+16+24+24+8 = 120 bars at 135 BPM targets ~3:30). Mid-song Breakdown section (24 bars) stays full and beat-driven — not ambient or exposed — per v527 lesson that sparse mid-song sections truncate hard. Final sung hook pushed past 2:40 by the Drop 2 placement. Production tokens used: polished studio mix, deep low-end definition, wide stereo stage, tight room reverb, warm tape saturation. Style 881 chars, sentence case throughout, atmospheric-first opening. Negative-prompt audit: no contradictions — electronic, synths, bass, and vocals are NOT excluded (this is a vocal electronic dance track); only non-native genres are excluded.

  The "Fever break" hook's falling fifth ('FE-ver' on a repeated pitch, 'BREAK' drops a fifth on beat 1 of the drop) mirrors the reese sub-bass interval so vocal and bass lock in unison at the drop — a frequency-convergence moment for maximum floor impact.

