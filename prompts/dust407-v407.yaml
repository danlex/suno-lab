name: "Dust407"
version: 407
style: "Underscore for homecoming joy — warm organic afro-house, 125 BPM, B major, polished studio mix. A sidechain-pumped four-on-the-floor kick drives the floor with peak-time forward energy — insistent, not laid-back. Log-drum and conga patterns lock with a continuous shaker on the offbeats, wide stereo spread. A kalimba two-bar melodic cell lifts to the major sixth and resolves — warm, the harmonic anchor. A rounded warm bass holds deep low-end definition. A sung female topline weaves between the congas like a fifth drum — short phrases on offbeats, syllables answering the log-drum hits, intimate in the verse, opening wider in the chorus. Close-miked, warm, plainspoken, forward in the mix. Verses tighter; chorus opens to a fuller, brighter sound. The groove is communal and joyful — organic percussion, a ringing kalimba, and a voice that belongs inside the rhythm. No guitars, no rock drums, no pipe organ, no autotuned pitch shifts."
title: "Dust407"
lyrics: |
  [Intro: log-drum, kalimba, 0:00]

  [Verse 1: 0:12]
  The chair is still beside the window
  Where I used to read the light
  My handprint on the door frame
  Worn into the wood just right
  There's a dip in the floorboard
  Where I always stood to wait

  [Pre-Chorus: 0:33]
  I didn't ask it to hold on
  But every corner held my name

  [Chorus: 0:46]
  They swept the floor but kept my dust
  My name is still warm in this wood
  They swept the floor but kept my dust
  My name is still warm in this wood

  [Groove Vamp: log-drum, kalimba, 1:06]

  [Verse 2: 1:44]
  A cup kept my colour on the shelf
  The threshold still remembers every step
  A crack above the window holds the year
  I walked away — the house would still be here

  [Chorus: 2:01]
  They swept the floor but kept my dust
  My name is still warm in this wood
  They swept the floor but kept my dust
  My name is still warm in this wood

  [Skeleton Reveal: kick+bass+vocal, 2:43]
  They swept the floor but kept my dust
  My name is still warm in this wood

  [Outro: 3:04]

  [End]
