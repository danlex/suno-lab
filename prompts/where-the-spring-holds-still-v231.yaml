name: "where-the-spring-holds-still"
version: 231
title: "Where the Spring Holds Still"
instrumental: true

style: "Modern orchestral cinematic score, E minor, QUARTAL HARMONY ARC,\
  \ total duration 3:00, NYCKELHARPA + BASS TROMBONE + CIMBALOM at 145 BPM.\
  \ Open perfect fourths stack into hollow suspension — dense yet weightless,\
  \ never resolving. The nyckelharpa opens alone at 0:00, sustaining open-fourth\
  \ dyads on a bench-lamp-lit workbench, its sympathetic strings ringing like\
  \ coiled watch-springs. Bass trombone enters at 0:25, anchoring the lowest\
  \ fourth with cavernous weight. Cimbalom threads metallic glint at 1:00,\
  \ tremolo across the dense buildup. Strings and winds fill inner quartal\
  \ voices by register alone. At 2:10 the collapse: all fourths fold to a\
  \ single bare unison, the stopped watch ticking again; cimbalom delivers\
  \ one dry strike — the tick. The ensemble settles quietly. Film score for\
  \ a horologer-examining-a-stopped-watch scene. No guitars, no vocals, no\
  \ rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Short Instrumental Intro]
  [Nyckelharpa Bare Fourth Drone]
  [Bass Trombone Enters Low]
  [Cimbalom Tremolo Threads In]
  [Quartal Voices Stack and Saturate]
  [Peak Cluster 6-Voice Tension]
  [2:10 — Collapse to Bare Unison]
  [Single Cimbalom Strike — The Tick]
  [Ensemble Settles — Mechanism Resumes]
  [End]

exclude_styles: "Arabic, tribal, world music, acoustic guitar, rock, metal,
