  TRIO INSTRUMENTS:
  - Tam-tam (CATALOG DEBUT — never used in 317 prior versions; gap infinite): large
    bronze gong struck with heavy beater, producing a slow-building crash with long
    decay tail — the defining percussive marker of theatrical choral-orchestral climaxes.
    Opens the piece from 0:00 as the first sonic event, anchoring downbeats with
    thunderous low-frequency mass. Rolls through full-ensemble sections and final brass
    hammer blow. First appearance of this instrument in the entire 317-version catalog.
  - Piccolo (last v242, gap 76): the highest-pitched standard orchestral instrument,
    sounding an octave above written pitch. Enters at the full ensemble ignition (2:15)
    as the blazing fanfare voice cutting above every other instrument — brass, choir,
    soprano. Its piercing high register is the exact sonic complement to the tam-tam's
    cavernous low end, framing the full texture from extremity to extremity. 76-cycle
    revival is among the deepest single-instrument gap revivals in catalog history.
  - Stile concitato tremolo strings (full violin + viola section — body voice): the
    entire violin and viola section in measured semiquaver repeated-note tremolo,
    deployed as a full-section Baroque agitation engine from 0:25 onward. Not a solo
    string line — a mass of strings in unison rapid figuration, creating the hammering
    rhythmic pressure that sustains relentless defiance across every section except the
    bare percussion gate. String orchestra used at v310 and v316 in slow-bow sustain
    roles; this cycle's semiquaver-tremolo function is a wholly distinct deployment.

  Latin lyric vocabulary: "Ignis" (fire), "veritas" (truth), "vincit" (conquers),
  "tonat" (thunders), "iustitia" (justice), "aeterna" (eternal), "fortuna" (fortune/fate),
  "vertit" (turns), "tempus" (time), "victoria" (victory), "lumen" (light — used as
  song title at v298, here as lyric word only), "lucet" (shines), "omnia" (all things).
  Male choir chants relentless short phrases ("Ignis, veritas, vincit"; "tempus, tempus
  tonat"). Dramatic soprano carries lyric lines at peak ("Lumen aeterna, fortuna vertit";
  "Lumen aeterna lucet"). Concept: the cathedral as crucible of justice — fire hammers
  to truth, the wheel of fate turns by relentless percussion, the eternal flame outlasts.

