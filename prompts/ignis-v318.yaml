notes: |
  v318 "Ignis" — stile concitato Baroque agitation engine x cinematic symphonic-choral
  fiery defiance. Third pole of the monumental emotional triptych: v316 Hiraeth (grief)
  + v317 Sorgente (transcendence) + v318 Ignis (defiance).

  TECHNIQUE: Stile concitato ("agitated style") is a Baroque compositional device
  formalised in the early 17th century as a means of musical expression for agitation,
  combat, and fierce emotion. Its engine is the semiquaver (sixteenth-note) tremolo:
  rapid repeated articulation of a single pitch or chord across strings or other
  sustaining voices, producing a hammering, relentless rhythmic energy that saturates
  the texture from below. The effect is distinct from standard tremolo (speed variation)
  or bowing tremolo (unmeasured) — stile concitato specifies measured semiquaver
  repetition as a structural device. Here it is deployed as a full string-section force:
  all violins and violas in unison semiquaver figuration, not a solo line, producing a
  wall of agitation beneath the choral mass. The technique influenced later composers'
  battaglia and scenes of just wrath — none named here per catalog discipline.

  Concept source (researcher): "v318 Ignis — stile concitato Baroque-engine x cinematic
  symphonic-choral fiery defiance. THIRD pole of the monumental emotional triptych
  (v316 grief + v317 transcendence + v318 DEFIANCE). Hammering semiquaver tremolo
  strings under massed low male choir + dramatic soprano apex. Emotion through relentless
  driving defiance — the opposite of v316's vulnerability and v317's communal welling."

  Composer-omission: the architecture of massed low choir in brutal unison beneath a
  soaring soprano, underpinned by hammering string figuration and punctuated by tam-tam
  and brass, most directly echoes two canonical choral-orchestral works of the 19th
  century — one a secular cantata anchored by a wheel-of-fate motif, one a sacred
  sequence for the dead turned theatrically confrontational. Neither composer is named
  here per catalog discipline.

  Duration strategy: BPM 120 sits at the upper edge of the slow band (playbook rule 8
  ceiling ~3:30 for ≤115 BPM, borderline at 120). Total lyric bar count: 176 bars across
  9 sections. Duration drivers applied:
