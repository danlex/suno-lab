style: "Symphonic choral fiery defiance — stile concitato semiquaver tremolo strings as relentless agitation engine, massed low male choir in brutal unison chant, dramatic soprano soaring as spear-tip above the blaze. Cathedral nave at midnight, lightning through rose windows, stone cold, hundreds rising as one. Polished studio mix, Hollywood stage, deep low-end definition. D minor lifting to Eb minor at 2:40, 120 BPM. Tam-tam and brass fanfare open hammering meter. Tremolo strings ignite at 0:25 — violins and violas in rapid semiquavers. Bass-baritone choir enters brutal unison chant; soprano cuts through at 1:20. Bare percussion gate at 2:10: tam-tam only. Full ensemble ignition at 2:15; piccolo fanfare cuts highest. Half-step lift to Eb minor at 2:40; brass hammer blow; soprano above the choir's final chord. Film score for a communal defiance-rising scene. No guitars, no rock drums, no pipe organ, no synthesizers, no electronic beat."

