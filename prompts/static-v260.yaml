notes: |
  VIRAL PIVOT — v260 is an explicit rule-override cycle. The catalog through v259 has been cinematic-orchestral instrumental; this cycle pivots to drift phonk, Suno's strongest documented viral lane on short-form video platforms.

  Technique: drift phonk is a Memphis-rap-derived subgenre defined by distorted 808 sub-bass, cowbell on the half-beat (not downbeat), slowed-and-reverbed vocal chops, dark melodic minor string samples, and a sigma-stoic aesthetic. It emerged from slowed-and-reverbed edits of Memphis rap and became a dominant sonic identity on short-form video from roughly 2022 onward. No specific artists named per blocklist discipline.

  Concept source: late-night drift racing energy — neon rain, engine idle, nobody watching, no destination. The stoic isolation aesthetic is the emotional core, not narrative lyrics.

  Rule overrides explicitly applied for this cycle:
  - instrumental: false (vocal chops are the earworm hook)
  - Synthesizers allowed (808, sidechained pad)
  - Trap/cowbell drum pattern allowed
  - exclude_styles replaces the standard cinematic list with phonk-correct negatives
  - Style char range 600-900 (viral tighter than cinematic)
  - Duration target 1:45-2:30 (TikTok-optimized hook structure)
  - Lyrics use standard pop section labels (no colon-syntax bar counts from cinematic playbook)
  - Build/Silence/Drop classical arc suspended; replaced by Drop-first hook structure

  Vocal direction: deep distorted male whisper, slowed and reverbed. Lyrics use stylized vowel-sound phonk chops ("uh-oh-wo", "na-na-uh", "oh-wo-oh") rather than sung English words, to stay in the genre voice. The four-line verse sections ("walk through the rain alone / engine and the cold") provide just enough stoic atmosphere without melodic-pop sing-along energy.

  Production tokens in style: distorted 808 sub-bass, cowbell on the half-beat, vinyl crackle, slowed reverb vocal chops, sidechained synth pad, Memphis chop, polished underground mix.

  Key: A minor (drift phonk canonical default — dark, simple, recognizable).
  BPM: 138 (canonical drift phonk range 130-140).
  Style chars: 785.

  This is the first non-instrumental, non-cinematic entry in the v200+ catalog. The genre pivot is intentional and bounded to this cycle as a documented experiment.
