notes: |
  Technique: EBM-industrial dark-techno with three acoustic texture voices — cimbalom,
  tenor saxophone, and french horn — layered above a cold electronic engine. The cimbalom,
  a Central European hammered dulcimer with a bright metallic reverberant attack, functions
  as the primary glacial shimmer voice; each struck string delivers a "frozen needle" of
  overtone that cuts through the low-end reese density. The tenor saxophone enters once in
  the mid-track breakdown as an unexpected human warmth contrast voice — a single smoky noir
  line against the machine. The french horn enters in the final section with cold muted calls
  cutting through the half-step-lifted grid, adding a brass authority to the relentless close.

  Concept source: dark clubbing / EBM-industrial techno with cimbalom as glacial
  hammered-metal texture above the synth bed, tenor saxophone as one-time human-warmth
  breakdown voice, french horn as cold muted final-section brass, cold deadpan female vocal,
  and a filter-sweep build into a half-step lift drop (A-flat minor to A minor).

  Composer-omission: This cycle echoes the cold-menacing industrial club sensibility of
  certain late-1980s through early-2000s European electronic-industrial acts whose names
  are omitted per house policy. The cimbalom, tenor saxophone, and french horn bring acoustic
  textures those acts never employed, making this compositionally distinct.

  Duration strategy: BPM 134 sits in the proven 130-160 duration band. Forward-motion
  concept (cipher-as-cold-grid, half-step kinetic payoff) targets 3:00-3:30 per the
  playbook rule. Duration levers applied: (1) explicit lyric-free instrumental vamp
  at 1:38-2:06 (~28 seconds, Filter Sweep + Breakdown stretch without sung lyrics), (2)
  last lyric timestamp at 2:38, (3) outro section pushed to 3:02. No [Silence] metatag
  used — per feedback_silence_gate_truncates, explicit [Silence] markup truncates; instead
  the [Filter Sweep] section removes vocal and builds tension while kick keeps running,
  then [Breakdown] continues the lyric-free stretch with saxophone and reese only.
  Production tokens: polished studio mix, deep low-end definition, wide stereo stage.
  Atmospheric-first opening names genre, mood, key, BPM in the first ~115 chars. Five
  inline negatives close the style field. Sentence case throughout — no ALL-CAPS labels.

  Instrument roles (trio: cimbalom, tenor saxophone, french horn):
  - Cimbalom (body voice): glacial hammered-steel shimmer; enters at Verse 2 and runs
    through the track; metallic attack cuts through reese density with frozen-needle
    overtones; returns prominently at the Drop (2:06) as signal the lifted grid is back.
    Primary featured instrument. Body voice (hammered dulcimer family).
  - Tenor saxophone (body voice): enters once in the Breakdown at 1:38; a single smoky
    noir line offering unexpected human warmth against the cold machine before the Drop
    reclaims the track. Contrast voice — one appearance makes it memorable. Body voice.
  - French horn (body voice): enters in the Final Chorus (2:38); cold muted brass calls
    cutting through the half-step-lifted grid, adding authority to the relentless close.
    Body voice. All three trio instruments are body voices — zero spectral picks.

  Trio body-voice count: 3 body voices (cimbalom, tenor saxophone, french horn).
  Satisfies the >= 2 body voices rule with margin. Zero spectral instruments in trio.

  Novelty claims: Cimbalom in an EBM/dark-techno context is novel to the catalog.
  Tenor saxophone as a single-appearance "human warmth vs. machine" contrast voice in
  a cold techno breakdown is a fresh deployment. French horn in a dark-techno grid
  context adds a menacing brass weight rarely associated with this genre. The filter-sweep
  build (no [Silence] tag, filter opens rising) is validated per feedback. BPM 134 matches
  v352 (proven dark-techno duration). A-flat minor to A minor is a fresh key pair.

