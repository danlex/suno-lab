title: "Cipher"
instrumental: false
vocal_gender: female

style: |
  Cold dark-techno menace, hypnotic, relentless, polished studio mix, wide stereo. A-flat minor lifting a half-step to A minor at the final section, 134 BPM. A four-on-the-floor kick anchors the pulse; a thick detuned bass pulse grinds cold beneath; industrial percussion flares. A cimbalom casts glacial hammered-steel shimmer above the bed — each struck string a frozen needle. A tenor saxophone breathes once in the breakdown, a smoky line of unexpected warmth. A french horn enters late — cold muted calls through the lifted grid. Cold female phrases, deadpan. Near 1:30 the filter sweeps upward, tension coils, vocal strips to just the bass pulse — then the drop lifts half a step, the full grid returns harder. Near 2:06 the drop lands full. Cold grid underfoot, ciphered numbers above. Underscore for a cipher-transmission scene — the message decoded at the drop. No guitars, no warm strings, no pipe organ, no synthesizers, no acoustic drums.

lyrics: |
  [Intro: kick and bass pulse, 0:00]

  [Verse 1: cold vocal over kick grid, 0:14]
  Signal locked behind the wall
  Every number placed and small
  Cold inside the corridor
  Nothing human anymore

  [Verse 2: cimbalom shimmer enters, 0:38]
  Watch the grid until it bends
  Every threshold breaks and mends
  Something hollow in the wire
  Feeds the city like a fire

  [Chorus: full industrial layers, 1:02]
  Run the current
  Let it burn
  Nothing standing
  Nowhere to turn
  Run it colder

  [Filter Sweep: bass rises, vocal strips bare, 1:26]

  [Breakdown: bass pulse, tenor saxophone line, 1:38]

  [Drop: A minor lift, full kick and cimbalom, 2:06]

  [Verse 3: vocal over lifted grid, 2:14]
  Underneath the concrete runs
  Every wire, every one
  No one watching at the seam
  Nothing here is what it seems

  [Final Chorus: french horn cold calls, relentless close, 2:38]
  Run the current
  Watch it burn
  Nothing standing
  Nowhere to turn
  Run it colder

  [Outro: kick and bass fade, 3:02]

  [End]

