notes: "v116 — ORCHESTRAL FUTURE GARAGE. Return to electronic fusion after 5 consecutive pure-orchestral architectural forms (v110 bolero, v111 passacaglia, v112 lone-center, v113 fugue, v114 arch, v115 rondo). This is the synthesis era's core identity: electronic genre + full orchestra + unusual instruments. First future garage attempt in 115 prior prompts. RESEARCH: MasterClass future-garage guide (5 characteristics: shuffling 2-step beats, sub-bass pressure, heavy reverb/delay depth, ghostly vocal elements, nocturnal atmosphere), Wikipedia future-garage (Burial's Untrue 2007 as blueprint), Toxigon 'Atmospheric Sound of Tomorrow' (lush pads, field recordings, reverb-soaked space), Synergy FM soundscape analysis. LEARNED: (1) Future garage = 130 BPM, shuffling 2-step beat (not straight 4/4), heavy reverb, sub-bass, nocturnal reflective mood. Burial's signature: ghostly vocal shards + urban ambience as deeply emotive inward-looking experience. Fits perfectly with user's 'fragile becoming infinite' aesthetic from memory. (2) Mellotron (repo first use per novelty_surface) = tape-playback keyboard from 1960s-70s, each key triggers a pre-recorded tape loop (strings, flute, choir). Ghostly, warped quality. Perfect bridge between electronic and acoustic — literally tapes of acoustic instruments. (3) Handpan (v97, 18 versions ago) = meditative metallic percussion, natural sustain, replaces typical electronic percussion with organic metallic tones. (4) Piccolo (v83, 32 versions ago, deepest revival this session) = highest standard orchestral instrument. Used here as the 'ghost singing from ceiling' — extreme frequency contrast with sub-bass. DURATION: continues v115 approach: tighter style language + structural metatags in lyrics field ([Short Instrumental Intro] → [Atmospheric Build] → [Climax] → [Silence] → [Return] → [End]). Testing whether simplified metatag set works better than v115's rondo-specific labels. NOTE: exclude_styles includes 'UK garage' and '2-step' to prevent Suno from interpreting 'future garage' as literal 2-step garage (which would override the atmospheric intent). 903 chars."
