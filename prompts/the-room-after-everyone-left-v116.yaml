style: "ORCHESTRAL FUTURE GARAGE film score for an abandoned-room scene, total duration 1:40 to 1:55 (ends at 1:55, never longer), with MELLOTRON + HANDPAN + PICCOLO, atmospheric reverb-drenched space where sub-bass meets orchestral depth, B minor to C minor, 130 BPM, instrumental. From 0:00 mellotron enters alone — warped tape-loop strings ghosting through heavy reverb, each note decaying into infinite space. At 0:20 handpan joins, meditative metallic percussion ringing over a shuffling rhythmic undercurrent. At 0:45 piccolo rises above everything, the highest voice floating over the deepest atmosphere. Chamber strings swell at 1:05, orchestral warmth meeting sub-bass pressure. Silence at 1:20 — three beats of void. At 1:23 music returns in C minor half-step up, mellotron thundering, handpan ringing, piccolo soaring, fortississimo. Ends at 1:55. No guitars, no vocals, no rock drums, no pipe organ."
