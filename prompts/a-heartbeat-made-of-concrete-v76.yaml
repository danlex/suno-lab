name: "a-heartbeat-made-of-concrete"
version: 76
style: "DARK orchestral techno hybrid, B minor, 130 BPM, purely instrumental. Charlotte de Witte meets Hans Zimmer in a cathedral after midnight. Relentless four-on-the-floor techno kick drives from beat one — dark, hypnotic, pounding like industrial machinery. Minimal acid bass burbles underneath in evolving patterns. A full symphony orchestra enters on top — strings in long sustained notes layered over the beat, brass playing slow menacing chords against the kick rhythm. Pipe organ holds a low drone cutting through everything. As the track progresses, the orchestra gets more frantic while the kick stays locked — 130 BPM forever, like a heartbeat made of concrete. Rolling acid synth lines lock with cellos in impossible unison. No drops, no builds — just steady relentless forward motion getting darker until strings and brass scream over the techno kick. A symphony orchestra playing in an abandoned Berlin warehouse. Modern dark techno production. No vocals, no guitars."
title: "A Heartbeat Made of Concrete"
lyrics: ""
instrumental: true
exclude_styles: "vocals, singing, gentle, ambient, soft, lo-fi, calm, Arabic, tribal, world music, acoustic guitar, rock, pop"
