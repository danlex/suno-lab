style: "Symphonic metal, dark female mezzo-soprano, powerful electric guitar, full orchestra, driving double bass drums, dramatic choir, cinematic and fierce, gothic rock meets classical grandeur, explosive energy"
title: "The Crown I Forged Myself"
lyrics: |
  [Heavy Guitar Riff and Orchestra]
  They handed me a kingdom
  Made of paper and of lies
  A throne of empty promises
  Beneath indifferent skies

  [Driving Drums and Bass Enter]
  So I melted down their golden cage
  And hammered it to steel
  Forged a crown from every wound
  They thought would never heal

  [Full Symphonic Metal - Massive]
  This is the crown I forged myself
  From fire and from will
  No birthright and no blessing
  Just the strength to climb the hill

  [Quiet - Clean Guitar and Voice]
  They'll write their histories without me
  They always do

  [Explosive Final - Everything]
  But the crown I forged myself
  Burns brighter than their sun
  And every queen who built her throne
  From nothing
  Has already won

  Already won
  Already won

  [End]
