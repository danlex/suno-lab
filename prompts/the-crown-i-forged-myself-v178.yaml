notes: "v178: Symphonic metal — Nightwish/Within Temptation energy. Electric guitar + full orchestra + dark mezzo-soprano + choir + driving drums. The user liked 'Interstellar' (gothic orchestral rock) — this pushes further into metal territory while keeping the orchestral grandeur. Female empowerment theme continues from the world tour."
