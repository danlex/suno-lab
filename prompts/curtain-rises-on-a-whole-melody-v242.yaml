notes: |
  HOCKET-AND-FUSION is a technique rooted in medieval European practice (13th–14th century) in which a single melodic line is divided between two or more voices that alternate in strict rests — each voice fills the other's silences, so the melody only exists as the sum of all parts. This prompt modernizes it with spatial call-and-answer staging and a structural arc that moves from sparse pair → expanding chain → sustained breath → full-orchestra rhythmic unison (the "fusion" payoff where the hocket resolves into a complete shared melody for the first time).

  Concept source: hocket reframed for modern cinematic orchestra — pair-hocket opening, multi-voice chain expansion, single sustained chord as breath, then tutti rhythmic unison where all voices finally lock together and the melody arrives whole.

  Composer-omission note: several major practitioners of hocket and interlocking rhythm in both Western and non-Western traditions were intentionally omitted per the hard blocklist (no composer or performer names permitted).

  Duration strategy: UPRIGHT BASS is the body voice — continuous low plucked weight anchors the pulse and prevents Suno from losing rhythmic identity. The hocket structure itself enforces a constant rhythmic grid throughout, so even in the chain-expansion phase Suno has unambiguous beat placement. Full orchestra enters during the expansion and is indispensable at the fusion, giving the AI clear density escalation cues. Dense lyric sections (1-2 sentences each) encode the arc without over-specifying.

  Trio roles and version gaps:
  - UPRIGHT BASS (plucked strings, last v228, gap 14): BODY VOICE — pizzicato hocket bass, anchors beats 1 and 3 throughout.
  - CLAVICHORD (keyboards, last v229, gap 13): MIDDLE HOCKET VOICE — rapid shallow-key attacks fill the narrowing gaps as the chain expands.
  - PICCOLO (woodwinds, last v221, gap 21): TOP HOCKET VOICE — bright piercing accents on beats 2 and 4, the answering half of the seed phrase.

  Key: D-flat major (home key; luminous and noble for the opera-house setting) → D major (half-step lift at the fusion; brighter arrival key). BPM: 159 (unused; brisk processional pulse suits the suspended-anticipation of an empty auditorium before the curtain rises).

  Scene: an opera house before the curtain — empty auditorium, velvet curtain down, chairs arranged, programs on seats, instrument tuners offstage. The hocket arc maps the rituals of readiness: sparse pair = first violinist's A / one offstage horn answer; chain = more tuning, murmurs; sustained chord = conductor's downbeat; fusion / unison = the curtain rises and the overture theme arrives whole.

  Cultural guard applied: hocket has both medieval European and West African interlocking-rhythm associations. All such descriptors were excluded from style and lyrics — no "motet," no "sacred chant," no "African," no "West African," no "polyrhythmic," no "ethnic," no "folk," no "traditional," no "world music." The technique is described purely as "stutter-weave," "rhythmic mosaic," and "rhythmic unison." "hocket" appears only as a neutral technique label.

  Style char count: 947.
