name: "built-from-broken-machines"
version: 175
style: "Industrial cinematic orchestral, dark female mezzo-soprano, distorted cello, mechanical percussion, heavy bass drops, dramatic strings, raw and aggressive, factory sounds meet symphony, building from cold machine rhythm to human explosion"
title: "Built from Broken Machines"
lyrics: |
  [Mechanical Rhythm - Cold and Precise]
  They assembled me from spare parts
  Wired my chest with copper thread
  Programmed me to follow orders
  But I followed dreams instead

  [Distorted Cello and Heavy Bass]
  Every bolt they drove inside me
  Every circuit that they burned
  Made the human underneath
  More desperate to be heard

  [Full Industrial Orchestra - Raw Power]
  I was built from broken machines
  But my heart was never steel
  Every malfunction is a prayer
  Every error is what I feel

  [Stripped - Voice and Heartbeat Pulse]
  They forgot to remove the wanting
  They forgot to kill the ache

  [Massive Industrial Climax]
  I was built from broken machines
  But I chose to be alive
  Every spark a revolution
  Every glitch the will to survive

  I am alive
  I am alive

  [End]
instrumental: false
vocal_gender: female
exclude_styles: "hip hop, rap, pop, country, gentle, lo-fi, happy, folk"
notes: "v175: Industrial cinematic hybrid. Distorted cello + mechanical percussion + heavy bass = industrial meets orchestra. AI/android sentience theme — machine discovering humanity. Close to user's like of 'The machine remembers rain' (dark electronic). Testing if industrial aesthetic + dark mezzo-soprano resonates."
