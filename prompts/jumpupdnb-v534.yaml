notes: |
  Jump-up drum and bass is a UK sub-genre of drum and bass originating in the late 1990s, defined by rolling 2-step breakbeats at 170-180 BPM, oversized wobbling basslines tuned to the reese waveform, and a deliberately playful-aggressive energy that fills warehouse floors. The genre sits at the intersection of rave culture and engineering discipline — the bassline is specced, not improvised; the chops are deliberate; the chaos is arranged.

  The concept source is the "Tuesday in the rib cage" hook: a specific wrong-weekday (Tuesday, the most inside of inside-the-week days) paired with the anatomical site where 174 BPM sub-bass registers physically. The syncopation contour — 'TUES-day' on beat-1 (two eighths), 'IN the' offbeat of beat 2, 'RIB-cage' syncopated beat 3-and with '-cage' dropping a perfect fifth below 'TUES-' (E4→A3) — gives the phrase a triplet-feel fingerprint that rides the 16th-note break texture. Verse lines supplied by caller: "Six in the morning, still wearing last night" / "Bass so low it's got an address" / "I gave my weight to the rolling drum."

  Duration strategy: 174 BPM is in the proven fast-render band. Parametrized colon-lyrics with bar counts (8+16+16+16+24+32+24+8 = 144 bars) give Suno per-section length targets. A dedicated full-density 32-bar instrumental break at ~60% of the song is the mandatory duration lever — it stays beat-driven, not ambient. Final hook lands late. Dense continuous arrangement with no silence gate prevents truncation.

  Trio roles: ROLLING BREAKBEAT drives the rhythmic engine, 2-step pattern with syncopated hats. GROWLING JUMP-UP BASSLINE is the harmonic and physical anchor, wobbling reese waveform in E minor. CHOPPED VOCAL STABS provide melodic identity across the drop — the hook sung by a punchy female vocal with attitude, stabs chopped for rhythmic texture.

  Negative-prompt discipline: style ends with 5 inline negatives. Exclude_styles blocks orchestral, ambient, acoustic, and genre-drift vectors without blocking electronic/breakbeat/bass/vocals. No contradiction — the electronic and vocal bed is preserved.

  Novelty: jump-up DnB genre is new to this catalog position. 174 BPM used in v529 in a different genre context. E minor has 27 prior uses. Scene (3am warehouse, sub-bass as physical force) is fresh.

