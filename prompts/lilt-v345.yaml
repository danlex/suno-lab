style: "Bright uptempo chamber-pop bursting with racing delight, clean modern production, 173 BPM in A major lifting to B-flat major at the final section for a joyful half-step uplift. A female voice delivers fast rhythmic syllabic vocalise — light playful non-lexical syllables like da-na-ta, la-li-la, dee-da-dee — as the primary hook, woven between short English anchor lines. Sunlit room, bare feet bright on warm boards. The trio is prepared piano, pizzicato strings, and marimba: prepared piano gives a plinky percussive attack bright, full of spring, pizzicato strings drive the chamber-pop propulsion with tight rhythmic energy, and marimba carries the bright mallet melody in arpeggiated runs. The texture stays light and transparent, never dense. Final syllabic race-out near 2:45, bright ringing cadence near 3:00. Underscore for a sunlit sprint scene, morning air sharp. No guitars, no rock drums, no synthesizers, no pipe organ, no thick bass."

