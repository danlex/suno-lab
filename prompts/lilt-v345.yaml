  [Chorus: full trio A major, marimba runs, 0:44]
  Da-na-ta, dee-da-dee, la-li-la
  Let it race, let it fly
  Da-na-ta, ta-da-na, dee-da-dee
  Watch the bright day rise high

  [Verse 2: prepared piano plink, lean texture, 1:10]
  Da-na-ta, la-li-la
  Light is rushing in again
  Dee-da-dee, ta-da-na
  No room left for pain

  [Chorus: full trio reprised, driving, 1:34]
  Da-na-ta, dee-da-dee, la-li-la
  Let it race, let it fly
  Da-na-ta, ta-da-na, dee-da-dee
  Watch the bright day rise high

  [Bridge: stripped marimba, breath, 2:00]
