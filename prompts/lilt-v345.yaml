  Every moment earned

  [Final Chorus: B-flat major lift, syllabic race-out, 2:20]
  Da-na-ta, dee-da-dee, la-li-la
  Let it race, let it fly
  (Da-na-ta, la-li-la, dee-da-dee)

  [Outro: marimba rings, bright fade, 2:45]
