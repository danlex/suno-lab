notes: |
  VIRAL ARM cycle v261 — slap house experiment, rule overrides in effect.

  Slap house (also "Russian deep," "future rave") is the second-strongest Suno short-form lane
  identified in the v260 roadmap research. Canonical traits: 124 BPM four-on-the-floor,
  sidechained plucky synth lead (the "donk" sound associated with Eastern European melodic
  dance), soaring female reverb vocal on a one-phrase hook, and heavy sub-bass sidechain
  ducking. The genre was popularized by a cluster of Russian and European producers without
  artist names invoked here.

  Rule overrides vs. cinematic playbook:
  - instrumental: false (vocals enabled, female)
  - Synthesizers ALLOWED (sidechain pluck, sub-bass, stereo pads)
  - Rock drums ALLOWED (four-on-the-floor kick + 2&4 clap)
  - Style char range relaxed to 600-900 (was 700-950)
  - Duration target short-form optimized: 1:45-2:30 (NOT 3:00+)
  - Lyrics use pop-format labels: [Intro] [Build] [Drop] [Verse] [Hook] [Final Drop] [Outro]
  - Exclude_styles uses short-form list (NOT cinematic list)

  Key: A minor throughout, modulating to B-flat minor on the final drop — the classic
  half-step lift that creates the dance-floor rush without the silence-plus-modulation
  cliche of the cinematic arm.

  Title "Polnoch" (Russian: midnight) — meme-able, 1-word, Eastern-European-coded,
  matches the late-night Moscow rooftop mood.

  Comparison to v260 "Static" (drift phonk): v260 tested slow-tempo dark phonk at ~130 BPM
  with Suno auto-tagging it correctly (1:42 + 2:14 clips). v261 tests the higher-energy
  slap house lane at canonical 124 BPM — expected to render similarly short (sub-2:30)
  given the pop-format lyric structure and vocal-forward genre. The Build/Drop/Hook
  repetition is the key engagement driver; emotional peak at the Final Drop modulation.

  Style char count: 893.
