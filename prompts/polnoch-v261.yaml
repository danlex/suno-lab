title: "Polnoch"

style: "Russian slap house future-rave melodic dance, 124 BPM, A minor to B-flat minor on the final drop. Sidechained plucky synth lead with that iconic \"donk\" melodic pulse, four-on-the-floor kick on every beat, sharp clap on 2 and 4. Soaring female melodic vocal with heavy reverb tail and layered double-tracked stack — Eastern European emotional intensity, yearning and romantic-melancholic. Late-night Moscow rooftop energy: neon reflections, dance-floor electric, longing in the air. Polished club mix with deep sidechained sub-bass, wide stereo synth pads ducking under the pluck, melodic dance bassline anchoring the groove. Vocal hook is one short phrase repeated with rising reverb — intimate and enormous at once. Half-step lift into B-flat minor at the final drop for that classic dance-floor rush. No country, no broadway, no jazz, no classical singer tone, no orchestral strings as lead."

