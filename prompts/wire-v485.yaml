notes: |
  v485 TOURNAMENT WINNER (inline-judged 85/100; beat sibling candidate B "chant-battle/beat-drop-reload" at 78 — B hit the 1000-char lyrics ceiling [forcing stripped bar counts + thinner verses] AND its climax was a 1-bar dead-air beat-cut, exactly the dissolution/silence-gate truncation risk on a groove-primary genre that already renders short; A has a fuller arc, richer MC bars, and keeps the kick alive throughout). Lane: BAILE FUNK (funk carioca) — never used; the deliberate FAST tempo break (148 BPM) after EIGHT straight 113-137 mid-tempo cycles.

  HIGH VARIANCE: FAST 148 BPM (breaks the mid-tempo cluster), MALE MC rap+shout (a fresh vocal MODE vs the recent pure-sung lanes), groove-primary/confrontational (not melodic), Rio street-party register. Vocal-gender alternation M/F/M/F/M/F/M/F/M held across v477-v485.

  HOOK: "Sweat on the wire" (hook-writer 19/25) — Rio rooftop image (sweat on the laundry wire between buildings) + English idiom "on the wire" (under pressure). "SWEAT" on the tamborzão beat-1 kick (808 sub-drop), "WIRE" held/bent up a tritone (C->F#) with a synth-whistle stab, unresolved. MC shouts first; crowd shouts back. Second phrase "still here — FIRE" adds a chantable answer.

  ARCHITECTURE — classic baile funk, density/drop climax (no modulation): bare tamborzão intro (8 bars) -> MC rap verse -> crowd-hook chorus -> 2nd cycle -> STRIPPED MC section (kick pulse ONLY, NOT silence — contrast without truncation) -> 24-bar lyric-free [Tamborzão Break] -> maximum-weight final chorus, hard cut. NO key change (deliberately dropped the novelty-picker's C-minor->D-flat-minor half-step lift, a penalized template).

  DURATION LEVER: the 24-bar lyric-free [Tamborzão Break] + a full two-verse/chorus arc + the stripped-MC section (kick kept live). Baile funk is groove-primary and can render short, so the arc is kept full and the vocal present throughout.

  INSTRUMENTS: tamborzão drum pattern (kick-every-beat + rapid snare rolls) + hyper-compressed 808 sub-bass + minimal bright synth-whistle stab. BPM 148 (novelty gap 255, near-virgin, dead-center baile-funk pocket) and C minor (novelty gap 47, freshest dark minor) from the novelty surface, avoiding all recent keys. Kept the palette genre-authentic (skipped novelty's mbira — Zimbabwean, would muddy a Brazilian lane).

  NEGATIVES AUDIT (feedback_negative_prompt_contradiction): does NOT exclude electronic/synth/808/bass/vocals/singing/rap (all load-bearing). Excludes Brazilian genre-drift (samba, bossa nova, pagode, axé, forró) + rock/live-band/acoustic.

  LANGUAGE: fully ENGLISH (English-language baile funk — the genre, not the language); verified no Portuguese in vocal lines ("tamborzão" appears only in bracket labels). ALL-CAPS hook lines are an intentional crowd-shout delivery cue.

  Style char count: 904.

