style: "Baile funk carioca — heat rising off concrete, a whole block moving as one, rooftop night air thick with bass and no apology. The tamborzão drum pattern drives every bar: kick on the downbeat, rapid snare-roll figure locking the pocket, hyper-compressed 808 sub-bass dropping a floor under the crowd, brick-wall limiting, near-zero reverb so the sound stays hard and close. A bright minimal synth-whistle stab punches in on the hook. 148 BPM, C minor, polished street-ready mix. Male MC vocal — punchy rap cadence on the verses, opening into a short crowd-ready sung and shouted hook the whole street yells back. Confident, defiant, communal. The groove is the architecture. No melody over the beat — just the pattern, the sub, the stab, and the shout. Wide stereo stage on the kick and sub; stab dead-centre. No guitars, no live band, no samba or bossa nova instrumentation, no rock drums, no lush pads."

lyrics: |
  [Intro: bare tamborzão + 808 sub-bass, no vocal, 8 bars]

  [Verse 1: MC punchy rap cadence over full tamborzão pocket, 16 bars]
  Top floor, no elevator, that is just the climb
  Sweat on your neck before you even make the time
  Block is awake, every window lit and loud
  Bass through the wall, bass through the floor, bass through the crowd
  Nothing is soft up here, nothing is smooth
  You either lock in or you lose the groove
  Hands up or hands in your pockets — pick a side
  We do not stop when the pressure rides

  [Chorus: crowd-ready shout-back hook, sub-drop + synth-whistle stab on WIRE, 8 bars]
  SWEAT ON THE WIRE
  (Sweat on the wire!)
  SWEAT ON THE WIRE
  (Sweat on the wire!)
  We are still here — FIRE
  (Still here — fire!)
  On the wire, on the wire

  [Verse 2: MC rap over full tamborzão, tighter cadence, 16 bars]
  They said the roof would break, the sound is too raw
  We said the roof has heard this block before
  Every body counts, every body knows the beat
  You feel the kick before your feet hit the street
  No ceiling on the heat when the night goes long
  No apology — the bass was never wrong
  Lights from the city below like a grid
  We claim the air above — that is what we did

  [Chorus: crowd-ready shout-back hook, sub-drop + synth-whistle stab on WIRE, 8 bars]
  SWEAT ON THE WIRE
  (Sweat on the wire!)
  SWEAT ON THE WIRE
  (Sweat on the wire!)
  We are still here — FIRE
  (Still here — fire!)
  On the wire, on the wire

  [Stripped MC: MC raps over minimal beat, kick pulse only, 16 bars]
  Just the kick now
  Just the kick and the voice and the block
  No flash, no trick — just the body and the clock
  You know the name, you know the sound we make
  Every rooftop carries what it will not break
  Keep it moving
  (Keep it moving)
  Keep it moving
  (Keep it moving)
  Hold the line

  [Tamborzão Break: full tamborzão + 808 sub-bass + synth-whistle stab, no vocal, 24 bars]

  [Final Chorus: maximum weight, full crowd shout, hard tamborzão pocket, 16 bars]
  SWEAT ON THE WIRE
  (Sweat on the wire!)
  SWEAT ON THE WIRE
  (Sweat on the wire!)
  We are still here — FIRE
  (Still here — fire!)
  On the wire, on the wire
  SWEAT ON THE WIRE
  (Sweat on the wire!)
  SWEAT — ON — THE WIRE

  [End]

