notes: "v123 — ORCHESTRAL NOIR SONATA. First sonata form in 122 prior prompts. The most sophisticated classical structure: exposition (two contrasting themes) → development (fragmentation, modulation) → recapitulation (themes return transformed) → coda. In noir framing: Theme A (flugelhorn = the detective, warm and searching) vs Theme B (tenor sax = the mystery, smoky and elusive). Development = the investigation. Recapitulation = the reveal. RESEARCH: Piano String Theory noir scoring guide — full orchestra, chromatic harmonies, leitmotifs, tense romanticism. Sonokinetic Noir library specifically features flugelhorn and tenor saxophone as core noir voices, confirming instrument choices. Neo-noir = smaller ensemble, smoky/urban atmosphere. Our 'orchestral noir' fuses the small-ensemble noir intimacy with full orchestral power. INSTRUMENTS: Flugelhorn (v106, 16-version gap) = mellow brass, darker/wider than trumpet, explicitly a noir instrument. Tenor saxophone (v107, 15-version gap) = warm, breathy, classic noir/jazz voice. Added 'jazz, blues, lounge' to exclude_styles to keep it orchestral not bebop. Steel tongue drum (v108, 14-version gap) = meditative metallic percussion, adds tension without driving rhythm. All deep revivals (14-16 gaps). NOVELTY: Sonata form = new. Noir genre = new. 102 BPM = never used. Eb minor (×2) is rare. Return to minor after 3 consecutive major-key experiments (v120-v122). 923 chars."
