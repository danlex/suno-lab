notes: |
  Lyrical sweeping cinematic elegy — the bittersweet emotional arc expressed at full-orchestra scale rather than in intimate chamber form. State-funeral scale: public grief, sweeping and historical rather than personal. The Build/Silence/Drop architecture (Playbook Move 7) is retained from v257, but the Drop section is inverted in density: instead of bare/exposed restatement, the Drop returns the theme in FULL ENSEMBLE DENSITY — strings, brass, and woodwinds together, mellotron broadening the harmonic bed, oboe leading the melodic ache above, marimba marking each downbeat in the body of the sound.

  Concept source: Direct hypothesis test of the drop-density question raised by v257's 3:12 mean render. v257 (exposed Drop, intimate chamber) was auto-tagged "cinematic ambient" by Suno and rendered short. v258 holds the same emotional family (bittersweet, both keys minor, half-step rise) but forces FULL-DENSITY Drop. If render hits 4:00+ this cycle, the hypothesis is supported and full-density Drop should be promoted as a playbook rule: "do not strip the Drop, keep tutti weight, Suno classifies exposed Drops as ambient and renders them shorter."

  The technique belongs to a tradition of state-ceremonial cinematic music — composers whose names are on the blocklist and are intentionally omitted. The emotional mechanism is the public-grief procession: not the private loss (v257's drawer of linens) but the national-historical weight of a cortege down a grand boulevard. Same harmonic logic (both keys minor, half-step rise as luminous sorrow), different scale and instrumentation density.

  Duration strategy: 166 BPM functions as cut-time 83 BPM processional. At 166 BPM actual (fast band), bar counts work efficiently (Playbook Move 8 table: BPM 160+ yields excellent bars-to-time efficiency). Total lyric bars: 252, squarely in the 240–280 target. Expected render: 4:00–5:00 wall-clock. Parametrized colon-syntax lyrics with per-section bar counts (Move 1). Production tokens: "Hollywood scoring stage," "Decca-tree wide strings," "deep low-end definition" — all three from Move 2, chosen for sweeping public scale. Sentence case throughout (Move 3). Atmospheric-first opening (Move 4). Build/Silence/Drop stack with true 8-bar silence and full-density Drop (Moves 7 and the new density hypothesis). Dead-weight superlatives stripped (Move 9). exclude_styles explicitly blocks "cinematic ambient" and "intimate chamber" to prevent the classification drift that affected v257.

  Trio rationale: three body voices satisfying Move 5 (≥2 body voices, zero spectral). Mellotron (gap 12, last used v246): orchestral-pad body, the harmonic foundation, the wide harmonic warmth under all voices. Oboe (gap 60, last used v198 — extraordinary deep revival): lyric-elegy body, the aching melodic line at the top of the texture, the human cry above the procession. Marimba (gap 21, last used v237): resonant percussive body, the heartbeat of the cortege, each downbeat marked in wood-resonance.

  Key: A-flat minor to A minor — half-step rise, both keys minor. The rise is luminous sorrow, not triumph. The grief does not resolve into release; it becomes more present, more seen, as the bier passes the gate.

  Scene: a capital city, gray winter morning, the grand boulevard lined many-deep with silent crowds, banners furled in black, the riderless horse with reversed boots in the stirrups, military honor guard rifles inverted, a distant bell tolling slowly, the weight of history in each footstep of the procession.

  Style character count: 938.
