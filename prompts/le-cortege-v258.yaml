name: "le-cortege-v258"
version: 258
title: "Le Cortège"
instrumental: true

style: "Gray winter sky over a grand boulevard, military honor guard slow-marching, a riderless horse, banners furled in black, the crowd silent and many-deep — national grief measured in stone-step pace. Hollywood scoring stage with Decca-tree wide strings and deep low-end definition. Three voices: mellotron pads hold the harmonic bed in broad orchestral warmth, oboe carries the aching melodic line, marimba marks each downbeat with resonant wood as the procession moves. A-flat minor through the long boulevard, then a half-step rise to A minor as the bier reaches the gate — luminous sorrow, both keys remaining minor. 166 BPM cut-time, felt as 83 BPM processional, each bar a deliberate footstep. Full strings, brass choir, woodwinds together, mellotron harmonic foundation underneath, oboe carrying the grief high, marimba anchoring each beat in the body of the sound. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Intro: distant tolling bell over cold ambience, solo oboe stating the grief theme softly above mellotron pad, marimba striking the first downbeat, 12 bars]
  [Cortege Enters: full string section joins beneath mellotron, oboe melody continues, marimba marking each beat as the procession steps forward, 16 bars]
  [Theme Unfolds: brass choir enters in low sustained chords, woodwinds filling the harmonic texture, oboe leading above the full ensemble, mellotron widening the harmonic bed, marimba steady, 24 bars]
  [First Deepening: full orchestra in A-flat minor, strings carrying the inner voices, oboe pressing the theme higher, mellotron sustaining beneath brass and woodwinds together, marimba resonant on every downbeat, 24 bars]
  [Counterpoint: oboe and a solo bassoon in two-voice counterpoint above the string foundation, mellotron holding the harmonic pillar, marimba quieter but present, 16 bars]
  [Second Deepening: full ensemble returns, harmonic tension darkening in A-flat minor, strings surging, brass swelling, woodwinds weaving, oboe pressing higher, mellotron deepening, marimba driving the beat, 24 bars]
  [Build: all voices accumulating weight — strings intensifying, brass choir pushing, woodwinds layering, mellotron thickening, oboe ascending, marimba anchoring the pulse as the procession approaches the gate, 32 bars]
  [Silence: full ensemble stops, absolute held breath, the cortege turning the corner, nothing underneath, 8 bars]
  [Drop: full orchestra returns together in A minor — string section, brass choir, woodwind voices all at once, mellotron harmonic bed broadening, oboe carrying the aching theme over the full ensemble tutti weight, marimba striking each downbeat in resonant affirmation, the grief now public and complete, 48 bars]
  [Drop Swells: full ensemble sustains the A minor theme, strings sweeping, brass deepening, woodwinds expanding the texture, mellotron holding wide harmonic warmth, oboe melody soaring above, marimba steady in the body of the sound, 32 bars]
  [Coda: orchestra slowly thins — brass withdraws, woodwinds fade, strings diminish, mellotron sustaining a final chord, oboe alone on the last phrase, marimba one last downbeat, then silence, 16 bars]
  [End]

exclude_styles: "Arabic, tribal, world music, acoustic guitar, rock, metal, lo-fi, vocals, singing, pipe organ, electronic, EDM, synthesizer, zen meditation, new age, experimental noise, free jazz, atonal, microtonal, quarter-tone, triumphant fanfare, cinematic action, march, march tempo, polka, klezmer, gypsy jazz, chamber music, ambient, cinematic ambient, intimate chamber"

