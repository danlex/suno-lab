notes: "v129 — ORCHESTRAL ALEATORIC. Fourth 20th-century avant-garde technique after micropolyphony (v126, dense cloud), minimalism (v127, precise patterns), spectral (v128, overtone-derived). Aleatoric = chance/indeterminate music. Performers make decisions within a framework — pitch sets, time windows, graphic notation. From Latin 'alea' = dice. RESEARCH: MasterClass + Wikipedia + Britannica confirm technique. Foundational work 'Music of Changes' (1951). Three types: random procedures → fixed score, mobile form, indeterminate notation. Paired with composers who are all blocklist (names omitted). INSTRUMENTS: French horn (×5, last v92 — **37-VERSION GAP, DEEPEST REVIVAL OF THE ENTIRE SESSION**) = warm brass, capable of multiphonics and microtonal bends. Harp (×7, v118, 11-gap) = glissandi across indeterminate pitch sets, archetypal chance-music instrument. Waterphone (×4, v114, 15-gap) = bowed metallic rods producing inherently unpredictable harmonics, literal aleatoric instrument. NOVELTY: First aleatoric. 82 BPM = never used. Db minor (×1) = near-virgin key. French horn 37-gap sets new depth record for this session. Wonder/indeterminacy emotion (new). Added 'experimental noise, free jazz' to exclude_styles to prevent the aleatoric concept from triggering abstract-noise territory. 920 chars."
