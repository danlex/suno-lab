style: "ORCHESTRAL ALEATORIC film score for a star-chart-drawn-from-chance scene, total duration 1:00 to 2:00, with FRENCH HORN + HARP + WATERPHONE, indeterminate pitches and timings where each player chooses within a framework, D-flat minor to D minor, 82 BPM, instrumental. From 0:00 waterphone enters alone — bowed metallic rods producing unpredictable harmonics. At 0:18 harp joins with glissandi across indeterminate pitch sets, fingers choosing notes from possibilities. At 0:40 french horn rises, muted brass playing microtonal bends and multiphonics. At 1:00 full orchestra enters — strings in clouds of indeterminate pitches, woodwinds choosing entry points, controlled chaos forming cosmic pattern. Silence at 1:25 — chance held still. At 1:28 music returns in D minor half-step up, all three voices fortississimo. Ends at 1:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
