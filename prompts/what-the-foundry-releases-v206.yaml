name: "what-the-foundry-releases"
version: 206
style: "COL LEGNO STRUCTURAL ARC at a foundry at the moment of cooling, total duration around 3:00. WATERPHONE + CONTRABASSOON + FLUGELHORN anchor three timbral states. From 0:00 to 1:10 the string section strikes with wooden bow-backs in col legno battuto at 103 BPM in A-flat minor, a dry skeletal rattle like cooling machinery; waterphone shimmers above with metallic resonance while contrabassoon breathes its subterranean growl beneath. At 1:10 strings shift to sul ponticello tremolo, bowing near the bridge for a bright metallic shimmer as texture thins, the orange glow of the metal fading to grey. Near 1:50 a silence of five seconds. At 2:00 the arco strings return in A minor, warm bowed tone flooding back — the return of melody itself is the catharsis. Flugelhorn enters, warm and mournful. Underscore for a foundry cooling scene, film score pacing. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "What the Foundry Releases"
lyrics: |
  [Short Instrumental Intro — col legno battuto strikes, dry]

  [Waterphone Shimmer Rises]

  [Contrabassoon Growl Enters]

  [Skeletal Rattle Builds — 103 BPM, A-flat minor]

  [Sul Ponticello Tremolo — shimmer thins]

  [Silence]

  [Arco Return — warm bowed tone, A minor]

  [Flugelhorn Sings Over Strings]

  [End]
