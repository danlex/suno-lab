exclude_styles: "Arabic, tribal, world music, acoustic guitar, rock, metal, gentle, lo-fi, vocals, singing, pipe organ, electronic, EDM, synthesizer, zen meditation, new age, experimental noise, free jazz, atonal, microtonal, quarter-tone, Scandinavian folk, Japanese folk"
notes: |
  v206 introduces the COL LEGNO STRUCTURAL ARC — a technique in which the string section's primary texture transitions through three distinct timbral states across the duration of a single piece: (1) col legno battuto (striking strings with the wooden back of the bow, producing a dry percussive rattle, favored in early-20th-century orchestral writing), (2) sul ponticello tremolo (bowing close to the bridge for metallic, shimmering overtones), and (3) full arco return (warm sustained bowing), where the reappearance of normal bowed tone is itself the climactic event. No electronic layer is required — the acoustic drama is entirely built into the strings' changing mode of contact with the instrument.

  The concept was synthesized from research into extended string techniques and their structural (not coloristic) use. Comparable precedents omit named composers per blocklist rules.

  Featured trio — three deep-revival families (metallic idiophone / woodwind / brass):
  - WATERPHONE: spectral metallic resonance, bowed and struck; sits over the col legno skeleton as spectral shimmer.
  - CONTRABASSOON: subterranean reed growl; the furnace breath anchoring the lowest register throughout.
  - FLUGELHORN: warm, mournful brass; withheld until the arco catharsis, arriving as the human voice the piece has been denying.

  Scene anchor: foundry at the moment of cooling — col legno rattle = mechanical cooling machinery; sul ponticello shimmer = the glow of solidifying metal; arco return = the warm release of the finished form.

  Duration strategy: tonal (A-flat minor modulating to A minor at the arco climax — sharpest half-step pivot available) + pulse-based (103 BPM, andante-moderato, not present in catalog) + 3-minute framing per v137+ override.

  Novelty claims: first COL LEGNO STRUCTURAL ARC prompt in catalog; 103 BPM not previously used; A-flat minor to A minor modulation is new; foundry-cooling scene is new.

  One meaningful change from v205: entire paradigm shift — from chanson réaliste vocal to instrumental structural arc; technique-first rather than voice-first; three-state bow-contact arc replaces verse/chorus structure.

