style: "Modern Persian pop ballad, Farsi pop, contemporary Iranian ballad, 82 BPM, C# minor, Tehran rooftop midnight. Female Persian pop vocal — mid-high crystal-tone with characteristic TAHRIR ornament (microtonal vocal trill turning around the central note, distinct from Hindustani gamak / Mor Lam glissando / dangdut cengkok), intimate close-mic Farsi pronunciation with poetic phrasing, dastgah modal inflections on long vowels, NOT Bollywood Hindustani, NOT Mor Lam nasal, NOT Mandopop head-voice, NOT mahraganat shouting — Persian tahrir-ornamented pop ballad signature. Production: gentle Western piano arpeggios, tar (Persian lute) atmospheric chord, santur (hammered dulcimer) light hammered phrases, soft strings, sparse trap drums on chorus, 808 sub on the drop, wide vocal reverb with rain ambience. 2026 Persian-diaspora midnight, NOT traditional Persian classical, NOT Sufi, NOT Arabic mahraganat, NOT Turkish makam. Tehran-Tehrangeles diaspora. No Sufi, no orchestral arena."

