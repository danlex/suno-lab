style: "ORCHESTRAL QUARTER-TONE film score for a glassblower-at-dawn scene, total duration 1:00 to 2:00, with CRISTAL BASCHET + CIMBALOM + PICCOLO, 24-note equal temperament where each pitch has a quarter-tone neighbor sliding in and out, C-sharp major to D major, 106 BPM, instrumental. From 0:00 cristal baschet enters alone — bowed glass rods, continuous glissandi between the keys of the piano. At 0:20 cimbalom joins, hammered strings with microtonal bends between each note. At 0:45 piccolo rises, shrill trills splitting each whole step into four. At 1:15 full orchestra enters, strings in quarter-tone harmonic fields, woodwinds bending sustained chords, brass holding just-intonation intervals. Silence at 1:25 — four seconds of rest. At 1:30 music returns in D major half-step up, all three voices fortississimo with crystalline microtonal bloom. Ends at 1:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "The Intervals Your Ear Forgot"
lyrics: |
  [Short Instrumental Intro]
  [Glass Glissando]
  [Hammered Microtones]
  [Shrill Quarter-Tone Trills]
  [Quarter-Tone Harmonic Field]
  [Silence]
  [Return Half-Step Up]
  [End]
