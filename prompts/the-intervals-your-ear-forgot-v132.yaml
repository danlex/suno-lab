notes: "v132 — ORCHESTRAL QUARTER-TONE MICROTONAL. Seventh 20th-century avant-garde technique after micropolyphony (v126), minimalism (v127), spectral (v128), aleatoric (v129), twelve-tone (v130), stochastic (v131). Quarter-tone = 24-note equal temperament — each half-step split in two. All non-percussive orchestral instruments can play microtonal gradations: winds via embouchure + altered fingerings, strings via fingerboard placement. RESEARCH: Microtonality research confirms orchestral feasibility. Notation uses double-flat/double-sharp symbols with arrows or dedicated glyphs. Composer name blocklist — Ives, Haba, Maneri, Grisey, Partch all omitted. Tonal framing kept (C#→D major) to avoid v130 atonal duration collapse. INSTRUMENTS: Cristal baschet (×3, last v112 — 20-gap) = bowed glass rods, naturally continuous pitch, literal microtonal instrument. Cimbalom (×2, last v115 — 17-gap) = hammered dulcimer, capable of microtonal bends between strikes. Piccolo (×2, last v116 — 16-gap) = highest woodwind, shrill microtonal trills. Three deep revivals, each from a distinct family: bowed glass, struck string, edge-blown wind. NOVELTY: First quarter-tone / microtonal. 106 BPM = never used. C# major (×2) = near-virgin key. Crystalline / between-the-notes emotion (new territory). 932 chars."
