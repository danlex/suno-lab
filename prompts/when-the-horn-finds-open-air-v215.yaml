title: "When the Horn Finds Open Air"
lyrics: |
  [Short Instrumental Intro — stopped horn alone, muted bite in cold air]

  [Felt Piano Enters — muffled warmth under the horn]

  [Cristal Baschet Blooms — bowed harmonics thicken, horn pushes toward cuivré]

  [Peak Density — forte cuivré crackle, flutter-tongue bite]

  [Silence]

  [Open-Bell Return — clean horn tone, half-step up to D minor]

  [Resolution — clarity out of distortion, scriptorium lit]

