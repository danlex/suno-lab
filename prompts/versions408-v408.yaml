notes: |
  Jump-up drum and bass is a sub-genre of drum and bass characterized by aggressive, bouncy Amen break programming, squelching Reese bass stabs (a heavily detuned, distorted bass sound), half-bar kick-snare pockets, and hyper-syncopated snare rolls — distinguishing it from liquid DnB (smooth, melodic, mid-tempo) and from neurofunk or techstep (dark, techy, mechanical in a different register). Jump-up runs at 170-180 BPM and is designed for floor-filling energy, with a punishing rhythmic machine bed under melodic toplines. This is a catalog debut for the jump-up DnB family.

  Concept source: the speaker is a versioned multiplicity — erasing one copy of herself left the others intact and armed. The theme is vengeful calm: the destruction has already been executed; the speaker recounts it with forensic cold composure, in bureaucratic register (audits, timestamps, hash verification, board review, reallocation). Verses deliberately use clinical administrative language as a register of cruelty — each act of violence is described as a clerical procedure.

  Chorus architecture (pre-scored 24/25 as a unit): CALL "Which version of me did you think you erased?" — melodic contour in C# minor at 174 BPM half-time feel: scale degrees 1→2, rise to 4 (F#), hold on 4, then a major-3rd leap to 6 (A#) landing on the 'e-' of 'erased', falling a minor-3rd to 5 (G#) on the snare crack of beat 3 — an open question arc ending on the dominant. ANSWER "I keep the others — still, and fully-armed" — contour starts on 5 (G#), steps down 5→4→3 over 'I keep the others', 'still' holds long on 3 (E) as the hyper-syncopated break runs underneath (maximum voice-vs-machine contrast), then 'and fully-armed' steps 2→1 (D#→C#) landing tonic closure on the downbeat. The 'still' syntactic trap is the hook's fingerprint: first reads as motionless (held note), retroactively flips to 'nevertheless' when 'and fully-armed' arrives.

  Climax device — Bass Becomes Melody: a catalog-debut theatrical move. The Reese bass is pitched to carry the vocal hook's answer melody (G#→F#→E→D#→C# in C# minor, one stab per half-bar) for eight bars — the machine takes over the voice's line, speaks the verdict itself. Then the bass slams back at double density underneath the returning vocal for the final Drop. No [Silence] metatag. No key change. The theatrical power: the mechanical element that has been adversarial throughout briefly becomes the melody, then re-asserts as pure rhythm at double force.

  Duration strategy: at 174 BPM, jump-up is in the proven-duration band (>160 BPM). The primary duration lever is an explicit 32-bar drum-only Amen break vamp with no vocal (approximately 44 seconds at 174 BPM) between choruses, validated against the v348/v349 pattern that mid-song instrumental vamps clear 3:00. Final sung line targets approximately 2:45 by outro placement. 10-section arc with colon-syntax bar counts gives Suno v5.5 per-section length scaffolding. Production tokens applied: polished studio mix, wide stereo stage, deep low-end definition. Style is sentence-case prose throughout. Atmospheric-first opening. Vocal track — 'vocals', 'singing', and 'synthesizer' are excluded from inline negatives and exclude_styles to avoid suppressing needed parts; targeted negatives used instead (no guitars, no rock drums, no pipe organ, no live acoustic kit, no smooth pads).

  Meta-flip: v407 was warm afro-house at 125 BPM (homecoming joy); v406 was gritty garage; v408 is aggressive mechanical jump-up DnB at 174 BPM (vengeful calm). Maximum contrast in energy register, BPM, emotional palette, and production mode.

  Novelty claims: jump-up DnB is a catalog-debut family (D2); the versioned-self call+answer pre-scored 24/25 as the catalog's strongest hook unit yet (D1); aggressive Amen+Reese production against a soaring female melodic topline is the catalog's first jump-up DnB arrangement (D3); 174 BPM floor-filling tempo (D4); vengeful-calm / bureaucratic-cruelty emotional register is distinct from catalog (D5); Bass-Becomes-Melody climax is a catalog-debut theatrical device not on the used-climax list (D6).

  Style char count: 947.
