name: "ferrum-v319"
version: 319
title: "Ferrum"
instrumental: true

style: "Cinematic orchestral action score — staccato string ostinato as the relentless pulse engine, low brass and deep woodwind anchoring an iron foundation. Underground forge at midnight: molten iron, hammers on steel, sparks tracing the dark. Hollywood scoring stage, deep low-end definition. B minor lifting to C minor at 2:20, 138 BPM. Staccato violin and viola eighth-note ostinato opens alone — two-bar figure, nothing else. Bass trombone pedal enters on the low B fundamental at 0:25. Brass attacks layer every four bars from 0:45; contrabassoon doubles bass trombone an octave below, density doubling. Full tutti from 1:20, horn countermelody cuts above the ostinato. Strip to bare bass trombone pedal and staccato strings at 2:00 — nakedness as the climax. Full tutti returns at 2:20 with half-step lift to C minor. Final brass chord cut at 2:50. Film score for a forge-and-fury action cue. No guitars, no vocals, no rock drums, no synthesizers."

lyrics: |
  [Staccato strings alone, 8 bars]

  [Bass trombone pedal enters, 8 bars]

  [Brass attacks layer in 4-bar increments, 16 bars]

  [Contrabassoon doubles — full tutti builds, 24 bars]

  [Horn countermelody — max density, 28 bars]

  [STRIP: bass trombone and strings ostinato only, 16 bars]

  [Tutti return — half-step lift to C minor, 28 bars]

  [Final brass chord and cut, 6 bars]

  [End]

