name: "porcelaine-v361"
version: 361
style: "Underscore for a dancefloor that breaks you open — 1993-era eurodance revival,
  chest-deep four-on-the-floor kick grid, crystalline soprano hook the crowd finishes
  alone. B-flat major rising to E-flat via a fourth-up modulation and filter-sweep:
  low-pass opens at 2:40, glass harmonica blooms into full-range resonance as the key
  lifts. 140 BPM. Kick on every beat, open hi-hat on the off, staccato ophicleide
  brass stabs on 2 and 4, voicing the chord grid, sub-bass tracking chord roots.
  Glass harmonica holds the chord pad above — bright bowl-resonance tying harmony
  between the stab pulses. Soprano carries the hook: rising minor third, fifth plateau,
  stepwise descent to tonic. The 8-bar phrase pairs 4 bars soprano with 4 bars riff
  alone so the listener finishes the melody. Vamp at 1:45 strips to ophicleide stabs,
  glass harmonica pulse, and kick for 32 bars. No guitars, no rock drums, no rap,
  no synthesizer leads, no pipe organ."
title: "Porcelaine"
lyrics: |
  [Intro: kick, ophicleide stabs, glass harmonica, 0:00, 8 bars]

  [Verse 1: soprano, 0:14, 4 bars]
  Something breaks like china when you leave
  Every piece too sharp to touch or keep
  Patterns on the floor I used to see
  Now they only cut whenever I breathe

  [Hook riff: 0:28, 4 bars]

  [Verse 2: soprano, 0:42, 4 bars]
  You left a mark in white and gold and grey
  A cabinet you packed and walked away
  Each crack runs deep the way I never showed
  All that fine-bone beauty, letting go

  [Hook riff: 0:56, 4 bars]

  [Chorus: 1:10, 8 bars]
  Something breaks like china when you leave
  Something breaks like china when you leave
  The kind of break that won't be healed or sealed
  Something breaks — the kind you only feel

  [Vamp: 1:38, ophicleide, glass harmonica, kick, 32 bars]

  [Chorus: E-flat major, filter sweep, 2:40, 8 bars]
  Something breaks like china when you leave
  Something breaks like china when you leave
  The kind of break that won't be healed or sealed
  Something breaks — the kind you only feel

  [End]
