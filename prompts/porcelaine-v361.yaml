notes: |
  Eurodance revival (1993-95 formula, 2026 TikTok-driven debut in the catalog). The
  genre is characterised by a four-on-the-floor kick grid, synth-stab chords on beats
  2 and 4, a sub-bass following the chord roots, and a short repetitive soprano hook
  alternating with riff-alone bars so listeners mentally complete the phrase — the
  mechanism behind the genre's TikTok loop virality. The concept source is the
  china-breaking-as-departure image: departure as breakage of something irreplaceable
  and beautiful, emotionally specific rather than generic heartbreak chant-filler.

  The composer whose output this most closely echoes — a prolific 1990s Eurodance
  production team responsible for several genre-defining chart records — is not named
  per blocklist policy.

  Duration strategy: parametrized colon-lyrics with timestamps and bar counts (0:00
  Intro through 2:40 final Chorus), polished studio mix + wide stereo stage as
  production tokens, sentence case throughout, atmospheric-first opening. The
  instrumental vamp at 1:38 (32 bars at 140 BPM ≈ 55 seconds of lyric-free groove)
  is the explicit duration lever per the duration-lever feedback. Last lyric timestamp
  at 2:40 gives Suno a late anchor to push toward 3:00+. The fourth-up modulation
  (B-flat major → E-flat major) with simultaneous filter sweep is the climax — NOT
  the overused half-step lift from v216-v219.

  Instruments:
  - Glass harmonica (spectral voice): shimmering crystalline synth-pad analog,
    bright 1-4 kHz register, provides the ethereal shimmer above the groove. Debut
    lane: not previously used as a featured trio voice in a eurodance context.
  - Ophicleide (body voice): keyed brass instrument, low-mid register, here used as
    the stab-chord brass punch on 2 and 4. Debut lane.
  - Soprano (body voice): carries the central hook with the specified rising minor
    third (Bb→Db), sustained fifth plateau (F), and stepwise descent (D-C-Bb).

  Note on "Glass" blocklist false positive: the substring matcher flags "glass
  harmonica" because "Glass" also matches the composer Philip Glass. This is an
  instrument-name false positive; the composer is not referenced. The instrument was
  explicitly specified by the caller.

  Novelty: eurodance debut lane; glass harmonica + ophicleide pairing is new to the
  catalog; fourth-up modulation (not half-step) is first appearance of this specific
  interval as climax device; 140 BPM confirmed new per cycle_start novelty surface.

  Style char count: 941.
