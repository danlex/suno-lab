style: "ORCHESTRAL BREAKBEAT with HANDPAN + CONTRABASS CLARINET, relentless kinetic energy, cinematic urgency, F minor to F-sharp minor, 135 BPM, purely instrumental. Breakbeat percussion drives everything — syncopated broken rhythms that never let the body rest. Handpan enters with a hypnotic melodic pattern ringing metallic warmth over fractured beats. Contrabass clarinet provides the deepest woodwind tone beneath, rumbling like tectonic movement. Full symphony strings in rapid staccato bursts synchronized to the breakbeat. Brass stabs on every offbeat. The build layers handpan over increasingly complex breakbeat patterns while strings ascend chromatically. Timpani rolls build for thirty seconds. Then silence — two beats of nothing. Orchestra returns in F-sharp minor half-step up, full brass fortississimo, handpan ringing above, contrabass clarinet shaking the floor, breakbeat at maximum velocity. Every instrument detonating at once. No guitars, no vocals."
title: "Every Atom Wants Out"
lyrics: ""
