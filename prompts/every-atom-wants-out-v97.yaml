notes: "v97 — ORCHESTRAL BREAKBEAT. New electronic genre for synthesis era. RESEARCH: Envato music trends 2026 (maximalism searches +999%), Sound-Sculpture Handpan Festival 2026 (handpan + electronics emerging), Orchestration Online extreme auxiliary instruments, Pitch Innovations ethnic percussion 2026. LEARNED: (1) Handpan + synth/bass is emerging live combination in 2026 — Mar Loi duo touring Europe. (2) Contrabass clarinet overtone-rich low-end excels in atmospheric film scoring. (3) Post-genre maximalism is THE trend — layered cross-genre. (4) Breakbeat never attempted in synthesis era (v93-v96 covered dubstep/trance/trap/prog house). IMPROVED: Orchestral breakbeat — the most kinetic electronic genre (syncopated broken rhythms) merged with handpan (metallic melodic percussion, hypnotic) + contrabass clarinet (deepest woodwind, rumbling atmosphere). Concept: 'every atom wants out' — the breakbeat never resolves, the handpan melody floats above the chaos, the contrabass clarinet anchors the floor. Silence-before-climax + half-step F minor→F-sharp minor. 969 chars."
