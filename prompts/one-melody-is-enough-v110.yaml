name: "one-melody-is-enough"
version: 110
style: "ORCHESTRAL BOLERO with OBOE D'AMORE + VIBRAPHONE, hypnotic cinematic crescendo, one melody building from whisper to earthquake, C major to D-flat major, 72 BPM, purely instrumental. Oboe d'amore introduces the melody alone — sweeter than oboe, baroque warmth singing a single unforgettable theme. Vibraphone joins on the second repetition, adding shimmering metallic sustain beneath. Each repetition adds one more instrument — first solo flute, then clarinet, then strings pizzicato, then full strings bowed, then horns, then trumpets, then trombones. The melody never changes but the orchestration grows relentlessly. Full symphony strings provide the rhythmic ostinato that pulses beneath every repetition like a heartbeat. The build takes the entire piece — from single oboe to full orchestra fortississimo. Then silence — two beats. Orchestra returns in D-flat major half-step up, every instrument playing the melody in thunderous unison. No guitars, no vocals."
title: "One Melody Is Enough"
lyrics: ""
instrumental: true
exclude_styles: "Arabic, tribal, world music, acoustic guitar, rock, gentle, ambient, lo-fi, vocals, singing, electronic, EDM"
notes: "v110 — ORCHESTRAL BOLERO. First non-electronic genre approach in synthesis era — pure orchestral architecture. RESEARCH: Classical-music.com Ravel Bolero guide (relentless rhythmic repetition, gradual crescendo, timbral layering from solo to full orchestra), Wikipedia Bolero (C major, 3/4 time, pianissimo to fortissimo), Oreate AI bolero in film (mounting tension, dramatic climax). LEARNED: (1) Ravel's Bolero = one melody, never changes, but orchestration grows from solo snare drum + solo flute to FULL ORCHESTRA over 15 minutes. The build IS the piece. (2) Oboe d'amore = baroque oboe pitched between oboe and cor anglais, sweeter tone. Bach's favorite. Never used. (3) Vibraphone struck (not bowed) = warm metallic sustain, jazz-inflected shimmer. IMPROVED: Bolero architecture (one melody repeated with growing orchestration) + oboe d'amore (baroque sweetness, introduces the theme) + vibraphone (metallic shimmer on second repetition). NOT an electronic-genre fusion — pure orchestral concept. C major→Db major. 974 chars."
