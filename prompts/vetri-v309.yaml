name: "vetri-v309"
version: 309
title: "Vetri"
instrumental: true

style: "Film score for a midnight apartment scene — frost on the window, a single yellow lamp reflected in cold condensation on empty glass. Polished studio mix, warm tape saturation, deep low-end definition. F minor, 80 BPM. Felt piano opens alone at 0:00, close-miked with full damper resonance and soft muted attack, stating a four-bar motif; sub-bass pad rises slowly at 0:20 like a breath held against the window; granular tape-hiss shimmer accumulates; single cello enters at 1:00 with a countermelody a minor sixth below, arching against the motif without displacing it; piano strips to single-note ostinato at 1:40 as cello widens upward, sub-bass peaks; piano motif returns voiced an octave higher at 2:30, key lifts to F-sharp minor, tape hiss thins to near-nothing, final chord fades with the felt-damped sustain alone. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Intro — felt piano motif]

  [Sub-bass pad rises]

  [Tape hiss accumulates]

  [Cello countermelody enters]

  [Piano ostinato + string shimmer]

  [Motif returns octave higher]

  [Tape hiss thins]

  [Final chord fades]

  [End]

