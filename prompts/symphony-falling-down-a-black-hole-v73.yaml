name: "symphony-falling-down-a-black-hole"
version: 73
style: "MASSIVE orchestral dubstep hybrid, D minor, 140 BPM half-time feel, purely instrumental. Hans Zimmer and Noisia colliding at maximum weight. Opens with full symphony playing a slow menacing theme — low brass, cellos, timpani building tension for 16 bars. Then the drop hits — wobbling LFO bass growling at sub-frequencies that rattle walls, half-time snare cracks hitting like cannons, orchestral brass stabs locked to every downbeat. Strings race above the wobble bass in frantic tremolos while the wobble modulates from menacing to terrifying. French horns blast heroic counterpoint over the chaos. Multiple BRAAAM orchestral hits between bass wobbles. At the second drop the bass goes deeper and the entire orchestra detonates on top — impossibly heavy, simultaneously cinematic and crushing. Sounds like a symphony orchestra falling down the gravity well of a black hole. Modern cinematic dubstep production, maximum low-end impact. No vocals, no guitars."
title: "Symphony Falling Down a Black Hole"
lyrics: ""
instrumental: true
exclude_styles: "vocals, singing, gentle, ambient, soft, lo-fi, calm, Arabic, tribal, world music, acoustic guitar"
notes: "v73 — ORCHESTRAL DUBSTEP. Fourth electronic fusion. 140 BPM half-time feel (classic dubstep). Wobble LFO bass. Noisia + Zimmer. Tension build → drop → wobble bass + orchestra detonation. 'Symphony orchestra falling down the gravity well of a black hole.' D minor. Half-time snare cracks like cannons. 959 chars."
