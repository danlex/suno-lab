name: "longer-than-light"
version: 13
style: "Cinematic neoclassical film score, monumental orchestral crescendo. Coloratura soprano with breathtaking vocal runs and ornamental flourishes, melismatic passages, voice soaring into the stratosphere with elaborate embellishments. Solo piano opening, then cathedral pipe organ swells with deep chords, lush string orchestra builds, angelic choir erupts at the climax. Extreme dynamic range from intimate whisper to overwhelming orchestral peak. Pristine production, vocals forward in the mix. No drums, no percussion, no beat, no electric guitar, no rock. BPM: 72, Key: D Minor resolving to D Major"
title: "Longer Than Light v13"
lyrics: |
  [Solo piano, intimate]

  I hear your key in the door
  I set the table for two
  This house still holds your name
  But you are gone

  [Strings enter, voice with vocal runs]

  Come home... come home
  I wait longer than light
  Come home

  [Pipe organ swells, soprano flourishes higher]

  Your coat hangs by the door
  I did not move your chair
  I talk to the empty room
  And you are there

  [Full orchestra, choir, soprano at peak with soaring melisma]

  Come home... come home
  I wait longer than light
  Come home

  [Big Finish]
  [End]
instrumental: false
notes: "v13 — Monumental return. Combines simple wounded lyrics with full orchestral build and coloratura soprano doing vocal runs, flourishes, melismatic passages. Best of all versions: v6 lyrics + v1 orchestral scope + vocal ornaments. No custom voice."
tags: [cinematic, neoclassical, soprano, coloratura, melisma, monumental, orchestral, no-drums, short]
