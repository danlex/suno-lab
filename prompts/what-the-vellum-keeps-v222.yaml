notes: |
  ADDITIVE STRATUM SCORING is a through-composed technique in which discrete
  instrumental layers enter one by one, each locking in permanently once deposited.
  No layer is removed, no recapitulation occurs, and the climax is simply the moment
  of total saturation — all strata sounding simultaneously. The form is related to
  additive process music documented from the mid-20th century onward; no individual
  composer is cited here per catalog blocklist policy.

  Concept source: the technique is distinguished from standard crescendo-building
  by its irreversibility — each stratum is a permanent deposit, not a dynamic swell
  that can subside. Harmonic interest derives from the accretion of contrasting
  timbres across three registers (sub-bass reed / mid-bright brass / ultra-high
  metallic transient) rather than from key change or silence-before-climax.
  This is a new arc for the catalog: true through-composed accretion with no
  modulation, no silence drop, no half-step return.

  Composer-omission confession: additive process writing has documented history in
  post-1950 art music and minimalist composition. No composer or performer names
  appear per blocklist rules; the structural form is the sole subject.

  Duration-fix reasoning (addressing v221's 0:42 and 1:34 clips): v221 likely
  truncated because (1) the lyrics scaffold was only 7 lines with no sustained
  plateau section, giving Suno too little structure to fill 3:00, and (2) language
  about motion "stopping mid-phrase" may have signaled an early end. For v222,
  the lyrics scaffold has 10 sections including an explicit "[Full Saturation]"
  plateau, a "[Saturation Sustains]" continuation, and a "[Long Sustained Chord
  Rings and Fades]" terminal section — giving Suno a clear signal to carry all
  layers to full length. The style explicitly states "the full stack holds from
  2:30 through 2:55" so the model understands the piece runs to ~3:00. The ending
  is a sustained chord that rings rather than a cut-off, which encourages Suno to
  hold to natural length rather than truncating.

  Duration strategy: 137 BPM provides a steady underlying pulse that holds constant
  throughout — the tempo does not accelerate. Tonal anchor is D-sharp minor, stable
  and non-modulating (1 prior catalog use at v210). The no-modulation is authentic
  to additive-stratum form: each new stratum brings harmonic color through timbre
  contrast, not through key change. Target 2:30–3:30 per v137+ override.

  Featured trio with version gaps:
  - BASS CLARINET (first appearance in 222-version catalog — never used before):
    the sub-bass reed foundation, the first stratum. The bass clarinet's low register
    fills the bottom of the texture with a warm, column-like tone that sustains without
    vibrato intrusion, making it the ideal permanent ground layer for an accretion piece.
    Distinct from "clarinet" (last v210) and "contrabass clarinet" (last v210) —
    bass clarinet occupies the register between them and is a catalog debut.
  - TRUMPET (×5, last v193 — 29-gap): mid-register bright brass, the middle stratum.
    The trumpet's unwavering projection and penetrating harmonic presence make it
    the ideal second deposit: once it locks in above the bass clarinet, it holds
    the center of the texture with authority. Gap of 29 versions makes this a deep revival.
  - CROTALES (first appearance in 222-version catalog — never used before): ultra-high
    metallic transient shimmer, the final stratum. Crotales (small antique cymbals tuned
    to specific pitches) produce overtone-rich, bell-like attacks in the highest register,
    their shimmer falling like candlelight sparks on vellum. They arrive last at 2:00
    and remain, their persistent high-register shimmer completing the three-octave stack.

  Scene anchor: a scriptorium at first candle — the hour when a single flame is lit
  over a blank page of vellum and the night's work of illumination begins. Each
  instrumental layer is a new deposit of pigment or ink: once laid down, it cannot
  be removed. The piece is the act of illumination heard as sound.

  Novelty claims: first named ADDITIVE STRATUM SCORING prompt in catalog; first use
  of bass clarinet (catalog debut); first use of crotales (catalog debut); trumpet
  revival at 29-gap (last v193); 137 BPM first catalog use (gap between 136 at v138
  and 138 at v71/94/100); D-sharp minor second use only (first at v210); bass clarinet
  + trumpet + crotales trio never previously combined; scriptorium-at-first-candle
  scene not previously used; true irreversible-accretion arc new to catalog (no silence,
  no modulation, no half-step return, no dissolution ending).

  Final style char count: 949.
