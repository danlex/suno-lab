name: "what-the-vellum-keeps"
version: 222
style: "ADDITIVE STRATUM SCORING for a scriptorium at first candle, total duration around 3:00, with BASS CLARINET + TRUMPET + CROTALES — irreversible accretion in D-sharp minor, 137 BPM, nothing removed. The bass clarinet enters alone at 0:00, a sub-bass reed column holding in candlelit silence, the first stratum. Low strings settle beneath at 0:25, thickening the foundation. The trumpet locks in at 1:00, mid-register brass unwavering, deposited above and held. At 1:35 violas spread across the inner voice, binding reed to brass. The crotales arrive at 2:00, ultra-high metallic shimmer falling like candlelight on vellum, and remain. All three strata sustain together from 2:15; the full stack holds from 2:30 through 2:55 in total saturation, nothing withdrawn. The piece ends on a long sustained chord that rings and fades. Underscore for illuminated pages accumulating in dark. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "What the Vellum Keeps"
lyrics: |
  [Short Instrumental Intro — bass clarinet alone in candlelit dark, sub-bass reed, first stratum]

  [Bass Clarinet Holds the Foundation — sub-bass column sustained, the permanent first layer]

  [Low Strings Settle Beneath — foundation thickens, nothing displaced]

  [Trumpet Deposits Its Stratum — mid-register brass locks in above the reed, permanent]

  [Violas Bind the Inner Voice — chorale texture spreading between bass and brass]

  [Crotales Arrive and Remain — ultra-high metallic shimmer, the final stratum descends and holds]

  [Full Saturation — all three strata sounding together, total textural accumulation]

  [Saturation Sustains — the complete stack holding, nothing withdrawn, all layers present]

  [Long Sustained Chord Rings and Fades]

  [End]
