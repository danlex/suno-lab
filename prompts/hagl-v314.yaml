style: "Cinematic atmospheric symphonic score — mountain ridge in November sleet, granite spires, one figure against the storm. Polished studio mix, Hollywood scoring stage, wide stereo stage. B minor, lifting to C minor at 2:20, 100 BPM. Post-black metal layered tremolo electric guitar opens alone over a low string drone, cold sustained low strings beneath. Full orchestral strings and brass swells enter at 0:35, building slow density; male choir Aa vocalise rises at 1:10 like vapor above stone. At 1:40 a single clean male tenor cuts through the ensemble — one spare liturgical phrase in the cold — then the orchestra reclaims the texture. Half-step lift to C minor at 2:20 drives full tutti to the summit. From 2:50 density strips to tremolo guitar and low strings only; tenor returns unharmonized, smaller than before. Deep low-end definition, warm tape saturation. No percussion overdrive, no screaming, no growling, no synthesizers, no pipe organ."

lyrics: |
  [Tremolo guitar over string drone, 16 bars]

  [String orchestra enters — dense slow swells, 20 bars]
  Hail on the granite
  Stone holds the weather
  The ridge does not move
  Ice on the iron spire

  [Brass choir Aa vocalise rise, 20 bars]
  Wind above the tree line
  Snow in the cold air
  The stone remains
  Above the grief above the ridge

  [Male tenor single phrase — emotional hinge, 12 bars]
  I stand in the hail

  [Full tutti — tenor sustains into peak unison, 16 bars]
  I stand in the hail
  The ridge remains
  Above the weather
  Above the grief

  [Half-step lift to C minor — full tutti summit, 24 bars]
  Stone above the weather
  Ice above the stone
  The ridge above the grief
  Still I stand in hail

  [Stripped — tremolo guitar low strings only, 16 bars]
  Hail on the granite
  Stone holds the weather

  [Tenor returns unharmonized — exposed, 12 bars]
  I stand in the hail

  [End]

