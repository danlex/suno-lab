notes: |
  Hagl (Old Norse "hail" — the weather phenomenon) is a classifier-boundary
  test: v314 probes whether Suno v5.5's classifier can be steered toward a
  "cinematic atmospheric symphonic" long-form read of post-black metal tremolo
  guitar texture by leading the style field with the cinematic anchor BEFORE
  introducing the post-black metal genre descriptor. This is the inverse of
  v311's density-first approach: here the genre anchor precedes the instrument
  introduction, attempting to prime the classifier toward the cinematic/film-
  score long-form bucket rather than the extreme-metal short-form bucket.

  Concept source (researcher): "Post-black metal × symphonic orchestra
  cinematic. Lead with 'cinematic atmospheric symphonic' BEFORE 'post-black
  metal'. Tremolo electric guitar catalog debut. Low string section + male
  choir Aa + sparse brass swells. Single male tenor enters once at ~1:40 as
  a mid-track event — not protagonist throughout (distinct from v311+v312+v313
  vocal-protagonist arcs). Half-step lift B minor → C minor at 2:20. 100 BPM.
  Mountain ridge November snowstorm."

  The compositional tradition this echoes — atmospheric black metal projects
  that layered tremolo-picked guitars over orchestral string textures to achieve
  something between extreme metal and cinematic score — is well-established in
  northern European music of the 2000s–2010s. Its foremost practitioners are
  not named here per catalog discipline. The specific move of positioning the
  cinematic anchor ahead of the metal descriptor borrows from production notes
  on how streaming-era DSP classifiers handle genre collisions: the first
  recognized anchor tends to dominate.

  Duration strategy: BPM 100 sits in the slow band; the BPM-duration ceiling
  applies (~3:30 regardless of bar count per playbook rule 8). Total lyric bar
  count is 136 bars across 8 sections — targeting the slow-BPM ceiling of
  3:00–3:30. The classifier argument is the primary duration driver: if the
  "cinematic atmospheric symphonic" anchor engages before the metal descriptor,
  the expected render is 3:30–4:30+; if the metal classifier dominates instead,
  the render may compress to 1:30–2:30. This is the explicit hypothesis of the
  cycle. Production tokens applied: polished studio mix, Hollywood scoring
  stage, wide stereo stage, deep low-end definition, warm tape saturation.
  Sentence case throughout; atmospheric-first opening; colon-syntax lyrics with
  bar counts for per-section length scaffolding; no [Silence] metatag per
  hardened rule (feedback_silence_gate_truncates.md). Two body voices in trio
  confirmed: tremolo electric guitar (body — genre-signature distorted body
  voice) + low string section (body — cellos and double bass sustained drone);
  male choir Aa vocalise is the third voice (choral body texture). Playbook
  rule 5 body-voice minimum met (2 body + 1 choral body = all three body class;
  zero spectral picks — cleanly compliant).

  Trio instruments:
  - tremolo electric guitar (catalog debut — never used in 313 prior versions):
    the signature timbral marker of atmospheric post-black metal; tremolo
    picking produces a shimmering continuous tone from distorted electric guitar
    by rapidly alternating the pick across a single sustained pitch or melodic
    phrase; here it opens alone over the low string drone and returns stripped
    in the final section as an emotional callback; gap = infinity (debut).
  - low string section — cellos and double bass (body voice, orchestral bed):
    sustains a pedal drone beneath the tremolo guitar in the opening, then
    joins the full string orchestra for the build; returns as the sole
    accompaniment in the stripped final section.
  - male choir Aa vocalise (choral body texture, gap 3 from v311): serves
    a distinct role here — not rhythm-section-backed but as the orchestral
    swell companion to the brass at 1:10, rising to peak unison with the
    tenor at 1:55 before ceding to the stripped final section.

  Voice architecture: single clean male tenor as mid-track arrival event.
  Enters once at ~1:40 (the emotional hinge), sustains through peak unison
  at 1:55, and returns stripped and unharmonized in the final section. This
  is architecturally distinct from v311+v312 (soprano protagonist throughout)
  and v313 (bass-baritone protagonist throughout): the tenor here is a single
  event rather than a continuous presence — "voice as arrival" rather than
  "voice as narrator." The liturgical quality (sparse, chant-adjacent) echoes
  the post-black-metal tradition of clean vocal incursions over atmospheric
  texture.

  Novelty claims: technique-novelty (cinematic-anchor-first + post-black-metal
  texture — classifier boundary test, first in 313 versions); instrument-debut
  (tremolo electric guitar, gap infinity — catalog debut); voice-novelty (clean
  male tenor as single mid-track arrival event, distinct from all prior
  vocal architectures including v313 bass-baritone protagonist, v299 tenor
  protagonist, v311+v312 soprano throughout); scene-novelty (mountain ridge
  November snowstorm, single human figure in hail, geological/weather framing
  — no prior catalog entry uses this specific atmospheric geography);
  BPM-revival (100 BPM last v272, gap 42 — very fresh); key-novelty (B minor
  last v306, gap 8 — fresh); modulation (B minor → C minor half-step lift).

  Classifier risk acknowledged: post-black metal is uncharted classifier
  territory for v5.5. The mitigation (cinematic anchor first) is speculative
  but grounded in the v257–v259 classifier-prose-reading findings. If Suno
  collapses to extreme-metal short-form, the lesson is that the metal genre
  label overrides the cinematic anchor regardless of position. Either outcome
  advances the classifier map.

  Final style char count: 932.

