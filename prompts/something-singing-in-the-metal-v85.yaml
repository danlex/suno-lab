name: "something-singing-in-the-metal"
version: 85
style: "WATERPHONE + BOWED VIBRAPHONE + HARP orchestral, haunting and cinematic, slow-building monumental, E minor, 60 BPM, purely instrumental. Three rare metallic voices layered with strings: waterphone (bronze rods on water-filled steel, from Poltergeist and Aliens) bowed into long wavering tones, bowed vibraphone bars sustained into bell-like sighs, harp in ascending glissandi. Opens with the waterphone alone — a metal voice warped by water, a ghost in a copper cathedral. Bowed vibraphone enters on a shimmering tone two octaves above. Harp glissandi roll between them like liquid. A low cello drone anchors everything. Violas enter in sustained swells. French horns gather slowly. Pipe organ pedals add weight. At the climax the three metallic voices sound at once above the orchestra at fortississimo — a texture no standard ensemble can produce, three different physics of metal vibration singing together. Modern cinematic audiophile production. No vocals, no electronics, no guitars."
title: "Something Singing in the Metal"
