notes: "v85 — UNCOMMON METALLIC TRIO. First iteration applying new user feedback: 'Try uncommon combinations of instruments, experiment, innovate.' And 'Research, learn, improve every cycle.' RESEARCH: waterphone Wikipedia, Dark Horse Institute horror instruments, Enhanced Media waterphone history. LEARNED: waterphone is an inharmonic idiophone invented by Richard Waters (1935-2013), inspired by kalimba + nail violin + Tibetan water drum. Steel resonator bowl + bronze rods + internal water. Bowed or struck. Used in Poltergeist, The Matrix, Aliens, Crouching Tiger Hidden Dragon, Star Trek TMP, Let the Right One In. IMPROVED: instead of using waterphone alone as centerpiece (the obvious move), I combined THREE rare metal-based instruments together: waterphone (bowed bronze-on-water), bowed vibraphone (cello bow on struck metal bars — sustains bell-tones indefinitely), and harp glissandi (plucked metal strings cascading). Three different physics of metal vibration producing three different sonic profiles, all layered over a standard orchestra. This is a texture no standard ensemble can produce — genuinely uncommon combination per feedback. Contrast with v79 (glass harmonica alone), v80 (ondes martenot alone), v84 (contrabass clarinet alone) — those were solo centerpieces. v85 is the first combination iteration. E minor 60 BPM slow for maximum metallic shimmer. Sources: Waterphone Wikipedia, Enhanced Media 2021, Dark Horse Institute horror instruments, OUPblog 10 facts about waterphone. 989 chars."
