notes: "v106 — ORCHESTRAL AMAPIANO. First African-rooted electronic genre in synthesis era. RESEARCH: BellaNaija Asake Red Bull Symphonic (33-piece orchestra + Afrobeats/Fuji/Amapiano fusion), Soundverse afrobeat electronic 700% growth 2026, World Music Central balafon guide (gourd-resonated xylophone, calabash buzzing resonators, 12th century Mali), Wikipedia balafon. LEARNED: (1) Asake's Red Bull Symphonic proved orchestral Afrobeats works — sweeping strings over Nigerian rhythms = cinematic. (2) Balafon = West African wooden xylophone with calabash gourd resonators + spider web silk creating a unique buzzing shimmer. 800+ year history. (3) Amapiano = 110-115 BPM, deep bass pads, rolling eighth-note patterns, groove-centered. IMPROVED: Orchestral amapiano (celebration energy — first purely joyful genre after ambient v103, drill v104) + balafon (buzzing xylophone, never used) + flugelhorn (warmest brass, smooth melodic lines). Concept: 'a thousand calabashes singing' — the balafon's resonators buzzing beneath an orchestra in full groove. F minor→F# minor. 985 chars."
