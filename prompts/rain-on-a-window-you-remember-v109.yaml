name: "rain-on-a-window-you-remember"
version: 109
style: "ORCHESTRAL CHILLHOP with MBIRA + UPRIGHT BASS, warm jazz-inflected cinematic groove, lo-fi orchestral intimacy, E-flat minor to E minor, 80 BPM, purely instrumental. Mbira plays gentle rhythmic patterns — Zimbabwean thumb piano with metal tines creating bell-like melodies that shimmer with each pluck. Upright bass walks a warm pizzicato groove beneath, jazz-rooted and unhurried. Full symphony strings voice rich jazz chords — minor sevenths and ninths that shift color every two bars, lush and intimate. Solo flute weaves ornamental phrases between the mbira patterns. The orchestra breathes like a late-night jazz session, unhurried and warm. The build layers mbira melody over increasingly lush string voicings while upright bass deepens the groove. Then silence — two beats of intimate stillness. Orchestra returns in E minor half-step up, strings in their richest voicing, mbira at its most intricate, upright bass at its deepest, full warmth fortississimo. No guitars, no vocals."
title: "Rain on a Window You Remember"
