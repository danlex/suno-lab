notes: |
  Testing ORCHESTRAL STILE CONCITATO — the early-Baroque "agitated style" introduced in the 1638 preface to the eighth book of madrigals, defined by rapid repeated notes, sixteenth-note tremolos, and driving tonguing to carry the passion of urgency and combat. A foundational dramatic technique; the first composer to codify it wrote that music had described softness and moderation but never agitation — and we omit composer names per repo blocklist. Research source: encyclopedic entries on stile concitato and its adoption by later Baroque opera composers.

  Duration strategy per v137+ override: target 2:30-3:30, phrase "total duration around 3:00" in first 200 chars, timestamps 0:00 / 0:25 / 1:00 / 2:00 / silence 2:10 / return 2:15 / end 2:50. Tonal framing (F minor to F-sharp minor half-step) plus pulse-based 134 BPM to give Suno enough rhythmic spine to sustain the full 3-minute shape — avoids the short-artifact failure mode seen in v130/v131 avant-garde drafts.

  Trio rationale:
  - french horn: x6, last v129 — 13-gap, brass family, stopped-horn rapid fanfare
  - mbira: x2, last v124 — 18-gap, metallic idiophone family, thumb-plucked rapid tines as agitato floor (Zimbabwean folk excluded)
  - contrabass clarinet: x3, last v131 — 11-gap, woodwind family, low sixteenth-note tonguing as pedal pulse

  Three different instrument families (brass + metallic_idiophones + woodwinds), all gaps >= 11, no overlap with v137-v141. Novelty claims: first stile concitato, first use of 134 BPM (surface novelty confirmed via novelty_surface.json), F minor to F-sharp minor modulation fresh for this session window, scribe-racing-the-candle scene is new in repo. Title "What the Candle Outran" varies from recent "The/Where" openings.

  Final style char count: 947.
