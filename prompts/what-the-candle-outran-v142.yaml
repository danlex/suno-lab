style: "ORCHESTRAL STILE CONCITATO film score for a scribe-racing-the-candle scene, total duration around 3:00, with FRENCH HORN + MBIRA + CONTRABASS CLARINET, early Baroque agitated style of rapid repeated notes, F minor to F-sharp minor, 134 BPM, instrumental. From 0:00 mbira pulses alone in rapid repeated tines, thumb-plucked iron, candle flame trembling. At 0:25 contrabass clarinet enters below with sixteenth-note tonguing, pedal tones pressed into the room. At 1:00 french horn rises with stopped-horn fanfare, repeated pitches cutting the floor. At 2:00 orchestra floods in, strings tremolando, woodwinds passing the concitato figure, brass punching downbeats. Silence at 2:10, five seconds of held breath as the candle gutters. At 2:15 the concitato returns in F-sharp minor fortississimo, half-step up, mbira doubled by pizzicato, horn and clarinet hammering. Ends at 2:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
