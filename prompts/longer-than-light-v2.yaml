name: "longer-than-light"
version: 2
style: "Cinematic neoclassical film score with the most breathtaking soprano voice ever heard, ethereal and otherworldly, crystal-pure tone with perfect delicate vibrato, soaring effortlessly into impossibly high celestial notes that send shivers down the spine. The voice is hauntingly beautiful beyond human capability, fragile as glass yet powerful enough to fill a cathedral, every note dripping with raw vulnerable emotion. Intimate solo piano opening, vast cathedral pipe organ with deep sustained chords, lush string orchestra with violins and cellos in aching harmonies. Immense reverb creating infinite space around the voice. A slow inevitable crescendo from whispered intimacy to overwhelming orchestral ascension. Angelic choir harmonies supporting but never overshadowing the soprano lead. Transcendent, goosebump-inducing, bittersweet longing transforming into triumphant euphoria. No drums, no percussion, no beat, no electric guitar, no rock. BPM: 76, Key: A Minor resolving to A Major"
title: "Longer Than Light"
lyrics: |
  [Intro]
  [Solitary piano, vast silence]

  [Verse]
  [Ethereal soprano, crystalline, barely a breath]
  I have waited longer than light itself
  Do you hear me... through the years

  [Build]
  [Voice rises effortlessly, strings bloom, pipe organ breathes]

  [Chorus]
  [Soprano soaring, pure high notes with delicate vibrato, strings and organ swell]
  I am still here
  Reaching across the dark to find you
  I am still here... I will always find you

  [Build]
  [Organ deepens, choir rises from silence, strings cry upward]

  [Chorus]
  [Soprano reaching impossible heights, voice luminous and overwhelming, full orchestra and choir]
  Even past the edge of everything
  Even when the stars have forgotten us
  I am the light... I am still HERE

  [Big Finish]
  [End]
instrumental: false
notes: "v2 — Exaggerated voice quality. More descriptive soprano: crystal-pure, vibrato, fragile as glass, inhuman beauty. User asked to 'exaggerate how good it is.'"
tags: [cinematic, neoclassical, soprano, ethereal, film-score, no-drums, short]
