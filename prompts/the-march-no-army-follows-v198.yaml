notes: "v198: Dark orchestral march — heavy 4/4 processional. Trombone (gap=59), oboe (gap=51), contrabass (gap=56). 89 BPM unused. G minor → Ab minor half-step up. Theme: a march for a procession no army follows — a funeral march that has outlived the dead, the rhythm itself as a kind of grief that keeps walking. The oboe melody is the human presence; the trombone is the ceremony; the contrabass is the ground that receives them all."
