notes: |
  Huayno is the defining song-form of the Andean Quechua and Aymara people — a bimodal structure (verse and refrán) in 3/4 or 6/8, built on the long-short-short rhythmic cell, rooted in oral traditions across the Bolivian, Peruvian, and Ecuadorian highlands. The form predates European contact and absorbs Iberian string instruments (notably the charango, developed from the Iberian lute) into a fundamentally pentatonic Quechua melodic grammar. In the noir-orchestral frame used here, the huayno cell drives the rhythmic engine while the C minor Dorian mode — with its raised sixth (A natural) brightening the otherwise minor field — creates a modal color distinct from both Arabic maqam and European minor-key classifiers.

  Concept source: Andean altiplano dawn at 4000 metres — dark Cordillera silhouettes, breath visible, a Quechua mountain soprano addressing the Apu (sacred mountain spirit) in the moment before sunrise. Quechua lyrics use the authentic vocabulary of wind (wayra), sky bodies (killa, inti, puyu), community (ayllu), and the sacred peak as witness.

  This prompt echoes a lineage of Andean female vocalists whose high nasal open-throat placement and Quechua phonetic inventory defines the highland soprano tradition — none are named here per catalog discipline. The phonetic architecture is drawn from Quechua's typological features: absence of voiced stops (no phonemic /b d g/), retroflex and aspirated stop series (kh, t', k' released hard), and strong penultimate stress that creates cascading syllable tails — a rhythmic-phonetic fingerprint completely absent from all 48 prior voices including v307 Ladino mezzo, v306 Greek demotic baritone, v305 Tuvan kargyraa, and v304 Zulu isicathamiya.

  Duration strategy: 104 BPM sits in the slow-to-mid band (≤115), where the playbook ceiling is approximately 3:30 regardless of bar count. Arc targets 3:00–3:30 with emotional density. Parametrized colon-syntax lyrics with bar counts provide per-section scaffolding (8+8+8+16+16+12+16+8+4 = 96 bars). Production tokens applied: warm tape saturation, polished studio mix, wide stereo stage. Sentence case throughout; atmospheric-first opening. No [Silence] metatag — sustained crescendo-modulation arc per feedback_silence_gate_truncates.md. Whole-step modulation (C minor Dorian → D minor Dorian) at 2:10 broadens the climax lift beyond the clichéd half-step.

  Instruments and catalog gaps:
  - charango: 10-string Andean lute developed from Iberian lute, bright metallic twang, catalog debut (zero prior appearances in 307 versions). Role: sole voice in intro, huayno-cell motor throughout, stripped-down bridge accompaniment.
  - siku: Andean panpipes with breathy split-tone timbre, catalog debut (zero prior). Role: pentatonic countermelody a minor third above charango, call-response with soprano in the refrán.
  - bombo legüero: Andean bass drum with deep resonant strike, catalog debut (zero prior). Role: single beat-one strike establishing the 3/4 pulse, full strumming in the refrán climax, hard stop on the final four bars.

  Thin bowed string layer (cello + double bass) provides orchestral noir grounding — these ARE in the catalog but unused in the last several cycles, serving as weight anchor rather than featured voice.

  Novelty claims: technique-novelty (huayno-noir form — 38th distinct language, Quechua, 1st Andean entry in catalog); all three featured instruments are catalog debuts; BPM 104 last used at v286 (22 cycles back, fresh); C minor Dorian last used at v287 (21 cycles back, fresh); scene (Andean altiplano dawn / Apu invocation / Cordillera silhouettes) — no prior Andean or Quechua entry in 307 versions. Vocal voice #49: female Quechua mountain soprano with high nasal open-throat placement, retroflex aspirated stops, cascading penultimate-stress syllable tails.

  Final style char count: 943.

