style: "Film score for Andean altiplano dawn — Cordillera silhouettes at 4000 metres, breath visible, a mountain soprano calling to the Apu before sunrise. Warm tape saturation, polished studio mix, wide stereo stage. C minor Dorian, 104 BPM, huayno long-short-short cell in 3/4. Trio: charango opens alone with dry bright metallic-twang picking; siku enters breathy and split-tone a minor third above; bombo legüero lands one deep resonant strike on beat one. Female Quechua mountain soprano — high nasal open-throat, retroflex aspirated stops, cascading penultimate-stress syllable tails, minimal vibrato. Voice enters sparse at 1:00 over low cello and bass barely above whisper; full bombo and bowed strings at 1:40 for the huayno refrán; charango and voice alone at 2:10 as key lifts to D minor Dorian; full ensemble at 2:30 with vocal ghost shadow, hard bombo stop closes. No guitars, no rock drums, no pipe organ, no synthesizers, no pop vocals."

lyrics: |
  [Charango huayno cell — solo, 8 bars]

  [Siku enters minor third above, 8 bars]

  [Bombo soft on beat one, 8 bars]

  [Soprano enters sparse, 16 bars]
  Wayra, wayra, ñuqa rikhurini —
  Apu riqsiwarqanki, qasa tutamanta.
  Puyu, puyu, killa llipyasqa —
  Mama ayllu, ñawi wañuq inti.

  [Refrán climax — full trio, 16 bars]
  Wayra kanka, Apu kanka, yawar p'unchaw —
  Warmi ñawi inti tiyasqa, huk tuta.
  Wayra, wayra, ñuqa kani —
  Apu riqsiwarqanki, mama, mama.

  [Bridge — charango and voice, key lifts, 12 bars]
  Tuta, tuta, p'unchaw hamuchkan —
  Wayra, wayra, ñuqa kanka.

  [Full ensemble return in D Dorian, 16 bars]
  Wayra kanka, Apu kanka, yawar p'unchaw —
  Warmi ñawi inti tiyasqa, huk tuta.
  Ayllu, ayllu, mama ñawi —
  Wayra, wayra, huk killa.

  [Vocal ghost shadow, 8 bars]
  Wayra, wayra, wayra kanka —
  Ñuqa, mama, inti ayllu.

  [Bombo hard stop, 4 bars]

  [End]

