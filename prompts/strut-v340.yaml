style: "Brass-forward disco-funk vocal hit — warm stage lights, polished floor, horn section up front. Polished studio mix, deep low-end definition, wide stereo stage, dry and punchy. D-flat minor lifting to D minor at the final chorus, 116 BPM four-on-the-floor. Flugelhorn carries the round warm melody above brass stabs, threading chorus hooks. Felt piano anchors spare verses with dry chordal warmth under the conversational vocal. Crotales flash crystalline shimmer where the hook ignites and again at the half-step lift. Live drummer four-on-the-floor kick, tambourine right, one rhythmic guitar chop left. Popping electric funk bass holds the pocket. Brass section stabs every chorus. Female lead vocal close-miked and dry — playful on the verse, cracking into stacked harmonized soprano hooks above the stabs. Purpose: make the body move before the brain objects. No drum machine, no autotune, no EDM drop, no distorted rock guitars, no reverb haze."

lyrics: |
  [Verse 1 — bass, felt piano]
  Walking in like I already won
  Heels hit the floor, the night's begun
  I'm not here to talk — here to move

  [Pre-chorus — horns slide in]
  Feel that bass ride low and slow
  Brass rising, getting ready to go

  [Chorus — harmonized, brass stabs, 0:40]
  Let me strut, strut, strut
  Brass calling for something more
  Horns cut through the night
  Oh strut, baby strut

  [Verse 2 — conversational groove]
  Second time around you know the song
  Come on take my hand, let's ride

  [Chorus — stacked harmonies, 1:22]
  Let me strut, strut, strut
  Brass calling for something more
  Horns cut through the night
  Oh strut, baby strut

  [Horn groove section, 1:48]

  [Bridge — voice and bass, 2:12]
  Just me and the bass now
  Everything else gone quiet

  [Final chorus — D minor, doubled brass, 2:28]
  Let me strut, strut, strut
  Brass calling for something more
  Horns cut through the night
  Strut like the whole world burns bright
  Oh strut, baby strut — strut!

  [Groove hit, 2:48]

  [End]

