notes: |
  Technique: brass-forward disco-funk vocal pop — the dominant 2026 disco revival lane,
  characterized by a punchy live horn section locked to a four-on-the-floor kick,
  a popping electric funk bass, close-miked conversational female vocal that opens up
  into stacked harmonized soprano hooks on the chorus, and a dry studio aesthetic with
  no reverb haze. This is the live-band side of the revival (not the synthesized
  nu-disco or future-funk lanes), emphasizing room presence, horn section bleed,
  and the physical groove pocket over production sheen.

  Concept source: charts-informed original — brass-forward disco-funk vocal pop is the
  dominant groove trend of 2026, and the catalog has zero prior entries in this lane.
  v329 (Lueur) was French-language nu-disco with a synthesized groove bed; v339 (Static)
  was power-pop with jangly guitar. Neither touches the live-horn disco-funk register.
  This fills the gap with an original English-language vocal song, original hook,
  no homage to any named act.

  Composer/band omission: this sound is in dialogue with the live-horn funk-pop tradition
  of the 1970s–1980s whose leading acts are on the blocklist and are intentionally
  unnamed here. The punchy brass stabs, four-on-the-floor pocket, and close-miked female
  vocal are idiomatic to that tradition without referencing any individual performer.

  BPM override note: the novelty picker's default slow-BPM suggestion (~93) was overridden
  to 116 BPM — the classic disco-funk four-on-the-floor pocket tempo. At 93 BPM the
  groove would lose its forward propulsion and sound more like a soul ballad than a
  dance-floor hit. 116 sits at the upper edge of the slow BPM band (90–115), meaning
  Suno may cap around 3:00–3:30; the arc is sized accordingly.

  Duration strategy: target 2:50–3:15. Arc: sparse verse (bass + felt piano + vocal) →
  pre-chorus (horns slide in underneath) → full chorus with brass stabs + harmonized hooks
  at 0:40 → verse 2 → chorus at 1:22 → horn groove section at 1:48 (a real instrumental
  groove break for added length) → bridge stripped to voice + bass at 2:12 → final chorus
  in D minor with doubled brass at 2:28 → tight groove hit at 2:48. Last lyric timestamp
  pushes to 2:48 per the late-anchor instruction. No [Silence] metatag per
  feedback_silence_gate_truncates — the bridge is a sparse moment but not a silence gate.
  Sentence case throughout; no ALL-CAPS form labels. Production tokens: polished studio
  mix, deep low-end definition, wide stereo stage. Atmospheric-first opening front-loads
  the stage/floor scene with purpose phrase embedded.

  Featured trio and instrument roles:
  - Flugelhorn (gap 12, last v328): carries the round warm lead melody above the punchy
    brass stabs in the chorus sections, threading hooks with a mellow gold tone distinct
    from the harder trumpet or trombone edge. The warm body voice of the horn section's
    solo register. Cast here because its mellow roundness sits ABOVE the stabs rather than
    competing with them — a lead color, not a section unison.
  - Felt piano (gap 31, last v309): anchors the sparse verse texture with dry chordal
    warmth, the velvet beneath the conversational vocal before the horns enter. Body voice —
    its damped attack keeps the verse intimate and prevents the keyboard from bleeding into
    the horn territory. Cast because felt-damped piano is the natural warm-room keyboard for
    a live-band disco-funk context, not Rhodes (which leans more toward soul-ballad) and not
    synth (which triggers the wrong Suno classifier).
  - Crotales (gap 20, last v320): flashes a single high crystalline shimmer at the precise
    moments the hook ignites (chorus entry) and at the D-minor key lift (final chorus).
    Spectral/bright voice — the one shimmer pick permitted per trio rules. Cast because
    its attack is percussive-metallic and brief, functioning as a cue rather than a texture,
    which avoids cluttering the dry studio mix. The crotales shimmer is the catalog's version
    of the ear-candy "hook bell" that pop brass arrangers use on the downbeat of a lift.

  Trio voice balance: flugelhorn (body — warm brass) + felt piano (body — warm keys) =
  two body voices. Crotales = one spectral. Satisfies the playbook ≥2 body voices rule.
  The genre bed (live drummer, popping funk bass, brass section, tambourine, guitar chop)
  is described in the style field as environment, not as additional trio instruments.

  Key: D-flat minor (midnight disco, minor-funk groove) lifting to D minor (one half-step
  up) at the final chorus. This is the playbook key-modulation frisson trigger in a disco-
  funk vocal context — the key lift doubles as the "moment the whole room shifts up."

  Novelty claims:
  - Genre lane: brass-forward disco-funk vocal pop — catalog first across 339 versions.
  - Technique novelty: live-horn disco-funk with close-miked female conversational verse
    opening into harmonized soprano chorus — not present in any prior catalog entry.
  - Trio novelty: flugelhorn (gap 12) + felt piano (gap 31) + crotales (gap 20) in a
    disco-funk vocal context — combination is catalog-unique; all three at significant gaps.
  - Key novelty: D-flat minor to D minor half-step lift in a funk-groove context — not prior.
  - Scene novelty: polished-floor stage/live-band-room scene in a disco-funk vocal frame —
    no prior catalog entry has this specific combination of setting + vocal genre + live brass.
  - Title: one-word English, disco-funk energy, fresh — not used in catalog.

