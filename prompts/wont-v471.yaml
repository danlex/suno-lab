  \ into punchy stabs that rise a minor third on 'it' and land isolated 'WON'T' syncopated\
  \ on an unresolved fifth so the loop never cadences. Bright marimba chop-stabs cut\
  \ through each drop as the pitched metallic color, locking into the kick grid with\
  \ staccato precision. Polished studio mix, deep low-end definition, wide stereo stage.\
  \ E minor, 138 BPM. Opening groove builds into a mid-song Jersey pause — kick-only\
  \ vamp that strips the mix to bare tension — then a full chop-drop return where the\
  \ entire stack slams back at maximum density. The climax is pure rhythmic impact,\
  \ staying in E minor throughout with no key change. No rap vocals, no boom-bap phrasing,\
  \ no slow jam feel, no cathedral organ."

