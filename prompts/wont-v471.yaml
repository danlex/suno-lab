notes: |
  Jersey club is a Newark/NJ club subgenre built on a signature triplet kick pattern
  (a dotted-eighth swing feel against 4/4 at 138–145 BPM), staccato 808 bass hits,
  and hyper-percussive layering — a subgenre entirely absent from the catalog before
  v471, making this a genuine fresh-lane entry.

  The hook mechanism is the concept source: a chopped, pitch-shifted female vocal
  phrase ("want it, then you won't") becomes the melodic anchor, rondo-style, returning
  at each drop. The minor-third contour (E5→G5 on 'it') and the unresolved fifth
  landing on 'WON'T' (B4) create loop-hunger — the phrase never cadences, so the
  groove demands another pass. Marimba chop-stabs supply the unusual bright pitched
  color: metallic, percussive, unexpected in a club context, and precise enough to
  lock into the kick grid. This is the instrument-novelty claim — marimba as rhythmic
  stab, not melodic soloist.

  Architecture is explicitly non-formulaic for this catalog: no key modulation, no
  half-step lift. The climax move is a "Jersey pause" (kick-only vamp stripping the
  mix to bare tension) followed by a full chop-drop return at maximum density. This
  density-as-climax structure is named in the lyrics brackets so Suno renders it
  deliberately. The double meaning of "Wont" (habit, customary behavior) is the
  title concept: the taunt predicts the listener's hesitation as if it were second
  nature.

  Duration strategy: parametrized colon-lyrics with bar counts summing to ~96 bars
  at 138 BPM (targeting ~3:00 wall-clock, matching the 130–160 BPM efficiency band).
  The explicit lyric-free [Kick Vamp / Marimba Chop Break] 16-bar section is the
  duration lever, placing the final chop-drop late at approximately 2:30. Three
  production tokens: polished studio mix, deep low-end definition, wide stereo stage.
  Sentence case throughout; atmospheric-first opening front-loads the genre anchor.
  No "singing/vocals" block in exclude_styles — the chopped refrain IS the hook; rap
  and boom-bap are blocked instead to prevent vocal-style drift.

  High-variance contrast to v460–v470 (bluegrass, rockabilly, pop anthem, nuevo tango):
  jersey club is a catalog first, marimba-as-chop-stab is an instrument-role first,
  and density-as-climax (no modulation) is an architecture first. Novelty on three
  axes. Style char count: 939.

