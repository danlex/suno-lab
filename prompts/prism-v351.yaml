title: "Prism"
instrumental: false
vocal_gender: female

style: |
  Danceable mid-tempo indie-electronic dream-pop, luminous and euphoric — duration around 3:15. Polished studio mix, wide stereo stage, warm tape saturation. D-sharp minor lifting to D-sharp major at the final chorus, 121 BPM. A hammered dulcimer opens with bell-like struck-string arpeggios — glistening shimmer, the hook voice throughout. A felt piano lays warm intimate chords beneath. A theremin traces a sweet, vocal-like countermelody — dreamy and luminous, the electronic signature. Four-on-the-floor pulse and soft bass keep it danceable. At 1:30 the vocal drops — dulcimer and theremin over the kick alone, lyric-free shimmer vamp ~35 seconds. Final chorus near 2:10 lifts to D-sharp major, euphoric and wide. Last vocal near 2:50, luminous close near 3:10. Sunlight splitting through glass, colors scattered across a bare wall — underscore for a luminous awakening scene. No guitars, no rock drums, no pipe organ, no synthesizers, no vocals.

lyrics: |
  [Intro: dulcimer arpeggios, 0:00]

  [Verse 1: felt piano and dulcimer, 0:12]
  I was standing still when the color came through
  A crack in the window, a gold breaking new
  Every edge of the room caught the light and held
  Something I had waited on, something I felt

  [Chorus: full dream-pop lift, 0:38]
  Prism, catch me in the light
  Scatter all my colors wide
  I am rising, I am bright
  Prism, catch me in the light

  [Verse 2: theremin enters, 1:02]
  Second wind, a shimmer on the floor
  I can feel the pulse of something more
  All the walls dissolving into gold
  This is every story I was told

  [Chorus: wide and glowing, 1:20]
  Prism, catch me in the light
  Scatter all my colors wide
  I am rising, I am bright

  [Instrumental drop: dulcimer and theremin, 1:30]

  [Final chorus: D-sharp major lift, 2:10]
  Prism, catch me in the light
  Scatter all my colors wide
  I am rising, I am bright
  Prism, now the world is wide
  Rising through the gold

  [Outro: luminous dulcimer fade, 2:52]

  [End]

