title: "I Was the Fire"
lyrics: |
  [Soft Piano]
  I stood where the silence grew
  Watched the world forget my name
  Every scar became a door
  Every door became a flame

  [Strings Enter]
  They said the light would never reach me
  They said the cold would never leave
  But something burned beneath the surface
  Something they could not believe

  [Full Orchestra Building]
  I was the fire they tried to bury
  I was the voice they could not break
  Rising from the deepest shadow
  Burning brighter with each ache

  [Orchestral Climax - Fortissimo]
  I was the fire
  I was the fire
  And nothing
  Nothing could put me out

  [Quiet Piano Return]
  Now I stand where the silence ends
  And the world remembers my name

  [End]
