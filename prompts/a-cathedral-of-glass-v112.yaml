notes: "v112 — NEOCLASSICAL FILM SCORE (first time using this exact genre anchor — not 'ORCHESTRAL X'). First cycle with the new harness: novelty_surface.py caught that pipe organ is used 50× and piano 40×, so the Evanescence/Interstellar/Modern-Classical references are delivered via effect not literal Zimmer-instruments. RESEARCH: 2026 Suno prompt corpus (hookgenius.app, soundverse, musci.io) — three techniques extracted and applied for the first time: (1) TIMESTAMPS — 0:00, 0:30, 1:15, 1:45, 2:00, 2:06 give Suno an explicit structural clock. (2) PURPOSE PHRASE — 'film score for a lone grief scene' at the head, replacing vague mood-only openings. (3) GENRE STACKING DISCIPLINE — two-word anchor 'NEOCLASSICAL FILM SCORE', no third genre tag. LEARNED: (a) Felt piano = genuine repo first use per novelty_surface (never in 111 prior prompts). (b) Cristal baschet = revival from v86/v93 (18 versions ago), bowed glass rods producing celestial sustained tones. Daniel Pemberton used cristal baschet in Project Hail Mary score with Thomas Bloch in Paris. (c) Glass harmonica = revival from v32-34/v79 (32 versions ago), spatial disorientation — brain can't locate sound in 1-4kHz range, more ethereal than crystal bowls. (d) Architectural concept 'lone-center-world-grows' — piano is static center, glass structures build the cathedral around it, piano stays. First such inversion (v110 bolero grew orchestration around a constant melody, v111 passacaglia grew variations over a constant bass, v112 grows an instrumental cathedral around a constant piano). IMPROVED: First application of timestamps + purpose phrase + genre discipline simultaneously. Felt piano first use. Three glass/felt textures as a trio (glass + glass + felt) — all substituting for the user's 'Interstellar pipe organ' reference via effect, not literal instrument. A minor→Bb minor half-step at climax. 924 chars."
