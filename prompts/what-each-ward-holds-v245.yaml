style: "LYRIC TONE POEM for full orchestra — lock-and-key workshop at dusk, total duration around 3:00, FLUGELHORN + CONTRABASSOON + GLOCKENSPIEL, C-sharp minor lifting to D minor at 2:20, 162 BPM. One continuous singing melodic line transforms in color and weight without resting. Strings state the cantabile theme at 0:00 — warm, unadorned. By 0:30 woodwinds fold in, CONTRABASSOON anchoring the sub-register while oboe and clarinet embroider above; brass load harmonic density through 1:30. Full saturation at 1:45 — strings, brass, winds, and timpani on the same melody in bloom. At 2:00 the orchestra thins: FLUGELHORN carries the line alone over sparse strings, warm body voice exposing each ward. GLOCKENSPIEL rings the half-step pivot at 2:20; brass re-enter blazing in D minor, full orchestra fortissimo on the same unbroken line. Strings sustain a long diminuendo into silence. No guitars, no vocals, no rock drums, no synthesizers, no pipe organ."
title: "What Each Ward Holds"
lyrics: |
  [Cantabile Theme — C-sharp Minor]
  [Theme Continues Bare]
  [Woodwinds Enter]
  [Building Density]
  [Brass Layers Rising]
  [Full Saturation]
  [Sudden Thinning]
  [Solo Statement Exposed]
  [Blazing Return — D Minor]
  [Long Diminuendo]
  [End]
