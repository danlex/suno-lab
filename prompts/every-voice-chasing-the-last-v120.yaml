notes: "v120 — ORCHESTRAL CANON. MAXIMUM PATTERN-BREAKING: (1) First MAJOR KEY in synthesis era — G major (×1, near-virgin). Every v93-v119 was minor. (2) First DUO instead of trio — evolution.md priority #8. Testing whether fewer instruments = more Suno focus. (3) First CANON/ROUND form — voices enter in imitation, chasing each other in perpetual round. New form not yet explored. (4) First JOYFUL emotion — every synthesis-era piece was melancholic/dark/grief. This is celebration, triumph, ecstasy. (5) 152 BPM — fastest in synthesis era, fastest since v94 (174 BPM). (6) NO silence-before-climax — breaking the 'always use' default. The canon form builds continuously, no gap. (7) 'processional' instead of 'film score for X scene' — breaking the purpose-phrase formula. RESEARCH: Canon form from Pachelbel (D major, which confirms major key + canon is historically validated) through contemporary orchestral canons. Two voices in perpetual round = infinite recursive beauty. INSTRUMENTS: Bass flute (v100, 19-version gap — deepest available revival) = warm, breathy, low woodwind. Steelpan (v107, 12-version gap) = bright, metallic, Caribbean percussion repurposed for orchestral celebration. Maximum timbral contrast: warm/breathy vs bright/metallic. Added 'Caribbean, reggae, calypso, soca' to exclude_styles to prevent steelpan from triggering Caribbean genres. 899 chars."
