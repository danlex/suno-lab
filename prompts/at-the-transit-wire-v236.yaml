notes: |
  DOUBLE VARIATION is an alternating-variation form with two contrasting themes (A and B) that trade off across multiple variation cycles before converging in a coda — a structural device prominent in late 18th- and early 19th-century symphonic writing, revived here as a Suno arc scaffold. The form's built-in emotional-pivot sequence (lament → march → answer → fortissimo → release → fusion) gives Suno's narrative completion model clear targets at each stage, defending against the early truncation that hit v226/v232/v233 (<1:35) on sparse-experimental prompts. v234 reached 3:38/3:08 and v235 reached 2:24/2:33 with chaconne; the alternation requirement here forces dense full-orchestra writing throughout, and the coda's simultaneous layering of both themes provides the density peak that sustains duration past the 2:30 mark.

  Trio roles and gaps (per novelty_surface.json and prompt catalog):
  - VIOLA (bowed_strings) — last v224, gap ×12. Theme A voice: warm middle-register lyric lament, an astronomer's patient watch before dawn. Central body voice for duration defense.
  - BASS CLARINET (woodwinds) — last v222, gap ×14. Theme B voice: dark striding march in the low register, rich harmonic weight beneath full-orchestra march passages.
  - TUBULAR BELLS (mallet_perc) — last v224, gap ×12. Celestial-event markers: ring at each major variation boundary (0:00, 0:30, 1:00, 1:30, 2:00, 2:30) and at the coda's climax; like a transit chronograph marking star crossings.

  Key decision: F-sharp minor home for Theme A's lament; the half-step modulation to G minor at 2:00 (A'') is the emotional release point — not an arbitrary key shift but tied to the astronomer finally witnessing the star cross the meridian wire. The modulation coincides with full strings + brass reclaiming Theme A, turning patient grief into open luminosity.

  Scene: an observatory at the transit hour — an astronomer alone at the transit-circle telescope just before dawn, waiting for a star to cross the meridian wire; brass orrery clicking, dome humming, a single bell marking each chronograph event. Theme A = the astronomer's patient watch; Theme B = the celestial body's measured passage; coda = the transit moment itself. Scene is new (no scriptorium/scribe/ledger/forge/foundry/flock/murmuration/lighthouse/ferryman/canal/horologer/watchmaker/apothecary/anatomy-theatre/mountain-pass/kiln used).

  Novelty claims: first DOUBLE VARIATION technique in catalog; 151 BPM is new (recent run: 149/148/147/146/145/143/142/141/128/112/83/153 taken); viola ×12 gap + bass clarinet ×14 gap + tubular bells ×12 gap = three deep revivals. Composer names omitted per blocklist.

  Final style char count: 937.
