notes: "v182: WEIMAR CABARET × DARK ORCHESTRAL — first theatrical genre fusion in 182 versions (all prior fusions were electronic × orchestral). Bandoneon (NEVER USED, 0 prior), bass clarinet (NEVER USED, 0 prior), glockenspiel (gap=49). Research found that 1920s Berlin cabaret used sardonic small-ensemble texture (solo clarinet, accordion/bandoneon, plucked bass) to create theatrical alienation. Fused here with dark cinematic orchestral swells = the cabaret band as intimate sardonic foreground, orchestra as ironic commentary. 67 BPM unused. Bb minor → B minor half-step up (Bb minor gap=124). Theme: performance as survival, the stage as a metaphor for the masks we wear."
