style: "Tunnel-dark hardgroove techno pressing down like concrete at 148 BPM in A minor — the sound of a city underbelly at three a.m., amber light over wet metal floors. The spine of the track is a distorted rumbling kick, relentless and subterranean, locked to a hypnotic looping synth riff that coils around itself every two bars with cold machine precision. Rave-hoover stabs punctuate the grid like pressure-valve releases, answering the mantra hook with industrial authority. Metallic hi-hats splice the 16th-note grid; clang percussion rattles the tunnel walls. A commanding male voice chants the mantra in quarter-note syllables, the hook locked to the downbeat kick, each cycle tighter and more hypnotic than the last. Polished studio mix with wide stereo stage and deep low-end definition — the kick must feel physical, the riff must feel inevitable. No guitars, no acoustic instruments, no pipe organ, no ambient drift, no female vocals."

lyrics: |
  [Intro: kick and riff, 8 bars]

  [Hook: mantra on downbeat, 8 bars]
  Three a.m. and I am voltage
  I am voltage

  [Verse 1: chanted riff and clang, 16 bars]
  The rails went cold at midnight sharp
  I pressed my spine against the wall and waited
  Every light down here is amber
  Every horn is mine

  [Hook: hoover stabs answer, 8 bars]
  Three a.m. and I am voltage
  I am voltage

  [Verse 2: riff tightens, clang intensifies, 16 bars]
  The tunnel opens like a throat
  Steel on steel, the city breathing under
  Nothing above me now, just the grid
  The machine and I

  [Hook: peak density stabs, 8 bars]
  Three a.m. and I am voltage
  I am voltage

  [Riff Break: full beat-driven instrumental, 24 bars]

  [Peak Hook: mantra doubled, stabs every beat, 16 bars]
  Three a.m. and I am voltage
  I am voltage
  I am voltage

  [Outro: kick drives, riff fades, 8 bars]

  [End]

