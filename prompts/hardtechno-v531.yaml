notes: |
  Hardgroove techno (also called hard techno or hardgroove) is a strain of peak-time techno characterized by a heavily distorted, subterranean kick drum — the defining element — combined with short hypnotic synth riffs that repeat with mechanical regularity, industrial clang percussion, and hoover-stab synth patches (aggressive pitched-down portamento patches derived from rave culture). The form prioritizes density, tunnel-pressure atmosphere, and forward drive over harmonic development; it is a dance-floor command rather than a narrative arc.

  Concept source: the last train missed on purpose — surrender to the machine — framed as descent into an all-night industrial rave under the city, with the mantra hook "Three a.m. and I am voltage" as the lyric spine.

  The hook contour (briefed by the caller) places 'THREE' on the kick downbeat in a quarter-note, then leaves one beat of rhythmic rest filled only by the distorted sub-kick, before 'I am voltage' arrives as a rising triplet (E–F#–A) held on the final syllable — the hoover stab answers. This rest-fingerprint is the ownable detail that distinguishes the hook from generic hard-techno chants.

  Duration strategy: the arc is explicitly non-modulation and non-silence-gate. Duration is carried by a full instrumental Riff Break (~24 bars, beat-driven and dense — no ambient gap) positioned at ~60% of the song, and by pushing the final peak mantra to ~2:40+. At 148 BPM the bar count (112 bars total) targets a 3:15–3:45 wall-clock render. The Build/Silence/Drop stack is deliberately omitted per the caller's brief — the in-hook one-beat rest is a micro-gap only, not a gate.

  Production tokens used: polished studio mix, wide stereo stage, deep low-end definition.

  Featured trio roles:
  - DISTORTED RUMBLING KICK (body anchor): subterranean pulse locked to every downbeat; the physical spine of the track.
  - HYPNOTIC LOOPING SYNTH RIFF (body melodic engine): 2-bar cold coiling figure that binds every section; the harmonic identity.
  - RAVE-HOOVER STABS (spectral accent, ≤1 spectral per trio rule observed): pitched pressure-valve releases answering the mantra; crescendo through the peak section.

  Style: 940 chars. Lyrics verified under 1000 chars. Sentence case throughout; no ALL-CAPS form labels in style. Blocklist clean.

