notes: >
  v463 TOURNAMENT WINNER (inline-judged 81/100; beat sibling Tuesday463 at 79). A deliberate
  HIGH-VARIANCE swing from v462 (fast/134/edgy/male speed garage) into a slow dreamy lane the user
  loves: 74 BPM, female, intimate, no percussion anchor, no key-tension release.

  POLAROID explores arch form (ABCBA) in dream pop — the piece opens sparse, accumulates texture
  to a central bloom, then recedes symmetrically, with no modulation or key change. The climax is
  purely textural: a reverb-drenched swell of the full trio rather than a harmonic lift or
  half-step shift (deliberately avoiding the overused build-strip-half-step-lift template).

  Concept source: a memory that won't resolve — the psychic state of a Polaroid photograph still
  developing, caught between exposure and fading. The hook ("half-awake in Polaroid light") is
  built around a near-spoken D-D on "half-awake," a step down to C, then a minor-third lift to a
  held Eb on "light" — grounded then opened, never resolved. (A stray contour annotation that had
  leaked into the lyric body was removed before submit.)

  Duration strategy: a 40-bar lyric-free instrumental drift ([Lap Steel and Mellotron Drift]) is
  the primary duration lever; the final lyric line lands around 2:40. Reflective concept at 74 BPM
  is calibrated for ~2:50-3:10 per the BPM-duration research.

  Instrument roles: MELLOTRON (tape choir + flute voices) is the warm slightly-warped harmonic bed,
  present throughout, thinning at start and end (deep-revival timbre). LAP STEEL GUITAR is a CATALOG
  DEBUT (zero prior uses across 462 versions) — melodic lead with infinite sustain and wide vibrato
  glides, providing the emotional lift without percussion or modulation. BASS FLUTE is a breathy,
  low, close-miked counter-melody answering the vocal.

  Novelty: lap steel guitar catalog debut; arch/textural-bloom architecture unused in the catalog;
  74 BPM in the slow-drift band; mellotron + lap steel + bass flute has no prior instance.

  Final style char count: 947.

