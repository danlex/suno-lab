name: "polaroid-v463"
version: 463
title: "Polaroid463"
instrumental: false
vocal_gender: female

style: >
  Dreamy, melancholic-euphoric dream pop drifting through reverb-drenched stillness at 74 BPM,
  total duration around 3:00, warm tape saturation. A memory that won't resolve, floating in
  F-sharp minor. Ethereal female voice — genuinely sung, long held notes, intimate and unhurried.
  Mellotron carries the harmonic bed in tape-choir and flute voices, warmth slightly warped by age.
  Lap steel guitar takes the melodic lead with infinite sustain and slow vibrato glides. Bass flute
  breathes low counter-melodies, close-miked. Arch form: sparse mellotron flute opens alone,
  textures accumulate toward a central textural bloom where the full mellotron choir, lap steel and
  bass flute swell into a lush reverb wash — the climax is a textural swell, not a key change —
  then everything recedes to near-silence. Polished studio mix, wide stereo stage, lush acoustic
  ambience. Brushed percussion only, or none. No guitars, no drum kit, no horns, no club pulse.

lyrics: |
  [Sparse Opening: mellotron flute voice alone, 8 bars]
  half-awake in Polaroid light
  where colors don't quite dry

  [Verse 1: bass flute enters beneath the mellotron, lap steel traces quietly, 12 bars]
  the room still holds the shape of you
  a smear of gold, a crooked hue
  I keep the frame the way it fell
  some things too soft to tell

  [Chorus: voice rises, lap steel glides, mellotron choir swells gently, 12 bars]
  half-awake in Polaroid light
  three seconds from the sun
  the edge of almost-right

  [Second Verse: intimate, bass flute answers each phrase, 12 bars]
  the clock forgets to move past noon
  the window keeps the same pale moon
  I trace the frost to find your face
  the cold just takes your place

  [Chorus: voice fuller, mellotron thickens, 12 bars]
  half-awake in Polaroid light
  three seconds from the sun
  the edge of almost-right

  [Lap Steel and Mellotron Drift: lyric-free instrumental, lap steel glides across the full register, mellotron choir swells beneath, bass flute hums, reverb wash fills the stereo field, 40 bars]

  [Textural Bloom: full trio at peak density — mellotron choir, lap steel sustaining high, bass flute low, voice rejoins floating above, 16 bars]
  half-awake in Polaroid light
  somewhere between the held and gone
  the light fades slow, the colors run
  I let it go

  [Recession: textures thin one by one, lap steel fades to silence, mellotron flute alone again, 10 bars]
  half-awake
  (fading)

  [Coda: single mellotron flute note sustained into silence, 6 bars]

  [End]

