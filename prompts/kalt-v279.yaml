style: "Modern Berlin tech-house, German techno with vocals, 128 BPM, A minor, Berghain morning 6am. Male German sprechgesang vocal — deadpan monotone restrained chest delivery, robotic-cool emotional distance, repetitive minimal phrasing in German, NO melisma, NO vibrato, almost-spoken with subtle melodic outline, NOT Türk trap melismatic, NOT Argentine porteño, NOT Mandopop crooner, NOT amapiano — distinctly Berlin sprechgesang deadpan with intentional emotional flatness. Production: minimal tech-house kit with crisp four-on-the-floor kick, off-beat hi-hat, snare on 2 and 4, deep rolling sub-bass, pluck-synth riff on off-beat (signature tech-house), filter sweeps, cold analog vocal reverb, occasional acid-303 accent, sidechain pump on the drop. 2026 Berlin warehouse-after-hours, NOT EDM big-room, NOT hardtekk, NOT trance, NOT Schlager, NOT Eurodance. Berghain morning, concrete and fog. No big-room, no Schlager, no trance, no orchestral."

lyrics: |
  [Intro]
  (sub-bass swell, hi-hat tease)
  kalt, kalt, kalt

  [Verse 1] (deadpan monotone)
  sechs Uhr morgens, immer noch hier
  die Sonne kommt, ich gehe nicht
  dein Anruf war vor zwei Stunden
  ich habe ihn nicht beantwortet

  [Pre-Hook]
  (sprechgesang) kalt, kalt
  alles ist kalt heute

  [Hook] (repetitive minimal sprechgesang)
  kalt, kalt, alles ist kalt
  kalt, kalt, der Beton ist kalt
  kalt, kalt, dein Bett ist kalt
  kalt, kalt, Berlin ist kalt

  [Verse 2]
  Friedrichshain im Nebel, U-Bahn fährt vorbei
  Späti macht zu, niemand spricht
  ich tanze allein im Berghain-Schatten
  der Bass schlägt, mein Herz nicht

  [Hook]
  kalt, kalt, alles ist kalt
  kalt, kalt, Berlin ist kalt

  [Bridge]
  (kick drops, only sub-bass + pluck)
  [Spoken-flat] du hast gefragt ob ich da bin
  ich bin nicht da
  ich bin nirgendwo

  [Final Hook] (filter-sweep build + sidechain)
  kalt (kalt), alles ist kalt
  kalt (kalt), Berlin ist kalt

  [Outro]
  (sub-bass fade) kalt
  [End]

