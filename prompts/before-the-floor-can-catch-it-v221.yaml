name: "before-the-floor-can-catch-it"
version: 221
style: "TARANTELLA ACCELERANDO-TO-COLLAPSE on a foundry floor splitting at first thaw, total duration around 3:00, PICCOLO + FLUGELHORN + WATERPHONE in A-flat minor at 133 BPM, terraced surges climbing until the music shatters. Col-legno and pizzicato strings lock the 6/8 ostinato from 0:00. Piccolo ignites at 0:20 in high register with the frenzied dance figure. First terrace at 0:30: tempo climbs, flugelhorn enters in warm mid-brass velvet. Second terrace at 1:15 adds density; A-flat minor brightens to A-flat major — parallel-major velocity lift, not half-step modulation. Stretto from 2:00: voices lock in unison, waterphone bowed-friction undertow rising from whisper to menace. From 2:15 all three converge on one unbroken accelerating breath. At 2:45 the piece does not slow — it stops mid-phrase, cut by its own speed. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers. Film score for a machine that cannot decelerate."
title: "Before the Floor Can Catch It"
lyrics: |
  [Short Instrumental Intro — col-legno strings ignite the 6/8 ostinato cage]

  [Piccolo Ignites — frenzied high-register dance figure above the string pulse]

  [First Terrace — tempo surges, flugelhorn swells in warm mid-brass velvet]

  [Second Terrace — density rises, A-flat minor brightens to A-flat major velocity lift]

  [Stretto Compression — all voices lock unison, waterphone undertow swells to menace]

  [Unbroken Surge — piccolo and flugelhorn and waterphone converging, tempo climbing]

  [Peak Velocity Cut-Off — piece stops mid-phrase at maximum speed, no resolution]

  [End]
