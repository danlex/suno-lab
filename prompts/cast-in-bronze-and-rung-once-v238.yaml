notes: |
  TECHNIQUE — THEMATIC METAMORPHOSIS ARC: A compositional structure in which a single seed-theme is systematically transformed through augmentation (stretching note-values), inversion (flipping the melodic contour), fragmentation (breaking the theme into cells passed across sections), and reorchestration (rebuilding in new keys and with new instrumental colors) to track three phases of emotional change: vulnerability, conflict, and transfiguration. The technique has antecedents in 19th-century programme music and 20th-century dramatic orchestral writing — composer names are omitted per blocklist. The key element is that the listener hears the same material throughout, increasingly transformed, until the final major-mode arrival feels both surprising and inevitable.

  CONCEPT SOURCE (caller-designed): Single seed-theme bared by cor anglais in B minor → inverted/fragmented across low brass and low strings in mounting dissonance → augmented theme in horns at the pivot breath (C minor) → full-orchestra C major restatement at triple note-values (transfiguration). The key arc B minor → C minor → C major is the harmonic engine: the half-step lift from B to C at the pivot breath creates harmonic tension that the major-mode arrival resolves with maximum brightness. No silence-before-climax device is used; instead the pivot breath (augmented theme, sustained string bed) performs the pre-climax suspension.

  DURATION DEFENSE: Four consecutive full-length generation successes (v234, v235, v236, v237). Duration is enforced by: (a) explicit timestamps at 0:00, 0:45, 1:50, 2:10, 2:45, 2:55; (b) nine dense lyric metatags each 1–2 sentences describing what the orchestra does in each section; (c) full-orchestra scoring signals (brass choir, string sections, woodwinds, harp, timpani all named) that imply a long dramatic arc must be completed. Triple note-values at the transfiguration further slows the final section, extending duration naturally.

  TRIO ROLES AND GAPS (verified against prompts/):
    - COR ANGLAIS (woodwinds): last used v225, gap 13. States the seed-theme alone and unharmonized at 0:00 — fragile, the bell's potential ring locked in clay; reappears briefly in the transfiguration as a memory of the original bare statement now glorified.
    - FRENCH HORN (brass): last used v230, gap 8. Emerges at the pivot breath (1:50) stating the augmented theme over sustained strings in C minor — the held breath before transformation; carries weight into the full-orchestra transfiguration.
    - HARP (plucked strings): last used v224, gap 14. Provides cascading arpeggios that mirror the bell's overtones during the transfiguration; bell-like punctuation throughout the latter sections.

  KEY DECISION: B minor home for vulnerability/conflict is natural for cor anglais's warm, reedy color. The half-step lift to C minor at the pivot breath (1:50) creates harmonic suspension without releasing the tension. The bloom into C major at 2:10 is the emotional payoff — the same half-step interval (B→C) now confirmed as a bright major-mode arrival rather than a dark chromatic shift. C major (no sharps, no flats) is the simplest, brightest key — maximum contrast against the B minor opening.

  SCENE — BELL FOUNDRY: Distinct from v206 ("what-the-foundry-releases" — general metalworking) and v207 ("where-the-bell-finally-lands" — bell transport/placement). This prompt is specific to the bell-casting process: the pour, the cooling in the clay mold, the breaking out (conflict), the hanging on the test frame (pivot breath), and the first ring (transfiguration). The bell's first ring maps directly onto the theme's first full-voiced C major statement — the arc is the bell's birth.

  NOVELTY CLAIMS: First use of THEMATIC METAMORPHOSIS ARC as a named orchestral technique in this catalog. 155 BPM is a new tempo. Three-stage key arc (B minor → C minor → C major) with half-step lift plus mode change is new. Bell-foundry-pour scene (cast/cool/break/ring narrative) is new. All three trio instruments are deep-catalog revivals.

