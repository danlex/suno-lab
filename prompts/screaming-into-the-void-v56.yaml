style: "Dark cinematic orchestral with raw powerful female vocals in E minor at 130 BPM. Not gentle, not pretty — FURIOUS. A woman singing with the intensity of someone who has lost everything and is screaming into the void with the full force of a symphony orchestra behind her. Pounding orchestral percussion and timpani drive an unstoppable rhythm. Massive string ostinatos churn beneath her voice like a storm. Brass stabs punctuate her phrases like lightning strikes. Her voice shifts between haunted whisper and full-throated devastating power, wordless but carrying more emotion than any lyrics could. A pipe organ roars underneath the entire arrangement adding impossible weight. The orchestra surges and crashes around her voice like waves against a cliff. Modern dark orchestral film score, maximum intensity, world-class production, raw emotional devastation. No electric guitars, no synthesizers, no autotune, no pop. E minor, 130 BPM."
title: "Screaming into the Void"
lyrics: |
  [Pounding timpani, storm of strings]

  [Woman's voice, haunted whisper]
  Mmm...

  [Voice erupts into power]
  AHHH... AHHH...

  [Orchestra surges around her]
  AHHH... AHHH... AHHH...

  [Brass stabs like lightning]
  AHHH... AHHH... AHHH... AHHH...

  [Full devastating force]
  AHHH... AHHH... AHHH... AHHH... AHHH...

  [End]
