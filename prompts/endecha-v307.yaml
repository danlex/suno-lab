notes: |
  Endecha is a Sephardic Ladino lament song-form — a Jewish-Spanish dirge tradition dating from the Iberian Peninsula, preserved in the oral memory of Sephardic communities after the 1492 expulsion from Spain and carried through centuries in Ottoman cities including Istanbul (Estambol in Ladino). The form centers on sustained vocal lamentation over modal accompaniment, the Phrygian mode (lowered second degree) providing the characteristic Judeo-Andalusian ache. Ladino is Judeo-Spanish, a language descended from medieval Castilian with Hebrew, Ottoman, and Balkan loanwords — the 37th distinct language to appear in this catalog.

  Concept source: 1492 Toledo expulsion echo carried 500 years to a contemporary Istanbul candlelit balcony at dusk — the Bosphorus dark, the memory ancient; daughter of Sefarad singing the kantiga across centuries.

  This prompt echoes a lineage of female Sephardic vocal artists whose recordings preserve this tradition — none are named here per catalog discipline, but their archival field recordings and studio interpretations inform the vocal-architecture brief: archaic Castilian sibilant inventory (the z/s distinction lost in modern Spanish but preserved in Ladino), Ottoman loan-word vowel coloring (closed o/u, narrow e/i), and long-vowel Phrygian ornamental turns rather than Baroque-style trills.

  Duration strategy: 90 BPM places this in the slow-BPM band (≤115), where the playbook ceiling is ~3:30 regardless of bar count. Arc targets 3:00-3:30 with emotional density rather than bar-count length. Parametrized colon-syntax lyrics with bar counts provide per-section scaffolding (8+16+16+12+16+10 = 78 bars). Production tokens applied: warm tape saturation, polished studio mix, tight chamber reverb, deep low-end definition, wide stereo stage. Sentence case throughout; atmospheric-first opening. Vocal architecture is explicit in the style (Ladino mezzo, chest-mid, Phrygian ornamental turns) to guide v5.5's auto-classifier. No [Silence] metatag anywhere — sustained crescendo-decay arc per feedback_silence_gate_truncates.md. Gender diversification after three consecutive male cycles (v304/v305/v306).

  Instruments and catalog gaps:
  - qanun: Ottoman plucked zither, catalog debut (zero prior appearances in 306 versions). Role: arpeggiated Phrygian lines in intro and refrain, melodic counterweight when voice rests, tremolo fade in outro.
  - oud: Middle-Eastern fretless lute, catalog debut (zero prior). Role: sustained chord tones beneath vocal verse, sole accompaniment in bridge, fretless vibrato body resonance providing deep low-end definition.
  - darbuka: goblet drum with dry tek-doum articulation, catalog debut (zero prior). Role: offbeat pattern in intro and refrain, deliberately silent in bridge for intimacy contrast, returns at refrain-octave-up.

  All three instruments are catalog debuts — triple-debut trio (unprecedented in this catalog).

  Novelty claims: technique-novelty (Ladino endecha form — 37th distinct language, 1st Judeo-Spanish entry); all three instruments are catalog debuts; BPM 90 last used at v276 (30 cycles back, fresh); G minor last used at v298 (8 cycles back, fresh); scene (1492 Sephardic expulsion echo / Istanbul balcony / Bosphorus) — no prior Sephardic or Ottoman crossover in catalog. Vocal voice #48: female Ladino mezzo with archaic-Castilian-sibilant inventory + Ottoman-vowel coloring + Phrygian ornamental turns.

  Final style char count: 932.

