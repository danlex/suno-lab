name: "what-the-chapel-holds-at-dawn"
version: 211
style: "EUPHORIC ORCHESTRAL HARDSTYLE BREAKDOWN at first light through a frosted chapel window, total duration around 3:00. FRENCH HORN + MARIMBA + ONDES MARTENOT drive a beauty-first arc in C-flat major at 105 BPM: marimba hammers the hardstyle pulse, its wooden attack replacing the kick — propulsive; french horn soars the anthemic octave-leap melody above, wide open and luminous; ondes martenot sings a continuous aching tone, trembling like cold light through frosted panes. At 0:25 strings swell in the breakdown shimmer. At 1:00 full orchestral tutti builds, brass and woodwinds layering the melody in counterpoint. At 1:50 everything strips to marimba alone for four beats — then the orchestra returns at full force, key lifts to C major, the chapel flooded with light. French horn sings the octave-leap phrase fortissimo, ondes martenot beneath. Ends at 2:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers. Score for dawn."
title: "What the Chapel Holds at Dawn"
lyrics: |
  [Short Instrumental Intro — marimba hardstyle pulse alone]

  [French Horn Octave-Leap Melody Enters — luminous, anthemic]

  [Ondes Martenot Aching Tone — trembling beneath]

  [Strings Swell — breakdown shimmer builds]

  [Full Orchestral Tutti — brass, woodwinds, counterpoint surge]

  [Marimba Alone — four beats, stripped bare]

  [Orchestra Returns — key lifts to C major, chapel flooded]

  [French Horn Fortissimo — octave leap in new key]

  [Ondes Martenot Sustains — final breath]

  [End]
