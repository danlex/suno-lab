notes: |
  VIRAL ARM cycle v277 — Modern Japanese city-pop / future-funk-adjacent.
  Research-driven (TikTok 2026 phonk/funk playlists, IIAS blog 2025 city-
  pop revival analysis, Spotify Future Funk Aesthetic 2026): city-pop
  revival continues to dominate TikTok aesthetic-content with Takeuchi
  "Plastic Love" at 61M+ YouTube views. Modern Japanese city-pop /
  future-funk pairs traditional city-pop instrumentation (Roland Juno-60
  analog pads + slap bass + Rhodes + sax) with contemporary electronic
  production (four-on-the-floor kick + filter sweeps + sidechain pump +
  vinyl crackle texture). Concept: technological-utopia Tokyo neon
  aesthetic — driving at night, taxi window reflections, neon kousaten.

