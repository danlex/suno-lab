style: "Modern Japanese city-pop, future-funk-adjacent, 108 BPM, Bb major, Tokyo Shibuya 2am driving. Female city-pop vocal — warm 80s-inflected mid-range with light vibrato, languid cool-girl phrasing, smooth melodic curve floating over the groove, intimate close-mic Japanese with English code-switched chant line in chorus, NOT K-pop group, NOT Mandopop head-voice, NOT Bollywood melismatic, NOT hyperpop kawaii — solo retro-analog city-pop with cool-girl emotional distance. Production: Roland Juno-60-style analog warm synth pads, slap bass (signature city-pop), Rhodes electric piano arpeggios, soft sax fills, four-on-the-floor disco-funk kick, off-beat hi-hat, hand-clap layer, filter sweep transitions, sidechain pump, vinyl crackle, tape-saturation polish. 2026 city-pop revival, NOT traditional Japanese folk, NOT enka, NOT shamisen, NOT J-rock, NOT anime opening. Shibuya night drive, taxi window neon. No enka, no shamisen, no koto, no anime, no orchestral."

lyrics: |
  [Intro]
  (Rhodes arpeggio, slap-bass tease)
  oh-oh, oh-oh

  [Verse 1] (languid cool-girl)
  yoru no machi, neon ga kirei
  taxi no mado ni utsuru watashi
  nan-jikan unten shite mo
  anata no koto wakaranai mama

  [Pre-Hook]
  (sax fill) oh-oh, yoru
  yoru, yoru ni ochiru

  [Hook] (English code-switch chant)
  yoru, yoru, the city is awake
  yoru, yoru, I am driving alone
  midnight in the neon, baby on the radio
  yoru, yoru, Tokyo never sleeps

  [Verse 2]
  Shibuya no kousaten, hito ga tachi-tomaru
  watashi no koe wa todoku darou ka
  raito ga aoku natte mata akaku
  ano natsu no kioku, mada koko ni aru

  [Hook]
  yoru, yoru, the city is awake
  yoru, yoru, I am driving alone

  [Bridge]
  (just Rhodes + slap bass, no drums)
  [Spoken-sung] kioku, kioku
  ano natsu no oto

  [Final Hook] (filter-sweep buildup + sidechain)
  yoru (yoru), the city is awake
  yoru (yoru), Tokyo never sleeps

  [Outro]
  (filter close, vinyl crackle) yoru
  [End]

