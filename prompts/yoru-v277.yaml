  LANGUAGE — 13th distinct language. Japanese in Latin transliteration
  (romaji) with English code-switched chant line in chorus (canonical
  city-pop convention — Takeuchi-era and modern city-pop frequently
  alternate Japanese verses + English hooks). Lyric vocabulary uses
