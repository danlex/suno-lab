name: "haze-v331"
version: 331
title: "Haze"
instrumental: false
vocal_gender: female

style: "Submerged in luminous haze — a bedroom ceiling dissolving into reverb, the world gone watercolour. Dream-pop shoegaze-pop, polished studio mix, wide stereo stage, warm acoustic ambience. Breathy English female voice, half-spoken in verses, rising to airy soprano at the chorus. 170 BPM half-time feel, kick buried deep in the wash, slow-attack pads rising behind. C major lifting to D-flat major at the final chorus. Reverb-saturated guitars form a tonal wash, never aggressive. Theremin traces continuous pitch shimmer shadowing the vocal. Oboe d'amore breathes warm longing through the pre-chorus swell. Clavichord lays a featherlight bed under the whispered verse. Chorus floods the room: doubled vocal harmonics and wide pads. Final chorus at 2:35 with the half-step lift, reverb-tail fade near 2:55. Underscore for a lucid-dream immersion scene. No distorted guitars, no deep-crunch distortion, no noise rock, no aggressive drums, no autotune."

lyrics: |
  [Intro — clavichord, bare, 0:00]

  [Verse 1 — whispered vocal, guitar, 0:10]
  All the colours bleed together
  Nothing sharp, nothing clear
  I have been here before somewhere
  In the in-between, half-awake

  [Pre-Chorus — oboe d'amore, pads, 0:40]
  Something opens in the chest
  The room grows soft at the edges
  Hold your breath

  [Chorus 1 — guitar wash, harmonics, 1:10]
  Drift until the ceiling disappears
  A flood of sound and light comes through
  Let the wave take what it wants
  I belong inside the blue

  [Verse 2 — theremin shimmer, 1:28]
  Your voice somewhere in the feedback
  Warm and shapeless, almost found
  I reach across the static
  You dissolve into the sound

  [Bridge — near-solo vocal, 2:00]
  Nothing sharp now
  Nothing solid left
  Just the haze and what it keeps

  [Final Chorus — half-step lift, 2:40]
  Drift until the ceiling disappears
  A flood of sound and light comes through
  Let the wave take what it wants
  I belong inside the blue

  [Outro — reverb fade, 2:55]
  mmm...

  [End]

