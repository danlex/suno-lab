notes: |
  Technique: dream-pop / shoegaze-pop — a genre defined by tonal immersion rather than
  forward propulsion. The listener is submerged in reverb-saturated guitar wash and
  slow-attack synth pads; the vocal floats as another texture, half-spoken in verses
  and rising to breathy soprano on the chorus. The hook lands via a sudden harmonic lift
  (half-step key modulation at the final chorus) discovered inside the texture rather
  than delivered as a lyrical punch. Originated in late-1980s UK independent music and
  refined across the early-1990s through the 2020s; no specific artist or band named
  per blocklist discipline.

  Concept source: charts-informed novelty — zero prior catalog representation of
  dream-pop or shoegaze-pop across all 331 versions. v328 was confessional indie-pop
  (guitar + piano, lyric-forward), v329 French nu-disco, v330 folk-pop anthem. This is
  textural immersion, not melodic storytelling. TONAL IMMERSION is the signature.

  Differentiation from last four cycles:
  - v327 (slow ballad): not this — no slow tempo, no introspective lament.
  - v328 (confessional indie-pop): not this — no close-mic vulnerability arc.
  - v329 (nu-disco): not this — no groove pocket, no French language.
  - v330 (folk-pop anthem): not this — no anthemic singalong, no acoustic instruments.
  This is hazy, submerged, luminous — a room you fall into.

  Duration strategy (duration-fix applied): last cycles rendered short. Fixes:
  1. Eight sections with timestamps extending to 2:55.
  2. BPM 170 — proven high-BPM band (160+) where bar counts work and renders hit 3:00+.
  3. Late time anchors in style field: "final chorus at 2:35" and "reverb-tail fade near 2:55."
  4. No [Silence] metatag — per feedback_silence_gate_truncates, explicit silence markup
     truncates. The bridge near-solo is described in the bracket label only.
  5. Final chorus labelled at 2:40 in lyrics + 2:35 in style — twin anchors push Suno
     past the 2:10 truncation zone.
  6. The outro "reverb fade, 2:55" signals to v5.5 that playback should continue to that
     timestamp rather than ending early.

  Synth pads NOTE: this genre requires slow-attack synth pads as genre anchor; "no
  synthesizers" is intentionally absent from inline negatives per the caller's
  instructions. Distortion/aggression is excluded instead.

  Production tokens: polished studio mix, wide stereo stage, warm acoustic ambience
  (three tier-1 v5.5 production tokens woven into style prose). Sentence case throughout;
  no ALL-CAPS form labels. Atmospheric-first opening (bedroom ceiling dissolving into
  reverb) front-loads the scene.

  Featured trio (signature texture; reverb guitars + pads are genre anchor, not trio):
  - Theremin (gap 108, last v222): continuous pitch shimmer tracing the vocal line,
    ethereal and pitch-continuous — the ideal spectral voice for the haze. Spectral pick
    (the one permitted per trio rules).
  - Oboe d'amore (gap 81, last v249): warm, longing timbre in the pre-chorus swell,
    adding ache and organic warmth against the reverb wash. Body voice.
  - Clavichord (gap 89, last v241): featherlight key-touch action, the most intimate
    keyboard instrument — opens the track bare before the guitar wash arrives, then
    sustains as harmonic bed beneath the whispered verse. Body voice.

  Two body voices (oboe d'amore + clavichord) plus one spectral voice (theremin): satisfies
  the ≥2 body voices rule. Reverb guitars and slow-attack pads are genre anchors.

  Novelty claims:
  - Technique novelty: dream-pop / shoegaze-pop — zero catalog prior in 331 versions.
    First textural-immersion vocal track in the entire catalog.
  - Trio novelty: theremin (gap 108) + oboe d'amore (gap 81) + clavichord (gap 89) —
    all three at significant catalog absence; combination is catalog-unique.
  - Key novelty: C major → D-flat major (half-step lift at final chorus) — not prior.
  - BPM novelty: 170 BPM — unused in catalog, high-BPM band, aids full render.
  - Scene novelty: bedroom ceiling dissolving into reverb — submerged watercolour haze.
    Distinct from all prior scene moods (morning kitchens, city apartments, processions).
  - Genre novelty: shoegaze-pop / dream-pop — zero prior representation.

