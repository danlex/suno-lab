  [Build — Drums + bass drop, 2:00-2:30]
  (lead) somethin' is rising inside me
  (choir) RISEN, RISEN
  (lead belt) callin' me higher

  [PRAISE BREAK Climax — choir + Hammond + half-step ascent, 2:30-3:00]
  RISEN! (choir) RISEN!
  oh I am RISEN, I am RISEN
