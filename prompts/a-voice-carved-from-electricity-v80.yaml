notes: "v80 — ONDES MARTENOT as centerpiece. Third pure-orchestral experiment in the unusual-instrument series (v78 Shepard tones → v79 glass harmonica → v80 ondes martenot). The ondes martenot is the 1928 proto-electronic instrument invented by Maurice Martenot that produces a singing voice-like tone using ribbon-controlled oscillators. Famously used in Lord of the Rings (Howard Shore), Lawrence of Arabia (Maurice Jarre), Ghostbusters, Star Trek IV, Amélie, and Radiohead albums. Unique sonic vector: the instrument sounds unmistakably like a human voice singing with vibrato, but it's not — it's electricity shaped into melody. Creates an uncanny-valley response paired with heroic orchestral framing. F minor, slow 66 BPM Celibidache patience. Contrasts sharply with v79's pure bell-like glass harmonica — ondes martenot is wailing and vocal, glass harmonica is ethereal and bell-like. Key exclude note: excluded 'synthesizers' and 'electronic' from negative prompts because ondes martenot is technically electric, but kept drum machine/techno/house/EDM exclusions. 939 chars."
