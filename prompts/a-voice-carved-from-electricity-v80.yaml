name: "a-voice-carved-from-electricity"
version: 80
style: "ONDES MARTENOT orchestral, F minor, 66 BPM, purely instrumental. Zimmer scores the 1928 instrument that haunted Lord of the Rings and Lawrence of Arabia. Opens with solo ondes martenot — a voice that is not a voice, wailing a four-note melody with vibrato like a human soprano but the texture of singing electricity. It floats alone in darkness. Contrabasses enter beneath. Cellos build. Violas. A pipe organ drone gathers cathedral weight. The ondes martenot never stops — it sings its wordless melody as the orchestra rises around it. French horns enter in heroic parallel. Trumpets call. Strings tremolo in long sustained bows. Pipe organ opens its full throat. At the climax the orchestra is a thunderstorm, but the ondes martenot still rides above — a wailing voice carved from electricity and light, recognizable as human but locatable in no human body. Modern cinematic audiophile production. No vocals, no synthesizers, no guitars."
title: "A Voice Carved from Electricity"
lyrics: ""
instrumental: true
