  "soft disco groove", "gliding melodic bass". This approach is a catalog first — no
  prior entry uses this sound family.

  Concept source: charts-informed original — the neo city-pop revival (2024-2026)
  emphasises shimmering analog synth hooks, sun-warmed Rhodes, four-on-the-floor
  disco grooves, and clean English-language female vocals rather than the original
  era's Japanese-language register. This cycle translates that sonic vocabulary
  without genre-labelling it, preventing auto-classifier drift.

  This technique echoes a generation of late-1970s through 1980s Tokyo-based studio
  producers and their 2020s-revival interpreters without naming any of them, per
  blocklist discipline.

  Nyckelharpa substitution note: the novelty-picker suggested nyckelharpa (gap 79)
  for the reed-family slot, but nyckelharpa carries strong Nordic-folk character
