style: "Sun-warmed analog shimmer, airy and bright — a rooftop at golden hour, a clean female voice riding a gliding melodic bass and a soft disco four-on-the-floor groove. Polished studio mix, wide stereo stage, warm tape saturation. B-flat minor lifting to B minor at the payoff chorus, 143 BPM. An analog synth hook opens cold and shimmering, female vocal enters at ten seconds doubling the hook. Rhodes electric piano sustains warm maj7 voicings with gentle chorus-shimmer. Cornet delivers close-miked warm brass stabs, bright and round. Chalumeau brings husky low-register warmth into verse gaps, a breath-dark undertow. Glockenspiel doubles the synth hook with bright mallet shimmer an octave higher. Gliding melodic bass anchors the groove. English-singing clean bright soprano, airy and close-miked. Final chorus at 2:35, synth-hook fade near 2:55. No distorted guitars, no aggressive drums, no autotune, no Scandinavian folk, no orchestral strings."

lyrics: |
  [Synth hook, 0:00]

  [Vocal doubles hook, 0:20]
  Shimmer on the rooftop
  You and the gold light stay
  Every note we're holding
  Won't ever fade away

  [Full groove, 0:40]

  [Verse 1, 0:50]
  Catch me in the shimmer
  Slow your breathing down
  You're the warm-lit window
  Every time I come around
  We don't need a reason
  When the groove runs high

  [Pre-chorus — bass and vocal, 1:25]
  Let it ring out
  Let it ring out bright
  One more step
  Stepping into light

  [Payoff chorus — B minor, 1:42]
  Gleam like the morning gold
  Gleam, never growing cold
  This melody is ours to hold
  Gleam, bright and bold

  [Verse 2 — cornet stabs, 2:02]
  Keep the rhythm easy
  Let the synth hook run
  Feel the bass line carry
  Every note until we're done

  [Final chorus — full, 2:35]
  Gleam like the morning gold
  Gleam, never growing cold
  This melody is ours to hold
  Gleam, bright and bold
  Gleam, bright and bold

  [Outro — synth hook fades, 2:50]
  Gleam...

  [End]

