style: "Warm conviction rising to release — a woman's voice alone in a gospel-lit hall, the whole room holding its breath before the choir erupts. Polished studio mix, wide stereo stage, warm tape saturation. A-flat minor lifting to A minor at the final chorus, 171 BPM with a half-time hand-clap feel. Warm gospel grand piano opens alone, spare, rich 7th and 9th chord voicings. A soaring female lead enters over piano only, close-miked, soulful, breath audible on the verse phrases. Hammond organ swells in at the pre-chorus. Call-and-response choir at the chorus — lead calls, choir answers — building from hum to full-voice replies. Tuba grounds the low end with round sousaphone-weight gospel brass. Hand-claps and tambourine enter by the final chorus. Final chorus at 2:35, choir pad sustain near 2:55. Anthem score for a secular conviction scene. No devotional church framing, no autotune, no EDM drop, no distorted guitars, no trap hi-hats."

lyrics: |
  [Piano intro, 0:00]

  [Verse 1 — piano only, 0:10]
  I've been carrying this a long time
  Setting it down to pick it up again
  Every road I walked alone

  [Pre-chorus — choir hum, 0:45]
  Something's rising in my chest
  Can't hold back what wants to break
  The choir hums beneath me

  [Chorus — call and response, 1:10]
  I'm letting go (let it go, let it go)
  All the weight I swore I'd keep (lay it down)
  Tell me I'll be alright (you'll be alright)
  The flood has found its break

  [Verse 2 — organ enters, 1:35]
  Rooms I kept too quiet
  Doors I never dared to open
  The sound won't stay inside me

  [Pre-chorus 2 — choir, 2:00]
  Something rising, won't stop rising
  Breaking open, wide and bright
  The choir meets every calling

  [Final chorus — key lift, 2:25]
  I'm letting go (let it go, let it go)
  All the weight I swore I'd keep (lay it down)
  Tell me I'll be alright (you'll be alright)
  I'm letting go, letting go

  [Lead over choir pad, 2:45]
  Alright... alright
  Just the ember left to burn

  [End]

