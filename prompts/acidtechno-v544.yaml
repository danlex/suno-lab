notes: |
  Acid techno is a variant of techno built around the Roland TB-303 bass synthesizer — originally a guitar-bass simulator repurposed in Chicago and Detroit warehouses in the mid-1980s — whose resonance filter sweeps and squelch produce the genre's defining hypnotic signature. The 303 line is not a melody but a morphing organism: cutoff frequency rises and falls across the grid, occasionally peaking into full resonance screech before closing back into sub-bass territory, giving the track a breathing quality even as the arrangement remains otherwise locked and relentless. The concept source: a lone driver in a long tunnel at 3am, strobing overhead lights, endless identical pillars, the mind emptying into pure hypnotic forward motion, self dissolving into the strobe — "The road is eating me."

  Hook contour as specified: "The road is eating me" — rising whole-step on "is eat-" (A4→B4, beats 2–3), falling perfect fifth on "-ing me" (B4→E4, held beat 4 into next bar). "Me" lands on the fifth of A minor, open and unresolved, driving the immediate repeat. Delivered deadpan, monotone, entranced — not belted — one phrase per two-bar loop over the 303 squelch grid. The backup verse lines ("The white line knows the way," "Sixty seconds, sixty pillars," "I stopped counting at forty") are woven into the verse blocks to create the tunnel-counting hypnosis without deviating from the deadpan lane.

  No negative-prompt contradictions: exclude_styles omits "vocals"/"singing" (the track IS vocal), and the inline negatives avoid "no synthesizers" (the TB-303 IS a synthesizer — the entire sound-world depends on it). Duration strategy: parametrized colon-syntax with bar counts summing to 136 bars (8+16+16+32+16+16+24+8), anchored by a 32-bar mid-song acid instrumental (303 + kick only, no ambient layer) as the duration lever. Atmospheric-first opening, sentence case throughout. Production tokens: polished studio mix, deep low-end definition, wide stereo stage. BPM 130 sits in the proven duration band (130–160).

  Novelty: acid techno with a deadpan-trance male vocal hook ("The road is eating me") and a tunnel-strobe scene is unused in this catalog. The continuous 303-never-stops arrangement philosophy combined with the parametrized bar-count lyric structure is a first for this lane. Style chars and lyrics chars verified via count_field.py before finalizing.
