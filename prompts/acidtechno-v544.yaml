style: "Hypnotic tunnel trance at 130 BPM, A minor — acid techno with a squelching TB-303 bassline that morphs through resonance sweeps beneath a relentless four-on-the-floor kick, tight hi-hats on every sixteenth, metallic percussion interlocking without gaps. Polished studio mix, deep low-end definition holding the acid grid, wide stereo stage spreading 303 cutoff sweeps and clap transients across the field. The arrangement is dense and continuous: the 303 never fully stops, its resonance opening and closing like a breathing throat. A lone male voice delivers the hook in deadpan monotone — not belted, not shouted, entranced and hollow, one phrase per two-bar loop over the squelch, self dissolving into strobe motion. Strobing tunnel walls, white pillars at 3am, the mind long gone, only forward momentum and the repeating phrase remaining. No acoustic guitar, no rock band, no pipe organ, no choir, no live strings."

