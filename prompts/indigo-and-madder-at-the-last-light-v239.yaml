notes: |
  HYMN-AND-FUGATO is a three-part orchestral design (not a period form but a compositional procedure): a slow noble chorale-hymn states and plants a short melodic cell, which is then taken up imitatively in a fugato — a canonic eruption that never locks into a complete fugue but builds imitative density toward a climactic peak — before the hymn returns in a brighter key with the fugato still audible beneath it. The concept synthesizes the weight of chorale writing with the kinetic energy of imitative counterpoint, allowing both textures to coexist in the final section. The procedure was developed here as an original framing for this prompt series.

  Duration defense: five consecutive successes with the full-orchestra anchor strategy (v137+ override). Although the featured trio — ondes martenot, contrabass clarinet, bowed vibraphone — is spectrally unusual and could tempt Suno toward chamber or ambient textures, the style anchors deeply in full orchestral forces: named brass section, full string section (low to high), flutes and oboes in the woodwinds, timpani and percussion bed. The trio members are featured colors within that full-orchestra context, not the sole voices.

  Composer-omission note: no composer or performer names appear anywhere in this prompt, per standing blocklist policy. Canonical orchestral forms and procedures are described by structural function only.

  Trio roles and novelty gaps:
  - ONDES MARTENOT (early_electronic, last v227, gap 12): vocal-like sustained body line; carries the hymn's expressive top voice in the return above the full brass, adding otherworldly warmth to the chorale texture.
  - CONTRABASS CLARINET (woodwinds, last v227, gap 12): deep low-register foundation; doubles the low strings in the chorale opening, adds dark resonant rumble to the fugato bass line at the peak.
  - BOWED VIBRAPHONE (mallet_perc, last v218, gap 21): shimmering metallic halo; arpeggiated figures during the fugato build, bell-tone punctuation at the hymn return, bridging the chorale's sustained weight and the fugato's rhythmic pulse.

  Key arc: A major (hymn, fugato) → B-flat major (hymn return at 2:00) — a half-step lift that rewards the fugato's climb and lands the return in a perceptibly brighter harmonic space.
  BPM: 156 — not used in the recent run sequence (154/155/151/153/148/147); measured noble walking pulse appropriate to the chorale opening.
  Scene: a Renaissance/early-industrial dye-works at sundown — vats of indigo and madder simmering, lengths of cloth hanging to drip from beams, the final pass of light catching saturated colors. Hymn = the slow steady simmer. Fugato = workers crossing with bolts, overlapping rhythmic activity. Hymn return = dyed cloth hung in the last light, each color made visible as triumph. Scene is new to this series (no prior dye-works prompt).

  Style char count: 943.
