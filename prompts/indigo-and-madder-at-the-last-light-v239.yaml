style: "Monumental orchestral HYMN-AND-FUGATO, dye-works at the last light, total duration around 3:00, 156 BPM, A to Bb major arc, full orchestra: ONDES MARTENOT + CONTRABASS CLARINET + BOWED VIBRAPHONE. Brass chorale opens in A major: horns and low brass over low strings, noble unison planting a short melodic cell. At 0:45 the fugato erupts — violins seize the cell, violas follow, cellos after, woodwinds rising with flutes and oboes on top, contrabass clarinet on the bass line with deep rumble. Bowed vibraphone shimmers in metallic arpeggios as canonic density compresses toward the 1:45 peak. At 2:00 the brass chorale returns in B-flat major — ondes martenot carries the expressive top voice while the fugato counterpoint weaves in strings below. Both textures reach the final cadence: chorale triumphant, fugato threading beneath. Timpani and full percussion throughout. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Short Instrumental Intro]
  [Brass Chorale, Dye Vats Simmering]
  The slow hymn moves in A major — horns and low brass over low strings, a noble unison, the melodic cell planted in deep harmonic saturation as pigment blooms in still water.

  [Fugato Eruption, Workers Crossing]
  Violins seize the cell at 0:45, then violas, then cellos, woodwinds rising with flutes and oboes on top — overlapping voices like workers lifting and draping bolts of cloth, contrabass clarinet rumbling beneath.

  [Bowed Vibraphone Arpeggios, Canonic Density]
  Metallic shimmer threads through the canonic pile-up — the bowed vibraphone arcs above the strings while dissonance accumulates and the full orchestra surges toward the 1:45 peak.

  [Orchestral Peak, All Voices]
  Full string section, brass, woodwinds and timpani arrive together — the dye vats boiling, every bolt in motion, maximum density at 1:45.

  [Silence]

  [Hymn Returns in B-flat Major]
  The brass chorale rises a half-step — ondes martenot carrying the expressive top voice above the full orchestra, the fugato counterpoint still weaving in strings and woodwinds beneath.

  [Two Textures Together, Cloth in the Late Light]
  Chorale triumphant above, fugato threading below — each dyed length catching the last sun, saturated color made visible as a kind of triumph.

  [Final Unison Cadence]
  Every voice converges — the chorale lands, the fugato resolves, and the last light holds the colors still.

  [End]

