notes: |
  Speed garage is a UK sub-genre that emerged from UK garage in the late 1990s — it pushes the tempo to 130-140 BPM while retaining the four-on-the-floor swing kick, the skippy offbeat snare pattern, and the signature wobbling squelch bass. The genre's emotional register leans toward release and floor-filling euphoria rather than cool detachment.

  The concept source: a man who finally cracks open and lets go on the dancefloor — "I was glass" as the central image, fragility transformed into liberation.

  v462 TOURNAMENT WINNER (inline-judged 81/100, danceability 8; bar lowered to >=70 by user directive 2026-07-15). Beat sibling Flooded462 (79/100, double-time beat-flip). An earlier v462 speed-garage tournament (Smoke/Corridor/Orbit) STALLED at 61-74 because all three shared the build->strip->half-step-lift arc and used a cool/spoken vocal; this winning attempt fixed both: a genuinely SUNG melodic hook (22/25 from the hook-writer) and a bold non-modulation climax (kick-withdrawal suspension), single key throughout.

  Duration strategy: the total duration target (around 3:00) is stated early in the style. The mid-song [Squelch Bass and Theremin Break] provides the explicit lyric-free instrumental duration lever (~16 bars at 134 BPM = ~28-35 seconds of pure instrumental groove). The final lyric line lands around 2:40 via the [Outro] timestamp. Sentence case is used throughout; the style opens atmosphere-first with genre + purpose + BPM before naming the trio.

  Architecture rationale: the prior-version failure came from the default build->strip->half-step-key-lift->drop template. This version stays locked in A minor with zero modulation. The climax device is a kick-withdrawal suspension: kick and bass cut for ~2 bars, leaving voice and theremin exposed, then the full groove slams back on the downbeat. The "drop" IS the return of the groove, not a key change. This is named explicitly in the style prose and instantiated with [Kick Withdrawal — Voice and Theremin Only] in the lyrics.

  Trio roles and novelty: THEREMIN (spectral voice — eerie hovering lead melody, fills space the bass clarinet vacates during the kick-withdrawal); BASS CLARINET (body voice — organic growling squelch bass surrogate, deep low-end definition); STEEL TONGUE DRUM (body voice — skippy percussion grid, leads the drop return). Two body voices (bass clarinet + steel tongue drum), one spectral (theremin).

  Hook contour: "Crack me open" lands on a syncopated triplet attack on the offbeat snare pair; "o-pen" descends stepwise; "I was GLASS" rises a major sixth, the high note held over the squelch-bass wobble peak. The call-and-response answer — "Pour yourself into the cracks" — is a melodically distinct second idea.

  Novelty claims: speed garage has not appeared as the genre anchor in the catalog. Bass clarinet as squelch-bass surrogate is an untested fusion. Steel tongue drum in a UK club context is novel. The kick-withdrawal climax architecture is a deliberate departure from the overused v216-v219 template. BPM 134 in this genre band has not appeared. Scene: cathartic release on a dancefloor.

  Final style char count: 934.

