style: "Speed garage club track built for release and euphoria, total duration around 3:00, with a soulful aggressive male vocal singing every line with floor-filling conviction, in A minor at 134 BPM. Four-on-the-floor swing kick, skippy offbeat snares, wobbling squelch bass — with THEREMIN as the eerie hovering lead, BASS CLARINET supplying the organic growling squelch, and STEEL TONGUE DRUM locked into the skippy percussion grid. Catharsis on the dancefloor: a man who cracks open and lets go. Warm tape saturation on the drum bus, deep low-end definition from the bass clarinet growl, wide stereo stage on the theremin. The climax is a kick-withdrawal suspension — kick and bass drop entirely for two bars, leaving only voice and theremin suspended, then the full groove slams back on the downbeat. No modulation, no key change; the arc is accumulation and withdrawal. No guitars, no pipe organ, no 2-step, no grime, no drum and bass."

lyrics: |
  [Intro: swing kick locks in, bass clarinet growl rises, 8 bars]

  [Verse 1: hushed urgency, building pressure]
  I been holding myself together too long
  Every seam pulled tight, every word held wrong
  There's a rattle in my chest where the silence lives
  And I got nothing left to keep, only things to give

  [Pre-Chorus: snares skip harder, theremin climbs]
  Something in me finally breaking loose
  I can feel the floor decide

  [Chorus: full squelch drop, sung with conviction]
  Crack me open, I was glass
  Pour yourself into the cracks
  Crack me open, I was glass
  Light gets in — and it never looks back

  [Verse 2: fuller band, more urgency, mid-song heat]
  Spent a whole life being careful, being clean
  But careful never felt like it meant anything
  Now the bass is in my blood and the beat's on fire
  And I don't know which part of me is real, and I don't care

  [Pre-Chorus: escalating, snares doubling up]
  Something in me finally breaking loose
  I can feel the floor decide

  [Squelch Bass and Theremin Break: lyric-free instrumental, bass clarinet and theremin trade phrases over skippy steel tongue drum, 16 bars]

  [Chorus: soulful and full-throated, high energy]
  Crack me open, I was glass
  Pour yourself into the cracks
  Crack me open, I was glass
  Light gets in — and it never looks back

  [Kick Withdrawal — Voice and Theremin Only: kick and bass drop out, voice and theremin suspended bare, two bars of space]
  I was — glass

  [Drop Return: full groove slams back on the downbeat, steel tongue drum leads]
  Crack me open, I was glass
  Pour yourself into the cracks
  Crack me open — glass

  [Outro: bass clarinet holds long tone, theremin fades, kick softens, 0:02:40]
  Never going back
  Never going back

  [End]

