style: "Polynesian dark orchestral, powerful dark female mezzo-soprano, deep war chant choir, heavy tribal percussion, conch shell horn, dramatic strings, cinematic and primal, ocean power, building from chant to tsunami"
title: "The Ocean Carved My Bones"
lyrics: |
  [Deep Percussion and Chant - Primal]
  Before the maps were drawn
  Before the compass turned
  We read the stars like scripture
  And the ocean was our church

  [Conch Horn and Strings Enter]
  A thousand miles of water
  Could not keep us from the shore
  We sailed into the unknown
  And the unknown made us more

  [Full Orchestra and War Choir - Massive]
  The ocean carved my bones
  The ocean made me strong
  Every wave that tried to drown me
  Became another song

  [Quiet - Voice Alone with Distant Drums]
  My ancestors crossed horizons
  With nothing but the tide

  [Explosive Final - War Chant and Orchestra]
  The ocean carved my bones
  And I am made of waves
  Every storm that ever broke me
  Taught me how to be brave

  We are the ocean
  We are the ocean

  [End]
