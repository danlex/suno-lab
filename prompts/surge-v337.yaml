name: "surge-v337"
version: 337
title: "Surge"
instrumental: false
vocal_gender: female

style: "Warm euphoria pressing upward — liquid drum and bass for the UK dance chart crossover of 2025–26, club lights blooming as the bass reloads. Polished studio mix, wide stereo stage, deep low-end definition. B major lifting to C major at the final chorus, 172 BPM rolling two-step breakbeat with deep sub-bass and warm pad washes. An emotive English female soprano carries the hook high and bright above the breaks. Vibraphone shimmers in bright metallic fills between vocal phrases. French horn holds warm mid-register pads, a harmonic cushion below the soprano. Harp arpeggios propel the groove, liquid attack on each two-step downbeat. The pre-drop strips the bass for four bars before the full sub-bass and breaks reload under the hook. Final drop 2:20, breaks fade to pad near 2:50. No breakbeat aggression, no patois vocals, no chopped amen patterns, no dark techstep texture, no autotune. Underscore for a euphoric dance-floor arrival scene."

lyrics: |
  [Pad wash intro, 0:00]

  [Bare vocal hook, 0:18]
  Every colour runs to you
  Every light comes breaking through

  [Verse one — rolling breaks, 0:35]
  I keep finding ways to lose the thread
  Then the whole room fills with you instead

  [Chorus — sub-bass in, 0:55]
  You are the surge, the open door
  Feel you in the low end of the floor
  You are the surge, come back for more

  [Pre-drop — bass strips out, 1:20]
  Hold the space

  [Drop — full sub-bass, 1:28]
  You are the surge, the open door
  Feel you in the low end of the floor

  [Verse two — harp forward, 1:46]
  Every city night has had your face
  Every corner of the sound you trace

  [Build — vibraphone lifts, 2:04]
  Lifting, lifting, higher through the break

  [Pre-drop two — bass strips out, 2:14]
  Hold the space

  [Final drop — C major key lift, 2:20]
  You are the surge, the open door
  Feel you in the low end of the floor
  You are the surge, come back for more
  Breaking into something worth the war

  [Breaks fade to pad, 2:48]

  [End]

