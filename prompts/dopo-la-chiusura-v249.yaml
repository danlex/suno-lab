notes: |
  Italian neoclassical chamber cinematic — a late-night film cue in the tradition of intimate Italian scoring (no composer names named, per blocklist discipline), evoking the warmth and shadow of a trattoria at the end of a narrow alley after closing time. The maître d' nurses a vermouth at the corner table; the kitchen is quiet; the remaining musicians play for themselves.

  v248-breakthrough playbook applied in full: (1) parametrized colon-lyrics with bar counts (8–10 sections, the v5.5 trick proven at 3:17 in v248); (2) production-mix tokens — "tight chamber reverb," "warm tape saturation," "polished studio mix" — three tokens baked into the style; (3) sentence case throughout style, no ALL-CAPS form labels; (4) atmospheric-first opening — feeling before technique; (5) three full body voices (harpsichord + cor anglais + bass clarinet), satisfying the two-body-voice rule.

  Trio roles and gaps:
