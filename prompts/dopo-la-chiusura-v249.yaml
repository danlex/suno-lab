name: "dopo-la-chiusura-v249"
version: 249
style: "Late-night Italian neoclassical chamber cinematic, intimate and noir-tinged, the warmth of a trattoria at the end of a narrow alley after the last guests have gone. Tight chamber reverb and warm tape saturation frame a polished studio mix where every instrument breathes in close proximity. Scored in F minor moving to A-flat major at the bridge, at 144 BPM, for harpsichord carrying the chord progression and ostinato figures, cor anglais stating the mournful melodic line, and bass clarinet providing rich sub-register sustain beneath the full string section. The harpsichord's mechanical attack anchors the pulse; the cor anglais bends each phrase with low-reed warmth; the bass clarinet underlines every harmonic shift with dark resonance. Cellos and violas fill the middle register while violins trace a delicate upper line. No guitars, no vocals, no percussion, no synthesizers, no rock drums."
title: "Dopo la Chiusura"
lyrics: |
  [Intro: solo harpsichord states the F minor theme over a sparse cello pedal, 8 bars]
  [Reed Enters: cor anglais joins with a mournful countermelody above the harpsichord ostinato, 8 bars]
  [Sub-Bass Joins: bass clarinet enters with rich sub-register sustain, deepening the harmonic bed, 8 bars]
  [Bridge: all three voices modulate to A-flat major, violas and cellos rising with warmth, 16 bars]
  [Bloom: full string section blooms as harpsichord, cor anglais, and bass clarinet weave in counterpoint, 16 bars]
  [Hush: harpsichord and cor anglais alone, intimate piano dynamic, strings silent, 8 bars]
  [Final Statement: full ensemble returns in F minor, bass clarinet anchoring the final cadence, 16 bars]
  [Coda: bass clarinet sustains low tonic while harpsichord rolls a quiet final chord, 8 bars]
  [End]
