style: "Cold darkwave synth-pop with post-punk urgency and new-wave hook precision, total duration around 3:00. An icy detached female vocal — melodic and controlled, warm melody over a cold noir surface. Polished studio mix with deep low-end definition and wide stereo stage. Key of B minor, 122 BPM. Cold analog sawtooth synth bass, retro drum machine with tight clipped gated snare and driving kick, ondes martenot as the eerie gliding electronic noir lead threading every section. Cold synth pads and a noir lead-synth line fill the texture. Verse strips to near-bass-and-drum pulse; pre-chorus drops to kick and sawtooth only, cold tension; chorus lifts with the full ensemble; an arpeggio bridge features ondes martenot gliding over cascading synth arpeggios; final chorus adds layered arpeggios and soaring ondes martenot — density as the climax, staying B minor. No guitars, no live drums, no pipe organ, no trap percussion, no bright EDM leads."
title: "Automatic475"
lyrics: |
  [Intro: cold sawtooth bass and gated snare drum machine, sparse synth pads entering, 8 bars]

  [Verse 1: icy female vocal enters over bass-and-drum pulse, cold and controlled, 16 bars]
  Fluorescent light on the ceiling above
  I trace the edges of something like love
  The signal's clean, the channel is clear
  A familiar frequency I can't unhear

  [Pre-Chorus Strip: drops to kick and sawtooth bass only, tension building cold, 8 bars]
  Something moves without a reason
  Underneath the frozen season

  [Chorus: full ensemble, hook melody soaring, ondes martenot gliding the tritone answer, 16 bars]
  Automatic — I still want you
  I still — want you
  Wired into what we never named
  Automatic — nothing's changed
  Signal locked, I still want you

  [Verse 2: synth pads thicken slightly, vocal stays icy and controlled, 16 bars]
  You move in patterns I've memorized
  Predictable in all the ways I despise
  But here in the dark the current returns
  Automatic — the body still learns

  [Pre-Chorus Strip: kick and sawtooth only again, colder, 8 bars]
  Something moves without a reason
  Out of reach but still in season

  [Chorus: full ensemble again, ondes martenot tritone shadow on the answer, 16 bars]
  Automatic — I still want you
  I still — want you
  Wired into what we never named
  Automatic — nothing's changed
  Signal locked, I still want you

  [Arpeggio Bridge: ondes martenot gliding high over cascading synth arpeggio, no vocal, 16 bars]

  [Final Chorus: layered synth arpeggios added, ondes martenot soaring, full density, 16 bars]
  Automatic — I still want you
  I still — want you
  Every circuit burning your name
  Automatic — I'll take the blame
  Locked and loaded — I still want you

  [Outro: sawtooth bass and ondes martenot alone, fading cold, 8 bars]

  [End]
