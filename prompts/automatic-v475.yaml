notes: |
  Darkwave cold synth-pop is a lane that blends post-punk structural discipline with new-wave melodic
  hook writing and analog-synth noir texture — the genre emerged in the mid-1980s European underground
  (UK, Germany, Belgium) and has been periodically revived via artists working in goth-adjacent
  electronic spaces. The concept source: a cool detached icy female vocal carrying a warm singable
  melody as a surface-rupture contrast — the mechanical "automatic" exterior breaking to the naked
  emotional confession "I still want you."

  This lane is fresh to the catalog (no prior darkwave cycle in the prompt archive). The ondes
  martenot serves as the eerie gliding noir lead — an acoustic-electronic hybrid that predates
  synthesizers and produces a distinctive sinusoidal wobble unlike any standard synth voice. Its
  tritone glide answering the vocal hook confession is the signature framing color of this cycle.

  Duration strategy: lyrics target ~3:00 with a full sung arc — two verse/pre-chorus/chorus cycles,
  a dedicated lyric-free arpeggio bridge (~16 bars at 122 BPM, approximately 30s) as the duration
  lever, and a final-density-lift chorus (arpeggios + soaring ondes martenot) as the climax. Final
  lyric line lands around 2:40. Production tokens used: polished studio mix, deep low-end definition,
  wide stereo stage. Sentence case throughout; atmospheric-first opening. Two body voices (sawtooth
  synth bass + retro drum machine) anchor the trio with one spectral (ondes martenot) per the
  playbook limit.

  Architecture is non-formulaic: no key modulation — density and intensity (layered arpeggios,
  soaring ondes martenot) replace the overused half-step-up cliché as the climax mechanism. The
  pre-chorus strip (kick + sawtooth only) is a structural move distinct from the Build/Silence/Drop
  stack, creating cold tension without risking silence-gate truncation.

  Instrument roles and novelty: cold analog sawtooth synth bass (harmonic foundation, never-used
  darkwave bass voice), retro drum machine with tight clipped gated snare (post-punk rhythmic anchor,
  gated snare is a new texture), ondes martenot (eerie gliding lead, tritone shadow on the hook).

  Novelty claims: darkwave as a genre lane is fresh to the catalog; ondes martenot in a noir-synth
  lead role (not orchestral color) is a new use; gated-snare drum machine texture is fresh; density
  climax without modulation is a distinct architectural move vs prior cycles; female vocal after male
  v460/v458 rebalances gender. BPM 122 is in the proven 130-160 band's lower neighbor — at 122 BPM
  the ~3:00 target is realistic and appropriate for the cold-darkwave mood.

  Style char count: 945.
