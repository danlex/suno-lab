notes: "v191: TOMBEAU form (first use) — 17th-century French Baroque memorial elegy. Style brisé (broken arpeggiated chords), unmeasured rhythmic freedom, grief dissolving into silence. Nyckelharpa (gap=51, Swedish keyed fiddle with sympathetic strings), celesta (gap=50, crystalline keyboard), cornet (gap=51, warm Renaissance brass). 51 BPM = slowest unused BPM, suits the grave memorial character. E minor → F minor half-step up. Daniela DAN voice. Theme: the way grief and love are passed between generations through music — the songs we inherit without knowing all the words."
