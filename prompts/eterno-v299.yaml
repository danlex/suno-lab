lyrics: |
  [Intro] (solo grand piano arpeggios, 0:00-0:30)
  (no vocals)

  [Verse 1 — tenor enters sotto voce, 0:30-1:00]
  eterno è il mare, eterno il cielo
  eterno il vento che parla nel silenzio
  ho camminato lungo la riva sola
  cercando ciò che il tempo non consuma

  [Verse 2 — cello joins, tenor fuller, 1:00-1:30]
  per monti, per valli, per il mondo
  ho portato il tuo nome nel cuore profondo
  eterno è l'amore che non muore
  eterno, eterno, eterno

  [Build — strings enter, tenor rising, 1:30-2:00]
  eterno, eterno, ascendere
  eterno, eterno, illuminare
  per la notte eterna, eterno io vivrò
  ascendere, ascendere

  [Climax — full orchestra + organ + half-step ascent + soaring high-belt, 2:00-2:30]
  ETERNO! ETERNO! eterno amore!
  ETERNO! ETERNO! per ogni secolo!
  ETERNO è il mare, eterno il cielo
  vivo, vivo, vivo, eterno

  [Sustained Plateau Climax, 2:30-3:30]
  (ensemble holding) eterno... eterno...
  eterno amore, eterno
  eterno, vincit eterno

  [Outro] (orchestral wash + piano fade)
  eterno...
  [End]

