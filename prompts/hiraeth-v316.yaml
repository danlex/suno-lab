style: "Cinematic classical-crossover orchestral lamentation, a counter-tenor alone — single descending phrase, Welsh hwyl cadence rising then falling in grief, the ache of a homeland changed beyond return. Mist-cold hillside at dawn, breath visible, voice carrying across the valley. Polished studio mix, Hollywood scoring stage, deep low-end definition. C minor lifting to C# minor at 2:35, 60 BPM. Counter-tenor in high lyric falsetto opens alone; alto flute enters pianissimo at 0:38 with soft counterpoint; low string orchestra of cellos, violas, and double basses as slow harmonic ground, low brass pedal tone from 1:20. At 2:05 texture strips to solo cello plus counter-tenor near-unison — sudden exposure. Half-step lift to C# minor at 2:35, strings return wide and unresolved, alto flute traces the opening phrase an octave higher. Underscore for a grief-homecoming scene. No guitars, no drums, no pipe organ, no synthesizers, no choral ensemble."

lyrics: |
  [Counter-tenor alone — hwyl descent, 10 bars]
  Hiraeth, hiraeth yn fy nghalon
  Llef y gwynt dros fynydd llwm
  Tref a gollwyd, tref a newidiodd

  [Alto flute enters beneath, 14 bars]
  Calon drom yn cario tristwch
  Môr o ddagrau heb eu henw
  Gwynt oer yn sibrwd yn y cwymp

  [Low strings join, harmonic ground, 16 bars]
  Hiraeth am yr hyn a fu
  Dagrau ar y garreg lwyd
  Llef yn codi dros y niwl

  [Full orchestra — grief peak, 20 bars]
  Calon, calon, llawn o hiraeth
  Môr a mynydd, cwymp a thristwch
  Ymbil, ymbil, hiraeth mawr

  [Strip: cello plus voice in unison, 16 bars]
  Hiraeth...
  Lux aeterna luceat eis
  In memoriam — hiraeth, hiraeth

  [Half-step lift to C# minor, strings return, 18 bars]
  Llef yn codi, newydd uchel
  Tref newydd dan yr un sêr
  Hiraeth mawr sy'n troi yn obaith

  [Alto flute octave higher — decay, 14 bars]
  Calon, calon, dal i ganu
  Môr o hiraeth, môr o olau
  Ymbil, ymbil, dal yn fyw

  [Final unaccompanied close, 10 bars]
  Hiraeth, hiraeth yn fy nghalon
  Llef y gwynt dros fynydd llwm
  Hiraeth

  [End]

