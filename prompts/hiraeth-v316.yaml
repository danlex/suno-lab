notes: |
  Hiraeth is the Welsh word for an untranslatable longing-grief — an ache for
  a place or time that has changed forever, the yearning for a homeland one
  cannot return to because it no longer exists as it was. The word carries no
  exact English equivalent; it is simultaneously homesickness, nostalgia, grief,
  and a deeper existential ache. Among the most widely cited "untranslatable"
  words across any language.

  Concept source (researcher): "Hiraeth Welsh orchestral lamentation ×
  cinematic classical-crossover. Counter-tenor unaccompanied opening, hwyl
  cadence architecture, Welsh Cymraeg lyrics with Latin shading at climax.
  Applying the v298-v300 validated long-form recipe with completely new vocal
  register and language. MONUMENTAL emotional cycle — tornado/cascade/eclipse
  intensity, grief architecture at maximum emotional nakedness."

  Composer-omission: the orchestral lamentation architecture this cycle echoes
  most directly — a slow string ground beneath a solitary high voice building
  to a climax then stripping to near-exposure before a final unaccompanied
  statement — is associated with one of the most performed American orchestral
  works of the 20th century. That composer is not named here per catalog
  discipline.

  Duration strategy: BPM 60 sits in the slow band (playbook rule 8, ceiling
  ~3:30 for ≤115 BPM). Total lyric bar count is 118 bars across 8 sections —
  targeting the slow-BPM ceiling of 3:00–3:30. The classifier argument is the
  primary duration driver: "Cinematic classical-crossover orchestral lamentation"
  anchors the opening sentence to prime the long-form classifier before
  instrument description. No [Silence] metatag anywhere per hardened rule
  (feedback_silence_gate_truncates.md) — the emotional strip at 2:05 is achieved
  by label instruction ("Strip: cello plus voice in unison") without explicit
  silence markup. The half-step lift C minor → C# minor at 2:35 uses modulation
  as the frisson driver. Production tokens applied: polished studio mix,
  Hollywood scoring stage, deep low-end definition, wide stereo stage, lush
  acoustic ambience (5 tokens, playbook rule 2 compliant). Sentence case
  throughout; atmospheric-first opening; colon-syntax lyrics with bar counts
  for per-section length scaffolding (playbook rule 1 compliant).

  Trio instruments:
  - alto flute (CATALOG DEBUT — never featured in 315 prior versions; gap ∞):
    soft mid-register woodwind, lower and breathier than the standard concert
    flute. Enters pianissimo at 0:38 to wind gentle counterpoint beneath the
    counter-tenor. The alto flute's warm hollow tone is uniquely suited to
    grief-textured counterpoint without overpowering the exposed voice. Returns
    in the final third tracing the opening phrase an octave higher for the
    luminous, unresolved close.
  - low string orchestra (cellos + violas + double basses — last as "string
    orchestra" at v310, gap 6): builds from 0:38 as the slow harmonic ground
    beneath the lament, rising in density through the grief peak at 1:20–2:05,
    then stripped hard at 2:05 to solo cello only. The deliberate framing as
    "low string orchestra" (cellos, violas, double basses — no violins) makes
    the texture darker and heavier than a full string section, suited to the
    grief register of hiraeth.
  - counter-tenor voice (CATALOG DEBUT voice register — never used in 315
    prior versions; gap ∞): high lyric male falsetto register, biologically
    male voice singing in the range above normal tenor. The catalog has had
    operatic soprano (v298), bel canto tenor (v299), mezzo-soprano duet (v300),
    bass-baritone (v313), clean tenor (v314), and dramatic contralto (v315) —
    but never counter-tenor. The register is specifically suited to the hwyl
    cadence: a rising-then-falling grief arc native to Welsh chapel oratory,
    carrying extraordinary emotional exposure when delivered unaccompanied.

  Welsh lyric vocabulary: hiraeth (longing-grief), yn fy nghalon (in my
  heart), llef (cry/voice), y gwynt (the wind), dros fynydd llwm (over bare
  mountain), tref a gollwyd (a home that was lost), tref a newidiodd (a home
  that changed), calon drom (heavy heart), tristwch (sadness), môr o ddagrau
  (sea of tears), heb eu henw (without their name), ymbil (entreaty), cwymp
  (fall), dagrau ar y garreg lwyd (tears on the grey stone), llef yn codi
  (voice rising), troi yn obaith (turning to hope). Latin at climax strip:
  "Lux aeterna luceat eis" (may eternal light shine upon them), "in memoriam"
  (in memory).

  Novelty claims: technique-novelty (counter-tenor unaccompanied opening +
  Welsh hwyl cadence architecture — first Welsh-language cycle in the catalog);
  instrument-novelty (alto flute CATALOG DEBUT, gap ∞ — first in 315 prior
  versions); voice-novelty (counter-tenor register debut — 56th orthogonal
  vocal architecture, never used in catalog history); scene-novelty (Welsh
  hillside in mist at dawn, slate fence half-fallen, voice across the valley);
  key-fresh (C minor last v308, gap 8); BPM-fresh (60 BPM last v298, gap 18).

