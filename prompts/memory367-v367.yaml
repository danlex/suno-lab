notes: |
  UK two-step garage vocal pop is the lane: that late-2025 / summer-2026 chart cluster of bittersweet, danceable songs with plainspoken female vocals over a shuffled garage beat — accessible, emotionally honest, clean production. The concept is anticipatory acceptance: walking into a beautiful thing knowing it will end, choosing it anyway, clear-eyed not regretful. Present-and-gone-at-once. This maps to a universal feeling (love, a night, a friendship, a season) without being cryptically literary — every listener can slot their own story in.

  The hook "you look like a memory already" is the whole thesis stated plainly: you are here and already becoming the past. The triplet arc on "memory" across the 2-step shuffle accent is the melodic fingerprint that separates it from generic sad-pop. The falling minor third on "already" resolving to F-sharp tonic gives it a finish that feels both inevitable and a little heartbreaking — the tonic resolution IS the acceptance.

  Style follows the winning v366 recipe: accessible vocal, danceable, plainspoken, universal, clean modern production. No obscure chamber instruments forced. The brief explicitly requests this lane. Genre: UK two-step garage vocal pop, 130 BPM, F-sharp minor. Polished studio mix, wide stereo stage, deep low-end definition as production tokens. Sentence case throughout, atmospheric-first opening.

  Climax design is non-formulaic per the brief: the stripped bridge (vocal + hi-hat only) contrasts against the full final chorus re-entry without using an explicit [Silence] metatag (documented to truncate renders) and without a half-step modulation gimmick. The density contrast IS the climax — the listener senses the near-absence before the full beat comes back.

  Duration levers: hook-first structure plants the melody at 0:00. A 28-bar post-chorus 2-step instrumental vamp (1:24–1:52) is the primary 3:00 lever (community-documented as the structural move that clears that threshold at 130 BPM). Final lyric pushed to ~2:44 with an instrumental outro fading from 3:02. Target 3:00–3:20 wall-clock. BPM 130 is in the proven 130–160 duration band per playbook rule 8.

  Exclude styles blocks genre drift: grime, dubstep, UK funky, garage house, drum and bass, jungle, UK drill, trip-hop — all adjacent genres that Suno's classifier might drift toward on a UK garage prompt. No artist names appear anywhere.

  Style char count: 925.

