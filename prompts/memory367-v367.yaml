style: "Bittersweet summer feeling — knowing something beautiful is already ending while you're still inside it — as UK two-step garage vocal pop at 130 BPM in F-sharp minor. Polished studio mix, wide stereo stage, deep low-end definition. Crisp shuffled hi-hats over a warm sub bass pulse. Bright clean synth pads; a tight sidechained pad breathes with the groove. Close plainspoken female vocal at the front of the mix — confessional, clear-eyed, no runs. The hook \"you look like a memory already\" lands on a triplet arc across the 2-step shuffle accent, falling minor third on \"already\" resolving to F-sharp tonic. Verses are low and intimate; the chorus fills with synth and percussion; a stripped bridge of vocal-and-hi-hat only precedes the final chorus re-entry. Danceable and luminous on the surface, something quietly aching underneath. No guitars, no rock drums, no pipe organ, no synthesizer arpeggios, no grime basslines."

