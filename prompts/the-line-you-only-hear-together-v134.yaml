notes: "v134 — ORCHESTRAL HOQUETUS. Medieval hocket (literally 'hiccup') — a single melodic line split between voices so rapidly that each voice alone sounds broken, but together they form one line. 13th-14th century Notre Dame school / Ars Antiqua. Second medieval-era technique after v133 isorhythm. RESEARCH: hocket = staggered interlocking texture. Composer name (Machaut's 'Hoquetus David') omitted. Notable revival in 20th-century minimalism and modern rhythmic music. DURATION STRATEGY: continued from v133. Tonal (F#→G MAJOR), rhythmic trading language (pulse-based), explicit microtonal/atonal exclusion. Expecting 1:00–2:00. INSTRUMENTS: Ondes martenot (×2, last v111 — 23-gap) = early keyboard with continuous gliding pitch, a single-voice instrument perfect for hocket lines; exclude 'electronic' and 'synthesizer' to prevent Suno category drift. Cor anglais (×2, last v122 — 12-gap) = alto oboe, warm legato, natural gap-filling voice. Bass flute (×2, last v120 — 14-gap) = breath-rich low woodwind, sets the first descending fragments. All three are sustaining single-line instruments — ideal hocket palette. NOVELTY: First hoquetus. 118 BPM = never used. F# major established (×2→3). Hummingbird-scene = novel image. Fragmentation-into-wholeness emotion. 940 chars."
