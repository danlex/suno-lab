name: "the-line-you-only-hear-together"
version: 134
style: "ORCHESTRAL HOQUETUS film score for a hummingbird-in-slow-motion scene, total duration 1:00 to 2:00, with ONDES MARTENOT + COR ANGLAIS + BASS FLUTE, medieval hocket where a melodic line is split between voices so rapidly each seems incomplete alone, F-sharp major to G major, 118 BPM, instrumental. From 0:00 bass flute enters with a descending line that breaks off every third note. At 0:18 cor anglais fills the gaps, each fragment continuing where the flute stopped. At 0:40 ondes martenot joins with continuous gliding pitch, weaving the third voice through the cracks. At 1:10 full orchestra takes the pattern, strings, woodwinds, brass trading a single line in rapid alternation. Peak 1:20 where all three voices lock into unison. Silence at 1:25 — four seconds. At 1:30 music returns in G major half-step up, fortississimo, the line finally unbroken. Ends at 1:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "The Line You Only Hear Together"
lyrics: |
  [Short Instrumental Intro]
  [Broken Line]
  [Gap-Fill]
  [Gliding Third Voice]
  [Orchestral Trading]
  [Unison Lock]
  [Silence]
  [Return Half-Step Up Unbroken]
  [End]
