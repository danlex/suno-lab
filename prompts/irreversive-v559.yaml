notes: |
  IRREVERSIVE is a structural concept in which the harmony of a piece moves forward through deepening tonal regions and never resolves back to any prior region. Nothing repeats. The past exists only as ringing sympathetic overtone in the hall's vast reverb — the sustain pedal holding the abandoned harmonies as a physically audible wake beneath the advancing present. Time's arrow is the form. This is the second entry of the technique in the catalog (v558 debuted it as fast and kinetic; v559 is the deep realization — slow, saturated, solemn).

  Concept source: IRREVERSIVE existentially realized — the arrow of time as harmonic form; loss and the unrepeatable moment; the past as sacred, slowly-decaying resonance; one indivisible arc from seed to transcendence, never resolving home.

  The echoes of late-Romantic adagio tradition and of composers who built entire architectures from a single sustained breath and the inevitability of harmonic gravity are present throughout — but no names are invoked per the blocklist discipline.

  Duration strategy: 104 total bars at 58 BPM. The playbook notes slow BPM (≤115) caps around 3:00-3:30 regardless of bar count — this is accepted deliberately. The goal is emotional density, not length. Playbook moves applied: parametrized colon-syntax lyrics with bar counts; production tokens (polished studio mix, deep low-end definition, lush acoustic ambience, wide stereo stage, Hollywood scoring stage weight); sentence case throughout; atmospheric-first opening (vast stone hall before technique). The reflective/transcendent concept is intentional — the auto-classifier ceiling of ~3:30 is appropriate for this arc's emotional weight. The arc's single building trajectory toward [Transcendence] functions as the implicit Build-Drop, with [Sacred Decay] as the extended dissolution.

  Instrument: solo grand piano, the only voice. Close-mic'd for individual-voice transparency; surrounded by cathedral reverb for orchestral spatial gravity. The sustain pedal's ringing harmonics constitute a second textural layer without adding a second instrument — the hall itself becomes part of the ensemble. Exclude_styles audited: no piano-family terms (piano, solo piano, sparse piano, keys, keyboard, acoustic, grand piano) appear in the exclude list — confirmed safe.

  Novelty claims: technique realized in its existential depth (v558 was the debut but as spectacle; v559 is the intended form), BPM 58 (new in this context), C-sharp minor as tonal center opening, scene ("a grand piano alone in an immense stone hall"), reflective-transcendent arc targeting awe and sacred grief. Style char count: 942.
