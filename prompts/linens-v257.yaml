name: "linens-v257"
version: 257
title: "Linens"
instrumental: true

style: "Bittersweet cinematic chamber piece — late-autumn light through a single window, a room undisturbed for fifteen years. Hollywood scoring stage with warm tape saturation and tight chamber reverb. Three voices: flugelhorn carries the surfacing memory in warm lyrical brass, contrabassoon holds the weight of years beneath, cristal baschet scatters spectral shimmer like dust motes in slanting light. C-sharp minor to D minor — a half-step rise that arrives as aching recognition, not release. 138 BPM, allegretto moderato, pulse measured and intimate. The architecture opens with the slow revealing, theme growing from one voice into layered voices. A true silence holds the moment of seeing. Then a rawer, exposed restatement: same theme transposed one step higher, played more slowly, fewer instruments, melody bare. Not louder. Not resolved. Just recognized. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Intro: solo flugelhorn states the theme softly over cold ambience, a single voice in an empty room, 12 bars]
  [Threshold: contrabassoon enters low beneath the flugelhorn, the weight of years accumulating, 16 bars]
  [Theme Surfaces: flugelhorn melody expands over contrabassoon foundation, cristal baschet enters as spectral shimmer in the slanting light, 24 bars]
  [Deepening: all three voices in dialogue, harmonic richness of C-sharp minor, theme turning in the light, 24 bars]
  [Build: texture tightens, flugelhorn pressing higher, contrabassoon darkening, cristal baschet brightening, 32 bars]
  [Counterpoint: flugelhorn and contrabassoon in intimate two-voice counterpoint, cristal baschet sustains underneath, 24 bars]
  [Second Build: all three voices accumulate, harmonic tension rising through C-sharp minor, the drawer half-open, 24 bars]
  [Silence: full ensemble stops, held breath, 8 bars of true silence, nothing underneath, 8 bars]
  [Drop: solo flugelhorn alone in D minor, same theme transposed one step higher, played more slowly, melody bare and exposed, rawer, 32 bars]
  [Drop Deepens: contrabassoon re-enters at low register, very soft, cristal baschet returns as faint shimmer, theme in D minor continues, 32 bars]
  [Coda: theme fragments to a single sustained flugelhorn phrase, then one long low contrabassoon note fading, cristal baschet dissolves to silence, 16 bars]
  [End]

exclude_styles: "Arabic, tribal, world music, acoustic guitar, rock, metal, lo-fi, vocals, singing, pipe organ, electronic, EDM, synthesizer, zen meditation, new age, experimental noise, free jazz, atonal, microtonal, quarter-tone, triumphant brass, fanfare, orchestra tutti, cinematic action, march, polka, klezmer, gypsy jazz"

