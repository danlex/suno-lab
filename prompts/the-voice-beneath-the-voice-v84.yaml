notes: "v84 — CONTRABASS CLARINET + TOP-LOADED PROMPT STRUCTURE. Fourth research-driven iteration. TWO research inputs this round: (1) Suno v5.5 prompt engineering analysis of 1,000+ prompts shows 'Top-Loaded Palette' structure wins — first ~150 chars should cleanly anchor [Mood]+[Energy]+[2 Instruments]+[Key/BPM] before any scene description. 'Write cleaner, not more. Pick a lane and commit.' (2) Contrabass clarinet is the lowest orchestral woodwind, Zimmer's signature sub-bass voice in Interstellar, Inception, Dark Knight Rises — specifically the 'duhhh duhhh' organ pulse is usually doubled with contrabass clarinet for extra visceral depth. Not used in any previous version. Applied technique: the first line 'CONTRABASS CLARINET orchestral crescendo, reverent and devastating, slow-building massive, C minor, 72 BPM, purely instrumental' establishes everything Suno needs before the scene description begins. Contrast with v83's spectral music (Grisey's abstract harmonic orchestration) — v84 returns to intuitive mood-driven scoring but with tighter top-loading. Sources: hookgenius.app analysis of 1,000+ Suno prompts 2026; Suno v5.5 guide; Zimmer orchestration Reddit/YouTube discussions on Interstellar low voicing. 976 chars."
