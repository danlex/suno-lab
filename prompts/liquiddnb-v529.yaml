style: "Rain on the windscreen at 174 BPM, sodium glow smearing the tarmac, the weight lifting off your chest as the motorway opens up — liquid drum and bass at full density, polished studio mix with deep low-end definition and wide stereo stage. G minor, 174 BPM. Featured trio: rolling sub-bass locking the low-end in that deep warm pulse that never settles; lush Rhodes chords washing the mid-range in wide reverb-soaked progressions that ache with late-night longing; amen-style rolling breakbeat driving 16th-note patterns with surgical precision and forward momentum that stays full and dense. Wide atmospheric pads and reverb-tail vocal chops fill the texture. Soulful male vocal with a genuinely sung hook, emotive and uplifting, cutting through on every drop. Warm tape saturation on the Rhodes, Decca-tree wide stereo on the pad wash, tight chamber reverb on the breaks. No guitars, no pipe organ, no acoustic instruments, no live band, no strings."

lyrics: |
  [Intro: sub-bass + Rhodes, 8 bars]
  (The road opens)

  [Verse 1: rolling breaks, 16 bars]
  Every junction passed is a name I won't keep
  Sodium lights on rain, I'm still moving
  The city gets small in the glass behind
  Hands loose, lungs finally free

  [Drop 1: full hook, 16 bars]
  The tarmac remembers my name
  The tarmac remembers my name
  (Remembers — remembers)
  The tarmac remembers my name

  [Verse 2: rolling breaks, 16 bars]
  Every red light skipped, a doubt left behind
  Rain hits the windscreen, I breathe it out
  No signal, no map, the rolling low
  What I was running from won't follow

  [Build: rising breaks, 8 bars]
  (Rolling — keep rolling)

  [Roller: beats + Rhodes, 24 bars]
  (Sub-bass pulse — Rhodes wash)

  [Drop 2: stacked hook, 24 bars]
  The tarmac remembers my name
  The tarmac remembers my name
  Miles till the weight lifts clean
  The tarmac remembers my name
  (Remembers — remembers)
  The road is the only thing I've ever been

  [Outro: sub-bass rolling, 8 bars]
  (The tarmac remembers my name)

  [End]

