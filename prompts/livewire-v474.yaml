style: "Late-night glamour and muscular groove — nu-disco boogie-funk with polished studio mix warmth, total duration around 3:00. Silky male falsetto over a four-on-the-floor kick at 120 BPM in D-sharp minor, single key throughout. Slap bass pops on every off-16th, clavinet chops the 16th-note grid, talkbox answers the vocal with a falling wah arc on beat three. Disco string stabs hit the off-beat; brass stabs punch the downbeat of the next bar. Wide stereo stage on the verse, intimate and coiled. A pre-chorus strip drops to slap bass and kick alone before the full chorus detonates with brass, strings, and falsetto. Mid-song a talkbox-and-brass vamp runs 32 bars — the duration lever. The final chorus adds stacked backing vocals and full brass density; that density lift is the climax, no key change. Warm tape saturation on the low end, tight chamber reverb on brass. No guitars, no EDM synth leads, no trap hi-hats, no pipe organ, no rap vocals."

