style: "ORCHESTRAL TOCCATA for a bell-tower-at-first-light scene, total duration around 3:00, with CELESTA + GLASS HARMONICA + SUBCONTRABASS SAXOPHONE against orchestral tutti, virtuosic runs alternating with chordal and fugal sections, F# minor to G minor, 121 BPM, instrumental. From 0:00 celesta opens alone with cascading arpeggios like bronze bells, light-footed runs climbing into cold air. At 0:25 glass harmonica joins above, friction-glass partials floating through the celesta figuration. At 1:00 subcontrabass saxophone enters far below, chordal pedal tones under the runs, orchestra swelling in fugal imitation. Peak at 2:00, the three voices locked with the tutti, runs dissolving into block chords. Silence at 2:10, five seconds still as dawn unbroken. At 2:15 the toccata returns in G minor fortississimo, half-step up, runs paired to massed strings. Ends at 2:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "Where the Bells Run Ahead"
lyrics: |
  [Short Instrumental Intro]
  [Celesta Cascading Arpeggios Alone]
  [Glass Harmonica Floats Above]
  [Subcontrabass Saxophone Deep Pedal]
  [Orchestra Enters in Fugal Imitation]
  [Runs Dissolve into Block Chords]
  [Peak at Two Minutes]
  [Silence]
  [Return in G Minor Fortississimo]
  [End]
