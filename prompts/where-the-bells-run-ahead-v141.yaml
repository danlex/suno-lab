notes: "v141 — ORCHESTRAL TOCCATA. Baroque virtuosic form: rapid runs and arpeggios alternating with chordal/fugal sections, improvisational feel over loose sectional structure. Distinct from v141-prior fugue/canon work — toccata is the juxtaposition of improvisatory and fugal passages, not pure imitation. Research source: Britannica + Wikipedia toccata entries, 2026-04-13 WebSearch. Composer names associated with the form omitted per blocklist. DURATION: ~3-min arc with 121 BPM walking pulse (fast enough to carry cascading runs), matches v137+ 3-min override. INSTRUMENTS: Celesta (×5, last v118 — 23-gap) = bell-like keyboard for rapid toccata arpeggios, the idiomatic voice. Glass harmonica (×5, last v112 — 29-gap) = friction-glass partials that float unmoored in the 1-4kHz band, pairs with celesta as a second bell-color. Subcontrabass saxophone (×2, last v118 — 23-gap) = deep pedal fundament to anchor the upper running voices. Three families: keyboard, metallic idiophone / friction, low woodwind. All three deep revivals (gap >=23). NOVELTY: First orchestral toccata. 121 BPM = never used. F# minor uncommon. Scene bell-tower-at-first-light = new dawn-architectural image. Cascading-virtuosity emotion. 941 chars."
