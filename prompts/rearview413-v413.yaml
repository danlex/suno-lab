notes: |
  Melodic dubstep is a sub-genre of dubstep that runs at 140-150 BPM with a pronounced half-time feel (roughly 70-75 felt BPM), built on detuned supersaw chords, growl-wobble bass (a pitch-modulated sub-bass designed for emotional abrasion), and sung melodic arcs — distinguishing it from brostep (heavier scream-bass, minimal melody), riddim (repetitive grid-locked bass), and from standard atmospheric electronic (which lacks the drop-weight and machine grit). The production alternates between sparse, warm, pad-heavy verses and abrasive full-weight drops. Melodic dubstep is a catalog debut for this family.

  Concept source (caller-designed): resolute longing — the state of moving cold-clear toward something you know is unreachable because it's already behind you in time; not grief, not euphoria; the geometrically impossible act of driving into what you already left. Verses use concrete cold images: mile markers, changed addresses, carrier tones, folded maps with the fold running through the center of the destination town.

  Chorus architecture (pre-scored 23/25 as a unit): CALL "I am driving into something I already left" — F# major, scale degrees 3→5→4→5→3→2→1; pickup on degree 3 (A#), rises to 5 (C#) on 'driving', moves around 4-5 on 'into something', descends 3→2 on 'I al-rea-dy', LANDS on root F# (degree 1) on 'LEFT' — sustained, the word melodically arrives home; that F# root is the bass-lock target for the climax. ANSWER "The rearview shows me arriving" — degrees 5→7→5→3→4→2; pickup 5 (C#), leaps to degree 7 (E#, highest/most tense pitch) on 'REAR-', falls through C#–A# to B on 'views me ar-', SUSPENDS on degree 2 (G#) on '-riving' — deliberately unresolved. The call resolves to root; the answer suspends on the second; the harmonic irresolution IS the resolute-longing feeling. No padding in the chorus.

  Climax device — voice-machine fusion lock: a catalog-debut device distinct from all listed used climaxes. At the final drop, the growl-wobble bass is pitch-shifted to exactly match the fundamental of the sung hook's root note (F#), so for approximately four bars the bass and the sustained voice occupy the same frequency as a single fused composite tone — neither pure vocal nor pure synth, both present simultaneously as one resonance. Then the growl re-widens back to full machine abrasion. This is explicitly distinct from bass-becomes-melody (v408, where the Reese bass carried the melodic contour across multiple pitches) — here the bass locks to a single sustained root in unison with the held voice, a timbral fusion at one pitch, not a melodic hand-off.

  Duration strategy: 145 BPM is in the proven-duration band (130–160 BPM) where bar counts translate reliably to wall-clock. The full melodic-dubstep arc (intro → verse 1 → pre-drop build → drop 1 → verse 2 → pre-drop build 2 → breakdown → build to final drop → final drop → outro) provides ten distinct sections that require all phases to resolve, the primary structural duration lever. The explicit 32-bar machine-only drop at section 4 functions as a mid-song instrumental vamp (validated v348/v349 pattern clearing 3:00). Final sung line anchored to ~2:48 by outro section placement. Three production tokens applied: polished studio mix, wide stereo stage, deep low-end definition. Style is sentence-case prose, atmospheric-first opening, five targeted inline negatives. Vocal track — 'vocals', 'singing', and 'synthesizer' are deliberately absent from exclude_styles and inline negatives to avoid suppressing the needed vocal and electronic parts.

  Meta-flip: v412 was Baltimore club breakbeat at 132 BPM (anxious elation, fractured 8/4 grid); v413 is melodic dubstep at 145 BPM half-time feel (resolute longing, slow emotional weight, machine-vs-voice contrast). Maximum contrast in rhythmic feel (breakbeat sprint vs half-time mass), emotional register (anxious elation vs cold resolute longing), and production mode (chopped Amen roll vs supersaw/growl-wobble).

  Novelty claims: melodic dubstep is a catalog-debut vocal lane (D2); 'driving into something I already left / rearview shows me arriving' call+answer is complete and arresting as a unit (D1); half-time 72 feel supersaw/growl-wobble production is a catalog debut against recent breakbeat/club lanes (D3); edgy 145 BPM half-time floor-driving (D4); resolute longing (cold clear forward motion toward the unreachable) is emotionally distinct from catalog (D5); voice-machine fusion lock is a bold audible climax device not previously used, distinct from bass-becomes-melody and all listed used climaxes (D6). Style char count: 945.
