name: "rearview413"
version: 413
style: "Resolute longing in half-time — melodic dubstep at 145 BPM in F# major, cold forward motion toward what's already behind you. Sparse sung verse over detuned pads, female voice plainspoken and precise. A supersaw swell builds pressure into the pre-drop, then detuned supersaws and a growl-wobble bass crash the drop — machine grit against vocal warmth, the contrast is the emotional engine. The exposed vocal breakdown strips to pads only, delivering the full call-and-answer hook with real melodic contour. At the final drop the growl bass pitch-locks in unison to the voice's sustained F# root — voice and bass fused as one layered resonance, neither pure vocal nor pure synth — then the growl re-widens to full machine abrasion. Underscore for resolute longing — edgy, floor-driving at half-time 72 feel, not warm, not ambient. No guitars, no rock drums, no pipe organ, no acoustic strings, no live band kit."
title: "Rearview413"
lyrics: |
  [Intro: 0:00, pads]

  [Verse 1: 0:18]
  Mile marker thirty-one, still counting backward
  The address changed while I was on the road
  My hands are cold, the heater stopped at noon
  I keep the speed, I do not touch the radio

  [Pre-Drop Build]
  The needle does not waver
  I do not look away

  [Drop 1]

  [Verse 2]
  The last known number stored under your name
  Rings out to a carrier tone, no routing
  I wrote the coordinates on a folded map
  The fold runs through the center of the town

  [Pre-Drop Build 2]
  The needle does not waver
  I do not look away

  [Breakdown: 1:44, exposed vocal]
  I am driving into something I already left
  The rearview shows me arriving

  [Build to Final Drop]
  I am driving into something I already left
  The rearview shows me arriving

  [Final Drop: growl bass locks to voice F# root, four bars fused]
  I am driving into something I already left
  The rearview shows me arriving
  I am driving into something I already left
  (arriving, arriving)

  [Outro: 2:48]
  The rearview shows me arriving

  [End]
