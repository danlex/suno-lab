name: "worth-it"
version: 59
style: "Cinematic orchestral in G minor at 90 BPM, purely instrumental. The feeling of standing in the ruins of something you built with your whole life and realizing it was worth it. A solo piano plays four notes — just four — over and over, simple as breathing, while strings slowly gather around it like memories returning. Each repetition adds one more layer — a cello, a horn in the distance, more strings. Nothing dramatic, nothing forced — just an accumulation of beauty so gradual you do not notice you are crying until your face is wet. The piano never stops those four notes. The orchestra grows until it surrounds you completely. Then at the very end, everything drops away except the piano again — those same four notes — but now they carry the weight of everything that came before. Emotional cinematic orchestral, modern film score, intimate and monumental, audiophile production. No electronic sounds, no synthesizers, no guitars, no vocals. G minor, 90 BPM."
title: "Worth It"
lyrics: ""
instrumental: true
