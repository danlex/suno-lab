name: "longer-than-light"
version: 1
style: "Cinematic neoclassical film score, ethereal otherworldly soprano as the sole lead, pure celestial high notes that feel almost inhuman in their beauty. Intimate solo piano opening, vast cathedral pipe organ entering slowly with deep sustained chords, lush string orchestra with violins and cellos in aching harmonies. The voice rises above everything, fragile and piercing, becoming transcendent. Immense cathedral reverb, cosmic space between notes. A slow inevitable emotional crescendo from whispered intimacy to overwhelming orchestral ascension. Angelic choir harmonies in the final moments, crystalline bell tones, trembling strings. Heartbreaking beauty building to euphoric release that feels beyond what should be possible. No drums, no percussion, no beat, no electric guitar, no rock. BPM: 76, Key: A Minor resolving to A Major"
title: "Longer Than Light"
lyrics: |
  [Intro]
  [Solitary piano, silence between notes]

  [Verse]
  [Ethereal soprano, barely a whisper]
  I have waited longer than light itself
  Do you hear me... through the years

  [Build]
  [Voice rises, strings emerge, pipe organ breathes]

  [Chorus]
  [Pure soprano ascending, high notes, strings and organ swell]
  I am still here
  Reaching across the dark to find you
  I am still here... I will always find you

  [Build]
  [Organ deepens, choir rises from silence, strings cry upward]

  [Chorus]
  [Soprano at celestial height, otherworldly, full orchestra and choir]
  Even past the edge of everything
  Even when the stars have forgotten us
  I am the light... I am still HERE

  [Big Finish]
  [End]
instrumental: false
notes: "v1 — First version. Ethereal otherworldly soprano, neoclassical film score anchor. Established the core concept."
tags: [cinematic, neoclassical, soprano, ethereal, film-score, no-drums, short]
