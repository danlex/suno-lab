notes: |
  Eurodance and hi-NRG are late-1980s-to-mid-1990s European electronic dance genres defined by fast four-on-the-floor kick (typically 128–150 BPM), supersaw synthesizer chords (Roland JP-8000-era stacked detuned sawtooth oscillators), octave-walking basslines, rave piano or organ stabs, and anthemic female-belt vocals with simple but hook-saturated lyrics. The form peaked commercially 1992–1997 and is now a high-traction nostalgia signal on social/streaming platforms. The concept source here is the "first night out after a long hard stretch" — a reclaimed-joy narrative set to the most physically commanding floor music of the era.

  The hook "Brûle avec moi" (French: burn with me) is built around a three-note syncopated triplet on the syllables 'brû-le a-vec' landing against the four-on-the-floor kick, with a rising whole-step on 'moi' held as a sustained open-vowel belt over the supersaw wall. Verses are English — gritty, personal, contrasting the euphoric French hook. Both French and English are within the allowed language set.

  Duration strategy: parametrized colon-lyrics with bar counts sum to approximately 128 bars at 140 BPM, targeting 3:15–3:45 wall-clock (140 BPM is squarely in the proven 130–160 duration band). The mandatory mid-song instrumental break (24 bars, full supersaw + rave piano, explicitly beat-driven) applies the v527 lesson — dense not ambient, energy maintained throughout. The final belted chorus is placed late. Production tokens used: polished studio mix, wide stereo stage, deep low-end definition.

  Trio: pounding four-on-the-floor kick (rhythmic spine), bright supersaw chord stabs (harmonic energy and spectral width), driving octave bassline (low-end lock). Rave piano and white-noise risers are supporting colors, not trio members. No negative-prompt contradictions: exclude_styles does not block electronic, synthesizer, piano, bass, or vocals. Key A minor, 140 BPM both visible in style. Sentence case throughout. Style char count: 932.
