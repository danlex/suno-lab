title: "Raking Salt Before the Tide Returns"
instrumental: true

style: "Monumental cinematic orchestral SCHERZO-TRIO-SCHERZO, salt-pan at low tide, total duration around 3:00, 157 BPM, F minor to F-sharp minor, full orchestra: DOUBLE BASS + SUBCONTRABASS SAXOPHONE + HANDPAN. Scherzo A opens at 0:00 — full strings surge from bar one in propulsive 3/4, brass punching off-beat accents, woodwinds doubling; double bass drives the bottom with arco and pizzicato alternation, slightly menacing in F minor. At 1:05 the Trio B arrives as sudden textural retreat — strings drop out entirely; subcontrabass saxophone carries a lyrical breath line, handpan floats above with metallic shimmer, sparse pizzicato double bass marks cadence points. At 1:55 the scherzo returns tutti forte — timpani joins, low brass adds gravity, the motif compressed and urgent in F-sharp minor. Final cadence at 2:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Short Instrumental Intro]
  Full strings and brass launch the scherzo at once — propulsive 3/4 drive, double bass hammering arco on the bottom, brass accents punching across the bar line, the rhythmic engine of labor in F minor.

  [Scherzo A: Workers Raking the Pan]
  Woodwinds double the melodic line as the strings push forward; the brine pumps thud on the downbeat, workers raking in cadenced strokes across the glittering salt crust, double bass alternating arco and pizzicato.

  [Full Scherzo Peak, 0:50]
  The whole orchestra locked in — brass, strings, woodwinds, percussion; the harvest at full pace, the salt-crust catching coastal light with every rake stroke.

  [Trio B: The Wind Crosses the Pan, 1:05]
  Strings drop away entirely. Subcontrabass saxophone carries a slow lyrical line in the sudden quiet — warm, low, breathing. Handpan floats above with metallic shimmer. Sparse pizzicato double bass marks the cadence points like footsteps.

  [A Gull Cries Once, 1:30]
  One worker rests and drinks. The wind moves across the open evaporation pond. A single gull overhead. The trio holds the stillness — saxophone breath, handpan shimmer, bass pulse.

  [Scherzo Return: Tutti Forte, 1:55]
  Full orchestra re-enters with sudden force — the scherzo motif compressed and more urgent than before. Timpani joins for the first time, low brass adds gravity. The key lifts to F-sharp minor: one step higher, the urgency renewed.

  [The Tide Will Turn, 2:20]
  Every voice in full force — strings, brass, woodwinds, timpani, double bass driving the bottom harder. The crop must be gathered before the sea returns. The rhythmic engine accelerates toward the final cadence.

  [Final Cadence, 2:50]
  All voices converge on the last downbeat — the harvest done, the salt packed, the tide beginning its return across the flat white pan.

  [End]

