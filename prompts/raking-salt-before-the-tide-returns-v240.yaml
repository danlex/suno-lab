notes: |
  SCHERZO-TRIO-SCHERZO is the classical ternary ABA instrumental form in which a vigorous, propulsive Scherzo (Part A) is followed by a contrasting, quieter Trio (Part B), after which the Scherzo returns — usually literally, sometimes with variations. The form emerged in the late 18th century as a replacement for the minuet-trio-minuet pattern in symphonies and chamber music, and its defining quality is the abruptness of the Trio contrast: the sudden textural and dynamic retreat is structural, not accidental. The return of the Scherzo therefore arrives with renewed force precisely because of the contrast that preceded it.

  Composer-omission note: no composer or performer names appear in this prompt per standing blocklist policy. The form is described by structural function only.

  Duration defense: v239 truncated to 2:16/2:26 because the featured trio (ondes martenot + contrabass clarinet + bowed vibraphone) was unusual and spectrally sparse; Suno ended the generation early when the texture thinned. V240 addresses this through three mechanisms: (1) DOUBLE BASS as the body voice — an acoustic low-frequency anchor present in all three sections, providing the grounded resonance that gives Suno a continuous physical signal to sustain; (2) the SCHERZO sections are explicitly dense full-orchestra writing — strings, brass, woodwinds, and percussion all active from bar one; (3) the TRIO B is framed explicitly as a middle contrast, not a resolution — the return is telegraphed clearly in the style, giving Suno structural reason to continue past 2:00.

  Trio roles and novelty gaps:
  - DOUBLE BASS (bowed_strings, last v178, gap 62 — deepest revival in catalog): the body voice; drives the scherzo bass line with arco/pizzicato alternation in the outer sections; retreats to sparse pizzicato cadence-marking in the Trio; returns driving hard with timpani in the final scherzo. Physical anchor throughout all three sections.
  - SUBCONTRABASS SAXOPHONE (woodwinds, last v228, gap 12): sub-bass breath column; doubles low strings in the scherzo; carries the Trio's lyrical line as its primary voice — warm, low, breathing; adds chordal voicings in the return.
  - HANDPAN (metallic_idiophones, last v225, gap 15): metallic shimmer; punctuates the scherzo rhythmically; featured as the floating voice above the saxophone in the Trio B; provides bell-tone color in the scherzo return.

  Key arc: F minor (Scherzo A and Trio B) → F-sharp minor (Scherzo return at 1:55) — a half-step lift on the return that gives the already-compressed motif renewed urgency, the harmonic equivalent of the tide beginning to turn.
  BPM: 157 — not used in the recent sequential run (153/154/155/156 in v235–239). Fast propulsive scherzo tempo appropriate to the labor scene.
  Scene: a salt-pan at low tide — vast rectangular evaporation ponds on the coast just after the tide has receded; brine being raked by workers, the dried-salt crust glittering in coastal light, gulls overhead, the slow pumping of fresh seawater. Scherzo = the propulsive rhythmic labor of raking and harvesting. Trio = a moment of stillness — wind crosses the pan, a worker drinks, a gull cries. Scherzo return = work resumes with urgency, the tide will turn. Scene is new (no prior salt-pan prompt in catalog).

