style: "Cinematic orchestral score in D minor at 85 BPM, purely instrumental, building from sparse to massive. Opens with a solo cello playing a haunting 8-bar theme — slow, mournful, the sound of something ancient waking up. At 0:30, low brass and timpani enter with a deep resonant pulse. Strings begin layering at 0:45, building in waves, each wave bigger than the last. Full orchestra climax at 1:30 — soaring strings, heroic French horns, thundering timpani, the kind of sound that makes your chest physically ache. Brief silence at 2:00, then the cello theme returns transformed in D major carried by the entire orchestra — grief becoming triumph, darkness becoming light. Resolves with a sustained brass chord that fades into cathedral reverb. World-class symphony orchestra, film score production, audiophile recording. No electronic sounds, no synthesizers, no rock, no pop, no vocals, no choir."
