style: "Symphonic metal operatic ballad — cathedral apse at pre-dawn winter, eastern window catching first red light, a male falsetto rising as the bell-tower strikes. Polished studio mix, Hollywood scoring stage, warm tape saturation. C# minor lifting to D major at 2:00, 72 BPM. Countertenor in pure falsetto opens alone — flute-like clarity over a single pipe organ pedal tone, stone-cathedral-dawn gravity beneath. Cello pizzicato enters at 0:40 as heartbeat pulse; strings rise from 1:10. Full metal tutti erupts at 1:30 — rhythm section and choir — countertenor floats above, most delicate voice over most powerful texture. At 2:00 the mass drops to one organ pedal; C# minor lifts to D major — dark becoming light. Choir enters from below at 2:15; countertenor rides above. Organ returns full at 3:00. Deep low-end definition. Film score for a cathedral awakening scene. No synthesizers, no autotune, no rock drums, no pop production."

lyrics: |
  [Countertenor alone — organ pedal, 12 bars]
  Primo luce, ortus novus
  In tenebris — stella matutina
  Aurora surgere — lux in petra
  Matutina — ortus

  [Cello pizzicato heartbeat enters, 14 bars]
  In luce novus dies
  Matutina surgit hora
  Stella matutina — in petra
  Primo luce, primo luce

  [Strings rise — organ swells, 16 bars]
  Aurora — novus dies ortus
  In luce — in luce
  Stella matutina surgit
  Primo luce — ortus

  [Full metal tutti — countertenor on top, 24 bars]
  Primo luce! Ortus novus!
  Stella matutina — surge!
  In luce — in luce ascende
  Aurora! Novus dies!
  In luce aeterna — ortus

  [Organ pedal — C# minor to D major, 12 bars]
  Primo luce...
  Ortus — lux
  In luce — matutina

  [Male choir from below — countertenor above, 20 bars]
  In luce novus dies
  Stella matutina — ortus
  Aurora surgit — surge in lucem
  Primo luce — aeterna
  In luce — in luce

  [Pipe organ returns full — final cadence, 16 bars]
  Primo luce — ortus
  In luce aeterna surgere
  Stella matutina — novus dies
  Primo luce

  [End]

