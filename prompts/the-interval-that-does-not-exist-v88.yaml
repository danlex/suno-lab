notes: "v88 — MICROTONAL BEATING. New axis of experimentation: not unusual instruments (v85-v86), not unusual techniques (v87), but unusual TUNING. RESEARCH: Wikipedia microtonality, Columbia University Georg Friedrich Haas profile, Mica Levi Under the Skin analysis, Classical Music Forum on microtonality. LEARNED: (1) Georg Friedrich Haas uses microtones to create 'interference effects' — two nearly-identical pitches produce physical beating/pulsing. (2) Haas's 'in vain' (2000) uses two orchestras tuned a quarter-tone apart. He manipulates 'the flow of musical time, sometimes establishing moments of perfect stillness through pure acoustical tunings, sometimes exploring the inner turbulence of a single sustained sound.' (3) Mica Levi's Under the Skin uses quarter-tones to 'destabilize harmony' with minimal elements. IMPROVED: Two string sections playing identical material but detuned a quarter-tone apart create INTERFERENCE BEATING — a physical sensation (chest pulsing, wavering) that cannot be produced by any single instrument or standard tuning. The combination is the TUNING ITSELF, not the instruments. Title names the paradox: the quarter-tone between D and D-sharp has no key on any piano. Pipe organ sustains a pure anchor while the detuned strings shimmer. Contrast: v87 explored quiet extended techniques. v88 explores the SPACE BETWEEN standard pitches. Sources: Wikipedia, Columbia University Haas profile, Classicalite Mica Levi/Haas/Xenakis concert, Buffalo Tones Under the Skin analysis. 992 chars."
tags: [microtonal, quarter-tone, beating, interference, haas, mica-levi, orchestral, d-half-sharp, 52bpm, detuned, two-string-sections, research-driven, pure-orchestral]
