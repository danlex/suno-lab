name: "the-interval-that-does-not-exist"
version: 88
style: "MICROTONAL orchestral, two string sections tuned a quarter-tone apart, D half-sharp, 52 BPM, purely instrumental. Georg Friedrich Haas technique — two groups of strings play identical melodies but one group is tuned halfway between D and D-sharp, creating BEATING: a pulsing interference pattern where two almost-identical frequencies collide and produce a physical wavering the listener feels in their chest. Opens with a single cello on D. A second cello enters on the quarter-tone above — the two frequencies pulse and shimmer against each other. More strings join each group. Violas a quarter-tone apart. Violins a quarter-tone apart. Contrabasses from the depths. The orchestra is doubled and detuned, a massive shimmering cloud of interference. Pipe organ sustains a pure D beneath as anchor. At the climax fifty strings all a quarter-tone apart — the sound of the interval that does not exist on any piano. Modern cinematic audiophile production. No vocals, no electronics, no guitars."
title: "The Interval That Does Not Exist"
lyrics: ""
instrumental: true
