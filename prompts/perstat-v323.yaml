style: "Sacred minimalist orchestral sustained lament — a candle in a stone room at 4am, cold window unbroken, a woman keeping watch. Polished studio mix, tight chamber reverb, warm tape saturation. D minor Dorian, no modulation, 54 BPM. A four-note descending bass — D C B-flat A — repeats as slow grief ostinato without development. Lyric soprano enters at 0:28 on the contour as long held tones, never pushed high, never ornamented. Viola-led string orchestra breathes beneath at pianissimo, violas prominent over violins, texture constant. At 1:50 a shadow alto folds in a third below, not harmonizing, simply witnessing. The dynamic never rises. No climax, no modulation, no eruption — weight through duration not volume. At 2:50 the soprano stops; the alto continues briefly; only the ostinato remains until the final tone decays. Film score for a nocturnal vigil scene. No guitars, no rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Viola ostinato alone — D C Bb A, 16 bars]
  Perstat
  Manet

  [Soprano long-tone enters — string pad, 24 bars]
  Manet candela
  In silentio cantat
  Anima sola
  Vigilat

  [Sustained — no development, 24 bars]
  Per noctem
  Sustinet — manet
  Vigilia longa
  Perstat — perstat

  [Shadow alto enters — third below, 20 bars]
  Lux in tenebris non frangitur
  Manet candela
  Anima sola — vigilat
  Perstat

  [Both voices witness — ostinato constant, 24 bars]
  Sustinet — sustinet
  Per noctem — vigilia longa
  In silentio cantat
  Manet — manet
  Lux in tenebris non frangitur

  [Soprano stops — alto alone, 16 bars]
  Perstat
  Anima sola
  Vigilat — manet

  [Alto stops — ostinato final descent, 16 bars]
  Perstat

  [Final note held until decay, 8 bars]

  [End]

