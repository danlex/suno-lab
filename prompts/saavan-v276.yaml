  trope). Concept: classic Bollywood monsoon ballad — two years after
  the loss, rain falls on Mumbai street, fragrance lingers, WhatsApp
  last-seen check, only the monsoon remains as companion. Saavan +
  baarish + tanha + yaad are the four pillars of the Bollywood ballad
  emotional core.

