style: "Modern Bollywood ballad, Hindi pop, monsoon-romance, 90 BPM, D major, Mumbai monsoon balcony. Female Hindi playback-singer vocal — melismatic Hindustani ornaments (gamak, meend, murki), warm classically-trained chest-voice, light vibrato, intimate close-mic Hindi with English code-switch in bridge, NOT Indonesian dangdut sob, NOT Mandopop head-voice, NOT Punjabi male — distinctly Hindi playback-singer ballad with Hindustani classical foundation. Production: nylon-string acoustic guitar fingerpicking, soft tabla pulse (NOT solo), harmonium pad sustained, sparse trap drums on chorus, 808 sub on the drop, light tanpura drone, wide vocal reverb with monsoon-rain ambience. 2026 modern Bollywood pop tradition, NOT traditional orchestral playback, NOT classical raga, NOT bhajan, NOT qawwali, NOT Tamil cinema. Mumbai monsoon balcony. No tabla solo, no sitar lead, no qawwali, no orchestral, no broadway."

lyrics: |
  [Intro]
  (acoustic guitar arpeggio, tabla soft)
  oh, oh-oh

  [Verse 1] (intimate chest-voice melismatic)
  baarish gir rahi hai, raat khamosh hai
  tumhari khushboo abhi bhi yahaan hai
  do saal ho gaye, par dil samjha nahi
  tum chale gaye, main yahaan ruki hu

  [Pre-Hook]
  oh-oh, saavan saavan
  ah-ah, yaad aata hai

  [Hook] (melismatic Hindustani ornaments)
  saavan mein tum kahaan ho
  saavan mein main tanha hu
  baarish ki har boond mein
  tumhari yaad bhigi hai

  [Verse 2]
  Mumbai ki sadak pe paani ka shor
  chai ka pyala, akela samay
  WhatsApp pe last seen, mera naam nahi
  monsoon hi mera saathi reh gaya

  [Hook]
  saavan mein tum kahaan ho
  baarish ki har boond mein tumhari yaad

  [Bridge]
  (only harmonium + tabla, no drums)
  [English line] some loves are written in the rain
  saavan, saavan

  [Final Hook] (full melisma + ornaments)
  saavan (saavan), tum kahaan ho
  baarish (baarish), yaad bhigi hai

  [Outro]
  (rain ambience + guitar fade) saavan
  [End]

