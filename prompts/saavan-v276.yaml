  but v273 is Indonesian dangdut (pelog scale, kendang drum, cengkok
  ornaments + Auto-Tune sob), while v276 is Hindi playback-singer
  (Hindustani raga system, tabla + harmonium, gamak/meend/murki ornaments
  + clean no-Auto-Tune classical placement). Different melodic system
  (pelog vs raga), different ornament library, different instrumental
  bed, different vocal production (Auto-Tune sob vs classical clean).
  Suno's classifier should differentiate via the production palette
  signature alone. Style + exclude_styles block all 16 prior voice
  characters.

  LANGUAGE — 12th distinct language. Hindi in Latin transliteration
  (standard Bollywood social-media format). Lyric vocabulary uses
  authentic Hindi ballad: "saavan" (monsoon/rainy season — iconic
  Bollywood image), "baarish" (rain), "khushboo" (fragrance), "tanha"
  (alone), "yaad" (memory), "Mumbai ki sadak" (Mumbai street), "chai ka
  pyala" (cup of tea), "WhatsApp pe last seen" (modern Bollywood detail
