style: |
  Cold dark-techno drive, menacing and hypnotic, 3:15 target. Polished studio mix, deep low-end, wide stereo stage. G-sharp minor lifting a half-step to A minor at the final section, 134 BPM. A four-on-the-floor kick grid anchors the pulse; a distorted bass sequencer churns cold beneath; abrasive synth stabs flare across the mid-range. A waterphone casts an eerie spatial halo, resonant steel overtone shimmer above. A contrabass clarinet growls in the sub-bass, reinforcing the sequencer. A cornet drives clipped brass stabs at the top end. Cold filtered female phrases, deadpan and hypnotic. At 1:15 vocal drops: bare kick, bass sequencer, waterphone pressure only for nearly a minute. Layers rebuild, brass returns, half-step lift near 2:20. Last vocal near 2:55, driving close near 3:10. Cold concrete underfoot, blue strobe pulse — underscore for a cold dancefloor surveillance scene. No guitars, no warm strings, no pipe organ, no synthesizers.

lyrics: |
  [Intro: four-on-the-floor kick, bass sequencer pulse, 0:00]

  [Verse 1: cold vocal phrases over kick and synth stabs, 0:14]
  Current running through the walls
  Signal rising down the hall
  Every wire buried deep
  Nothing that you get to keep

  [Verse 2: waterphone halo enters, contrabass clarinet low, 0:38]
  Black on black the circuit hums
  Cold inside the frequency comes
  One by one the lights go out
  Turn the voltage inside out

  [Chorus: cornet stabs, full layers, 1:02]
  Voltage
  Running through the dark
  Voltage
  Starting at the heart
  Voltage

  [Drop: bare kick + bass sequencer + waterphone, 1:15]

  [Build: contrabass clarinet low pulse, synth stabs layer back, 1:55]

  [Chorus return: full layers, half-step lift to A minor, 2:20]
  Voltage
  Now we cross the line
  Voltage
  Cold and sharp and mine
  Voltage

  [Outro: cornet stabs fade, driving sequencer close, 2:55]

  [End]

