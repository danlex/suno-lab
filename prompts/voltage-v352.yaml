notes: |
  Technique: EBM-industrial four-on-the-floor electronic bed with acoustic texture trio
  — a cold dark-techno club track using a distorted bass sequencer and abrasive synth
  stabs as the engine, with three distinctive acoustic textures layered above: waterphone
  spatial halo, contrabass clarinet sub-bass breath, and cornet industrial brass stabs.
  The midtrack vocal drop at 1:15 (bare kick + sequencer + waterphone only for ~40 sec)
  is the primary duration lever, confirmed working across v348–v351. The half-step lift
  from G-sharp minor to A minor lands at the final chorus (~2:20), functioning as the
  payoff resolution trigger. No [Silence] metatag used — per feedback_silence_gate_truncates,
  explicit [Silence] markup causes Suno to truncate; instead the [Drop] section removes
  vocal and most layers while keeping the kick running.

  Concept source: dark clubbing / EBM-industrial techno with three fresh acoustic textures
  (waterphone as eerie spatial halo, contrabass clarinet as organic sub-bass reinforcement,
  cornet as clipped industrial brass stab hook) over a cold electronic bed. The register is
  menacing, physical, hypnotic — not longing or aching. Cold deadpan female vocal phrases.

  Composer-omission: This cycle echoes the cold-menacing industrial club sensibility of
  certain late-1980s through early-2000s European electronic-industrial acts whose names
  are omitted per house policy — the four-on-the-floor kick over a sequencer bass with
  cold processed vocals and brass stab hooks is a hallmark of that lane. The waterphone
  and contrabass clarinet wholly reframe that palette with acoustic textures those acts
  never employed, making this compositionally distinct.

  Duration strategy: BPM 134 sits in the proven 130–160 duration band where bar counts
  work. Forward-motion concept (cold current running through a grid, ascending voltage,
  half-step lift as kinetic payoff) targets 3:00–3:30 per the concept-type playbook rule.
  Production tokens: polished studio mix, deep low-end definition, wide stereo stage.
  Sentence case throughout. Atmospheric-first opening names genre, mood, key, BPM, and
  duration target in the first ~100 chars. Five inline negatives close the style field.
  Last vocal timestamp pushed to 2:55 to anchor render near 3:10–3:15. Exclude_styles
  blocks the main drift vectors: breakcore, happy hardcore, Belgian new beat, retro-EBM
  pastiche, cinematic ambient, synthwave/vaporwave/retrowave.

  Trio instrument roles (verified against novelty_surface.json at v351):
  - Waterphone (last used v251, gap = 101 — over 100 versions fresh): the eerie spatial
    halo voice; its resonant steel tine overtones bleed into the upper register as a
    continuous pressure texture during the vocal drop, and as atmospheric shimmer beneath
    the vocal sections. The single "spectral" instrument in the trio — per the playbook,
    limited to ≤1 spectral per trio.
  - Contrabass clarinet (last used v311, gap = 41): growling sub-bass breath texture;
    reinforces the distorted bass sequencer with organic weight and low-register warmth
    that keeps the bottom end from sounding purely electronic. Body voice.
  - Cornet (last used v333, gap = 19): clipped, sharp brass stabs cutting through the
    top end; the industrial "hook" voice that punctuates the choruses; returns after
    the drop rebuild as the signal that layers are back. Body voice.

  Trio body-voice count: 2 body (contrabass clarinet, cornet) + 1 spectral (waterphone).
  Satisfies the ≥2 body voices rule.

  Novelty claims: Waterphone at gap 101 is the primary freshness driver — over 100 versions
  since last use, and never before used in a dark-techno / EBM-industrial context (all
  prior uses were orchestral/ambient). Contrabass clarinet at gap 41 remains fresh. Cornet
  at gap 19 is reasonably fresh. The dark-techno / EBM-industrial genre is a new genre
  anchor in recent cycles (v324+ has been Latin sad-trap, anime ballad, Afro-soul, K-pop,
  indie dream-pop). The trio combination — waterphone + contrabass clarinet + cornet over
  an electronic bed — is an entirely novel pairing not found in any prior catalog entry.
  BPM 134 is new to this catalog (no prior 134 BPM entry confirmed in novelty_surface.json).

