name: "the-melody-that-changes-color"
version: 135
style: "ORCHESTRAL KLANGFARBENMELODIE film score for a lighthouse-beam-sweeping scene, total duration 1:00 to 2:00, with THEREMIN + TUBULAR BELLS + FLUGELHORN, tone-color melody where each note comes from a different instrument, the melody made of timbres not pitches, A major to B-flat major, 126 BPM, instrumental. From 0:00 theremin sings note one, gliding pitch. At 0:06 tubular bells strike note two, sharp metallic. At 0:12 flugelhorn plays note three, warm muted brass. Three voices alternate, each note a different color. At 0:40 orchestra enters, strings, woodwinds, brass passing the tune one note at a time. Peak 1:15 all three featured voices lock into one chord of mixed timbres. Silence at 1:22 — three seconds. At 1:25 music returns in B-flat major half-step up, fortississimo, the orchestra in one brilliant color. Ends at 1:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "The Melody That Changes Color"
lyrics: |
  [Short Instrumental Intro]
  [Theremin Note One]
  [Tubular Bell Note Two]
  [Flugelhorn Note Three]
  [Orchestral Color-Trade]
  [Mixed-Timbre Chord]
  [Silence]
  [Return in One Color]
  [End]
instrumental: true
exclude_styles: "Arabic, tribal, world music, acoustic guitar, rock, metal, gentle, lo-fi, vocals, singing, pipe organ, electronic, EDM, synthesizer, zen meditation, new age, experimental noise, free jazz, atonal, microtonal, quarter-tone, sci-fi"
notes: "v135 — ORCHESTRAL KLANGFARBENMELODIE. German = 'tone-color melody'. Instead of a melody being a sequence of pitches played by one instrument, each note comes from a different instrument — the melody becomes a progression of timbres. Originated with Schoenberg's 1911 Harmonielehre, most famous in Webern's Op. 10. Composer names omitted per blocklist. DISTINCT from: theme-and-variations (v119, same melody different colors block by block); this technique changes timbre note-by-note. INSTRUMENTS chosen for maximum timbral contrast: Theremin (×2, last v119 — 16-gap) = continuous gliding pitch, eerie/vocal. Tubular bells (×2, last v119 — 16-gap) = sharp metallic strike, long decay. Flugelhorn (×2, last v123 — 12-gap) = warm muted brass, velvety. Three completely different attack profiles and spectral signatures — ideal for the technique. Add 'sci-fi' to exclude_styles because theremin often drags Suno into that category. DURATION STRATEGY: tonal (A→Bb MAJOR), rhythmic alternation (strong pulse language), explicit exclusion of 'atonal' + 'microtonal' + 'sci-fi'. NOVELTY: First klangfarbenmelodie. 126 BPM = never used. Bb major (×2 → 3). Lighthouse-beam = novel image, suggests sweep + coloring. Sudden-color-shift emotion. 906 chars."
