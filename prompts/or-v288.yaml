notes: |
  VIRAL ARM cycle v288 — Modern Israeli pop / Yam Tikhoni (Mediterranean)
  pop / Mizrahi-electronic fusion. Research-driven (Wikipedia Noa Kirel,
  Static & Ben El, Eden Hason TikTok 2026, Tablet Magazine Israeli pop
  emuni 2026): contemporary Israeli pop blends Western pop production
  with Mizrahi (Middle Eastern Jewish) melodic phrasing and Hebrew lyrics.
  Static & Ben El's sound is defined as "fusion of contemporary electronic
  production and classical Middle Eastern music." Noa Kirel exemplifies
  contemporary Israeli chart pop. Eden Hason's "שמישהו יעצור אותי"
  (Someone Stop Me) is currently TikTok-viral. The Yam Tikhoni
  (Mediterranean) pop scene is the canonical Israeli production lane.

  USER ROADMAP TARGET: 27 viral cycles deep, 22 languages, 28 voice
  archetypes, 24 regions. v288 adds Hebrew (23rd language, 10M speakers
  + global Jewish diaspora) and Tel Aviv (25th region — eastern
  Mediterranean coast). Mediterranean now has FIVE distinct cycles:
  v272 Cairo Arabic mahraganat + v278 Istanbul Türk trap + v284 Tehran
  Persian tahrir + v287 Athens Greek trabetiko + v288 Tel Aviv Israeli
  Yam Tikhoni. Five language families (Afro-Asiatic Semitic, Turkic,
  Indo-European Iranian, Indo-European Hellenic, Afro-Asiatic Semitic
  Hebrew) — comprehensive Mediterranean musical-cultural differentiation.

  VOICE DIFFERENTIATION — 29TH orthogonal voice in 29 cycles. Cumulative
  ledger (abbreviated):
    v260-v287: 28 prior voices spanning 22 languages
    v288 — female ISRAELI MIZRAHI-POP CHEST-RICH HEBREW guttural HEBREW
           (chest-rich Hebrew guttural consonants — ayin, het, resh trills
           + Mizrahi modal melodic phrasing from Yemenite/Iraqi-Jewish
           ornament tradition + passionate emotional delivery —
           distinct from v287 Greek modal-belt via Hebrew guttural
           phonetic character and Mizrahi ornament library)
  Mediterranean female-vocal axis now has TWO distinct cycles: v284
  Persian tahrir microtonal trill + v287 Greek rebetiko modal-belt +
  v288 Israeli Mizrahi-pop chest-rich Hebrew-guttural. All three female
  Mediterranean voices distinct on ornament-system axis. Style +
  exclude_styles block all 28 prior voice characters.

  LANGUAGE — 23rd distinct language. Hebrew (Latin transliteration —
  Hebrew script exists but Latin transliteration is standard for
  international audiences on TikTok). Lyric vocabulary uses authentic
  Tel Aviv Mizrahi-pop Hebrew: "or" (light — iconic Hebrew word, used
  as endearment), "shtaim ba'lila" (2am), "Florentin yashan" (Florentin
  sleeps — Florentin is Tel Aviv's hip nightlife district), "haya'm"
  (the sea), "haShinayim" (the moonlight on the sea), "shana avra"
  (a year passed), "halev od mevakesh" (the heart still asks), "Spotify"
  intentionally NOT used here, "hama'arav zorech" (the west shines —
  Mediterranean sunset reference), "hayam noger be'or hapanasim" (the
  sea barks at the streetlight light). Concept: classic Israeli
  Mediterranean ballad — 2am Florentin sleeping, only me and the sea
  watching the moonlight, year since you left, the café is closed, the
  sea barks at the streetlight, "you're the light of the day, you're the
  light of the night, how can I forget, how can I live." Evergreen Yam
  Tikhoni emotional core.

  BPM 122 — fresh in rotation (recent: 78-174 mostly covered; 122 is
  unused). Mid-Yam-Tikhoni dance tempo.

  Key D minor — first reuse of D minor since v280 (8 cycles ago).
  Walks well with Mizrahi modal coloring (Hijaz/Bayati modal flavor on
  D-base sounds canonically Mizrahi).

  Production palette pinned: "darbuka percussion overlay + oud (Middle
