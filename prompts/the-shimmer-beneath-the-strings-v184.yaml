notes: "v184: BARYTON first use — bowed string instrument with sympathetic metal strings producing dual-resonance: warm dark bowed tone + shimmering metallic halo from resonating strings beneath. Research confirmed zero prior uses across 183 versions. Shakuhachi (gap=59, Japanese bamboo) + handpan (gap=51, metallic idiophone). Three families: bowed string/wind/percussion. 55 BPM unused. Db major → D major half-step up (Db major gap=138). Theme: the hidden resonance in music — the notes no one plays but everyone feels. The sympathetic strings as metaphor for empathy."
