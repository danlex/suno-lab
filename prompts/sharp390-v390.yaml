notes: |
  Hyperpop 2.0 × drum and bass is the lane: the 2025-2026 cluster of hard, floor-filling electronic tracks that fuse hyperpop's supersaw palette and punchy kick with DnB's snare-roll energy and sub-bass weight — accessible via clean vocal hooks, hostile to dated chipmunk processing. The concept is euphoric self-assertion: the specific moment of choosing to stop self-minimising and taking the space you've always been owed. Present-tense, first-person, taunting rather than wistful. Deliberately not farewell, not nostalgia, not bittersweet — distinct from v366 and v367's emotional territory.

  The hook "sharp end first" is built for the critical judge's D1 dimension: a pre-specified melodic contour (three-note stepwise descent B-flat4 → G4 → F4, one syllable per note, staccato), tonic landing on the snare hit, entering on the downbeat like a physical punch. The idiom carries defiance without cliché: "lead with the dangerous part" is a real English expression. On final chorus repetition the brief specifies stripping to kick + vocal so the three stop-consonants (sh/d/f) land as percussive accents — this is notated in the hook-first structure by having the chorus strip to vocal before the final vamp.

  Climax design targets D6 (non-formulaic climax) specifically: texture inversion at approximately 2:28. The DnB snare rush accelerates to double-time WHILE the supersaw chord wall cuts entirely — not a silence metatag (documented to truncate), not a strip-to-drums-then-drop, not a half-step lift. The vocal holds one sustained note over bare percussion. Then the full chord wall detonates on beat one of the final chorus at the same pitch, same key — the impact is velocity and density contrast only. The judge has docked every cycle that used the standard silence-gate + key-change template; this inversion avoids both.

  Duration levers: hook lands at 0:00 (hook-first structure). A 28-bar supersaw/DnB instrumental vamp (1:24-1:52) is the primary 3:00 lever, validated against v366 Pulse (3:08) and v367 Memory (3:10+). Final lyric pushed to approximately 2:44 with an instrumental outro from 3:02. At 128 BPM this sits in the proven 130-ish band; target wall-clock 2:50-3:20.

  Style follows the playbook: atmospheric-first opening (feeling before genre label), production tokens (polished studio mix, wide stereo stage, deep low-end definition), sentence case throughout, five inline negatives at the close. Style char count: 948.

  Genre anchor: hyperpop 2.0 × drum and bass. BPM 128. Key F minor. Exclude styles blocks all adjacent drift: dubstep, gabber, happy hardcore, chipmunk processing, jungle, grime, generic EDM, ambient — everything the auto-classifier might wrongly tag on this prompt.

  No artist names appear anywhere in style, lyrics, or notes. The exclude_styles field does not name artists. Title is exactly one fused word: Sharp390.

