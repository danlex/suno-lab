style: "Euphoric defiance — stop shrinking, take the room — as hyperpop 2.0 fused with drum and bass at 128 BPM in F minor. Polished studio mix, wide stereo stage, deep low-end definition. Compressed punchy kick on every beat; supersaw chord stabs cut the off-beats; DnB snare rolls drive the breakdown to double-time. Clean female lead vocal sits bright on top, plainspoken, no pitch processing, syllables staccato-clear. The hook \"sharp end first\" descends B-flat to G to F, one syllable per note, tonic landing on the snare hit, punching in on the downbeat. Verses thin to single stabs; choruses fill to a supersaw wall. At the climax snare doubles while chords cut entirely — vocal holds one long note over bare percussion — then the full chord wall detonates on beat one of the final chorus, same key. Contrast through velocity and density, not modulation. No guitars, no rock drums, no pipe organ, no synthesizers outside the above, no ambient drift."

