notes: |
  TECHNIQUE: The alap-jor-jhala velocity arc is a three-stage structural principle drawn from the formal architecture of Hindustani instrumental performance, here stripped of all geographic and cultural coding and retained purely as a rhythmic-density ramp. In its original context — which this catalog cannot attribute to performers or traditions by name, per blocklist rules — the three stages represent a progression from rhythmically free exploration (alap), through the emergence of implied pulse and melodic momentum (jor), to a rapid cascading climax driven entirely by density and register ascent (jhala). The technique is used here as a formal arc and renamed a "velocity arc" to describe its mechanism: three phases of increasing rhythmic density and register, where the climax is earned by densification alone, not by modulation or silence.

  CULTURAL-CODING GUARD: The terms alap, jor, and jhala appear only as plain structural-phase labels in the lyrics metatags. No geographically coded words appear anywhere in the YAML — no raga, sitar, tabla, sarod, veena, Indian, Bollywood, Eastern, spiritual, meditative, trance, North Indian, or any performer or composer name. The struck drone in the jhala phase is rendered as col legno and pizzicato low strings (Western orchestral technique), not any ethnic percussion instrument. All featured instruments are Western. The exclude_styles field blocks Indian classical, raga, sitar, tabla, and Bollywood at the generation level.

  CONCEPT SOURCE: The structural logic of the arc — metrically free opening, emergence of walking pulse, explosive rhythmic density at the end — applies universally to any medium where densification and register-leap can supply climactic energy without relying on key change or silence. Here it is mapped to a Western chamber-orchestral trio over orchestral strings.

  COMPOSER OMISSION: The tradition from which alap-jor-jhala structure originates has rich histories and named masters that cannot be cited under this catalog's blocklist rules. Their omission is intentional and acknowledged.

  DURATION STRATEGY: Target 2:30–3:30 (cue ~3:00) per v137+ override. The arc uses pulse-based intensification as its primary drama engine: alap phase (0:00–0:45, unmeasured/rubato), jor phase (0:45–2:05, walking pulse, register climb), jhala phase (2:05–2:50, rapid sixteenth cascade at the locked 148 BPM, struck drone). Key is B-flat minor throughout — no modulation is used, because the densification and register-leap supply the climax without any tonal assist. The decision to hold B-flat minor home is deliberate: adding a half-step shift would compete with and dilute the density-as-payoff mechanism. Render settles by 2:50, total under 3:30.

  FEATURED TRIO:
  - OPHICLEIDE (keyed low brass, last v180, gap 49 — ×49): the alap voice. A now-obsolete keyed brass instrument of the 19th century, sounding in the deep bass-baritone register; its large bell and conical bore produce a rich, slightly rough, searching tone ideal for slow free phrases over a drone. It is the dispersed-bird voice — singular, unhurried, low in the sky.
  - BARYTON (bowed string with sympathetic strings, last v184, gap 45 — ×45): the jor voice. A viola-da-gamba-family instrument with a second set of metal strings beneath the neck that vibrate sympathetically when the upper strings are bowed, producing a shimmering resonant halo around every note. It carries the walking momentum of the middle phase — its sympathetic ring suggests a flock beginning to synchronize.
  - CLAVICHORD (intimate keyboard, last v212, gap 17 — ×17): the jhala voice. The softest keyboard instrument, where tangents directly strike the strings; it can produce rapid, close-together figurations at the top of its range with a bright glittering attack. In the jhala phase its rapid sixteenth-note cascades high above the staff are the aerial-display equivalent — the flock in full explosive murmuration.

  KEY DECISION: B-flat minor home throughout, no modulation. The densification mechanism is the climax; no half-step lift is used, because adding pitch shift at 2:05 would reframe the jhala eruption as a modulation event rather than a density event. B-flat minor's dark richness in low brass (ophicleide) and the deep cello drone suits the dusk setting and the slow alap.

  NOVELTY CLAIMS:
  - OPHICLEIDE: keyed brass, last v180, gap 49 versions (×49, deepest revival in this catalog batch)
  - BARYTON: bowed strings, last v184, gap 45 versions (×45, second-deepest revival)
  - CLAVICHORD: keyboards, last v212, gap 17 versions (×17)
  - BPM 148: unused in catalog (recent run: 141/142/143/146/147 taken; 148 free — verified against novelty_surface.json)
  - Key: B-flat minor home without modulation — new use (prior b-flat minor prompts include half-step lifts; holding it stable is new)
  - Scene: starling murmuration gathering at dusk — first use in catalog
  - Technique: ALAP-JOR-JHALA VELOCITY ARC as formal principle — first use in catalog
  - Trio: ophicleide + baryton + clavichord — new combination, never assembled

