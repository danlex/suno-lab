notes: |
  Technique: downtempo-breakbeat-as-rhythmic-anchor with a dry-to-spatial reverb arc.
  The core move is structural rather than harmonic: the vocal begins completely dry and
  close-miked (no reverb) and only opens into full hall reverb at the bridge — so the
  reverb arrival functions as an emotional event, the room suddenly expanding around the
  voice. This reverb-transition-as-emotional-climax approach has zero prior representation
  across 334 versions of this catalog.

  Concept source: a neo trip-hop orchestral pull — the sound of slow sliced breakbeat
  anchoring clean orchestral string swells, with a single dry female vocal that
  deliberately refuses the warmth of reverb until the moment it can no longer hold.
  The genre description "trip-hop" is avoided in the style field to prevent dated lo-fi
  coloration; replaced with "cinematic downtempo" and "sliced breakbeat" as descriptors.
  The sound this echoes without naming its originators: the slow-tempo Bristol-adjacent
  cinematic downtempo producers of the mid-1990s through 2000s, and the orchestral
  expansion of that sound by later European film composers.

  Duration via structure (not BPM): the brief is to lean on the naturally long sections
  of the genre rather than bar-count arithmetic. The lyrics are structured in five
  well-spaced time zones: 0:00, 0:25, 1:05, 1:52, 2:40, with a final [Fade] at 2:55.
  The last lyric timestamp at 2:40 and the explicit style anchor "dry fade near 2:55"
  give Suno two structural cues to push the render toward ~3:00 without relying on
  [Silence] markup (which truncates per feedback_silence_gate_truncates). The
  sub-bass-only moment is conveyed via section label "Sub-bass only — reverb opens"
  rather than a [Silence] metatag.

  Instruments (all three are body voices — no spectral instruments):
  - Nyckelharpa (gap 83 — last used v252): warm drone-string texture that opens the
    track alone, thickens the orchestral string bed without competing with it; the keyed
    drone resonance gives the downtempo groove a distinctive Scandinavian-cinematic color
    without being Nordic-folk (guarded by exclude_styles).
  - Handpan (gap 81 — last used v254): provides the tactile downtempo percussive pulse
    that weaves with the sliced breakbeat; its mallet-struck resonance fills the gap
    between the breakbeat hits and keeps the groove from feeling empty.
  - Cor anglais (gap 20 — last used v315): plaintive melodic counter-voice that enters
    after the string swell, adding an aching oboe-family timbre that lifts into the
    A-flat major modulation at the final section.

  Key: G major voiced as modal-wistful (maj7, add9, suspended tensions, borrowed minor-iv
  colors) lifting to A-flat major at the final section. The half-step rise is the harmonic
  event of the song, timed to coincide with the reverb-climax arrival at 2:10. The
  melancholic/modal voicing ensures the major key reads aching and wistful rather than
  bright or cheery — consistent with the downtempo mood.

  Novelty claims:
  - Technique novelty: dry-to-spatial reverb arc as primary emotional event — zero prior
    uses in 334 versions.
  - Genre lane novelty: cinematic downtempo / orchestral downtempo — no prior version in
    this catalog. Differentiated from v327 (ballad), v328 (indie-pop), v329 (nu-disco),
    v330 (folk anthem), v331 (dream-pop), v332 (alt-R&B), v333 (city-pop), v334
    (gospel-pop).
  - Trio novelty: nyckelharpa + handpan + cor anglais — this three-way combination is
    new to the catalog.
  - Key novelty: G major to A-flat major (modal-wistful voicing) — fresh key context.

  Style char count: 948 (verified in-range 700–950).
  Lyrics char count: 911 (verified under 980).

  Production tokens used: polished studio mix, deep low-end definition, wide stereo stage.
  All three featured instruments are body voices (≥2 body voices rule satisfied, trio
  contains 0 spectral instruments). Sentence case throughout, atmospheric-first opening,
  no ALL-CAPS form labels. Five inline negatives present.

