name: "undertow-v335"
version: 335
title: "Undertow"
instrumental: false
vocal_gender: female

style: "Cold intimacy pressing against thin walls — something vast about to open. Polished studio mix, deep low-end definition, wide stereo stage. G major, maj7 and suspended tensions, modal-wistful, lifting to A-flat major at the final section, 86 BPM downtempo sliced breakbeat. Nyckelharpa opens alone beneath a close-miked English female vocal — dry, unreverbed, every consonant audible. Handpan weaves a tactile pulse alongside the half-time sliced breakbeat. Cor anglais enters as a plaintive counter-voice, aching, lifting toward the modulation. Strings build as slow cinematic swells, live-adjacent orchestral texture. Bridge: sub-bass carries alone while the vocal opens into full hall reverb, the room expanding. Reverb-climax at 2:10, dry fade near 2:55. Final section in A-flat major, strings at peak density, then a last dry vocal line fades to a string pad. No lo-fi tape hiss, no sampled stabs, no autotune, no EDM drop, no distorted guitars."

lyrics: |
  [Dry open — nyckelharpa, breakbeat, 0:00]
  Something in the walls tonight
  A weight that has no name
  I keep the lights turned low
  And let it stay

  [Verse — vocal close-miked, dry, 0:25]
  You left a gap in everything
  The kind that doesn't close
  I trace it like a map
  Of somewhere no one goes

  The handpan counts the seconds
  The drone string holds the key
  I'm in the room you left
  Like I'll always be

  [Strings enter — slow swell, 1:05]
  Underneath the quiet
  Something lifts and turns
  The cor anglais carries
  What the silence earns

  [Sub-bass only — reverb opens, 1:52]
  And then the room
  Just opened wide
  Hall reverb falling
  Nowhere left to hide

  The cor anglais bends
  Through A-flat sky
  Drone and strings rise
  Pulled open by the tide

  [Final verse — dry return, 2:40]
  One last time I'll say it
  Dry and close and clear
  The breakbeat fades to nothing
  But you are still right here

  [Fade — string pad only, 2:55]

  [End]

