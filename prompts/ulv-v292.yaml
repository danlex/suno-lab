  not artist-copy.

  **DOPAMINE-PEAK ARCHITECTURE v3** (third iteration of the user's
  directive — applies v291 lesson "no silence-gate"):
  - 0:00 frame drum march + male war-call (entry)
  - 0:30 female response (call-response established)
  - 1:00 first harmonized hook duet (first peak)
  - 1:45 harmonic ascent build — rising scale-degree progression
