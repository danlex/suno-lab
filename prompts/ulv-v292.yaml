lyrics: |
  [Intro] (frame drum march, lurs distant)
  (male war-call) ulv... ulv... ulv...
  (female battle-priestess response) ah... ah...

  [Verse 1 — male lead, 0:30] (tenor)
  midnatt på vidda, vinden bærer min røst
  ulven løper foran meg, månen viser min vei
  jeg jakter, jeg lever, jeg er ulv

  [Verse 2 — female response, 1:00] (full alto)
  jeg ser deg i mørket, jeg hører ditt rop
  blodet i mine årer husker dette
  vi er ett blod, jeg er ulv

  [Hook — DUET harmonized, 1:30]
  ULV! ULV! vi løper sammen!
  ULV! ULV! vi jakter under måne!
  ULV! ULV! Odin ser oss!

  [Build] (harmonic ascent, 1:45-2:15)
  ulv, ulv, ulv (drums build)
  ah ah ah (vocals rising)
  ulv, ulv, ULV!

  [Drop Climax — UNISON, 2:15] (full 808 + unison shout)
  ULV! ULV! vi løper sammen!
  ULV! ULV! Odin ser oss!
  ULV! ULV! vi er én!

  [Climax Duet, 2:45]
  (male) blod min blod
  (female) hjerte mitt hjerte
  ULV! vi er én!

  [Outro] (drum fade)
  ulv...
  [End]

