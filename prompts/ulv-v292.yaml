notes: |
  VIRAL ARM cycle v292 — THIRD cycle in user directive "Vikings music +
  brain dopamine." Sister track to v290 "Hugr" (male battle-roar choir) +
  v291 "Eldur" (female cool-glacial solo). v292 introduces the FIRST true
  male-female duet architecture in the catalog.

  Research-driven (Skáld Wikipedia + TikTok 2026 #vikings content):
  Skáld is a French Nordic folk group formed 2018 with three singers
  fronting — male-female call-and-response duet structure with Old Norse
  lyrics. Their "Herr Mannelig" is TikTok-viral. Sound is "percussive
  and driven by voices." This is the canonical reference for v292's
  duet architecture (without copying Skáld directly — reference is to
  the format/lineage, not to artist-copy).

  USER ROADMAP: 31 viral cycles + 2 Viking cycles = 33 cycles so far.
  v292 adds Norwegian (27th language — modern living Norwegian distinct
  from v290 Old Norse and v291 Icelandic) and Norwegian wilderness (29th
  region). Nordic / Viking-derived language family now has three cycles:
    - v290 Old Norse skaldic (battle-roar male choir)
    - v291 Icelandic Nordic noir (female cool-glacial-clear solo)
    - v292 Norwegian skald folk anthem (male-female true duet)
  Three different Nordic languages, three different vocal architectures.

  VOICE DIFFERENTIATION — 33RD orthogonal voice in 33 cycles. THE FIRST
  TRUE MALE-FEMALE DUET in the catalog. Cumulative ledger (abbreviated):
    v260-v291: 32 prior voices, all single-gender solo or single-gender
    group/stack (v268 female K-pop group, v271 male sertanejo duo, v283
    Mor Lam Sing call-response, v290 male-choir-with-female-overtone-
    accent — but none are TRUE male-female-equal duet)
    v292 — MALE-FEMALE TRUE DUET architecture (male warrior tenor + female
           battle-priestess alto, alternating verses then harmonizing on
           hooks, both singing throughout with equal weight, NOT one as
           lead with the other as accent layer — genuinely new vocal
           architecture beyond solo/single-gender-group)
  Style + exclude_styles block all 32 prior voice characters.

  LANGUAGE — 27th distinct language. Modern Norwegian (distinct from
  v290 Old Norse + v291 Icelandic — Norwegian is a living modern Nordic
  language with its own phonetics and standard form). Lyric vocabulary
  uses authentic Norwegian: "ulv" (wolf), "midnatt på vidda" (midnight
  on the plateau), "vinden bærer min røst" (the wind carries my voice),
  "månen viser min vei" (the moon shows my way), "blodet i mine årer"
  (the blood in my veins), "vi er ett blod" (we are one blood),
  "Odin ser oss" (Odin sees us), "vi er én" (we are one). Concept:
  classic Viking wolf-hunt blood-bond narrative — the male warrior and
  female battle-priestess on midnight wilderness hunt, blood-bonded by
  ritual, Odin watching, "we are one." Evergreen Norse warrior-bond
  emotional core.

  BPM 130 — march tempo, fresh in rotation. War-drum cadence canonical.

  Key Eb minor — first reuse since v278 (14 cycles ago). Walks well
  with cathedral-organ pad at climax.

  Production palette pinned: "tribal frame drum march cadence (4-on-floor
  war-drum) + lurs Viking horns counterpoint + tagelharpa drone +
  hardanger fiddle melody + hand-clap off-beat + sub-bass + 808 layered
  with drum on drop + cathedral-organ pad at climax + hand-percussion
