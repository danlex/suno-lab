title: "Rise from the Ashes"
lyrics: |
  [Thunderous Drums]
  [Deep Male Choir - Latin Chant]
  From the ruins we will rise
  Through the fire we will climb
  Every kingdom built on fear
  Falls before the march of time

  [Brass Fanfares - Orchestra Surges]
  [Female Choir Joins - Soaring]
  We are the ones they left for dead
  We are the flame that would not die
  With iron hearts and voices raised
  We shake the very sky

  [Full Orchestra and Choir - Maximum Power]
  Rise from the ashes
  Rise from the ashes
  The world will know our name

  [Quiet Moment - Solo Cello]
  They thought the silence meant surrender

  [Explosive Final Chorus - Everything]
  But silence was the calm
  Before the thunder came

  Rise from the ashes
  Rise from the ashes
  And nothing burns the same

  [End]
