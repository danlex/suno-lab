name: "suspense-v552"
version: 552
title: "Suspense552"
instrumental: true

style: "Manuscript room in winter candlelight, grand piano alone in the dark. Piano in A minor at 73 BPM — close-mic'd sustain-pedal resonance, polished studio mix, tight chamber reverb, wide stereo stage. Left hand rolls continuous eighth-note arpeggios throughout, never stopping; right hand sings a cantabile melody arriving one beat late through a 4-3 suspension, immediately re-suspended on resolution — perpetual aching almost-arrival. Mid-section the cascade migrates upward; viola d'amore enters with hushed sympathetic-string warmth beneath, never melodic; harmonium breathes a free-reed sustain binding the texture into a chamber exhale. Near two minutes the cascade resolves to a pure unguarded triad and the harmony drops to a radiant F major chromatic-mediant chord — a shock of open consonance, four bars of exhaled release after the aching tension. Warm tape saturation. No guitars, no vocals, no rock drums, no pipe organ, no choir."

lyrics: |
  [Cascade Opens: piano alone, rolling left-hand arpeggios in A minor, cantabile theme suspended one beat on arrival, 10 bars]

  [Suspension Deepens: theme climbs, each 4-3 suspension re-suspended on resolution, left hand unwavering, 10 bars]

  [Tenor Migration: cascade shifts upward, suspensions compound, viola d'amore enters hushed beneath, 12 bars]

  [Harmonium Joins: harmonium breathes sustained free-reed sigh, three voices exhaling together, suspensions still stacking, 10 bars]

  [Tension Peak: all three voices richest, cascade relentless, ear held one beat from resolution, 12 bars]

  [Release: cascade resolves to pure unguarded triad, harmony drops to radiant F major chromatic-mediant, four bars open consonance, 10 bars]

  [High Register Close: viola d'amore and harmonium silent, piano alone treble, final suspension dissolves to one sustained high note, 8 bars]

  [End]

