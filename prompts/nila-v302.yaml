notes: |
  VIRAL ARM cycle v302 — Tamil indie-trap / Chennai 3am Marina Beach.

  TECHNIQUE: Tamil indie-trap fuses Carnatic classical instrumentation
  (nadaswaram + veena) with contemporary trap production (808 sub-bass,
  hi-hat triplets, sharp clap). The nadaswaram is a South Indian
  double-reed aerophone — the loudest non-amplified wind instrument
  globally, used in temple ceremonial contexts — here transposed to a
  nocturnal Marina Beach scene. The veena is the primary plucked lute
  of Carnatic music, distinct for gamaka ornaments: continuous microtonal
  gliding slides impossible on fixed-pitch Western instruments. Both
  instruments DEBUT in the catalog — zero prior appearances in 301 versions.

  CONCEPT SOURCE (research-driven): Carnatic nadaswaram + veena melodic
  counterpoint over 808 sub-bass + trap hi-hats, first Dravidian-language
  entry in the catalog.

  COMPOSER OMISSION CONFESSION: This concept echoes a Chennai-based
  producer whose Tamil indie-rap work blended classical Carnatic timbres
  with modern trap production — that producer's name is withheld per
  artist-name blocklist discipline.

  DURATION STRATEGY: Per validated trap/rap duration model (v286 Polish,
  v297 Czech, v301 Hungarian precedents), genre-territory renders 1:30-2:00.
  Accepting this as honest outcome. ARC timestamps in style + parametrized
  lyric section labels with timestamps are the primary duration anchors.
  Two body instruments (nadaswaram and veena — both acoustic body-resonance
  instruments) satisfy the ≥2 body voice rule. Sentence case throughout
  style. Atmospheric-first opening (Marina Beach 3am before production
  tokens). Production tokens used: "wide stereo stage", "warm tape
  saturation", "low coastal reverb".

  INSTRUMENTS:
  - Nadaswaram (catalog debut, gap ∞): ceremonial double-reed nasal
    brightness carrier, 1-4 kHz peak, piercing overtone presence — states
    theme alone in intro, returns for hook call-and-response at 1:30.
  - Veena (catalog debut, gap ∞): plucked Carnatic lute with gamaka
    microtonal slides, enters at 1:00 as melodic counterpoint to the
    rap verse, sustains into climax harmonic ascent at 2:30.
  - Minimalist 808 trap kit: 808 sub-bass drives harmonic low-end in
    C minor / Natabhairavi-mode coloring; trap hi-hat triplets + sharp
    clap define rhythmic grid from 0:25 onward.

  VOICE DIFFERENTIATION — 43RD orthogonal voice in 43 cycles.
  Male Tamil rapper — chesty mid-low Chennai accent with Dravidian
  retroflex phoneme inventory: ழ /ɻ/ (Tamil-specific rhotic absent from
  all Indo-European languages and prior catalog voices), ட ண ள ற
  alveolar/retroflex set. Dravidian is completely unrelated to all 42
  prior catalog language families (Finno-Ugric, Slavic, Romance,
  Germanic, Semitic, Japonic, Sino-Tibetan, Koreanic, Turkic,
  Niger-Congo, etc.).

  LANGUAGE: Tamil (Tamil script தமிழ்) — 32nd distinct language.
  Vocabulary: நிலா (nila/moon), மரீனா (Marina), சென்னை (Chennai),
  கடல் (kadal/sea), காதல் (kadhal/love), மழை (mazhai/rain),
  ராத்திரி (rathri/night), தனியா (taniya/alone), இரவு (iravu/night),
  காத்திருக்கேன் (kaathirukken/I wait). Concept: 3am Marina Beach —
  moon over sea, last MTC bus gone, WhatsApp left unread, alone waiting
  in the warm coastal night.

  NOVELTY: BPM 94 — one prior use at v131 (170 cycles ago, extremely
  fresh). Key C minor — last used v287 (14 cycles back), maps directly
  to Carnatic Natabhairavi raga (natural minor equivalent). Scene:
  Marina Beach Chennai 3am — zero prior appearances. Both instruments
  debut. First Dravidian-language entry. 32nd distinct language.
  43rd orthogonal voice.

