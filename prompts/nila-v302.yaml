style: "Underscore for 3am Chennai coastal vigil. Marina Beach 3am — neon on sea-spray, last bus gone, moon over Natabhairavi-mode darkness. 94 BPM, C minor → D-flat minor at climax. Male Tamil rapper — chesty mid-low Chennai accent, rolling retroflex consonants (ழ /ɻ/, ட ண ள ற absent from prior catalog voices), syllabic flow, light Auto-Tune on hooks only. Nadaswaram carries ceremonial double-reed brightness (piercing nasal 1-4 kHz); veena answers with gamaka glides over the 808 sub. Production: minimalist Tamil indie-trap kit, deep 808 sub-bass, trap hi-hat triplets, sharp clap, wide stereo stage, warm tape saturation, coastal reverb. At 0:00 nadaswaram opens alone; 808 snaps at 0:25; veena counterpoint at 1:00; hook call-and-response at 1:30; climax ascent at 2:30; fade by 3:00. NOT Kollywood playback, NOT devotional temple, NOT Hindi film. No guitars, no rock drums, no pipe organ, no synthesizers, no Western strings."

lyrics: |
  [Intro — nadaswaram alone, 0:00-0:25]
  நிலா... நிலா...

  [Verse 1 — chesty Tamil rap, 0:30-1:00]
  மூணு மணி ஆச்சு, மரீனா தனியா
  கடல் காத்திருக்கு, நான் காத்திருக்கேன்
  ஒரு MTC போச்சு, ஒரு MTC போச்சு
  சென்னை தூங்குது, இரவு நீளுது

  [Pre-Hook — veena enters, 1:00-1:30]
  நிலா ஒளி, கடல் ஒலி
  ஒரே ராத்திரி, தனியா நான்

  [Hook — Tamil trap, nadaswaram call-response, 1:30-2:00]
  நிலா, நிலா, நீ வருவாயா
  நிலா, நிலா, கடல் சொல்லுது
  நிலா, நிலா, காதல் போச்சு
  நிலா, நிலா, இரவு மட்டும்

  [Verse 2 — fuller flow, 2:00-2:30]
  மழை வரலை, வேர்வை வருது
  WhatsApp நிறுத்திச்சு, பார்க்க பயம்
  ஒரு call போடணும், ஒரு call போடணும்
  ஆனா மரீனா மட்டும் பதில் சொல்லுது

  [Climax — full ensemble, harmonic ascent, 2:30-3:00]
  நிலா, நிலா, நீ வருவாயா
  நிலா, நிலா, சென்னை கேக்குது
  நிலா, நிலா, காத்திருக்கேன்
  நிலா, நிலா, இரவு... கடல்...

  [Outro — fade with nadaswaram, 3:00]
  நிலா...
  [End]

