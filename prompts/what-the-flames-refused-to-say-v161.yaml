title: "What the Flames Refused to Say"
lyrics: |
  [Spanish Guitar Solo - Passionate]
  In the courtyard where the jasmine burns
  I danced until my feet bled red
  Every step a word unspoken
  Every turn a prayer unsaid

  [Strings and Cajon Enter - Driving]
  They told me fire was for the reckless
  They told me passion was a sin
  But the flames that burn the brightest
  Are the ones that burn within

  [Full Orchestra - Explosive]
  I am the storm they tried to silence
  I am the song they tried to cage
  Every note a revolution
  Every breath a turning page

  [Quiet Guitar - Intimate]
  The courtyard holds its breath tonight

  [Final Eruption - Everything]
  And the flames
  The flames refused to say
  What my body always knew
  That I was born to burn this way

  [End]
