name: "vault554-v554"
version: 554
title: "Vault554"
instrumental: true

style: "Autumn library at last light, amber slant across the keys. Grand piano in E-flat minor at 77 BPM — close-mic'd sustain-pedal resonance, polished studio mix, tight chamber reverb. Singable theme stated at 0:08 in the middle register over a walking left-hand arpeggiated ostinato that never stops. From there the theme restated each time one octave wider — bass lower, treble higher — the same melody growing to fill more breadth: confiding first, then vast. At the full-keyboard bloom a German augmented-sixth surges — chromatic tension resolving to the B-flat dominant — the theme bridging full keyboard width, the most beautiful moment. Then the music contracts to the original middle-range statement, piano entirely alone: a reverse-reveal coda. Viola da gamba enters warm beneath the piano at the first expansion, receding in the coda. Bassoon enters only at the full-keyboard peak, filling the tenor register, silent in coda. No guitars, no vocals, no rock drums, no pipe organ, no choir."

lyrics: |
  [Theme Opens: grand piano alone states the full singable theme in middle register over walking left-hand arpeggiated ostinato, 0:08, 10 bars]

  [First Expansion: theme restated one octave wider, bass hand reaches lower, viola da gamba enters warm beneath the piano, 16 bars]

  [Harmonic Development: left-hand arpeggio deepens, theme ascends in right hand, viola da gamba mirrors the sustain, harmonic color darkening, 12 bars]

  [Full-Keyboard Bloom: theme restated across the full keyboard from low bass to high treble, left-hand arpeggio in the lowest register, German augmented-sixth chord surges at 1:55 resolving to B-flat dominant, bassoon enters filling the tenor, maximum register width, 20 bars]

  [Reverse-Reveal Coda: music contracts, theme returns to original tight middle-range statement, solo piano entirely alone, viola da gamba gone, bassoon gone, 10 bars]

  [End]

