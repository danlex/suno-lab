name: "longer-than-light"
version: 14
style: "Cinematic neoclassical film score, monumental orchestral arrangement with dramatic emotional arc. Opens at full power then collapses to silence. Coloratura soprano with breathtaking wordless vocal runs and melismatic flourishes singing in Italian and Latin, soaring stratospheric high notes. Male voice speaks intimate English words underneath. Cathedral pipe organ, lush string orchestra, angelic choir. Extreme dynamic contrast, reverse crescendo then rebuilds to devastating climax. Pristine production, vocals forward. No drums, no percussion, no beat, no electric guitar, no rock. BPM: 72, Key: D Minor resolving to D Major"
title: "Longer Than Light v14"
lyrics: |
  [Full orchestra, choir, organ, massive opening]
  [Soprano wordless vocalise: Ahhh...]

  [Everything drops to silence]

  [Spoken, male voice, alone]
  I hear your key in the door
  I set the table for two

  [Piano enters softly]
  [Soprano answers wordlessly: Ohhh...]

  This house still holds your name
  But you are gone

  [Strings enter, soprano sings in Italian]
  Torna a casa... torna a casa
  Ti aspetto più a lungo della luce
  Torna

  [Pipe organ swells, soprano flourishes higher]

  [Spoken]
  Your coat hangs by the door
  I did not move your chair

  [Soprano wordless melisma, soaring]
  Ahhh...

  I talk to the empty room
  And you are there

  [Full orchestra, choir, soprano at absolute peak, wordless]
  Ahhh... Ahhh...

  [Big Finish]
  [End]
instrumental: false
voice: "Alexandru DAN"
notes: "v14 — Everything combined. Reverse crescendo (starts massive, drops to silence). Male spoken word (Alexandru DAN) + wordless coloratura soprano duet. Italian chorus. Wordless vocals at climax — no consonants to mumble. Four innovations: reverse structure, dual voices, Italian/Latin, wordless peak."
tags: [cinematic, neoclassical, soprano, duet, italian, wordless, reverse-crescendo, monumental, short]
