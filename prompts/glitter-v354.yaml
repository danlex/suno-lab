style: "Warm disco light floods the dancefloor at golden hour — hips move before the mind decides. Crisp nu-disco production, polished studio mix, wide stereo stage. Thick four-on-the-floor kick locks into a deep octave bassline, open hi-hats and hand-clap snap on two and four. Disco string stabs slice in bright slashes, funky muted rhythm guitar chops between beats, soulful female vocal hook riding the groove with glamorous ease. G major rising to A-flat major at the final chorus, 120 BPM. Trumpet weaves bright two-bar calls, trombone answers with a fat slide beneath the strings, crystal marimba traces the hook in shimmering overtones. Tape warmth rounds the low end; string stabs bloom room-wide. Sunlit dancefloor joy — nocturnal glamour at full burn. Underscore for a glam dancefloor scene where the crowd surrenders to the beat. No lead guitar solos, no rock drums, no pipe organ, no synthesizers, no autotune."

title: "Glitter"

lyrics: |
  [Intro — kick, strings, 0:00]
  Let the night begin, feel the bassline pull you in
  Golden light everywhere

  [Verse 1 — guitar, trumpet, 0:22]
