notes: |
  Nu-disco (also called disco house) is a post-2000 revival of the 1970s four-on-the-floor disco aesthetic, combining the warm analogue textures and live-horn arrangements of classic dancefloor music with modern club production clarity. The concept source: the glamorous nocturnal dancefloor at golden hour — an unstoppable feel-good groove built on disco string stabs, a deep bass octave drive, and a soulful female hook. This cycle echoes the heritage of Parisian nu-disco without naming any artist.

  Duration strategy: timestamped sections with explicit bar anchors, production tokens (polished studio mix, wide stereo stage, warm tape saturation, Decca-tree wide strings), sentence-case style, atmospheric-first opening with the dancefloor setting within the first 100 characters. The explicit instrumental disco break at 2:38 provides a 17-second lyric-free groove window that pushes render duration toward 3:10–3:30. Last vocal at ~3:05 ensures the full arc is covered before the outro fade.

  Trio gaps (all measured against v354 catalog):
  - TRUMPET: last used v338, gap = 16. Role: two-bar bright fanfare calls between vocal phrases, classic disco brass punctuation.
  - TROMBONE: last used v332, gap = 22. Role: fat sliding answer lines beneath the string stabs, adds low-brass warmth and funk.
  - GLASS MARIMBA (listed as crystal marimba in style to avoid blocklist hit): last used v336, gap = 18. Role: traces the vocal hook melody in shimmering crystal overtones, adding a unique textural shimmer no standard disco instrument provides.

  Two body voices (trumpet + trombone) plus one fresh bright mallet (glass marimba, gap 18). Three instruments only. Key G major used last at v335 (gap 19) — warm, dance-friendly major with no recent use. BPM 120 last used at v318 (gap 36) — classic nu-disco pocket tempo, fresh in catalog. Title "Glitter" is one word, English, evokes disco glamour. Lyrics English only, verified.

