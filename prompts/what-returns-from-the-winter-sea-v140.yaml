notes: "v140 — ORCHESTRAL RITORNELLO. Baroque concerto grosso technique: the tutti states a recurring refrain (the ritornello) in the tonic, then modulates through closely related keys over successive partial statements, with contrasting episodes for the concertino in between. Distinct from v122 concerto grosso (which was solo-group-vs-tutti juxtaposition) — ritornello is specifically the refrain-return architecture: small 2–4-bar units of the refrain separated, varied, recombined, and confirming tonal guideposts across the arc. Research source: Britannica + Wikipedia entries on ritornello form, 2026-04-13. Composer names associated with the form omitted per blocklist. DURATION: ~3-min arc with 117 BPM walking pulse, matches v137+ override. The tutti-vs-concertino contrast gives the silence at 2:10 real architectural weight — it's the refrain holding its breath before the final half-step return. INSTRUMENTS: Cornet (×2, last v127 — 13-gap) = Baroque-authentic natural brass, bright refrain answer. Nyckelharpa (×2, last v127 — 13-gap) = Swedish keyed fiddle, sympathetic-string shimmer for the first concertino episode. Felt piano (×2, last v127 — 13-gap) = muffled hammers for the contrasting-key second episode. Three families: brass, bowed string, keyboard. Nyckelharpa is Scandinavian-folk risk — 'Scandinavian folk, Nordic folk, fiddle tune' added to exclude_styles. NOVELTY: First orchestral ritornello form. 117 BPM = never used. B minor to C minor = uncommon modulation (B minor sparingly used). Ship-returning-at-winter-dusk = novel maritime-dusk scene. Return-after-long-voyage / tonal-guidepost-returns emotion. 948 chars."
