name: "what-returns-from-the-winter-sea"
version: 140
style: "ORCHESTRAL RITORNELLO concerto grosso for a ship-returning-at-winter-dusk scene, total duration around 3:00, with CORNET + NYCKELHARPA + FELT PIANO as concertino against orchestral tutti, small refrain units recombined in new keys, B minor to C minor, 117 BPM, instrumental. From 0:00 the tutti states the ritornello in B minor, walking bass under suspended strings. At 0:25 nyckelharpa breaks away with a lone concertino episode, sympathetic strings ringing like cold salt air. At 1:00 felt piano enters in a contrasting key, muffled hammers carrying a second episode, cornet answering above. At 2:00 the three-voice concertino locks with the tutti, refrain fragments surfacing in the dominant. Peak at 2:05. Silence at 2:10, five seconds still as snow over water. At 2:15 the ritornello returns in C minor fortississimo, half-step up, tutti and concertino fused. Ends at 2:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "What Returns from the Winter Sea"
lyrics: |
  [Short Instrumental Intro]
  [Tutti Ritornello Refrain in B Minor]
  [Nyckelharpa Concertino Episode]
  [Felt Piano Second Episode]
  [Cornet Imitates Above]
  [Concertino and Tutti Interlock]
  [Ritornello Fragments in the Dominant]
  [Silence]
  [Return in C Minor Fortississimo]
  [End]
