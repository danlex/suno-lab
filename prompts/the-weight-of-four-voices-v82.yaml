style: "UNISON LOW-END orchestral, C minor, 56 BPM, purely instrumental. Rimsky-Korsakov's signature massive heavy effect — cellos, contrabasses, trombones, tuba playing the same low line in octave unison, a wall of gravitational weight. Opens with this four-instrument unison playing a four-note descending phrase at fortissimo — each note lands like a stone falling into an ocean. Against this crushing foundation, a solo violin enters high in the stratosphere, a fragile voice against four immense voices. The violin weaves a countermelody around the low-brass unison. Separation not stacking — violin and low-end quartet never share frequency range, both crystal clear. French horns join to thicken the middle register. Timpani doubles downbeats. At the climax the low-end unison is joined by pipe organ pedals while the violin holds a single high note shimmering above, a lone voice against an orchestra of titans. Modern cinematic audiophile production. No vocals, no electronics, no guitars."
title: "The Weight of Four Voices"
