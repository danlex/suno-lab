notes: "v82 — CLASSICAL ORCHESTRATION WISDOM. Second research-driven iteration (per user request). Research source: Rimsky-Korsakov's 1913 Principles of Orchestration treatise. Signature technique: the 'massive heavy effect' quadruple unison of cellos + contrabasses + trombones + tuba — four instruments spanning sub-bass to low-bass register all playing the identical low melody in octave unison. Creates gravitational weight that literally moves air in the room. Combined with the 'separation not stacking' principle (from 2026 film scoring literature): pair the four-instrument low-end unison with a single solo violin in the stratosphere so the two layers never share frequency range — both remain crystal clear. Contrast: v81 was frisson engineering via harmonic devices (appoggiaturas, silence, modulation). v82 is orchestration wisdom via spatial frequency separation. Different mechanism entirely. C minor slow 56 BPM for maximum Rimsky gravity. Sources: Rimsky-Korsakov Principles of Orchestration 1913; film scoring breakdown 2026; Quora orchestral epic techniques. 990 chars."
