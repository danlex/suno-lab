title: "Nerve"
instrumental: false
vocal_gender: female

style: "Dust-road swagger with a smirk — a woman who already knows she's going to win. Warm tape saturation, polished studio mix, wide stereo stage. F major lifting to F-sharp major at the final chorus, 118 BPM alt-country pop. Banjo opens alone two bars, bright plucked defiance. Fiddle threads a wry dry countermelody through the verse. Accordion carries the harmonic body with Cajun-folk warmth. Tape-saturated acoustic guitar, upright bass, and a loose not-quite-quantized kick anchor the groove. Pre-chorus drops the bass — two bars of voice and banjo. Chorus crashes: full band, gang-vocal swell on the last word. Spoken-word bridge over single picked guitar only. Final chorus lifts a half-step; fiddle rings the fifth-above, then hard cut on beat one near 2:45. Underscore for a dust-road outlaw escape scene — engine running, door half open. No metal, no EDM drop, no orchestral strings, no pitch-corrected pop vocal, no arena-rock."

lyrics: |
  [Intro — lone banjo, 0:00]

  [Verse 1, 0:08]
  Left my name on a bar receipt
  Borrowed truck, borrowed heat
  Before the law wakes from sleep

  [Pre-chorus — bass drop, banjo, 0:35]
  Nothing left to lose right here
  Just the string and the open air

  [Chorus — full band, gang swell, 0:48]
  Don't need your rules, I need the road
  Banjo swinging every mile I've owed
  Fiddle calls — go!

  [Verse 2, 1:10]
  Ran the red at Hendricks Creek
  Badge radio to speak
  Last honest girl, crooked town

  [Pre-chorus — bass drop, banjo, 1:38]
  Nothing left to lose right here
  Just the string and open air

  [Chorus — gang swell, 1:50]
  Don't need your rules, I need the road
  Banjo swinging every mile I've owed
  Fiddle calls — go!

  [Bridge — spoken, guitar, 2:10]
  [Spoken Word] Paid every fine I owed. The rest were more interesting.

  [Final chorus — F-sharp, harmony, 2:24]
  Don't need your rules, I need the road
  Banjo swinging every mile I've owed
  Fiddle rings — go, go!

  [Hard cut, fiddle, 2:42]

  [End]

