notes: "v58 — INTERSTELLAR DOCKING SCENE. The moment Cooper has to dock the spinning Endurance. Ticking organ ostinato = countdown clock. 140 BPM — fastest ever, pure urgency. Frantic strings never resolving. Walls closing in. Salvation or annihilation. Then the RELEASE — organ shifts to major and the orchestra EXPLODES with triumph. Maximum tension → maximum relief. Bb minor to Bb major. 848 chars."
