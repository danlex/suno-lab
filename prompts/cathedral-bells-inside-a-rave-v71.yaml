notes: "v71 — DARK TRANCE ORCHESTRAL. Building on v70's orchestral-house breakthrough. 138 BPM (classic trance tempo). C minor (dark). Pipe organ + sub-bass unison. Gothic bassline. Build-drop-build-drop structure. Lead synth melody over feral orchestra. Hans Zimmer + Deadmau5. 'Cathedral bells ringing inside a rave at the end of the world.' BRAAAM every 16 bars. 966 chars."
