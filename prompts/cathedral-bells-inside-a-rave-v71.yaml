name: "cathedral-bells-inside-a-rave"
version: 71
style: "DARK epic orchestral progressive trance hybrid, C minor, 138 BPM, purely instrumental. Hans Zimmer producing a Deadmau5 track. Massive four-on-the-floor kick drives relentless momentum while pipe organ plays a gothic bassline in unison with sub-bass. Full symphony orchestra stacks on top — string sections in frantic tremolos, brass blasting Dune-scale low horn drones, timpani locked to the kick. At the first drop, a soaring lead synth takes a heroic melody while the orchestra erupts around it. The kick never stops. The sub never stops. The strings never stop. Massive BRAAAM hits on the downbeat every 16 bars. Dark trance arpeggios cascade through the high end. French horns play a mournful theme over the driving beat. Build, drop, build, drop — each one bigger than the last. The sound of cathedral bells ringing inside a rave at the end of the world. Modern cinematic electronic orchestral, world-class production. No vocals, no guitars, no acoustic drums."
title: "Cathedral Bells Inside a Rave"
lyrics: ""
instrumental: true
