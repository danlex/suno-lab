notes: "v111 — ORCHESTRAL PASSACAGLIA. Second consecutive pure-orchestral architecture after v110 Bolero, but inverted form. Bolero = melody constant, orchestration grows. Passacaglia = bass constant, upper voices transform across variations. RESEARCH: Brilliant Classics Basso Ostinato overview (fixed bass motive, set of variations developing improvisatorily, repetition from Gregorian chant through minimalism), MusicTech Natalie Holt interview on Loki score (used Hardanger fiddle, nyckelharpa, Ondomo/Ondes Martenot for Nordic folk textures + early electronic voice for character Sylvie's Frigga connection), Wikipedia passacaglia (Baroque dance form, fixed bass, triple meter, variations increase in tension). LEARNED: (1) Passacaglia architecture — 8-bar ground bass repeats unchanged while the upper voices transform across 12 variations. The obsessive drive of repetition is the emotional engine. (2) Nyckelharpa = Swedish keyed fiddle with sympathetic strings producing natural spectral reverb, medieval origin. Never used in 110 prompts. (3) Hardanger fiddle = Norwegian violin with a second set of understrings ringing above each note, ghost overtones. Never used. (4) Ondes Martenot (via Ondomo in Loki) = 1928 proto-electronic voice, glides between pitches like disembodied soprano. Never used. IMPROVED: Three-soloist architecture (nyckelharpa + hardanger fiddle + ondes martenot, all haunting, all unused) layered over a passacaglia structure (twelve variations of mounting intensity over a descending chromatic ground bass) in G minor → Ab minor half-step at climax. 941 chars."
