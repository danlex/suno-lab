style: "Film score for Kakhetian chapel dawn — Georgian sacred polyphony, dawn mist over Alazani valley, candlelight in cold stone. 65 BPM, E minor Dorian sacred mode. Female soprano carries the high melodic arc above a sustained low string bani drone (cello and double bass open-fifth); cor anglais weaves bent-pitch modal ornament between. Three voices: bani drone as unmoving foundation, cor anglais middle voice threading modal color, soprano ascending through Dorian inflections. Polished studio mix, wide stereo stage, deep low-end definition in the drone bed. At climax the key lifts from E minor to F minor — all three voices converge in unison fortissimo, then open into three-part open-fifth harmony and fade. NOT Russian liturgy, NOT Bulgarian voices, NOT Mongolian throat-singing, NOT bel canto, NOT Celtic folk, NOT Gregorian plainvoice. No guitars, no rock drums, no pipe organ, no synthesizers, no Western leading-tone resolution."

