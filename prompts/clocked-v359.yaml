notes: |
  Technique: hard house is a UK sub-genre of house music characterised by a hard, driving
  four-on-the-floor kick and the defining "donk" — a heavily compressed, distorted synth
  stab that hits every offbeat (the "and" of every beat), creating an unrelenting 8-note
  stab pattern per bar. It emerged from northern England's rave circuit in the late 1990s
  and early 2000s and remains a pillar of UK rave culture, loved for its confrontational
  physicality and euphoric directness.

  Concept source: hard house / donk as a genre DEBUT in the catalog, built around a
  pre-validated hook ("every bone a clock") scoring 21/25, with the purity-versus-density
  contrast as the signature — a clean, high, pure female vocal line riding above the
  compressed donk stab grid, with the hook's descending fifth (B5 to E#4) doubled by
  celesta an octave higher.

  Composer-omission: this cycle echoes the northern-rave hard house producers of
  2001–2010 whose names are omitted per house policy. The nyckelharpa melody and celesta
  doubling wholly reframe that palette with acoustic instruments those producers never
  employed, making this compositionally distinct.

  Duration strategy: BPM 140 is squarely in the proven 130–160 duration band where bar
  counts translate reliably to wall-clock time. At 140 BPM: 35 bars/minute. Total lyric
  bar count: 8+16+8+16+8+24+8+8+8+8 = 112 bars ≈ 3:12 theoretical; playbook moves
  applied push render toward 3:00+. Duration levers: (1) explicit lyric-free Vamp
  section at 1:36, 24 bars (~41 seconds, within the 30-50s target); (2) Build → Density
  re-entry frisson stack at 2:17–2:31 (no [Silence] tag per feedback_silence_gate_truncates
  — instead, offbeat stabs CUT and full grid SLAMS back, implemented entirely in the colon
  content of the bracket); (3) last lyric timestamp at 2:45, anchoring the render close
  to 3:00+; (4) Outro at 2:59. Production tokens used: polished studio mix, deep
  low-end definition, wide stereo stage. Sentence case throughout. Atmospheric-first
  opening. Five inline negatives close the style.

  Non-formulaic climax: the density re-entry at 2:31 removes all offbeat donk stabs,
  leaving only kick and reverb tail — then the full stab grid SLAMS back at +3dB on beat 1
  exactly as the hook's "clock" lands. NOT a key change, no [Silence] metatag. This is
  the hard house equivalent of a Drop, implemented via bracket content instruction rather
  than a dead-stop silence marker that would trigger Suno's truncation gate.

  Trio instrument roles and gaps (confirmed via novelty_surface.json):
  - Nyckelharpa (last used v335, gap 24): bright Nordic keyed bowed string carrying the
    hook melody; its buzzing, reedy timbre cuts through the distorted stab grid with an
    ancient-meets-rave contrast that defines the track's identity. Body voice.
  - Celesta (last used v339, gap 20): crystalline bell-piano doubling the hook an octave
    higher; sits above the frequency range of the donk stabs, adding a spectral shimmer
    that makes the hook feel simultaneously delicate and irresistible. Spectral voice —
    the single spectral instrument in the trio, within the ≤1 spectral limit.
  - Bass trombone (last used v319, gap 40): low-brass growl reinforcing the sub-physical
    weight of each donk impact; its smeared legato tone contrasts with the stab's sharp
    transient and gives the low end an organic anchor beneath the electronic grid. Body voice.

  Trio body-voice count: 2 body (nyckelharpa, bass trombone) + 1 spectral (celesta).
  Satisfies the ≥2 body voices rule.

  Novelty claims: hard house / donk is a catalog DEBUT genre — no prior cycles have used
  it. The "every bone a clock" hook (21/25 score, highest in v359 cycle) is built into
  the architecture rather than added as decoration. BPM 140 confirmed new to the catalog.
  B major is a confirmed fresh key choice. Title "Clocked" is one English word, resonates
  with both the clockwork lyric imagery and rave slang ("getting clocked" = being seen /
  hit hard). Density re-entry climax is a structural innovation distinct from the
  Build/Silence/Drop stack and the half-step modulation cliché.

