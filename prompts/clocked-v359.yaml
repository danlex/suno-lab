title: "Clocked"
instrumental: false
vocal_gender: female

style: |
  Hard house rave energy — bone-deep and relentless — one pure female voice floating clean above a distorted stab grid. Hard limiting, tight sidechain, wide stereo spread. Four-on-the-floor kick; hard distorted donk stab on every offbeat, 1-and-2-and-3-and-4-and; rolling bassline churning beneath. Nyckelharpa carries the hook with bright Nordic urgency. Celesta doubles an octave higher, crystalline and piercing above the density. Bass trombone descends slow beneath the hook, legato against the stab grid's sharp transients. B major, 140 BPM. Purity-versus-density is the signature: voice rises clean while the stab grid hammers. At the climax all offbeat donk stabs cut out — kick and reverb tail only — then the full grid slams back at full force on beat 1 as the hook's final note lands. Underscore for a northern rave floor — body clock locked, sweat and cold concrete. No guitars, no rap vocals, no rock drums, no pipe organ, no synthesizers.

lyrics: |
  [Intro: kick and donk stab grid, nyckelharpa enters on hook motif, 8 bars, 0:00]

  [Verse 1: nyckelharpa melody, celesta shimmer, bass trombone low, 16 bars, 0:14]
  Joints ticking over
  Ribs a counting frame
  Spine the pendulum
  Skull full of the same

  [Hook 1: nyckelharpa and celesta, stab grid full, 8 bars, 0:41]
  Every bone a clock

  [Verse 2: grid tightens, bass trombone countermelody, 16 bars, 0:55]
  Sweat cold on the neck
  Lights cut without grace
  Two hundred bodies locked
  To the same locked pace

  [Hook 2: celesta one octave up, 8 bars, 1:22]
  Every bone a clock

  [Vamp: lyric-free, donk grid full, nyckelharpa over hook, 24 bars, 1:36]

  [Build: grid locks hard, bass trombone rises, nyckelharpa ascending, 8 bars, 2:17]

  [Density re-entry: offbeat stabs cut to kick and reverb tail — then full grid slams back on beat 1, 8 bars, 2:31]
  Every bone a clock

  [Final hook: celesta high, full grid, 8 bars, 2:45]
  Every bone a clock

  [Outro: stabs fade, kick holds, 8 bars, 2:59]

  [End]

