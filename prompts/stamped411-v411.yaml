notes: |
  Gqom is a South African electronic club music form that emerged from a South African coastal city in the early 2010s, built on rolling tom-heavy patterns running in broken polyrhythmic grids rather than standard 4-on-the-floor house conventions — the defining characteristic is the 3-against-4 stuttered cross-rhythm, sparse low sub-bass drops, and wide percussive room around every hit. Concept source: bitter relief — the cold-administrative act of closing something by sheer bureaucratic will (stamping a photograph, filing a drawer, sealing an envelope) as a form of self-protection from grief; the deliberate non-witnessing of "I didn't look" as the hard-won exhale.

  This cycle echoes a strand of austere South African coastal-origin electronic minimalism without naming any artist. The catalog has no prior gqom entry; this is a genre-family debut.

  Duration strategy: 124 BPM sits within the 130-160 proven duration band's lower edge, aided by the explicit ~18-bar instrumental vamp (toms multiply + dark synth stab, no vocal) mid-song as the primary duration lever. Final sung line anchored to 2:45 in the outro tag to push Suno's render toward 3:00+. Section arc runs 10 brackets with bar counts throughout: parametrized colon-syntax lyrics provide per-section length targets that v5.5 honors. Three production tokens embedded in style: polished studio mix, deep low-end definition, wide stereo stage. Sentence case throughout style; atmospheric-first opening leads with the dark pressure and broken grid before naming BPM/key. Five inline negatives close the style. exclude_styles blocks genre drift (amapiano, house, kwaito, trap, cinematic ambient, elegiac) without suppressing the vocal parts or sub-bass electronics needed for the gqom timbre.

  Climax device: rhythmic-convergence freeze (catalog fresh, not on the used list). The polyrhythmic rolling toms accumulate across a 12-bar Build, then every tom layer locks simultaneously onto one heavy unison downbeat — all cross-rhythms collapse to a single hit — and the groove strips to bare sustained sub-bass (no [Silence] tag; no true silence) under the naked returning hook "The ink is dry — I didn't look." The full broken grid then rebuilds across the Drop section. No key change.

  Chorus pre-scored as a unit (23/25 rating): CALL "I stamped it CLOSED across your photograph" — opens on scale degree 5 (F4), 'STAMPED' is a quarter-note hit that drops a minor-3rd to degree 3 (Db4) on 'CLOSED', then 'a-cross your pho-to-graph' walks the natural-minor descent Db-C-Bb-Ab-Bb landing on root, ~1.5 bars of broken grid. ANSWER "The ink is dry — I didn't look" — tight three-repeated-note figure on tonic Bb ('the INK is DRY', near-spoken), then 'I did-n't LOOK' steps up to degree 2 (C) and skips to degree 4 (Eb) — hanging unresolved. Plosive-heavy CALL punches against tom hits; unresolved ANSWER hangs in the sub-bass space. Style: 947 chars.
