name: "stamped411"
version: 411
style: "Dark cold gqom club pressure — rolling toms stutter in a 3-against-4 broken grid, sparse sub-bass drops carve vast room, a sung female topline delivers short incantatory phrases into near-empty space. Wide stereo. Cold detuned synth stab on the vamp offbeat. 124 BPM, Bb minor. Tom pattern never locks to 4-on-the-floor: triplet cells against the quarter pulse, wide room around each stroke. Sub-bass enters in sparse drops, not continuous. Vocal sits exposed and cold — a real dark minor melody, not chant. At the climax the cross-rhythms build to a density wall, then all tom voices lock simultaneously onto one solid unison downbeat — every polyrhythm collapses to a single hit — and the groove strips to bare sustained sub-bass holding under the returning hook, then the broken grid rebuilds. Sub-bass sustains through the freeze; no key change. No guitars, no rock drums, no pipe organ, no acoustic instruments, no 4-on-the-floor kick."
title: "Stamped411"
lyrics: |
  [Intro: 0:00, toms, sub-bass]

  [Verse 1: 0:12]
  Cleared the drawer in the afternoon
  Tagged each item, sealed the room
  Forwarded the last address
  Filed it under nothing left
  Pressed the stamp into the wax
  Locked it — didn't look back

  [Pre-Chorus: 0:38]
  The ledger closed at 4 PM
  I initialled every page

  [Chorus: 0:50]
  I stamped it CLOSED across your photograph
  The ink is dry — I didn't look
  (CLOSED) (didn't look)

  [Verse 2: 1:10]
  Wiped the counter, rinsed the cup
  Signed the last line in the dark
  Didn't read it from the start

  [Pre-Chorus: 1:28]
  The envelope went in the bin
  Still smelled like discipline

  [Chorus: 1:40]
  I stamped it CLOSED across your photograph
  The ink is dry — I didn't look
  (CLOSED) (didn't look)

  [Vamp: 1:56, polyrhythm, synth stab, no vocal]

  [Build: 2:34]

  [Freeze: 2:44, toms collapse, sub-bass sustains]
  The ink is dry — I didn't look

  [Drop: 2:52]
  I stamped it CLOSED across your photograph
  The ink is dry — I didn't look
  (CLOSED) (didn't look)

  [Outro: 3:08]

  [End]
