style: "Warm light through linen curtains — just enough space to breathe. Polished studio mix, lush acoustic ambience, warm tape saturation. F-sharp minor with ninth and major-seventh jazz extensions, lifting to G minor at the final chorus, 117 BPM bossa-pop groove with a gentle nylon-guitar clave feel. A close-miked English female voice — breathy, jazz-cool — sings over finger-picked nylon-string guitar and brushed jazz kit. Viola da gamba carries the walking-bass line, warm bow and honeyed low depth. Bass flute breathes through the instrumental bridge, airy and legato over seventh-chord changes. Crystal marimba shimmers high and vibraphone-cool, threading through the chorus hooks. Lush ninth chords, 6/9 voicings — sophisticated, warm. Bridge through 2:00, final chorus 2:30, ring-out fade near 2:55. Underscore for a late-night quiet-elegance scene. No percussive fiesta energy, no Latin-pop, no big brass, no distorted guitars, no autotune."

lyrics: |
  [Nylon guitar opens, 0:00]
  Just the light and the chord
  And the window half-drawn

  [Verse — vocal enters, 0:28]
  You still fold your sleeves the same
  Leave your coffee cup too close
  I've been reading all your quiet
  Like a language I almost know

  [Chorus — full groove, jazz chords, 0:56]
  Honey in the half-light
  Ninth chord, open door
  You're the only easy thing
  I've been waiting for
  Honey in the half-light
  Stay a little more

  [Verse two, 1:20]
  The bass flute finds the window
  Everything is borrowed time
  The crystal marimba shivers low

  [Chorus reprise, 1:40]
  Honey in the half-light
  Ninth chord, open door
  You're the only easy thing
  I've been waiting for

  [Instrumental bridge — bass flute, viola da gamba, 2:02]

  [Final chorus — voice and nylon guitar, 2:32]
  Honey in the half-light
  Ninth chord, open door
  You're the only easy thing
  I've been waiting for
  Honey in the half-light

  [Ring-out — sustained chord fades, 2:50]

  [End]

