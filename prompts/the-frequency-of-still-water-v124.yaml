notes: "v124 — ORCHESTRAL AMBIENT RICERCARE. First ricercare form and first ambient drone genre in 123 prior prompts. Ricercare = 'to search' in Italian, a Renaissance form where a theme is explored slowly through imitation. Combined with ambient drone aesthetics: sustained tones, gradual textural evolution, meditative pacing. RESEARCH: MasterClass drone music guide (2026) — sustained tones producing ambient, minimalist soundscapes. ModeAudio orchestral textures — concert orchestra transformed into 'undulating ocean of refracting audio.' Max Richter nominated for 98th Academy Awards 2026 in ambient/minimalist territory. Contemporary ambient = subtle evolution over time, changes in tone and filter. INSTRUMENTS: Hardanger fiddle (v111, 12-version gap) = Norwegian fiddle with sympathetic resonance strings underneath the played strings — natural drone instrument, each note produces a halo of overtones. Added 'Norwegian folk' to exclude_styles. Mbira (v109, 14-version gap) = African thumb piano, tiny metallic tines plucked in repetitive patterns, meditative and hypnotic. Added 'African folk' to exclude. Oboe d'amore (v110, 13-version gap) = Baroque alto oboe, slightly lower and warmer than standard oboe, the 'oboe of love.' The trio covers bowed-drone / plucked-metallic / sustained-woodwind. NOVELTY: Ricercare = new form. Ambient drone = new genre. 50 BPM = never used. F# major (×1) = near-virgin key. Return to major key after v123's minor. 943 chars."
