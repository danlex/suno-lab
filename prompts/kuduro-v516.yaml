style: "Bright high-energy kuduro diva-pop dance: a hard electronic downbeat, a breath of gap, then a stutter on the offbeat — locomotive propulsion that moves the body before the mind agrees. Punchy synth-bass stabs lock into the pocket; bright cowbell and hand-percussion hits ring across the groove; warm bright synth pads shimmer underneath. The voice is a genuine bright female diva — held notes, wide upward leaps, a real singable melodic line riding the stutter-kick, not a chant, not a shout. B major, 128 BPM. Polished studio mix with deep low-end definition and wide stereo stage. The chorus is a cumulative non-modulation drop: full stacked groove, synth pads at peak, cowbell front and bright, harmonized echoes cascading home. The close locks the stuttered kick and bass steady in the pocket — a controlled triumphant finish, not a fade. No guitars, no rock drums, no acoustic instruments, no orchestral strings, no pipe organ."

lyrics: |
  [Intro: stuttered kick and cowbell groove, 8 bars]

  [Verse 1: bright diva over stutter-kick and bass stabs]
  The signal starts at the base of my neck
  A half-second tip and I'm already set
  Feet barely touching, weight leaning forward
  The room blurs to light and the beat keeps order

  The body decides before the mind can vote
  Every single stutter hits a different note
  I'm not thinking now, I'm just following through
  The groove pulls me somewhere my worries never knew

  [Pre-Chorus: synth pads swelling in, building]
  Something moves me low
  Something bright and slow
  Then the drop arrives
  And every cell comes alive

  [Chorus: full drop, bright sung hook]
  Shake me like a tambourine
  Like a tambourine
  Shake me like a tambourine
  Bright and ringing, bright and clean
  Shake me, shake me, can't you see
  This body wants to be free
  Shake me like a tambourine

  [Verse 2: fuller groove, diva melodic line lifting]
  Loose in the limbs and the light's going gold
  The stutter hits harder, I'm letting go of control
  I was holding a thought but the cowbell cleared it
  Whatever I carried — the kick just cleared it

  A locomotive forward, never looking back
  The synth-bass stabs keep me on the track
  I ride every gap, I ride every beat
  The floor falls away underneath my feet

  [Pre-Chorus: swell building to the drop]
  Something moves me low
  Something bright and slow
  Then the drop arrives
  And every cell comes alive

  [Chorus: second full drop, stacked groove]
  Shake me like a tambourine
  Like a tambourine
  Shake me like a tambourine
  Bright and ringing, bright and clean
  Shake me, shake me, can't you see
  This body wants to be free
  Shake me like a tambourine

  [Percussion and Synth-Stab Break: stuttered kick, cowbell, bass stabs, pad swells — groove locked, never silent, 14 bars]

  [Final Chorus: cumulative stack, harmonized backing echoes on descent]
  Shake me like a tambourine
  Like a tambourine
  Shake me like a tambourine
  Bright and ringing, bright and clean
  Shake me, shake me, can't you see
  This body wants to be free
  Shake me like a tambourine
  (tam-bou-rine)
  (tam-bou-rine)
  Shake me like a tambourine

  [Outro: stuttered kick and bass locked in pocket, controlled close, 8 bars]
  [End]

