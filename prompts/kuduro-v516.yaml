notes: |
  v516 TOURNAMENT WINNER (inline-judged ~85/100; beat sibling candidate B "hook-bookended cumulative momentum-build" — both clean on the electronic/synth negatives audit and both had genuinely SUNG melodic hooks [not chant], but A won on THREE counts that matter most for this chant-prone lane: (1) WRITING DEPTH — A has two full 8-line verses with vivid varied kinetic imagery ["I was holding a thought but the cowbell cleared it"; "The floor falls away underneath my feet"] and a chorus that DEVELOPS the hook into a full melodic section, whereas B's verses were thin 4-liners and its chorus line "Hold the note and let the stutter hit" was on-the-nose [describing the music, not an image]; (2) SUNG-MELODIC SAFETY — A carries more genuinely-sung melodic content, the key insurance against the chant-short-render failure this lane risks; (3) DURATION insurance. B's hook-bookended cumulative architecture was more novel but that single axis didn't overcome A's stronger execution). Lane: KUDURO DIVA-POP (stuttered-kick electronic dance + pop-diva) — never used in v462-v515; danceable/energetic FEMALE — contrast to v515's raw fuzz-rock male; reconciled to a MID-danceable SUNG diva-pop to distance it from v510's fast-electronic-female jungle family (kuduro's stuttered-kick locomotion + cowbell + synth-bass-stabs is a distinct rhythm/palette from jungle's Amen-breakbeat + siren-stabs). Our audience likes danceable.

  HIGH VARIANCE: bright genuinely-SUNG FEMALE diva (kinetic/joyful — distinct from the recent females: warm philly-soul lead v514, confessional-to-belted torch v512, soaring-legato jungle v510), mid-danceable 128 BPM (breaks from the recent 146/103/141/75/119 cluster; novelty gap 34, the freshest in kuduro's 128-135 band), B MAJOR (bright/golden/uplifting, novelty gap 25 — not enharmonic to any recent key), bright electronic-dance production. Vocal-gender alternation M/F held across v477-v516 (v515 male -> v516 female).

  RECONCILIATION (heavy — the researcher couldn't run a live WebSearch [API overloaded, fell back to training knowledge] and the concept carried three risks): (1) kuduro's traditional CHANT/shout vocal is a short-render risk -> leaned fully into the "diva pop" fusion: a genuinely SUNG bright melodic hook + sung verses, NOT chant; (2) the researcher's arc_hint had a HALF-STEP KEY LIFT (penalized) -> dropped -> non-modulation cumulative-density climax; (3) its "strip to kick + voice only" exposed moment (near-silence truncation risk) -> replaced with a TEXTURED percussion/synth-stab break (kick + cowbell + bass + pad swells, never silent). Took BPM 128 (genre needs 128-135; novelty's top offer was 124, so took the freshest in-idiom value in the kuduro band, clear of banned 141/146) + B major (novelty gap 25). Dropped the novelty's steelpan (off-genre). Lyrics English, motion/body theme, NO Portuguese, NO place-names, NO artist names.

  HOOK: "Shake me like a tambourine" (hook-writer 21/25) — the body asking to be shaken like its own driving hand-percussion instrument (self-specific to the kuduro cowbell/hand-perc texture). Contour: tonic ^1 (B) on "Shake me", perfect-fifth leap up to ^5 (F#) on "like a", stepwise cascade ^4-^3-^2-^1 across "tam-bou-RINE" landing on a long held B; the wide upward LEAP is the melodic event that FORCES genuine singing (flatten it and the hook dies — it cannot be chanted), the descent is the satisfaction, "RINE" held across the stutter-kick re-entry. The chorus develops it: "Bright and ringing, bright and clean / Shake me, shake me, can't you see / This body wants to be free." Kinetic verse writing: "The signal starts at the base of my neck / A half-second tip and I'm already set"; "The body decides before the mind can vote."

  ARCHITECTURE — classic dance verse/pre-chorus/drop-chorus song, non-modulation cumulative-density climax: [Intro] stuttered kick + cowbell groove (textured) -> V1 (bright sung diva over stutter-kick + bass stabs, 8-line) -> Pre-Chorus (pads swelling) -> Chorus/Drop (SUNG hook, full stacked groove, cowbell bright) -> V2 (fuller, 8-line) -> Pre-Chorus -> Chorus/Drop -> described [Percussion and Synth-Stab Break] (stuttered kick + cowbell + bass stabs + pad swells, groove locked, 14 bars — textured duration lever, never silent) -> [Final Chorus] cumulative stack + harmonized backing echoes of "(tam-bou-rine)" on the descent, no key change -> [Outro] stuttered kick + bass locked in the pocket, controlled triumphant close (NOT a fade-to-silence, NOT a mid-phrase cut, NOT dissolution).

  DURATION GUARD (learnings): the genre's chant vocal renders short, so this leans on a genuinely SUNG melodic hook + two full 8-line verses + developed choruses + a described textured 14-bar break (never silent) + every section textured (groove always driving) + a driven groove close. 128 BPM danceable band. ~96 bars.

  INSTRUMENTS: STUTTERED chopped-KICK groove (hard electronic downbeat, gap, offbeat stutter — described sonically, NO brand/model names) + punchy SYNTH-BASS stabs + bright COWBELL/hand-percussion hits + warm bright SYNTH PADS + bright female diva vocal. BPM 128 (novelty gap 34) and B major (novelty gap 25).

  NEGATIVES AUDIT (feedback_negative_prompt_contradiction — v502/v513 lessons): does NOT exclude vocals/singing/electronic/synth/synthesizer/dance/kuduro/electronic-dance/drum-machine (all core to this ELECTRONIC DANCE lane — excluding "electronic"/"synth" would be the fatal v502/v513-class mistake). Excludes only genuine drift (rock/metal/acoustic-guitar/folk/country/jazz/classical/orchestral-strings/blues/reggae/lo-fi/ambient-drone/trap/Arabic/world/hard-autotune/guitar-solo/heavy-metal/punk/grunge/indie-rock/bossa-nova/flamenco/opera). Style negatives: no guitars, no rock drums, no acoustic instruments, no orchestral strings, no pipe organ. English only, no place-names, no nationality/ethnicity words, no Portuguese/other-language markers, no artist names. Sung lines clean of leaked stage-directions/instrument-cues/music-theory (v503/v505/v508/v511-siblingB/v514-siblingB lessons) — the break is a properly described lyric-free bracket; "(tam-bou-rine)" is a genuine sung backing vocable.

