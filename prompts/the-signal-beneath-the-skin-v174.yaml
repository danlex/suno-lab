title: "The Signal Beneath the Skin"
lyrics: |
  [Deep Bass Pulse and Atmospheric Pads]
  There's a frequency the world forgot
  Buried underneath the noise
  A signal older than the satellites
  Older than the voice

  [Glitchy Beats and Strings Enter]
  I feel it humming in my fingertips
  I feel it burning in my spine
  Something ancient waking up inside
  Crossing every line

  [Full Orchestra Over Electronic Bass - Massive]
  The signal beneath the skin
  The signal beneath the bone
  We are all receivers
  And we've never been alone

  [Stripped Back - Voice and Bass Only]
  Turn off the screens
  Turn off the light
  Listen

  [Explosive Hybrid Climax - Everything]
  The signal beneath the skin
  Has been singing all along
  Every heartbeat is an answer
  Every breath has been a song

  We are the signal
  We are the signal

  [End]
