notes: |
  Hindustani raga filmi orchestral: a compositional tradition from North Indian classical music in which raga frameworks — modal scales with prescribed ascending and descending pitch sequences, characteristic ornamental figures, and time-of-day emotional associations — are arranged for a hybrid ensemble combining Indian instruments (sitar, tabla, sarangi, harmonium) with Western string orchestra and choir. The raga deployed here is Bhairavi-adjacent in color: the characteristic lowered second and sixth scale degrees give the mode its characteristic quality of bittersweet tenderness associated with the closing hours of a musical gathering.

  Concept source (researcher): "DENSITY MANDATE — six instrument families simultaneously active throughout to guarantee 3:00+ duration; sitar + sarangi (120-cycle revival) + tabla + harmonium + Western strings + massed female choir Aa vocalise; C# minor / 96 BPM; Mumbai golden hour at the banyan tree, ancient roots, raga twilight."

  This prompt follows in the tradition of North Indian classical arrangers who worked extensively with studio orchestras — a body of work whose greatest practitioners are not named here per catalog discipline. The massed-choir Aa vocalise architecture is drawn specifically from the tradition of wordless unison female choir as orchestral texture rather than as solo performance, a distinction that separates this from both solo playback-singer tradition and polyphonic choral writing.

  Duration strategy: BPM 96 sits in the slow band (90–115), where the playbook ceiling is approximately 3:30 regardless of bar count. Total lyric bar count is 220 bars. At the data-calibrated 35% efficiency for this BPM band, 220 bars at 96 BPM targets approximately 3:00–3:30 mean render — consistent with the v254 precedent (106 BPM, 220 bars, 3:24 mean). The density mandate (six simultaneous instrument families) functions as an additional duration driver: Suno's classifier reads multi-family stack as full cinematic ensemble production and resists early truncation. Production tokens applied: polished studio mix, wide stereo stage, lush acoustic ambience. Sentence case throughout; atmospheric-first opening; no [Silence] metatag (hardened rule per feedback_silence_gate_truncates.md). The colon-syntax lyrics with bar counts provide per-section length scaffolding. No ALL-CAPS form labels.

  Instruments with catalog gaps:
  - sitar (catalog debut — zero prior appearances in 309 versions): Hindustani plucked lute with movable frets and sympathetic resonance strings, played with a wire plectrum; opens alone in the alap section stating the raga motif with characteristic ornamental bent-string curves, remains present throughout as the primary melodic voice.
  - sarangi (last v190, gap 120 — deep revival): Hindustani bowed lute with approximately 35 sympathetic resonance strings that shimmer around every bowed note; enters after the tabla-harmonium lock-in, bows a countermelody above the sitar, exchanges phrases with sitar in the contrast section.
  - tabla (catalog debut — zero prior appearances in 309 versions): paired Hindustani drums (dayan + bayan) played with fingers; provides the rhythmic teentaal cycle, paired here with dholak doubling for additional membrane-body weight.
  - harmonium (catalog debut as featured instrument — appeared in v276 only as supporting Bollywood-vocal pad, not featured): a reed organ imported to India in the 19th century, now central to Hindustani classical performance; sustains a low drone throughout, providing the harmonic foundation beneath all other voices.
  - Western string section (last v147, gap 163): full bowed string orchestra filling the mid-band; enters softly alongside the sarangi, swells through the choir-vocalise section, participates in the full tutti culmination.
  - massed female choir (50th orthogonal voice, 39th distinct language context): not individual singers but a unified massed sonority holding the open Aa vowel in long unison tones, with occasional soprano lift above the mass on emotional peaks; the choir is the voice architecture rather than a lead character, distinct from all 49 prior voice characters in catalog.

