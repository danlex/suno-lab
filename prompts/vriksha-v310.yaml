style: "Film score for a Mumbai twilight raga scene — golden-hour warmth over ancient banyan roots, vendors closing as the city hum dissolves into raga twilight. Six instrument families in constant density, never thinning, sustaining harmonic weight throughout. Polished studio mix, wide stereo stage, lush acoustic ambience. C# minor with lowered second and sixth degrees, Phrygian-adjacent modal color, 96 BPM. Sitar opens alone at 0:00 tracing the raga motif with ornamental bent-string curves; tabla and harmonium enter at 0:45 locking the rhythmic cycle with a low drone beneath; sarangi bows a warm sympathetic countermelody above; the full ensemble rises into orchestral mass at 1:30 with open Aa vocalise lifting above the texture. At the culminating tutti at 2:30 the key lifts half a step to D minor. No guitars, no rock drums, no pipe organ, no synthesizers, no electric bass."

