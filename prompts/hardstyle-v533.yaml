notes: |
  Hardstyle euphoric rawstyle is a branch of hard electronic dance music originating in the Netherlands and Belgium, characterized by distorted reverse-bass kicks (a kick drum pitch-swept downward through a bass tone), screeching hard lead synths, and euphoric supersaw melody sections called the 'break' or 'euphoric build.' The sub-style known as rawstyle emphasizes harder, more aggressive kick textures and industrial screech leads. This prompt encodes the defining arc: hard-kick intro, verse build, euphoric break with supersaw + sung hook, reverse-bass drop, repeat with escalation, then a full-density instrumental vamp before the final hook and drop close.

  Concept source: festival-mainstage hardstyle at sundown — the collective defiant euphoria of 20,000 people in the moment before the drop, built around the ownable hook "Scar the horizon" (punch-low tonic on 'Scar,' rapid eighth-step up on 'the,' held perfect fifth on 'hori-zon').

  This echoes the tradition of Dutch and Belgian hard-electronic producers whose work defined the genre across the 2000s and 2010s — none named per blocklist discipline.

  Duration strategy: parametrized colon-lyrics with explicit bar counts per section; wide stereo stage + deep low-end definition production tokens; a full hard-kick + screech-lead instrumental vamp (~30-40s, beat-driven and dense, NOT ambient) placed mid-song as the explicit duration lever; final hook + drop pushed to late in the arc (~2:40+ equivalent). The euphoric break is kept DENSE (supersaw + kick continuous throughout) to avoid the v527 truncation pattern where an exposed ambient breakdown caused early clip termination. No key modulation — energy and density are the climax drivers. BPM 150 puts this in the proven high-BPM duration band.

  Featured trio:
  - DISTORTED REVERSE-BASS KICK: the defining timbral signature; pitch-swept distorted kick provides the rhythmic spine and the drop impact
  - SCREECHING HARD LEAD SYNTH: industrial screech texture that locks the rawstyle energy between drops and drives the instrumental vamp
  - EUPHORIC SUPERSAW MELODY: layered detuned sawtooth chords that carry the emotional peak of the break and frame the sung hook

  Supporting: white-noise risers, gated reverb crashes.

  Novelty claims: hardstyle/rawstyle genre new to v533 catalog; 150 BPM; E minor; festival-sundown-defiance scene; "Scar the horizon" hook contour (punch-low then slingshot-fifth release).

  Style char count: 945.
