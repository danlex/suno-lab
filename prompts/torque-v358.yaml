style: |
  Rolling deep-club groove, springy and hypnotic — tech-house where the bassline does the talking. Polished studio mix, deep low-end definition, wide stereo stage. Four-on-the-floor kick locks tight, hi-hats swing, claps snap on the two. Filtered bassline coils and springs; bright organ stabs stutter between beats. Bass clarinet lays a smoky low-mid riff beneath the grid. Mbira delivers glinting percussive stabs cutting through like a hi-hat with soul. Mellotron breathes warm choir-pad shimmer underneath. B-flat minor lifting to B minor at the final drop, 126 BPM. Chopped clipped female vocal stabs ride the groove with attitude. At the midpoint a rising filter sweep strips to bassline, lone vocal stab, and open hats — raw and tense — before the groove slams back a half-step harder. Underscore for a midnight club floor — pavement heat rising, bass felt in the ribs. No guitars, no rock drums, no pipe organ, no synthesizers, no live strings.

lyrics: |
  [Intro: kick and bassline, 0:00]

  [Verse 1: bass clarinet riff, mbira stabs, 0:14]
  Come in close, feel the pull
  Body warm, bass is full
  Clock the room, hold the space
  Move your feet, set the pace

  [Chorus: organ stabs, 0:38]
  Take it down to the floor
  Don't need nothing more
  Bassline calling, can't ignore

  [Verse 2: mbira locked, 1:02]
  Lights go low, grid is tight
  Hold the rhythm through the night
  Every kick is where it's meant
  Every hat is heaven sent

  [Chorus: full groove, 1:26]
  Take it down to the floor
  Don't need nothing more
  Bassline calling, can't ignore

  [Vamp: groove instrumental, 1:50]

  [Filter sweep: rising sweep strips layers, 2:15]
  Strip it back — strip it back

  [Breakdown: bare bassline and lone vocal stab, 2:22]
  Just the bass... just the bass...

  [Drop: full groove in B minor, half-step up, 2:32]
  Take it down to the floor
  Don't need nothing more
  Higher now, can't stop now
  Bassline calling, can't ignore

  [Outro: groove fades, 2:48]
  [End]

