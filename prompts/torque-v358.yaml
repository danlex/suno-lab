notes: |
  Technique: tech-house is a fusion of techno's propulsive four-on-the-floor grid and house
  music's swinging soulfulness — characterised by rolling elastic basslines, crisp hi-hat
  shuffles, filtered organ or synth stabs, and chopped vocal hooks riding over a deep,
  club-ready mix. It emerged from late-1990s UK and European underground dancefloor culture
  and has remained a persistent force in club music through the 2020s.

  Concept source: a mid-club midnight groove built on a coiling filtered bassline with a
  mid-track filter breakdown frisson construction — rising sweep strips to bare elements,
  then the full groove slams back a half-step higher and harder, with chopped female vocal
  hooks and three acoustic texture instruments over the electronic bed.

  Composer-omission: this cycle echoes the elastic-bassline deep-club aesthetic of certain
  UK and European tech-house producers from the 2000s through 2020s whose names are omitted
  per house policy. The bass clarinet riff and mbira stabs wholly reframe that palette with
  organic acoustic textures those producers never employed, making this compositionally distinct.

  Duration strategy: BPM 126 sits at the lower edge of the proven 130-160 duration band
  but close enough to benefit from explicit timestamped sections. Duration levers applied:
  (1) explicit lyric-free [Vamp] at 1:50 running approximately 25 seconds before the filter
  sweep sequence; (2) filter sweep + breakdown + drop frisson stack covering 2:15–2:48,
  giving dense sectional scaffolding in the back half; (3) last lyric timestamp at 2:48
  anchors the render close to 3:00+. Production tokens: polished studio mix, deep low-end
  definition, wide stereo stage. Sentence case throughout. Atmospheric-first opening names
  genre, mood, key, and BPM within the first ~130 characters. Five inline negatives close
  the style. No [Silence] metatag used — per feedback_silence_gate_truncates, the filter
  breakdown retains the bassline and hats as a continuous floor.

  Frisson construction (the centerpiece): at ~2:15 a rising filter sweep strips the layers
  — not a dead stop but a dramatic thinning to bassline, lone vocal stab, and open hats
  (raw and tense). At 2:32 the full groove slams back into B minor (a half-step up from
  B-flat minor) harder and more relentless, completing the filter-breakdown-drop arc. This
  is the tech-house equivalent of the Build/Silence/Drop playbook stack, adapted for the
  vocal-club format without the literal [Silence] metatag.

  Trio instrument roles (all confirmed first-use in catalog via novelty_surface.py):
  - Bass clarinet (first use, gap = entire catalog): smoky low-mid organic riff beneath
    the electronic grid; its woody warmth contrasts with the punchy synthetic kick and
    stabs, adding distinctiveness no standard tech-house instrument provides. Body voice.
  - Mbira (first use, gap = entire catalog): bright metallic percussive pluck stabs acting
    like a hi-hat with melodic personality; punches through the mix with a bright shimmer
    that differentiates this track from standard organ-stab tech-house. Spectral voice —
    the single spectral instrument in the trio, within the ≤1 spectral limit.
  - Mellotron (first use, gap = entire catalog): warm choir-pad shimmer breathing underneath
    the groove; provides subtle textural depth and a haunting undertone without cluttering
    the rhythmic pocket. Body voice.

  Trio body-voice count: 2 body (bass clarinet, mellotron) + 1 spectral (mbira). Satisfies
  the at-least-2-body-voices rule.

  Novelty claims: all three instruments are catalog debuts (first use ever), making this
  the highest possible novelty score on the instrument dimension. Tech-house as primary
  genre anchor is new to recent cycles (v324+ has been Latin sad-trap, anime ballad,
  Afro-soul, K-pop, indie dream-pop, dark-techno, nu-disco, UK garage — tech-house is a
  distinct lane). BPM 126 is confirmed new to the catalog. B-flat minor is a fresh key
  choice. Title "Coil" is one English word, evokes the rolling bassline, never used before.

