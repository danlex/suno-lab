notes: |
  Riddim dubstep is a subgenre of dubstep distinguished by its signature triplet metallic wobble bass, relentless rolling percussion density, and half-time groove where the heavy snare lands on beat 3. Unlike standard dubstep, riddim drops are designed to be continuous and crushing rather than single-hit shock moments — the bass never stops twisting. The half-time feel sits at 140 BPM notated but is experienced as 70 BPM in the body, creating a slow-motion menace that rewards vocal lines with extra rhythmic space.

  Concept source: a demolition zone at night, a woman at the controls of a wrecking crane, gleefully flattening everything with pure unbothered destructive catharsis. The ownable hook "Sweetly, it splinters" (scored 22, strongest of three lanes) holds its character through a specific melodic contour: G4 held two beats on 'sweetly' (tender linger), quick passing F#4 on 'it', falling minor third to D4 on 'splinters' with the 'spl-' consonant cluster landing precisely on the half-time beat-3 snare. The tender adverb before onomatopoeic violence is the character — deadpan-cool, not belted, not shrill.

  This lane echoes the tradition of UK and US riddim producers who codified the triplet wobble and rolling-percussion grammar in the mid-2010s — without naming those practitioners.

  Duration strategy: parametrized colon-syntax brackets with explicit bar counts across 8 sections (8+16+8+12+8+32+8+16 = 108 notated bars at 140 BPM half-time, targeting ~3:00–3:20). The 32-bar [Dense Section] mid-song beat-driven instrumental is explicitly dense — rolling percussion and snarling wobble bass, not ambient — per the v527 lesson that sparse vamps truncate hard. Final hook pushed late. The vocal stays sung through every drop to prevent hollow-drop truncation (core lane requirement: voiced drops render full-length, vocal-chop-only drops truncate). Production tokens: polished studio mix, deep low-end definition, wide stereo stage. Style 947 chars, sentence case, atmospheric-first opening.

  Negative-prompt audit: does NOT exclude synthesizers, electronic, bass, or vocals. The triplet metallic wobble bass IS a synthesized sound — negating synths would destroy the genre. Does NOT put "vocals" or "singing" in exclude_styles. Negatives in exclude_styles cover genre drift only (ambient, techno, trance, jazz, classical, drum and bass, house, reggae, trap, hip-hop).

  Title: "Splinters543" — one word fused with version id, derives from the hook's onomatopoeic final syllable. E minor, 140 BPM (proven duration band for bar-count efficiency). Demolition-zone-at-night scene is unused in catalog. Riddim dubstep with sung-through drops is a lane variant not yet represented.

