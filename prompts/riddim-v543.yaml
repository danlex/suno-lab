style: "Gleefully-destructive riddim dubstep at 140 BPM in E minor — a wrecking crane in half-time, heavy as concrete, precise as spite. Signature triplet metallic wobble bass snarls through the low-end, twisting with menace and mechanical edge; rolling percussion fills every subdivision while the dark low-end shakes underfoot. A female vocal rides the drops with bratty, deadpan-cool poise — not belted, the tender delivery before onomatopoeic violence is the character. Dense and continuously arranged: topline stays sung through every drop, never hollow. Polished studio mix, deep low-end definition, wide stereo stage — demolition in high-fidelity. The groove never lets up; the mid-section escalates into rolling percussion and a snarling bass chase before the hook returns. Half-time snare on beat 3, the triplet wobble locks the grid, vocal lingers before the consonants crack. No guitars, no rock drums, no pipe organ, no ambient drift, no jazz."

lyrics: |
  [Intro: metallic wobble, half-time, 8 bars]

  [Verse 1: deadpan bratty vocal, 16 bars]
  The blueprint said don't — I read it twice
  Crane arm swings like a slow goodbye
  I charged it to the rubble account
  Nobody left me a forwarding address
  First wall's already mine

  [Drop 1: sung hook through wobble snarl, 8 bars]
  Sweetly, it splinters
  Sweetly, it splinters

  [Verse 2: gleeful, deadpan-cool, 12 bars]
  Nobody's watching but the dust agrees
  I signed the papers and I lost the keys
  Three floors gone and I'm not done yet
  Laughing where the lobby used to be

  [Drop 2: snarling bass, topline sung, 8 bars]
  Sweetly, it splinters
  Sweetly, it splinters
  (all of it)

  [Dense Section: rolling percussion, wobble bass, 32 bars]

  [Verse 3: minimal deadpan, 8 bars]
  Didn't hurt anyone — the building chose this
  Every bolt was tired anyway

  [Final Drop: full ensemble, sung hook late, 16 bars]
  Sweetly, it splinters
  Sweetly, it splinters
  Sweetly — it splinters
  Let it fall
  Let it fall

  [End]

