notes: "v125 — ORCHESTRAL PASSAMEZZO. Last unexplored classical form now complete (14 forms done). Passamezzo antico = Italian Renaissance dance with repeating ground bass pattern (i-iv-i-V-i-III-iv-i in minor) that cannot resolve — perfect for an 'obsessive pursuit' emotional territory. RESEARCH: Grokipedia + Wikipedia confirm 'passo e mezzo' ('step and a half'), 16th century Italian court dance, ground bass foundation enabling variation/improvisation above strict harmonic pattern. Antico variant = somber minor mode, introspective. Modern usage: Ammerbach arrangement for brass quintet (2011), Capella de Ministrers recording (2014). INSTRUMENTS: Balafon (v106, 18-version gap — DEEPEST currently available revival) = West African wooden xylophone, percussive and rhythmic. Hurdy gurdy (v113, 11-version gap) = medieval drone + melody instrument with buzzing bridge. Shakuhachi (v114, 10-version gap) = Japanese bamboo flute, breath-heavy, can cut jagged phrases. Three instruments from three different world traditions fused into orchestral passamezzo. Added 'African folk, medieval folk, Japanese folk, Renaissance fair' to exclude_styles to prevent any single world-music triggering. NOVELTY: Passamezzo = last unexplored form. 124 BPM = never used. Bb minor (×3) → B minor (×2) both relatively rare. Obsessive pursuit = new emotion (distinct from recent meditative/noir/nostalgic). The arc template breaks from silence-before-climax slightly: silence is ONE beat only ('where the dancer almost stops'), reinforcing the pattern-unbroken quality. 953 chars."
