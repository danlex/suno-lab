style: "ORCHESTRAL PASSAMEZZO film score for an insomniac's endless dance, total duration 1:00 to 2:00, with BALAFON + HURDY GURDY + SHAKUHACHI, three voices locked in the same repeating harmonic ground that cannot release, B-flat minor to B minor, 124 BPM, instrumental. From 0:00 balafon enters alone — wooden xylophone pulsing in obsessive duple meter, each strike a step that won't be the last. At 0:18 hurdy gurdy joins, medieval drone strings buzzing a melody that circles the same harmonic ground. At 0:40 shakuhachi rises above, breath-heavy Japanese flute cutting jagged phrases through the texture. At 1:00 full orchestra joins, strings and brass locked to the relentless pattern. Silence at 1:25 — one beat where the dancer almost stops. At 1:28 music returns in B minor half-step up, all three voices fortississimo, pattern still unbroken. Ends at 1:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "Every Step Is the Same Step"
