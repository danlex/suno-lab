style: "ORCHESTRAL MOTO PERPETUO film score for a river-rapids scene, total duration around 3:00, with GLASS MARIMBA + BASS TROMBONE + VIOLA DA GAMBA, continuous sixteenth-note motion that never stops, B-flat major to B major, 136 BPM, instrumental. From 0:00 viola da gamba alone runs the perpetual line, bowed sixteenths circling a pentatonic pattern. At 0:25 glass marimba enters with parallel sixteenths an octave above, mallets blurring across crystal bars. At 1:00 bass trombone joins with slower counterpoint in eighth notes. At 2:00 full orchestra layers in, strings sustaining the pulse, woodwinds passing the line through register, brass anchoring against the moving voices. Peak 2:05 with full motoric texture. Silence at 2:10 — five seconds where the motion stops. At 2:15 music returns in B major half-step up, fortississimo, sixteenths racing again. Ends at 2:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
