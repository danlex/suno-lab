notes: "v138 — ORCHESTRAL MOTO PERPETUO. Italian = 'perpetual motion'. Continuous unbroken stream of equal-length notes (typically sixteenths) maintained throughout. Famous in Paganini's Op. 11 violin moto perpetuo, Rimsky-Korsakov's Flight of the Bumblebee, and many Baroque toccatas. Composer names omitted per blocklist. DURATION HYPOTHESIS: motoric continuous-pulse texture should fight Suno's tendency to truncate. Strong rhythmic engine = sustained generation. Second ~3-minute prompt under new duration target. INSTRUMENTS: Glass marimba (×2, last v121 — 17-gap) = crystal bars, mallet blur ideal for sixteenth-note runs. Bass trombone (×2, last v121 — 17-gap) = low brass, slower counterpoint anchoring perpetual upper voices. Viola da gamba (×2, last v126 — 12-gap) = Baroque bowed string with deep chest register, capable of fluid bowed sixteenths. Three completely different attack profiles all sustaining the motion. NOVELTY: First moto perpetuo. 136 BPM = never used. Bb major (×2 → 3). River-rapids scene = kinetic, water-energy emotion (new). Pentatonic motion pattern (mentioned for tonal anchor). 939 chars."
