notes: |
  Technique: ghettotech is a Detroit-born subgenre sitting between ghetto house,
  electro, and Miami bass — characterised by fast tempos (130-160 BPM), hard 808
  sub-bass hits, dry MC or vocal calls with minimal reverb, and a raw street-level
  directness distinct from Chicago house or Detroit techno proper. It emerged from
  Detroit basement parties and record pool culture in the late 1990s and early 2000s,
  circulating on CDRs and mixtapes before any wider recognition.

  Concept source: ghettotech built around the pre-validated hook "Flicker, don't fix
  me" (scored 23/25 in the v362 candidate evaluation) — a stripped-warehouse scene
  where the sodium light flickers and the protagonist refuses repair, owning the broken
  state as a form of power rather than victimhood. Emotionally specific, not chant-filler.

  Composer-omission: this cycle echoes certain Detroit basement-party producers from the
  late 1990s and early 2000s whose names are omitted per catalog policy. The handpan,
  cornet, and chalumeau trio wholly displaces any standard ghettotech palette — no TR-909
  imitation, no Chicago-house samples — making this compositionally distinct.

  Climax: chord substitution is the structural novelty. The final chorus at 2:15 keeps
  the vocal melody entirely intact — same pitches, same rhythm, same contour including
  the rising half-step B to C on "me" — but the chord grid under it reharmonizes to
  an unexpected voicing. This is NOT a key change or half-step lift (the overused
  v216-v219 device). The hook's rising half-step retroactively makes sense as a
  mirror of the substitution interval, landing differently in emotional meaning.

  Duration strategy: 150 BPM sits in the proven 130-160 duration band where bar counts
  translate reliably to wall-clock time (37.5 bars/minute). Total bar count across all
  sections: 8+16+8+8+8+24+8+12+8 = 100 bars, theoretical ~2:40; with Suno's v5.5
  sectional expansion at this BPM, target render is 3:00-3:30. Duration levers applied:
  (1) explicit lyric-free Vamp at 1:23, 24 bars (~38 seconds, within the 30-50s target);
  (2) Build section at 2:02 providing pre-climax density ramp; (3) Final Chorus with
  reharmonization instruction at 2:15 giving Suno a production cue for the climax;
  (4) last lyric timestamp at 2:42 (the Outro bracket) anchors the render near 3:00+.
  Production tokens: polished studio mix, deep low-end definition, wide stereo stage.
  Sentence case throughout. Atmospheric-first opening. No [Silence] metatag used —
  per feedback, silence gates truncate; density ramp via Build bracket instead.

  Hook architecture: "Flicker, don't fix me" — the syncopated triplet feel on "Flicker,
  don't" creates a three-against-two polyrhythm against the 150 BPM two-step grid (triplet
  at 225 BPM implied against 150 BPM grid = 3:2 ratio). "fix" lands as a straight quarter
  note, arresting the polyrhythm. "me" rises by a half-step (B natural to C natural),
  landing precisely on the handclap beat. This contour is preserved identically in all
  chorus instances — the only thing that changes in the Final Chorus is the harmonic
  environment underneath it.

  Trio instrument roles and gaps:
  - Handpan (body voice, last used v353, gap 9): syncopated metallic interlock above the
    kick grid; its warm steel-tongue attack and short decay fill the rhythmic space between
    808 kicks and handclaps, providing the track's timbral signature. The handpan's
    resonant sustain contrasts with the clipped dryness of the groove grid.
  - Cornet (body voice, last used v352, gap 10): bright spare counter-line over the groove,
    doubling and framing the hook's harmonic structure; at the Final Chorus, the cornet
    signals the chord substitution with a new voicing before the vocal enters, priming the
    listener's ear for the reharmonization.
  - Chalumeau (body voice, last used v347, gap 15): dark woody low-register clarinet tone
    filling the sub-vocal shadow just above the 808; its rounded, reedy low end gives the
    track an organic anchor that contrasts with the electronic kick grid. In the Build
    section the chalumeau ascends, pulling harmonic tension toward the substitution.

  Trio body-voice count: 3/3 body voices (handpan, cornet, chalumeau). Zero spectral
  instruments. Satisfies and exceeds the at-least-2-body-voices rule.

  Novelty claims: ghettotech is a catalog debut lane — confirmed by the novelty surface
  (no prior cycles tagged ghettotech). The handpan + cornet + chalumeau trio is a new
  combination in the catalog; none have appeared together before. The chord-substitution
  climax (reharmonization under an identical vocal hook) is a structural technique not
  previously deployed in this catalog — distinct from key change, half-step lift, and
  density re-entry. Title "Flicker" is one English word with direct resonance to both the
  sodium-light imagery and the vocal hook. 150 BPM has been used before (v360 Peach).
  B minor has been used before (×17 in catalog).

