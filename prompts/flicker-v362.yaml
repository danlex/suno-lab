style: "Sodium-lit warehouse at 3 a.m., concrete still radiating heat\
  \ — Detroit ghettotech, fast electro-booty bounce, raw and unrepentant.\
  \ Underscore for a raw warehouse dancefloor that refuses polish. 808\
  \ kick on every beat, dry handclap on two and four, sub-bass tracking chord\
  \ roots. Handpan provides syncopated percussive interlocks above the kick grid\
  \ — steel-tongue attack, short decay. Cornet cuts a bright spare line over the\
  \ groove. Chalumeau fills the low shadow zone; in the Build section it ascends a\
  \ fifth, pulling toward the substitution. Vocal carries the hook: syncopated\
  \ triplet on \"Flicker, don't\" against the electro two-step, straight quarter on\
  \ \"fix,\" rising half-step B to C on \"me\" on the handclap. B minor, 150 BPM.\
  \ Final chorus the chord grid lands on the bVI (G major) under the unchanged vocal\
  \ line — the minor-key hook suddenly reads as brightness. No guitars, no synthesizer\
  \ leads, no rock drums, no pipe organ, no trap hi-hats."

