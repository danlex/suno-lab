name: "what-the-streets-sound-like-from-above"
version: 104
style: "ORCHESTRAL DRILL with COR ANGLAIS + TUBA, dark cinematic menace, half-time bounce with orchestral weight, C minor to C-sharp minor, 140 BPM, purely instrumental. Cor anglais plays sparse haunting melodic motifs — nasal and melancholic, the loneliest woodwind crying in the dark. Tuba provides sliding sub-bass lines gliding between notes like orchestral 808 slides, the lowest brass shaking the floor. Full symphony strings stab on offbeats with aggressive pizzicato. Sparse piano hits single dark notes in the high register between stabs. The texture is deliberately sparse — vast empty space between each hit, every note placed with menacing precision. The build fills the space gradually, adding voices one by one until density reaches critical mass. Then silence — two beats. Orchestra returns in C-sharp minor half-step up, cor anglais wailing at highest register, tuba at maximum depth, full strings and brass detonating on every offbeat. No guitars, no vocals."
title: "What the Streets Sound Like from Above"
