style: "Mahraganat, electro-shaabi, Egyptian street pop, 100 BPM, C# minor, Cairo rooftop 2am. Male mahraganat vocal — chesty mid-low Arabic street delivery in Egyptian Arabic, HEAVILY auto-tuned with melismatic Auto-Tune runs, conversational shouty rapid flow between chanting and rap-toasting, NOT traditional Arabic singer, NOT muezzin call, NOT Sufi, NOT Bollywood, NOT belly-dance pop. Production: pounding darbuka driving the 4/4, sawtooth synth mimicking mizmar reed timbre, heavy sub-bass under the kick, off-beat claps, hand-clap layers, distorted 808 fills, autotuned ad-libs ('ya-ya', 'yalla', 'eh'). Hassan Shakosh / Hamo Bika street tradition — DIY working-class Cairo, NOT mainstream radio Arab pop, NOT folkloric oud-and-qanun. Festival-of-the-poor energy, Imbaba rooftop bounce. No traditional Arabic, no oud lead, no qanun, no nay flute, no Sufi, no belly dance, no orchestral."

