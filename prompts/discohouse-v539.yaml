notes: |
  Disco-house (also called French-touch filter house) emerged in mid-1990s Paris as a reaction to the purist techno scene — producers associated with the Roule and Crydamoure labels took dusty disco vinyl, applied high-pass and low-pass filter sweeps to the master bus (the "filter" that defines the sound), laid a four-on-the-floor kick underneath, and let the original string arrangements breathe through in a new context. The clavinet (clav) became the signature stab element alongside piano. Sidechained bass — where the bass volume ducks in sync with every kick hit — creates the rhythmic pumping sensation that defines the style's low end. The concept source is a woman at a mirrorball club night who realizes the floor belongs entirely to her — Cinderella subverted (glass shoes, no prince; glamour without an audience; self-possessed joy over romantic expectation).

  Hook: "Glass shoes, no prince" — a perfect-fifth descent (A5→E5) on beat 1 lands on "glass shoes," voice cuts on the sidechain-pocket eighth-note rest, then a minor-third ascent (E5→G5) on "no prince" lands on beat 3. Three distinct moves in two bars, repeatable as a chorus stamp. Cinderella's objects reframed as self-sufficiency. Verse color lines: "Came here by myself, left everybody jealous"; "Every tile my mirror now"; "The DJ read my hips before I said a word."

  Duration strategy: 128 BPM is in the proven 128-160 band. Vocal bar counts sum to approximately 136 bars; the 32-bar dense instrumental filter break brings the total to ~168 bars, targeting 3:00–3:30 wall-clock. The mid-song filter break (clav + disco strings + kick + bass, explicitly beat-driven, no ambient drift) applies the v527 density lesson. The final hook lands late. Production tokens: polished studio mix, wide stereo stage, warm tape saturation, deep low-end definition.

  Instrument roles: filtered disco-string loops (harmonic shimmer, opened at chorus); four-on-the-floor kick (rhythmic spine); sidechained warm bass (low-end pump); punchy piano and clav stabs (off-beat percussive color); hi-hat sixteenths (floor energy). No negative-prompt contradictions: exclude_styles does not block electronic, synthesizer, piano, bass, drums, or vocals. Inline style negatives block only genuine drift. Key A minor, 128 BPM both visible in style. Sentence case throughout. Style char count: 937.

