style: "Euphoric disco-house and French-touch filter house — a mirrorball spinning over a floor that belongs to one woman, self-possessed and glowing, dancing for herself alone. Polished studio mix, wide stereo stage, warm tape saturation, deep low-end definition. A minor, 128 BPM. Soaring soulful female diva vocal, genuinely sung with joy and confidence. Filtered disco-string loops shimmer on the off-beats; a warm sidechained bass pulses under the four-on-the-floor kick; punchy piano and clav stabs land on the two and four; hi-hat sixteenths keep the floor alive between phrases. Dense continuous arrangement — strings filtered through the verse, opened wide at the chorus. Mid-song filter section: clav and disco strings take the floor with kick and bass, beat-driven, no ambient gaps. Final hook arrives late, voice wide open over the full arrangement. No acoustic guitar strumming, no pipe organ, no rock drums, no rap, no spoken word."

