notes: |
  v213 introduces ORCHESTRAL CACCIA WITH RITORNELLO — the 14th-century Italian trecento form in which two upper voices chase each other in strict canon at the unison over a long-note tenor (the "tenor drone anchor"), named for the hunt because its canonic structure depicts pursuit. What makes this form distinctive is its closing device: after the chase, a brief RITORNELLO section stamps a short, decisive cadential phrase in a contrasting texture, resolving what the chase left open. The form belongs to the Ars Nova movement of 14th-century Italy; composer names omitted per repository blocklist.

  Concept source: the caccia combines structural canon (two voices performing the same melodic line in strict temporal offset) with programmatic hunt imagery, onomatopoeia of hounds and horns, and a formal close that is percussive rather than legato — the ritornello is stamped, not sung. The near-silence before the ritornello is the moment the hunt freezes: the quarry is heard but not yet taken.

  Composer-omission confession: the trecento caccia has several known composers from the 14th century whose names this catalog cannot cite per blocklist rules. Their tradition is honored structurally.

  Duration strategy: tonal (E-flat minor opening, half-step lift to E minor at the ritornello stamp at 2:30) + pulse-based (111 BPM, not previously used in catalog — a moderato-allegretto pace that is kinetic but not frantic, exactly right for a pursuit through forest undergrowth) + 3-minute framing per v137+ override. The ritornello timestamp (2:30) replaces the standard "return at 2:15" to allow adequate near-silence.

  Featured trio:
  - BASS TROMBONE: ×3, last v138 — 75-gap. The slowest, lowest voice; assigned the tenor drone role, holding long sustained tones in E-flat minor throughout the chase. Its breath cycle is audible, making it feel alive.
  - UPRIGHT BASS: ×3, last v136 — 77-gap. Pizzicato attack for the first chasing voice — woody, percussive, kinetic; switches to arco for the ritornello stamp.
  - CRYSTAL MARIMBA (glass marimba): ×3, last v138 — 75-gap. The second canonic voice, identical line to upright bass but entering twenty seconds later; crystalline resonance contrasts with the woody pizzicato of the bass, making the chase audible as two distinct timbres.

  Note on instrument name: "glass marimba" (the caller's designation) is rendered here as "CRYSTAL MARIMBA" in the style field — an exact synonym (also called verrophone or crystal marimba) — to avoid triggering a composer-name association in the style text per blocklist protocol. Same instrument, different label.

  Novelty claims: first ORCHESTRAL CACCIA WITH RITORNELLO in catalog (v143 was ORCHESTRAL CACCIA with a different trio and no explicit ritornello stamp mechanism); 111 BPM is new (confirmed: BPM list jumps 110→112, 111 never used); twilight-forest-hunt-closing scene is new; all three instruments at 75+ version gap. The ritornello as a hoof-strike on stone is a new closing metaphor.

  Differentiation from v143 (ORCHESTRAL CACCIA): v143 used mellotron + bowed vibraphone + tenor saxophone, G-sharp minor → A minor, 107 BPM, hunters-crossing-winter-meadow. v213 uses bass trombone + upright bass + crystal marimba, E-flat minor → E minor, 111 BPM, twilight-forest-hunt-closing — plus the explicit ritornello stamp device that v143 did not feature.

