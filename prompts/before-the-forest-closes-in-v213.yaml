name: "before-the-forest-closes-in"
version: 213
style: "ORCHESTRAL CACCIA WITH RITORNELLO through a twilight-forest-hunt-closing scene, total duration around 3:00, BASS TROMBONE + UPRIGHT BASS + CRYSTAL MARIMBA in strict canonic form, E-flat minor to E minor, 111 BPM. Bass trombone opens alone at 0:00 on a long sustained drone — slow tenor anchor beneath darkening trees, cold damp air. Upright bass enters at 0:20 pizzicato with the first chasing voice, a kinetic hunting figure. Crystal marimba follows at 0:40 with the same line, twenty seconds behind — two voices chasing and never closing, sudden rests like forest clearings. Drone holds throughout as figurations tighten toward 2:00. Near-silence at 2:20 — six held seconds. Ritornello stamps at 2:30, half-step up to E minor, all three voices unison on a decisive closing figure, a hoof-strike on stone. Stamped resolution decays to silence by 3:00. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers. Score for hunt."
title: "Before the Forest Closes In"
lyrics: |
  [Short Instrumental Intro]

  [Bass Trombone Tenor Drone]

  [Upright Bass First Chasing Voice]

  [Crystal Marimba Canon Enters Twenty Seconds Behind]

  [Two Voices Chase — Drone Holds]

  [Figurations Tighten — Pursuit Compresses]

  [Silence]

  [Ritornello Stamp Half-Step Up]

  [End]
