notes: |
  v465 TOURNAMENT WINNER (inline-judged 84/100 — the run's best; beat sibling Spell465 at 80). New jack swing is a late-1980s/early-1990s style grafting tight drum-machine programming onto R&B harmonic language — syncopated hi-hats, hard snare on 2 and 4, bass-and-horn funk interplay. Catalog debut genre.

  HIGH-VARIANCE contrast (4th distinct profile this run): v464 mid Afropiano soul / male; v463 slow dream-pop / female airy; v462 fast speed garage / male — this is retro-R&B drum-machine / belted female, maximally distinct across tempo, genre, vocal register, and production era.

  The hook was engineered around a specific belted contour (hook-writer scored it 23/25): ascending gospel run + chromatic blue-note bend on "dan-GER-ous" + perfect-fifth leap belted on "Red," cornet answering in call-and-response. The parenthetical stage-directions in the drafted chorus were removed before submit so Suno does not sing them as ad-libs; the style field carries the cornet call-and-response instruction.

  Trio: CORNET (fresh brass, ~103-version gap — bright centered tone lighter than trumpet, leads the horn stabs) + RHODES ELECTRIC PIANO (seventh-chord funk bed) + SLAP FUNK BASS (syncopated upbeat pops). All body voices.

  Duration: explicit 16-bar lyric-free [Drum Machine and Horn Break] mid-song is the duration lever; final lyric line ~2:40; 98 BPM sits in the slow-BPM band, target 3:00-3:30.

  Climax device (non-formulaic, NOT a half-step transposition): a brass-unison stab burst into a PICARDIE parallel-major pivot (B-flat minor -> B-flat major on the same tonic) that floods the final chorus with sudden brightness. Fresh device for the catalog.

  Novelty: new jack swing catalog debut; cornet as lead brass fresh (~103 gap); Picardie parallel-major climax not previously used.

  Style char count: 948.

