style: |
  Smoky late-night groove with a belted female R&B vocal dripping gospel fire, total duration around 3:00. New jack swing drum-machine funk: snappy programmed snare on 2 and 4, syncopated hi-hats, slap funk bass popping the upbeats, Rhodes electric piano voicing warm seventh-chord patterns. A cornet leads the horn stabs — bright centered brass in call-and-response with the vocal on every chorus. Polished studio mix, deep low-end definition, wide stereo stage. B-flat minor, 98 BPM. The voice brings gospel-style runs, a chromatic blue-note bend on "dan-GER-ous," a pickup into "in," then a fifth leap belted hard on "Red," held in full chest voice while the cornet answers on beat 4. At the climax the ensemble fires a brass-unison stab burst, then lifts from B-flat minor to B-flat major — Picardie parallel-major brightening, not a transposition — flooding the final chorus with sudden light. No rap, no trap, no pipe organ, no acoustic guitar.

lyrics: |
  [Intro: Rhodes seventh-chord vamp, slap bass and drum machine lock in, 4 bars]

  [Verse 1: Belted R&B vocal, intimate threat, cornet stabs punctuate phrase ends, 8 bars]
  I walk in through the smoke and the low red light
  Every room goes quiet like a held breath tight
  I don't come to beg, I don't come to plead
  I come to take exactly what I need

  [Pre-Chorus: Vocal rises, bass drops to half-time feel, tension mounts, 4 bars]
  You've been warned, you've been told
  Something about me runs hot and cold
  Step back now or step in line
  You are already crossing mine

  [Chorus: Big belted hook, cornet call-and-response on beat 4, full band, 8 bars]
  Dangerous in Red
  Dangerous in Red
  You never should have let me walk through that door
  Now you're wanting so much more

  [Verse 2: Stripped — Rhodes and slap bass only, vocal more conversational, 8 bars]
  I move through this city like a blade through silk
  Nobody clocks the danger till they've spilled the milk
  I built this fire slow, one match at a time
  Now watch it catch, watch it climb

  [Pre-Chorus: Full band re-enters, cornet stabs tighten, 4 bars]
  You've been warned, you've been told
  Something about me runs hot and cold
  You can't call it back now
  You already crossed my vow

  [Chorus: Belted repeat, gospel runs on "Red," cornet answer louder, 8 bars]
  Dangerous in Red
  Dangerous in Red
  You never should have let me walk through that door
  Now you're wanting so much more

  [Drum Machine and Horn Break: Instrumental — cornet trading phrases with the slap bass over the drum machine groove, no vocal, 16 bars]

  [Bridge: Vocal spoken-low over Rhodes ostinato, building intensity, 4 bars]
  I gave you every sign
  I drew you every line
  You stepped across anyway
  So tonight, you stay

  [Brass-Unison Picardie Lift: Full ensemble brass-unison stab burst, harmony pivots B-flat minor to B-flat major, 4 bars]

  [Final Chorus: Belted in B-flat major, gospel runs peak, cornet blazing, 8 bars]
  Dangerous in Red
  Dangerous in Red
  You never should have let me walk through that door
  Now you can't want anything more

  [Outro: Rhodes and slap bass alone, vocal hums and fades, drum machine dissolves, 4 bars]

  [End]

