style: "ORCHESTRAL DUBSTEP with WATERPHONE WOBBLE + CRISTAL BASCHET LEAD, devastating and euphoric, maximum energy, G minor, 140 BPM half-time, purely instrumental. The waterphone replaces the LFO wobble bass — bowed bronze rods warped by water creating growling sub-frequency drops that rattle speakers. The cristal baschet replaces the synth lead — glass rods singing impossibly pure melodic lines above the chaos. Full symphony orchestra slams BRAAAM hits between every bass drop. Strings race in frantic tremolo. Brass blasts heroic anthems. Timpani cracks like cannons on the half-time snare. After two minutes of relentless assault — SUDDEN FULL SILENCE. Two beats of nothing. Then the orchestra returns in A-flat minor, half-step up, goosebump trigger, with the waterphone wobble deeper and the cristal baschet higher and the entire orchestra detonating. Everything we learned from 92 experiments ignited at once. Modern cinematic production at maximum intensity. No vocals, no guitars."
