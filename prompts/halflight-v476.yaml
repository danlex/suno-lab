style: "Shoegaze post-punk anthem with danceable motorik energy, raw intimate female voice cutting through guitar density, total duration around 3:00. Layered feedback-drenched electric guitars flood every frequency with reverb-soaked harmonic haze — they are the structural instrument. Driving post-punk bass guitar locks the motorik four-on-the-floor kick. A shimmering glockenspiel accent pierces the haze with cold bell clarity. The voice is melodic and present, slightly raw, never buried — dreamy precision over the guitar wall. Wide stereo stage, polished studio mix. F-sharp major, 120 BPM. Arc: guitar-wall intro, intimate stripped verse, thickened second chorus, lyric-free mid-song feedback vamp where guitars swell to peak saturation, filtered dip with low drone, then full-density chorus flood as climax — no key change, the density is the arrival. No synthesizers, no drum machines, no programmed beats, no auto-tune, no EDM drops."
title: "Halflight476"
lyrics: |
  [Motorik Guitar-Wall Intro: feedback guitars surge, bass locks kick, 8 bars]

  [First Chorus: full guitar density, voice present and raw]
  I only breathe in borrowed light
  The kind that falls when no one's watching
  I hold it close, I hold it tight
  Until the morning comes for something

  [Stripped Verse: bass and reverb arpeggio only, voice intimate]
  I traced the seams along the wall
  Where the paint had started peeling
  You left the window cracked in fall
  I still remember how that ceiling

  [Stripped Verse Continued]
  Looked in the half-dark, half-awake
  The kind of light that rooms can borrow
  I pressed my ear against the ache
  And couldn't tell the night from sorrow

  [Second Chorus: stacked guitars, thicker density]
  I only breathe in borrowed light
  The kind that falls when no one's watching
  I hold it close, I hold it tight
  And something in the haze keeps knocking

  [Lyric-Free Feedback Vamp: guitars swell to peak saturation, 24 bars]

  [Filtered Dip: low guitar drone and bass only, breath of near-silence]

  [Final Chorus Density Flood: full guitar wall returns at maximum density]
  I only breathe in borrowed light
  The rooms we held dissolve by morning
  I keep the dark pressed to my side
  And call the halflight home without warning

  [Outro: feedback fades to single guitar tone, 4 bars]
  [End]
