notes: |
  Shoegaze is a guitar-centric subgenre defined by dense, reverb-flooded electric guitar layers that create a harmonic wall of texture — the voice sits in rather than above the mix, though here the singer is intentionally present and raw-cut to stay intelligible. Post-punk provides the rhythmic spine: motorik four-on-the-floor kick, locked bass, forward-driving tempo. The researcher's concept: a danceable-edgy guitar-wall anthem as high-variance contrast to the catalog's recent synth-heavy run, with a shimmering glockenspiel accent as the one unexpected timbral pierce.

  This echoes the guitar-density approach of 1990s UK shoegaze artists without naming them — the key innovation is using guitar saturation density, rather than key modulation or silence, as the climax mechanism. The density-flood finale replaces the overused silence-gate-plus-half-step template.

  Duration strategy: parametrized bracket labels with explicit architectural metatags (stripped verse, feedback vamp, filtered dip, density flood); mid-song lyric-free feedback vamp of ~24 bars at 120 BPM is the primary duration lever targeting 3:00; final lyric line pushed to ~2:40 to hold the arc; wide stereo stage + polished studio mix as production tokens; 120 BPM in the proven 115-130 band.

  No body/spectral trio analysis applies — this is a guitar-forward vocal track, not an instrumental trio composition. Core instruments: layered feedback-drenched electric guitars (structural harmonic architecture), driving post-punk bass guitar (rhythmic anchor), motorik drum kit (four-on-the-floor engine), glockenspiel accent (timbral pierce).

  Hook spec: "I only breathe in borrowed light" — ascending stepwise approach landing on an unresolved sixth held on 'light', the ache never resolving. The held note sits one step below tonic F-sharp and does not cadence. Second chorus line varied to avoid repetition of "knocking/watching."

  Novelty claims: shoegaze/post-punk is a fresh lane in this catalog (contrast to electronic/synth cycles); guitar-wall as structural instrument rather than backing texture; glockenspiel as the sole timbral outlier; density-flood climax (no key change, no silence gate); 120 BPM motorik groove.

