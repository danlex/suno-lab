style: "Warm late-night yearning in a bright open room — liquid drum-and-bass at 174 BPM with a half-time groove pocket at 87 BPM, in A-flat major, emotionally open and lush. Underscore for a warm midnight vigil, hopeful not tragic. Wide stereo, deep low-end: shuffled 2-step liquid dnb breakbeat, warm Reese-ish sub-bass, lush reverb synth pads. Live alto saxophone is structural co-lead: states the hook alone in the intro, doubles vocal in unison on each chorus, solos over sub-bass in the break, fades alone in the outro. Reverb pads shift harmonic color in the final chorus — borrowed substitutions flood under the sax-vocal unison. Conversational neo-soul vocal, not a belt, Bb4 to Eb5. Hook: four-step rise cresting on sustained Eb5, triplet-fall to root Ab4; sax-and-voice unison is the fingerprint. Final chorus: same melody, new chords underneath. No guitars, no rock drums, no pipe organ, no trance synths, no trumpet leads."

