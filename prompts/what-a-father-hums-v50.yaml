notes: "v50 — 'What a Father Hums'. SECOND INSTRUMENTAL. PIANO + STRINGS EXPERIMENT. v49 used cello+organ+harp+strings. v50 tests the most classic emotional combination: solo piano with string orchestra. KEY CONCEPTS: (1) SIMPLICITY AS POWER — 'not virtuosic, not showy, just the kind of melody a father might hum'. Inspired by Zimmer's Interstellar (written about 'what it meant to be a father'). (2) BOOKEND — piano alone → piano with strings → piano alone again. Same structure as v46's lullaby but instrumental. (3) C MINOR TO C MAJOR — minor resolving to major, sadness to warmth. (4) SILENCE AS INSTRUMENT — 'long silences between phrases where the reverb fills the room like fog'. (5) TRANSFORMATION — 'transforms a humble tune into something cosmic, but now they mean everything'. (6) Concert hall (not cathedral) — testing different acoustic space. (7) BPM 72 — moderate, natural walking pace. (8) 964 chars."
tags: [instrumental, piano, strings, simple-melody, fatherhood, bookend, minor-to-major, silence, concert-hall, intimate, c-minor, zimmer-interstellar]
