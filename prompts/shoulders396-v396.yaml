style: "The chest unlocking, the jaw dropping, the breath you forgot you were holding — melodic trance-pop at 140 BPM in A major. Sidechain-pumped kick breathing the bassline; wide stereo supersaw; sub-low punch. Detuned supersaw synths stacked in three voices with gentle chorus spread; bright trance pluck arpeggios above; warm sustained pad on the harmonic floor. Four-on-the-floor kick; rolling offbeat bassline. Single close-miked female vocal — plainspoken, no runs. Hook \"Shoulders down at last\": C#5 falls to B4 on \"Shoul-ders,\" then A4 lifts to G#4 and sighs back to A4 on \"down at last\" — the G#4 major-seventh on \"at\" is the emotional fingerprint, resolving to tonic on \"last.\" First drop: full supersaw slam. Then the double breakdown strips to voice plus one held pad, no kick — that second unexpected strip is the climax signature — then the grid snaps back. No guitars, no rock drums, no pipe organ, no psytrance, no chipmunk pitched vocals."

