notes: |
  Melodic trance-pop is a commercially evolved offshoot of the late-1990s trance movement, characterized by detuned supersaw synthesizer chords stacked in multiple voices, four-on-the-floor kick architecture, rolling offbeat basslines, bright trance pluck arpeggios, and anthemic vocal hooks built on major-key resolutions — distinct from psychedelic trance (which uses more dissonant and hypnotic patterns), Hi-NRG (which is faster and more brittle), hardstyle (which has a reverse-bass signature), and makina (which is more distorted and percussive). This is a catalog-debut family: no prior version has used this genre identity or its production signature.

  The concept source is cathartic surrender: the moment you stop fighting something you've been holding unconsciously — not dramatic collapse, not victorious triumph — but the quiet physical event of muscles releasing. Verses name the fight in plain concrete images (jaw clenched since Tuesday, counting exits, holding breath, running useless math). The chorus IS the surrender, plainspoken, not explanatory: "Shoulders down at last."

  The hook is pre-scored at 22/25 for melodic richness. "Shoulders down at last" specifies a melodic contour with precision: C#5 descends to B4 across the two syllables of "Shoul-ders" (scale degrees 3→2), then a neighbor-tone figure from A4 (tonic, scale degree 1) lifts up to G#4 (the major seventh, scale degree 7) on "at" and sighs back down to A4 on "last" (tonic, beat 4). The G#4 on "at" is the emotional fingerprint — a deliberate major-seventh passing tone that mimics the physical sensation of a sigh; it creates mild harmonic tension before the tonic resolution on "last." Four syllables across one bar. This is not a repeated-note chant; it has a genuine descending-then-neighbor-tone contour designed to lodge in the listener's memory.

  The climax device is a double breakdown, selected as novel to the catalog. The first drop at 2:38 is standard trance grammar — full supersaw slam, kick grid detonating, all layers returning. The DISTINCTIVENESS lives in the second breakdown at 2:58: where the listener expects the track to ride out, everything strips unexpectedly to voice plus one held pad chord and no kick. A single final line is sung with no beat underneath. Then the kick grid snaps back for a short outro so the return feels like grace. This is explicitly NOT: texture-inversion (v390), false-ending, half-step modulation (penalized v216-v219), call-and-response (v393), pitch-brake/tape-stop (v395). No [Silence] metatag — documented to cause truncation; marked instead as [Breakdown 2: voice + one held pad, no kick]. No key modulation anywhere per brief.

  Duration strategy for 140 BPM (proven band). Per the BPM-duration playbook, 130-160 BPM bar counts work reliably; 140 BPM sits squarely in range. Key duration levers applied: (1) 10-section arc with explicit timestamps; (2) instrumental supersaw vamp at 2:10 running approximately 28 seconds — this explicit lyric-free vamp between the second chorus and the drop is the single most reliable duration extender per v348/v349 catalog data; (3) the Drop 1 itself at 2:38 is a length-generating event; (4) a second chorus at 2:44 during peak intensity extends the arc further; (5) final sung line ("Shoulders down at last") delivered at 2:58 in the stripped breakdown — satisfying the ≥2:45 target for 3:00+ render; (6) outro runs to approximately 3:08. Target wall-clock 3:00-3:20.

  Concept is forward-motion (the body releasing its held posture — a physical event moving from tension to resolution), which per the playbook auto-tags as danceable electronic and renders longer than reflective concepts. Exclude-styles block the primary drift risks: psytrance (dissonant/hypnotic), hardstyle (reverse-bass), Hi-NRG (brittle/fast), Eurodance (dated production), chipmunk pitched vocals (wrong treatment), and cinematic ambient (the compression auto-tag that caps duration).

  Style follows the playbook fully: atmospheric-first opening (chest-unlocking feeling before the genre label), three production tokens (polished studio mix, wide stereo stage, deep low-end definition), sentence case throughout, five inline negatives at the close. Style char count: 946. Blocklist scan: clean. No artist names, no place references anywhere. Title is exactly one fused token: Shoulders396.

