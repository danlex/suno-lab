notes: |
  VIRAL ARM cycle v274 — RKT (Reggaeton Kombi Trap) / urbano argentino.
  Research-driven (Nuevo Mundo, Spotify URBANO 2026, SoundCloud Stories,
  Público): RKT broke through globally in 2020 via L-Gante "L-Gante RKT"
  and his Bizarrap Session #38 (2021). 2026 viral leader is El Turco al
  Corte. The Buenos Aires urbano ecosystem (Bizarrap, Trueno, Duki, Wos,
  Nicki Nicole, María Becerra) drives the broader scene. Distinct from
  Caribbean reggaeton: RKT uses a different kick pattern (cumbia-villera-
  derived rather than pure dembow), darker moody synths, and the
  rioplatense porteño vocal accent. BPM 95-100.

  USER ROADMAP TARGET: 14 viral cycles deep, 10 languages, 14 voice
  archetypes, 11 regions. v274 adds Argentina/Buenos Aires as the 12th
  distinct region — South America, which had no prior cycle. Spanish is
  the language but with rioplatense accent and porteño slang, completely
  distinct sub-style from v264 (Caribbean ES neoperreo, Tomasa del Real /
  Ms Nina underground club tradition).

  VOICE DIFFERENTIATION — 15TH orthogonal voice in 15 cycles. Cumulative
  ledger:
    v260 — male whisper EN (drift phonk distorted)
    v261 — soprano belt EN (arena clean European belt)
    v262 — husky contralto FR (close-mic intimate)
    v263 — pitched-up kawaii EN (hyperpop chipmunked)
