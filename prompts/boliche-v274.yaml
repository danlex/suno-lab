  v264 vs v274 differentiation note: both ES, both autotuned, but v264 is
  Caribbean Latina female sing-rap with glossy mid-high attitude, while
  v274 is Argentine porteño male laid-back drowsy half-time flow with
  nasal mid-low timbre. Different gender, different register, different
  regional accent, different vocal energy. Style and exclude_styles block
  all 14 prior voice characters and also explicitly block the v264
  "raspy autotuned Latina sing-rap" character + Spanish-from-Spain trap
  (the closest classifier-drift risks).

  LANGUAGE — Argentine Spanish with porteño slang, the second Spanish
  cycle but completely distinct from v264. Lyric vocabulary uses
  authentic Buenos Aires street language: "boliche" (club), "che" (hey/dude),
  "posta" (real/legit), "el flaco del kiosko" (the kiosko guy — Argentine
  late-night detail), "la pibita del Uber" (the Uber girl), "el subte"
  (Buenos Aires subway, NOT Mexican "metro" or Madrid "metro"), "tumba"
  (drop/bass hit). Concept: classic Buenos Aires post-club narrative —
  4am, the boliche closed, kiosko on the corner, no Uber, smoking under
  the orange moon, thinking about her. This is evergreen porteño urbano.

  BPM 98 — center of the RKT canonical range (95-100). Fresh in the recent
  rotation (recent: 88, 92, 96, 100, 105, 110, 115, 120, 124, 132, 138,
  150, 160, 174). Distinct from v272 mahraganat (100) and v264 dembow
  (110).

  Key G# minor — first G# minor in the viral arm (Ab minor equivalent —
  unused in catalog). Walks well with the dark moody synth pads canonical
  to RKT.

  Production palette pinned: "dembow-influenced syncopated kick (RKT
