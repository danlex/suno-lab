notes: |
  TECHNIQUE: Isorhythm is a structural device from the medieval period (14th–early 15th century)
  built from two asynchronous repeating cycles: the talea (a rhythmic pattern) and the color
  (a melodic pattern), set at coprime lengths so they never re-align until the full composite
  cycle completes. The texture feels hypnotic and subtly uncanny as the loops drift in and out
  of phase against each other. The climax is purely geometric: the single moment the talea and
  color simultaneously land on beat one together is the structural payoff — no silence-before-
  climax needed, no crescendo spike, no half-step flourish appended. The convergence IS the
  climax. Concept source: isorhythm as a medieval structural device with coprime-length talea
  and color cycles; the convergence moment as geometric payoff rather than dynamic build.
  Composer-name omission: the canonical medieval practitioners of isorhythm are omitted per
  catalog blocklist; no composer or performer names appear anywhere in this YAML.

  DURATION STRATEGY: Tonal anchor is G-sharp minor (hypnotic, slightly modal) with the
  convergence chord near 2:20 landing in A minor — a half-step lift that is folded INTO the
  geometric alignment, not a separate silence-then-modulation trick. Pulse is 142 BPM, giving
  the talea loop enough forward motion to feel mechanical and inevitable. The 3-min arc is
  achieved by specifying total duration around 3:00 in the first 200 chars, with a timestamp
  cue (~2:20 convergence) in the lyrics and a long-fade close section.

  NOVELTY CLAIMS:
  - COR ANGLAIS: last used v207, gap of 18 versions. Role: carries the plaintive color melody,
    arching over the river mist in long, mournful phrases.
  - HURDY GURDY: last used v210, gap of 15 versions. Role: droning talea pulse engine, bowed
    wheel sustaining the rhythmic cycle with quiet relentlessness.
  - HANDPAN: last used v208, gap of 17 versions. Role: resonant metallic downbeat marker,
    bell-like strikes anchoring each loop cycle in warm shimmer.
  - BPM 142: unused in catalog (137/139/141 taken, 142 free) — first use.
  - Key: G-sharp minor opening with convergence to A minor — first use of this key pairing.
  - Scene: ferryman at a river crossing at dusk — new, not previously used.
  - Technique: isorhythmic convergence — first use of this technique in catalog.

