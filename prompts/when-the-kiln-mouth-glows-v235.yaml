notes: |
  TECHNIQUE: Chaconne ground-bass variations is a Baroque-era compositional form (17th–18th century) in which a short harmonic/chord pattern — typically 4 bars, often in triple or compound meter — repeats throughout the entire work while successive variations accumulate density and ornamentation above it. Unlike the passacaglia (already in catalog at v197), which repeats a melodic bass line, the chaconne repeats a harmonic/chord sequence; the distinction is harmonic identity vs. melodic identity. The form is sometimes conflated in older scholarship but the distinction is maintained here per the IMPORTANT note in the brief.

  CONCEPT SOURCE: The chaconne maps naturally to the kiln-at-first-light scene: each bellows-cycle is one repetition of the 4-bar ground; the rising heat is the variation density accumulating cycle by cycle. The TUBA provides the ground voice; the HARPSICHORD and VIBRAPHONE provide the primary ornamental voices; strings, brass, and woodwinds supply the variation-layer density. The form guarantees Suno keeps playing — the repeating harmonic bass is a structural anchor that prevents truncation (v226/v232/v233 lesson: sparse experimental prompts stall; the chaconne's dense accumulation is its own duration engine).

  COMPOSER-OMISSION CONFESSION: Historical chaconne masters (17th–18th century) are known and intentionally unnamed per the blocklist protocol. Their forms inspired this prompt; their names do not appear.

  DURATION DEFENSE: Chaconne form inherently generates ~3 minutes of content: 8–10 variation cycles at 153 BPM with a 4-bar ground = substantial clock time. The YAML has 9 metatag sections with 1–2 sentences each, supplying Suno dense material to render against each cycle. "Monumental cinematic orchestral" and "modern dramatic film-score" anchors prevent drift to sparse experimental textures. This follows the v234 lesson: full-orchestra dramatic arc hit 3:38 and 3:08.

  KEY DECISION: A-flat minor home for variations 1–6; half-step lift to A minor at the return after silence (variations 7–8). The lift coincides with maximum density for the harmonic apex — a reinforcing double effect rather than relying on density alone. Stable A-flat minor through the bulk of the work gives the final lift maximum contrast.

  TRIO ROLES AND NOVELTY GAPS:
  - TUBA (brass) — last used v223, gap 12 — carries the 4-bar harmonic ground in deep low register; the foundation of every variation cycle; bellows-pulse voice.
  - HARPSICHORD (keyboards) — last used v220, gap 15 — rapid figurations, broken chords, trills; incisive ornamental voice above the bass, first instrument above the ground.
  - VIBRAPHONE (mallet_perc) — last used v218, gap 17 — metallic shimmer, sustained upper-register chord-voicings; bowed-like resonance at climax; second ornamental voice, spatial glow.

  NOVELTY CLAIMS: First chaconne ground-bass variations prompt in the catalog. 153 BPM unused in recent run (112/128/141-149/83 taken). A-flat minor home with A minor lift is a new key combination. Kiln-at-first-light scene is new. All three instruments carry deep revival gaps (12/15/17 versions). Technique is catalog-debut.

