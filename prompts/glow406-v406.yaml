style: "Underscore for breathless reverence — UK bassline meets speed garage at 136 BPM in E minor, gritty Reese sub-bass rolling thick beneath a diva-style female vocal pushed to the front. Four-to-the-floor kick with deliberate garage swing, crisp clap on 2 and 4, shimmering hi-hat rolls across the off-beats. A pitched bass-synth doubles the Reese an octave up — dense vibrating column in the low-mid. A detuned synth pad breathes beneath the midrange: narrow and close in the verse, swelling to full stereo width as each chorus opens, so the diva rides the expanding room. At the final chorus the sidechain becomes deliberately over-driven: the sub pumps hard in lockstep with every kick, a rhythmic swell that lifts energy in one beat, the room inhaling — while the peak diva note rides above, cutting clean. Soaring high-chest delivery, not timid. 136 BPM, E minor. No guitars, no rock drums, no pipe organ, no acoustic instruments, no rap."

lyrics: |
  [Intro: Reese sub, kick with garage swing, 0:00]

  [Verse 1: 0:08]
  Felt it before I knew what it was
  Ribs opened wide around a frequency
  The floor already knew my weight
  Something moved the air — then moved through me

  [Pre-Chorus: 0:28]
  Not a chord — a pressure
  Not a beat — a tide
  It reached inside my sternum
  Before it reached my mind

  [Chorus: 0:46]
  Plaster cracked — I heard it glow
  Not every miracle needs a sound

  [Bass-Only Dub Break: bass and kick, no vocal, 1:02]

  [Verse 2: 1:36]
  Walls know things that windows don't
  The sub-bass wrote its name on every joint
  A thin high frequency stayed in my teeth
  The room kept ringing at its resonant point

  [Pre-Chorus: 1:58]
  Not a message — a weather
  Not a song — a law
  The plaster let it happen
  Because it knew the awe

  [Chorus: 2:18]
  Plaster cracked — I heard it glow
  Not every miracle needs a sound

  [Final Chorus: sidechain surge, 2:36]
  Plaster cracked — I heard it glow
  Not every miracle needs a sound

  [Outro: 2:50]
  I heard it glow

  [End]

