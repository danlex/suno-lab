name: "the-pilgrim-walk-in-parallel-thirds"
version: 139
style: "ORCHESTRAL FAUXBOURDON film score for a pilgrimage-at-daybreak scene, total duration around 3:00, with TROMBONE + CLAVICHORD + HURDY GURDY, 15th-century three-voice parallel harmony in 6-3 chords moving in strict consonance, E minor to F minor, 114 BPM, instrumental. From 0:00 hurdy gurdy alone states the tenor melody with drone resonance, wheel-bowed strings in slow step-wise motion. At 0:25 clavichord joins a sixth above, two voices moving in parallel intervals. At 1:00 trombone enters a third below, completing the three-voice fauxbourdon harmony, all voices locked in 6-3 chord motion. At 2:00 orchestra enters, strings doubling the three voices, woodwinds sustaining the drone, brass joining in parallel triads. Peak 2:05. Silence at 2:10 — five seconds of stillness. At 2:15 music returns in F minor half-step up, fortississimo, fauxbourdon preserved. Ends at 2:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "The Pilgrim Walk in Parallel Thirds"
lyrics: |
  [Short Instrumental Intro]
  [Hurdy Gurdy Tenor Alone]
  [Clavichord Sixth Above]
  [Trombone Third Below]
  [Three-Voice Fauxbourdon Locked]
  [Orchestral Parallel Triads]
  [Peak Consonance]
  [Silence]
  [Return Half-Step Up]
  [End]
instrumental: true
exclude_styles: "Arabic, tribal, world music, medieval folk, acoustic guitar, rock, metal, gentle, lo-fi, vocals, singing, pipe organ, electronic, EDM, synthesizer, zen meditation, new age, experimental noise, free jazz, atonal, microtonal, quarter-tone"
notes: "v139 — ORCHESTRAL FAUXBOURDON. 15th-century technique where a chant-like upper voice is harmonized by a second voice a sixth below and an improvised third voice a fourth below the upper (or equivalently, voices moving in 6-3 chord parallelism). Distinct from v137 organum (4ths, 5ths, octaves) — fauxbourdon is the later, sweeter development using 3rds and 6ths. Dufay / Burgundian school territory; composer names omitted per blocklist. DURATION: ~3-min arc with strong 114 BPM walking pulse. v137 organum proved the 3-min framing works (clip 1 = 2:39). Retaining pulse-based + tonal + medieval-adjacent concept. INSTRUMENTS: Trombone (×2, last v121 — 18-gap) = natural brass voice for lower fauxbourdon line. Clavichord (×2, last v126 — 13-gap) = quiet intimate keyboard, Baroque predecessor to piano. Hurdy gurdy (×2, last v125 — 14-gap) = medieval wheel-bowed string with drone, sets the tenor melody. Three families: brass, keyboard, wheel-string. Added 'medieval folk' to exclude_styles to prevent drift. NOVELTY: First fauxbourdon. 114 BPM = never used. E minor (×? well-established). Pilgrimage-at-daybreak = novel walking-image scene. Sacred-procession / parallel-motion-awe emotion. 946 chars."
