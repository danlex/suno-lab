style: "Modern Mandopop ballad, R&B-infused Mandarin pop, 78 BPM, F# major, late-night Taipei rooftop. Male Mandopop crooner — smooth light head-voice mix, gentle vibrato, melismatic ornaments on long vowels, FALSETTO FLIPS on emotional peaks (signature Mandopop ballad gesture), close-mic intimate Mandarin phrasing with code-switched English line, NOT Punjabi R&B mid-low, NOT Argentine porteño, NOT amapiano casual, NOT Afrobeats falsetto-mix — classically-trained Mandopop head-voice ballad signature. Production: gentle Steinway-style piano arpeggios, warm string pad layers, sparse trap drum kit with brushed snare, deep 808 sub on the chorus only, occasional erhu accent (NOT lead), light Auto-Tune corrective, wide vocal reverb tail. 2026 modern Mandopop ballad tradition, NOT traditional Chinese folk, NOT Cantopop, NOT C-pop dance idol group. Taipei night-rooftop intimacy. No erhu lead, no guzheng, no Beijing opera, no Cantopop, no K-pop, no J-pop, no orchestral arena."

lyrics: |
  [Intro]
  (piano arpeggio, distant)
  oh, oh-oh

  [Verse 1] (intimate head-voice)
  yueliang gua zai chuangwai
  ni de zhaopian zai zhuomian shang
  san nian le, wo hai zai zhe li
  shi zhong meiyou dengdao ni

  [Pre-Hook]
  (falsetto rise) oh-oh
  yue ah, yue ah

  [Hook] (melismatic + falsetto flip on "yue")
  yue, ni zhao zai wo de chuang
  yue, ni jihua wo de xinshang
  yue ah, ni hai jide ta ma
  yue ah, ta yijing buzai le

  [Verse 2] (code-switched English line in middle)
  taipei de yu xia bu ting
  zhe ge cheng shi tai an jing
  three years gone, no one knows
  yueliang shi wo de zhiren

  [Hook] (falsetto stack)
  yue, ni zhao zai wo de chuang
  yue ah, ni hai jide ta ma

  [Bridge]
  (just piano + string pad, no drums)
  [Whispered] ta yijing buzai le
  yueliang, yueliang

  [Final Hook] (full falsetto + light Auto-Tune)
  yue (yue ah), zhao zai wo de chuang
  yue (yue ah), ta yijing buzai le

  [Outro]
  (piano fade) yueliang
  [End]

