style: "Modern 4th-gen K-pop, NewJeans-adjacent dance pop, 132 BPM, B minor, glossy hyperdance. Multi-voice female group harmony — NOT solo: 4-singer breathy mid-register lead stack with call-and-response between members, detuned vocal stack on the chorus, layered ad-lib hooks, hyperpolished K-pop processing, bilingual Korean verses with English chant hooks. NOT solo soprano belt, NOT husky contralto, NOT pitched-up kawaii, NOT shouty MC, NOT autotuned sing-rap — GROUP vocal architecture with stacked harmony. Production: punchy four-on-the-floor kick, syncopated snare clap, glittery hi-hats, sub-bass pluck on the drop, sparkly synth arpeggios, retro-pop bass guitar groove, pitched vocal chops between sections, weird humane micro-drops. Glossy Seoul polish — Music Bank floor energy, NOT bedroom hyperpop, NOT EDM big-room. Choreography-ready dance pop. No PC Music harsh, no orchestral, no broadway."

