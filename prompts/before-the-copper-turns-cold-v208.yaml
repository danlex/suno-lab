name: "before-the-copper-turns-cold"
version: 208
style: "FRENCH OVERTURE FORM at rain on a copper roof at dusk, total duration around 3:00. PREPARED PIANO + HANDPAN + BASS FLUTE open in slow overdotted march at 93 BPM in G-sharp major: prepared piano strikes with clinking muted resonance, handpan rings low bell-tones, bass flute breathes a stately melodic line. At 1:00 the texture snaps into a fast fugal section — the march theme unwound into quick imitative entries, prepared piano scattering bright percussive interjections, bass flute threading a running counterline, handpan carrying metallic pulse, rain on copper a presence. At 2:00 the fugal churn stills: a brief slow return, the march theme resurfaces, key lifts a half-step to A major — warmer, copper roof in last dusk light — prepared piano ringing with fuller sustain, bass flute holding the melody below, handpan settling to long resonant strokes. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers. Film score for dusk."
title: "Before the Copper Turns Cold"
lyrics: |
  [Short Instrumental Intro — prepared piano, sparse]

  [Slow Overdotted March — handpan bell-tones enter]

  [Bass Flute Stately Melody]

  [Fast Fugal Section — imitative entries accelerate]

  [Prepared Piano Scatters — bass flute runs counterline]

  [Handpan Pulse Drives — rain on copper]

  [Fugal Churn Stills]

  [Brief Slow Return — key lifts to A major]

  [End]
