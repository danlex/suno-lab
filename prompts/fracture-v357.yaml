style: |
  Raw insurgent big-beat breakbeat — chunky syncopated broken drums, fat distorted bassline under filtered stabs. F-sharp minor lifting to G minor at the drop, 132 BPM. A chopped female vocal delivers short looped hooks with a rebellious edge, cut and repeating. An ondes martenot threads a ghostly wavering melodic line through the break gaps, cold and electric. A cor anglais brings a haunted countermelody in the mid-section, reedy warmth cracking against the hard groove. Crotales flash bright crystalline pin-accents at key breaks. Near 1:30 the drums strip to a filtered skeleton, the ondes martenot bends a single held note while a filter sweep climbs — pressure building — then the full breaks and bass slam back in G minor, harder and relentless. Deep low-end, polished mix, wide stereo. Underscore for a raw warehouse floor — crowd on knife-edge, heat rising. No guitars, no vocal melody, no rock production, no pipe organ, no synthesizers.

