notes: |
  TRIPHASE is a newly invented style debuting at v555. The concept: three grand pianos are each given a distinct register (low/mid/high), a distinct rhythmic grouping (threes/fours/fives), and a distinct tonal center (three keys a third apart — roughly C, E, and G-sharp — so they shimmer polytonally without resolving). The defining rule is "converge but never sync": across the piece the three orbits drift toward alignment, climaxing in an Eclipse — a near-collision onto one shared thunderous downbeat — then immediately tearing apart. They never fully lock; the near-miss and its dissolution is the emotional payload.

  The concept draws on phase-music traditions and polytonal practice (whose 20th-century architects cannot be named here per blocklist, but whose fingerprints are unmistakable in the 3-vs-4-vs-5 interlocking and the multi-key field). The researcher's framing: three simultaneous tonal centers a third apart, interlocking cross-rhythms that converge but never sync, Eclipse as the WOW moment.

  Duration strategy: 138 BPM puts this in the proven 130-160 duration band. Total bars: 16+20+16+32+4+24+16+20 = 148 bars — conservative but dense; at 138 BPM with Build/Silence/Eclipse stack this targets 3:00-3:30 wall-clock. The Silence section (4 bars) is real — no continuous pad — making the Eclipse impact genuine. Forward-motion concept ("orbits spiraling toward alignment, then tearing apart") triggers Suno's cinematic-instrumental classifier rather than reflective/ambient tags.

  Playbook moves applied: parametrized colon-lyrics with bar counts (8 sections + End); production tokens — polished studio mix, deep low-end definition, wide stereo staging, close-mic'd transients; sentence case throughout; atmospheric-opening (chrome concert hall scene); Build/Silence/Eclipse stack at ~65% of the arc; no blocklist words.

  Trio note: three grand pianos are all body voices — heavily percussive, rhythmically driven, no spectral instruments. This satisfies the ≥2 body-voice rule with perfect compliance (3/3 body). No 4th instrument added.

  Instruments: Piano 1 (left, sub-bass, percussive staccato anchor — first appearance in this register role, gap: debut); Piano 2 (centre, interlocking midrange rhythmic engine — debut); Piano 3 (right, glittering high-register figuration — debut). All three are the same instrument family deployed in completely different functional roles.

  Novelty: TRIPHASE is a wholly invented style name, never used in the catalog. Three-piano polyrhythm + polytonality with an Eclipse convergence arc: no precedent in v1-v554. BPM 138 may be novel. Scene: "three orbits crossing in a chrome concert hall" — entirely new framing.

  Style char count: 946.
