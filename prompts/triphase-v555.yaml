name: "triphase-v555"
version: 555
title: "Triphase555"
instrumental: true

style: "Three grand pianos locked in separate orbits in a chrome concert hall: left piano hammering percussive staccato sub-bass as the gravitational anchor, centre piano driving an interlocking rhythmic engine in the midrange, right piano scattering glittering rapid figuration in the high register. Wide stereo staging pans each to its own position, deep low-end definition on the sub-reinforced bass, close-mic'd transients for polished studio mix punch. Three tonal centers a third apart — polytonal, kaleidoscopic, never settling — shimmer and clash as all three phase in and out of alignment at 138 BPM. One moves in threes, one in fours, one in fives; orbits drift near then apart, motoric and hypnotic. Cross-rhythms tighten, sub-bass swells — the Eclipse: all three nearly slam onto one shared thunderous downbeat, near-collision at peak density — then tear apart, still orbiting. No guitars, no vocals, no drum kit, no synthesizers, no strings."

lyrics: |
  [Three Orbits Enter: sub-bass staccato pulse, midrange rhythmic engine, high figuration — separate keys, separate rhythms, immediate density, 16 bars]

  [Cross-Rhythms Tighten: threes against fours against fives, orbits circling closer, polytonal shimmer growing electric, sub-bass deepening, 20 bars]

  [Phase Drift: rhythms spread then narrow, each piano asserting its tonal center, the gap between orbits fluctuating, 16 bars]

  [Build: all three orbits spiraling toward alignment, cross-rhythms interlock harder, sub-bass swelling, tension at maximum, 32 bars]

  [Suspended: texture thins to a lone low piano note ringing, sub-bass cut for one held breath, motion barely alive, 3 bars]

  [Eclipse: all three pianos slam onto one thunderous shared downbeat, polytonal collision at peak density, then immediately tear apart, 24 bars]

  [Tear Apart: orbits diverge, three separate rhythms and keys re-establishing independence, still driving forward, 16 bars]

  [Second Orbit: smaller convergence, orbits tease alignment, dissolve mid-drift, unresolved, 20 bars]

  [End]

