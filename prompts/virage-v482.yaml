notes: |
  v482 TOURNAMENT WINNER (inline-judged 86/100; narrowly beat sibling candidate B "filter-as-form" at 85 — B was more architecturally novel but had a slightly more repetitive hook and real execution risk, per drafter's own caveat that Suno may flatten a filter sweep; A's stronger hook realization + reliable density-flood climax win). Lane: NU-ITALO DISCO — never used; an ELECTRONIC/synth-forward FEMALE swing away from v481's fast live-band male ska.

  HIGH VARIANCE vs v481: bright arpeggiated synth (not live band), airy sung FEMALE (not wiry male shout-sing), euphoric-bittersweet mood, A-flat MAJOR (breaking the recent minor-key run — v475/478/479/481 were all minor). Vocal-gender alternation M/F/M/F/M/F held across v477-v482.

  HOOK: "Reste encore un virage" (French, hook-writer 21/25) — addresses the night road for one more curve; bittersweet italo image. Contour: three-note plateau on C5, chromatic Db5 passing-tone (the joy-with-shadow note) on "-core", step-rise to Eb5, "vi-rage" falls Eb5-Db5-C5; Juno arpeggio answers a full tonic chord; wordless "(ah — ah)" backing hocket. Extensions ("Ce qu'on a vécu ne meurt jamais") carry the emotional payoff.

  ARCHITECTURE — classic nu-italo, density-flood climax (no modulation): cycling arpeggio intro (16 bars, no vocal) -> airy verse -> piano-stab chorus -> mid-song lyric-free [Arpeggio Vamp] -> final chorus arpeggio + piano-stab DENSITY FLOOD + octave-doubled topline. A-flat major held throughout — NO key change (deliberately dropped the researcher's suggested half-step lift, a penalized template).

  DURATION LEVER: the 24-bar lyric-free [Arpeggio Vamp] at ~60% + a full two-verse/chorus arc.

  INSTRUMENTS: arpeggiated Juno/Jupiter synth bassline (hero) + four-on-the-floor kick + gated-reverb snare + piano stabs + pumping sub-bass, with a warm MELLOTRON pad (novelty accent, gap ~19) low in the mix. BPM 128 (novelty gap 92) and A-flat major (novelty gap 32) both from the novelty surface, avoiding all recent keys.

  LANGUAGE: fully FRENCH (verified line by line — no English or other language in sung content), fitting the euro-italo character. Bracket labels are English descriptors (not sung); "(ah — ah)" is wordless vocable.

  NEGATIVES AUDIT (feedback_negative_prompt_contradiction): does NOT exclude electronic/synthesizer/arpeggiator/vocals/singing (all core to the genre). Excludes acoustic guitar, rock, live band, ska, trap, dubstep, etc.

