name: "what-the-noise-kept-hidden"
version: 224
style: "MUSIQUE CONCRÈTE INSTRUMENTALE — noise-to-pitch revelation for a torchlit
  cloister at nightfall with HARP + TUBULAR BELLS + VIOLA DA GAMBA in E-flat minor
  opening toward E minor, 141 BPM. Opens at 0:00 in pure noise mode: gamba bow in
  overpressure scraping, harp strings struck with nails and pedal buzzing, tubular
  bells grazed sideways — raw friction, no pitch. By 0:25 a partial harmonic leaks
  through the gamba scrape. By 1:00 a harp harmonic surfaces, one pitch unsteady
  in torchlight. Around 1:15 a tubular bell rings clean for the first time, startling
  against noise still beneath. Through 2:00 bow pressure eases and grazing yields
  to ringing. At 2:20 all noise falls away; one instrument holds a single pure tone
  in E minor — the arrival of pitch is the climax, quiet and absolute. The tone
  fades through 2:50. Underscore for instruments discovering pitch in cold stone.
  No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "What the Noise Kept Hidden"
lyrics: |
  [Short Instrumental Intro — all three in noise-generation mode, no pitch]

  [Gamba Overpressure Scraping — bow grinding past resistance, raw friction dominates]

  [Harp Nail-Strikes and Pedal Buzz — strings struck with nails, mechanism noise]

  [Tubular Bells Grazed Sideways — mallet grazing metal, not striking, only surface]

  [Harmonics Begin to Surface — partial pitches leaking through the noise fabric]

  [Noise Yields Slowly to Tone — bow pressure eases, grazing yields to ringing]

  [One Pitch Remains — all noise falls away, single pure tone in E minor holds]

  [Long Sustained Tone Rings — quiet absolute arrival, the climax without crescendo]

  [Long Fade — the tone diminishes slowly through the torch-dark cloister]

  [End]
instrumental: true
