name: "the-slowest-storm"
version: 103
style: "ORCHESTRAL AMBIENT with GLASS MARIMBA + CONTRABASSOON, glacial cinematic depth, every note given infinite space, D-flat minor to D minor, 60 BPM, purely instrumental. Glass marimba strikes single notes ringing for entire bars — crystalline pitched glass resonating through cathedral silence. Contrabassoon breathes the deepest woodwind tone, rumbling like tectonic plates in slow motion. Full symphony strings sustain long whole-note chords evolving imperceptibly, changing one voice at a time. French horns swell from nothing to warmth across sixteen beats. The build is geological — accumulating density so gradually the listener only realizes the orchestra has grown when it becomes overwhelming. Then silence — four beats of absolute void. Orchestra returns in D minor half-step up, every instrument sustaining one monolithic fortississimo chord, glass marimba above, contrabassoon below. The slowest storm imaginable. No guitars, no vocals."
title: "The Slowest Storm"
lyrics: ""
instrumental: true
