name: "the-shield-wall-holds"
version: 165
style: "Norse-inspired dark orchestral, deep male baritone and dark female mezzo-soprano duet, war horns, heavy tribal drums, dramatic choir, cinematic and powerful, viking battle energy, intense and raw"
title: "The Shield Wall Holds"
lyrics: |
  [War Horns - Low and Resonant]
  [Male Voice - Deep and Commanding]
  We stand where the thunder meets the sea
  Our shields locked tight as bone
  They brought an army to our shore
  We brought the will of stone

  [Female Voice Responds - Dark and Fierce]
  I sharpened every blade myself
  I braided war into my hair
  They think the shield wall's made of men
  They haven't seen me there

  [Both Voices Together - Choir Joins]
  The shield wall holds
  The shield wall holds
  Let the gods decide who falls
  The shield wall holds

  [Quiet - Female Voice Alone]
  When the ravens come to count the dead

  [Explosive Final - Everything]
  [Male] They'll find us standing still
  [Female] With blood upon our faces
  [Both] And iron in our will

  The shield wall holds
  The shield wall holds

  [End]
instrumental: false
exclude_styles: "electronic, hip hop, rap, EDM, pop, country, gentle, lo-fi"
notes: "v165: Norse/Viking dark orchestral DUET — first male+female duet. Deep baritone + dark mezzo-soprano trading verses then joining. War horns + tribal drums for driving rhythm. Not setting vocal_gender since it's a duet — let Suno decide the balance. Should appeal to user's taste for both baritone (v154) and dark female vocals (v161-164)."
