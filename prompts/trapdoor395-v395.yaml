notes: |
  Makina is a Spanish hardcore-electronic subgenre that emerged in the late 1990s from the Valencia club circuit and spread across peninsular dance culture in the early 2000s — defined by pounding four-to-the-floor kick drums, distorted high-pitched bouncy basslines, aggressive distorted synth leads, and euphoric anthemic structures at tempos between 145 and 165 BPM. It sits in a distinct lane from central-European hardstyle (which uses a reverse bass and heavier sub) and from German gabber (which is rawer and less melodic): makina is simultaneously brutal and bright, floor-shaking and singable. This is a catalog debut family — no prior version has used this genre or its production signature.

  The concept source is restlessness and adrenaline-tinged dread: running toward something you know will hurt you but cannot stop; feet moving before the mind agrees; the involuntary mechanism named in the hook — your heart is through the door before you decide to jump. The trapdoor is not metaphorical suffering but a physical event: the mechanism trips and you fall through it, willingly, again.

  The hook is pre-scored at 22/25 for melodic richness. "Trapdoor heart" carries a three-note ternary arc specified with pitch precision: F#4 (tonic, "Trap-"), minor-sixth leap upward to D#5 (the sixth degree, landing on "-door" on the downbeat kick — the most physically impactful beat in the bar), falling major-third down to B4 ("heart" — the third degree). This is a wide, upward-and-down contour — not stepwise, not a repeated-note chant — designed to soar euphorically over the distorted production and resolve with finality. No artist names, no place references (no Valencia, no España), per blocklist and language rules.

  Climax device targets D6 (non-formulaic). The pitch-brake drop is genuinely novel to the catalog: the distorted synth lead warps and decelerates for approximately four bars as if a hand is physically dragging a tape reel down (a studio pitch-bend manipulation effect), with the entire track sagging and lurching underneath, then snaps back at full 155 BPM with doubled kick density and the hook detonating. This is explicitly NOT: texture-inversion (used v390), false-ending, key-modulation, call-and-response, or half-step lift (penalized v216-v219). No [Silence] metatag — documented to cause truncation in the catalog.

  Duration levers applied for 155 BPM fast-tempo short-render risk. Per the BPM-duration playbook, 155 BPM sits above the proven 130-160 band and bar counts work well (73%+ efficiency). However fast makina tracks risk clipping at 2:30 without a full arc. Countermeasures: (1) 10-section arc with explicit timestamps anchoring Suno's section targets; (2) an instrumental synth-lead vamp at 2:12 running approximately 23 seconds before the pitch-brake drop — this explicit lyric-free section between the second chorus and the climax is the single most reliable duration extender per v348/v349 data; (3) the pitch-brake drop itself at 2:35 is a length-generating event (4 bars of deceleration + snap-back = ~3 seconds each bar at 155 BPM = roughly 12 additional bars of content); (4) final lyric pushed to approximately 2:46 with outro running to 3:06. Target wall-clock 2:50-3:15.

  Concept is forward-motion (adrenaline / running toward / irreversible mechanism) — per the playbook, forward-motion concepts with full-density Drop and BPM 130-160 reliably classify as "film score, orchestral ceremonial march" or in this case "hardcore electronic, dance" auto-tags and render longer. Exclude-styles block the key drift risks: happy hardcore (too bouncy/innocent), hardstyle (wrong bass signature), hard trance (wrong melodic style), gabber (too raw/industrial), chipmunk pitched vocals (wrong treatment), and cinematic ambient (the compression auto-tag that caps duration).

  Style follows the playbook: atmospheric-first opening (feeling before genre label), production tokens (polished studio mix, deep low-end definition, wide stereo stage), sentence case throughout, five inline negatives at the close. Style char count: 942. No blocklist words anywhere. Title is exactly one fused token: Trapdoor395.

