style: "Feet moving before the mind agrees — adrenaline-tinged dread as Spanish makina hardcore-electronic at 155 BPM in F-sharp minor. Hard sidechain-pumped low end, mono-to-stereo spread, club PA clarity. Pounding four-to-the-floor kick, punchy and dry; distorted high-pitched bouncy bassline; aggressive distorted synth leads cutting bright over the density. Clean modern female vocal above the distortion, open-throated and urgent. Hook \"Trapdoor heart\": F#4 tonic launch, minor-sixth leap to D#5 on \"-door,\" falling major-third to B4 on \"heart\" — a three-note arc landing the leap on the downbeat kick. At the climax the distorted synth lead warps and decelerates for four bars as if a hand drags the pitch down by tape-stop pressure, everything sagging, then snaps back at full 155 BPM with doubled kick density and the hook detonating — that brake-and-snap is the climax. No guitars, no rock drums, no pipe organ, no trance layers, no ambient drift."

