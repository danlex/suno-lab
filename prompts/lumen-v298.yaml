  language — no risky pronunciation, accessible across cultures,
  MEME-able). Lyric vocabulary uses ecclesiastical / classical Latin:
  "lumen in tenebris ardet" (light burns in darkness), "lumen in corde
  meo manet" (light remains in my heart), "per noctem longam, per
  silentium" (through the long night, through the silence), "lumen
  aeternum" (eternal light), "per montem, per vallem, per mare"
  (through mountain, through valley, through sea), "per silentium tuum
  cantare" (to sing through your silence), "ascende" (ascend),
  "illumine" (illuminate), "vincit lumen" (light conquers), "per omne
  saeculum" (through every age). Concept: classical-crossover meditation
  on light persisting through darkness — universal ecclesiastical-
  classical thematic core.

