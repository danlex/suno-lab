style: "Modern classical-crossover orchestral ballad, cinematic operatic soprano + cello + strings, 60 BPM (slowest viral-arm tempo), G minor, candlelit cathedral midnight. Female lyric SOPRANO classical-crossover — classically-trained pure-tone bright forward placement, vowel purity in operatic lines, subtle vibrato modulation, conservatoire phrasing, dynamic range from intimate piano whisper to soaring fortissimo belt at climax — operatic-pure-tone signature, FIRST true operatic-crossover voice. Production: solo grand piano arpeggios, solo cello melodic counterpoint entering 1:00, sustained string section pad, cathedral pipe organ pad, sparse timpani at climax, no drum kit. ARC: 0:00-0:30 piano alone, 0:30 soprano enters, 1:00 cello joins, 1:30 strings enter, 2:00 build, 2:30 climax with full orchestra + organ + half-step ascent + soaring belt, sustain to 3:30. Cinematic film-score classical-crossover. NOT pop, NOT power ballad, NOT Eurovision."

lyrics: |
  [Intro] (solo grand piano arpeggios, 0:00-0:30)
  (no vocals)

  [Verse 1 — soprano enters intimate piano, 0:30-1:00]
  lumen in tenebris ardet
  lumen in corde meo manet
  per noctem long am, per silentium
  lumen aeternum, lumen aeternum

  [Verse 2 — cello joins, soprano fuller, 1:00-1:30]
  per montem, per vallem, per mare
  per silentium tuum cantare
  lumen in tenebris, lumen in me
  aeternum, aeternum

  [Build — strings enter, soprano rising, 1:30-2:00]
  lumen, lumen, ascende
  lumen, lumen, illumine
  per noctem aeternam, lumen perdurat
  ascende, ascende

  [Climax — full orchestra + organ + half-step ascent + soaring belt, 2:00-2:30]
  LUMEN! LUMEN! aeternum lumen!
  LUMEN! LUMEN! per omne saeculum!
  LUMEN in tenebris, lumen vincit
  aeternum, aeternum, aeternum

  [Sustained Plateau Climax, 2:30-3:30]
  (full ensemble holding) lumen... lumen...
  aeternum lumen, aeternum
  lumen, lumen, vincit lumen
  aeternum

  [Outro] (orchestral wash + piano fade)
  lumen...
  [End]

