notes: |
  Technique: hooks-first power-pop vocal — a compact 2:40–2:55 radio-ready song structure
  built on jangly 12-string electric guitar, driving rock drums, electric bass, and stacked
  female vocal harmonies, with the first chorus arriving before 0:30. The chord grid is
  classic power-pop: E minor pushing to F minor (half-step up) at the final chorus for the
  key-lift frisson trigger. The arc: solo guitar riff → full band drop → chorus before
  0:30 → verse/chorus repeat → bare bridge (single vocal + bass) → final chorus with extra
  harmony layer + hard stop. No fade, no ambient tail.

  Concept source: charts-informed original in the jangle power-pop lane — inspired by the
  bright, driving guitar-pop that charted globally from the late 1970s through mid-1990s.
  This is a catalog first: no prior entry across 338 versions is an upbeat jangly guitar-rock
  vocal with stacked harmonies and a driving rock backbeat. None of v327–v338 touched this
  lane (those covered ballads, indie folk, dream pop, alt-R&B, city pop, gospel, trip-hop,
  bossa nova, nu-disco, DnB, chamber pop, and K-pop-adjacent styles).

  Composer/band omission: this sound echoes the guitar-pop songwriting tradition of the
  late 1970s–1990s — bands and writers whose names are on the blocklist and are intentionally
  omitted per discipline. The chiming 12-string attack, close three-part vocal harmonies,
  and driving snare-led backbeat are idiomatic to that era without referencing any individual.

  Trio-rejection / substitution note: the novelty-picker originally proposed waterphone +
  subcontrabass saxophone + cristal baschet. That palette is dark, eerie, and spectral —
  completely incompatible with bright uplifting power-pop. All three were rejected for genre
  coherence. Tubular bells (gap 28 — last used v311) and celesta (gap approx 11 — last used
  v328) were selected instead: tubular bells provide crisp high chime strikes that reinforce
  the jangly brightness in the choruses, and celesta threads sparkle arpeggiated ear-candy in
  the verses without thickening the guitar texture. Both are bright, chiming, body-adjacent
  voices that serve the genre rather than working against it.

  Duration strategy: power-pop is architecturally tight — 2:40–2:55 is genre-appropriate
  and should not be padded. Duration is scaffolded by: (1) explicit timestamps on every
  section from 0:00 to 2:45; (2) the style field anchors "Final chorus 2:20, hard stop near
  2:45"; (3) a hard-stop chord instruction (not a fade, not a [Silence] metatag — per
  feedback_silence_gate_truncates); (4) the bridge at 1:45 as a structural beat that
  separates the middle chorus from the final, preventing early truncation. BPM 150 sits in
  the proven 130–160 duration band, where bar counts work reliably per playbook rule 8.

  BPM 150 overrides the novelty-picker's suggestion of 173 (punk-fast, would compress
  the song into under 2:00 and lose the hook clarity). 150 is classic driving power-pop
  pocket — fast enough to feel energetic, slow enough to let the 12-string chime ring.

  Key: E minor (guitar-friendly, bright and driving) to F minor at the final chorus — a
  half-step lift that is the playbook key-modulation frisson trigger applied in a
  rock-vocal context for the first time in the catalog.

  Accent instruments and their roles:
  - Tubular bells (gap 28 — last used v311): crisp high chime strikes on the beat in every
    chorus — a cathedral brightness that reinforces the jangly 12-string without duplicating
    its frequency range. Spectral-adjacent but used rhythmically, not atmospherically.
  - Celesta (gap approx 11 — last used v328): quick arpeggiated runs threading between
    verse phrases — sparkle ear-candy that lifts the texture in the quieter vocal sections.
    Body-adjacent, used melodically.

  Note on instrumental field: instrumental: false — this is a vocal song. Stacked
  three-part female harmonies are the genre's defining texture. The vocal_gender is female
  (bright lead + close second and third voices, close-miked, wide stereo stage).

  Novelty claims:
  - Genre lane: jangle power-pop vocal — catalog first across 338 versions.
  - First upbeat guitar-rock vocal in the new-direction run (v327+).
  - Stacked three-part + four-part female harmonies: not present in any prior catalog entry.
  - Tubular bells + celesta as accent instruments over a live rock band bed: new combination.
  - First chorus before 0:30 structure: explicitly novel arc in the catalog.
  - Hard-stop ending (not fade, not ring-out): genre-appropriate, catalog contrast.
  - BPM 150: confirmed new per novelty surface.
  - E minor to F minor key: guitar-friendly, catalog novel pairing.

  Style char count: 978 (verified in-range 700–999, under Suno 1000-char hard limit).
  Lyrics char count: 980 (verified under 980-char target buffer).

  Production tokens used: polished studio mix, wide stereo stage, deep low-end definition.
  Sentence case throughout, atmospheric-first opening with purpose phrase ("the purpose is
  pure joy delivered in under thirty seconds"). Five inline negatives present: no distorted
  metal guitars, no screamo, no autotune, no EDM drop, no lo-fi haze.

