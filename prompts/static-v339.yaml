style: "Bright hooks-first power-pop — jangly chiming 12-string electric guitar over a driving rock backbeat and warm electric bass. Polished studio mix, wide stereo stage, deep low-end definition. E minor into F minor at the final chorus, 150 BPM. The 12-string opens alone, high and trebly, jangle-pop chime ringing clear. Full band crashes in, snare-led rock drums locking with bass. Tubular bells punctuate every chorus with crisp chime strikes. Celesta threads sparkle between verse phrases — quick arpeggiated runs lifting the texture. Stacked three-part female vocal harmonies arrive before the thirty-second mark, close-miked and wide. Bridge near 1:45 strips to single vocal and bass. Final chorus returns with an extra harmony layer, one held beat longer, crashing to a hard-stop chord near 2:45. No distorted metal guitars, no screamo, no autotune, no EDM drop, no lo-fi haze. Underscore for a radio-ready jangle-pop scene."

lyrics: |
  [12-string intro, 0:00]

  [Verse one, 0:08]
  You left your jacket on my chair
  A piece of you still hanging in the air
  I keep the window open just in case
  I hold the memory of your face

  [Chorus — three-part harmonies, 0:26]
  Static, ringing through my veins
  Every time you leave it's the same
  You're the signal that I chase
  Can't erase you from this place

  [Verse two, 0:46]
  You call at midnight just to talk
  Then you're gone before the morning walk
  I write it down, can't explain
  You're between the sun and rain

  [Chorus — stacked harmonies, 1:05]
  Static, ringing through my veins
  Every time you leave it's the same
  You're the signal that I chase
  Can't erase you from this place

  [Bridge — vocal and bass, 1:45]
  Nothing clears, nothing fades
  Still receiving you

  [Final chorus — four-part, F minor, 2:20]
  Static, ringing through my veins
  Every time you leave it's the same
  You're the signal that I chase
  Can't erase you from this place
  Static — still alive

  [Hard stop, 2:45]

  [End]

