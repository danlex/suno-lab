notes: |
  Amapiano is a South African genre that emerged in the mid-2010s from deep house and jazz fusion roots, defined by its signature log-drum (a deep, rolling percussion element produced by manipulating a bass synthesizer patch into a rhythmic log-like texture), spacious jazzy piano chords, continuous shaker percussion, and a warm round sub-bass. The genre runs at 100–115 BPM and prizes unhurried, soulful, layered density over sparse minimalism.

  Concept source: a father teaching his kid to ride a bike down a township street at golden hour — running alongside, hand on the seat, the moment he lets go and the kid wobbles then flies; pride and a lump in the throat.

  This prompt echoes the emotional DNA of late-afternoon township soul without naming any specific artist. The ownable hook "Both hands, then none" is built on the caller-specified contour: two punched quarter-notes on tonic B for "both hands," a half-beat rest on the log-drum ghost roll (the structural release — the hand leaving the seat), then "none" drops a minor sixth to D, held and breathy, entering beat 3. The rest is structural, not an ambient gap — the log-drum ghost roll fills it. The phrase encodes the scene's pivot in four syllables.

  Duration strategy: parametrized colon-syntax lyrics with bar counts across 8 sections (8+16+8+16+12+40+8+24+8 = 140 bars). At 112 BPM with continuous dense arrangement this targets approximately 3:00–3:30. The mid-song Instrumental section (40 bars) is explicitly dense and beat-driven — log-drum, shakers, bass, and piano at full density, never stripped or ambient — applying the v527 lesson that sparse mid-song sections truncate hard at sub-128 BPM. The Drop places the final full hook late in the arc (~2:20+). Production tokens: polished studio mix, deep low-end definition, wide stereo stage, warm tape saturation, lush acoustic ambience. Sentence case throughout; atmospheric-first opening. Negative-prompt audit: no contradictions — log-drum bass is a synth patch so no "no synthesizers" anywhere; vocals are wanted so "singing"/"vocals" absent from exclude_styles; only non-Amapiano genres blocked.

  Novelty: B minor is distinct from v541's F# minor. Male vocal marks a lane shift from v541's female lead. Father-and-child township bike-ride scene is catalog-fresh. "Both hands, then none" hook is original with caller-specified melodic contour.

  Style char count: 890. Lyrics char count: TBD.

