style: "Warm golden-hour tenderness — Amapiano at 112 BPM in B minor, polished studio mix with deep low-end definition and wide stereo stage. The signature rolling log-drum bassline anchors every bar with its round, thudding pulse; layered shakers and soft rim-clicks weave a continuous rhythmic shimmer; spacious jazzy piano chords breathe in open clusters with gentle pedal resonance; a warm round sub-bass sits beneath everything, full and unhurried; airy pads open the high-mids into late afternoon gold. A male voice carries the melody with grounded tenderness — grateful, unhurried, a lump quietly rising. Warm tape saturation on the log-drum, lush acoustic ambience across the mix. The arrangement stays continuously dense from first bar to last — log-drum, shakers, bass, and piano never stop, vocal sung throughout. No acoustic guitar, no rock drums, no pipe organ, no rap, no heavy metal."

lyrics: |
  [Intro: log-drum, shakers, 8 bars]

  [Verse 1: male vocal, full groove, 16 bars]
  Yellow light on a borrowed helmet
  He looked back once then looked forward
  I was running, he was flying
  He ran until the road ran back

  [Pre-Chorus: piano lifts, 8 bars]
  I was the training wheels all along
  Hands that held and then moved on

  [Chorus: full hook, 16 bars]
  Both hands, then none
  Feel it leave before it's gone
  Both hands, then none
  That's how you learn to run

  [Verse 2: bass and piano, 12 bars]
  He wobbled once — I let him wobble
  Yellow road, the shadow longer
  Pride is a name for missing
  What you made too strong to hold

  [Instrumental: log-drum and piano, 40 bars]

  [Build: layers rising, 8 bars]
  Both hands — hold on

  [Drop: full hook, male lead, 24 bars]
  Both hands, then none
  Feel it leave before it's gone
  Both hands, then none
  That's how you learn to run

  [Outro: bass holds, 8 bars]
  Then none
  Then none

  [End]

