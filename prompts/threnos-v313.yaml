style: "Romantic opera film score for an empty cathedral nave at dusk — dust motes in slanting amber light, one mourner at the altar after the funeral. Polished studio mix, Hollywood scoring stage, deep low-end definition. A minor, lifting to Bb minor at 2:20, 76 BPM. Ophicleide and serpent open alone in solemn chorale — buzzing low brass and reedy bass woodwind in dirge dialogue; no voice, no strings. Bass-baritone enters mid-track at 0:35 over bare pizzicato strings: late-Romantic aria phrasing, chromatic inner voice motion, chesty legato. Full strings and woodwind choir build density from 1:15. Horn-tuba enters at 2:00, a warm low brass color between horn and tuba. Half-step shift at 2:20 lifts the ensemble to Bb minor. Final phrase: bass-baritone over stripped strings — the voice does not resolve; the orchestra does. Wide stereo stage, warm tape saturation. No guitars, no rock drums, no synthesizers, no pipe organ, no choir of voices."

lyrics: |
  [Ophicleide serpent bass chorale, 8 bars]

  [Bass-baritone enters mid-track, 16 bars]
  Θρῆνος — threnos — lamentation
  Dust motes in the amber light
  ψυχή — the soul still here
  memoria — the memory holds

  [Pizzicato strings baritone alone, 8 bars]
  νύξ falls on the stone
  αἰών — eternity opens

  [Full Romantic orchestra enters, 24 bars]
  φῶς on the altar stone
  Luminis — light of memory
  ἄνθρωπος alone at the threshold
  The nave holds the silence now
  φῶς fades to amber
  memoria — remains

  [Wagner-tuba third brass layer, 16 bars]
  The chorale returns below
  Low brass breathing the dark
  Horn and tuba and depth
  ψυχή — the soul descends

  [Half-step Bb minor full ensemble, 20 bars]
  Θρῆνος — lamentation rises
  φῶς on the broken stone
  αἰών opens its door
  ἄνθρωπος — alone — memoria
  Θρῆνος — the light holds still

  [Final stripped bass-baritone phrase, 12 bars]
  νύξ — the night comes now
  luminis — one breath of light

  [Orchestra closes alone, 8 bars]

  [End]

