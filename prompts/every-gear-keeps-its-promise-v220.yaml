name: "every-gear-keeps-its-promise"
version: 220
style: "PERPETUUM MOBILE for a clockwork orrery turning through the cold night, total duration around 3:00, with HARPSICHORD + GLASS HARMONICA + CONTRABASSOON — unbroken sixteenth-note motion in F minor, 131 BPM, no resolution. The harpsichord launches the ostinato at 0:00, full speed from the first beat, a bass anchor that never stops. The glass harmonica glides in at 0:20, ethereal overtones circling as kinetic shimmer. At 1:00 the contrabassoon enters — sub-bass, antique depth — and a dark-toned string slab thickens the motion, no cadential landing. The spinning plateau from 1:45 holds tension flat: no silence, no modulation, only the turning of gears and planetary arms. From 2:15 layers dissolve: glass harmonica fades, then strings, then contrabassoon; harpsichord spins down in F minor, ending by winding away. Underscore for a mechanism that has never known stillness. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "Every Gear Keeps Its Promise"
lyrics: |
  [Short Instrumental Intro — harpsichord ostinato launches, full speed from the first beat]

  [Glass Harmonica Spins In — ethereal overtones circling above the continuo]

  [Contrabassoon Enters Beneath — sub-bass counterweight, antique depth under the spin]

  [String Slab Thickens — sul tasto density expanding into the existing motion]

  [Full Spinning Plateau — maximum kinetic density, tension held flat, no release]

  [Layers Begin to Dissolve — glass harmonica fades out, then strings withdraw]

  [Contrabassoon Descends Away — deepest voice the last to go]

  [Harpsichord Alone Winding Down — spinning figuration slowing in F minor]

  [End]
