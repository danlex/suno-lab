notes: |
  VIRAL ARM cycle v287 — Modern Greek pop / trabetiko (rebetiko + trap
  fusion). Research-driven (Wikipedia Rebetiko, Bandcamp Daily Modern
  Rebetiko 2026, TikTok 2026 Greek viral playlists): "Trabetiko" is the
  contemporary Greek genre-fusion pioneered by Negros Tou Moria (Kofi
  Ansong) in their 2025 album — blending traditional rebetiko (bouzouki +
  modal melodies + Athenian street poetic tradition) with modern trap (808
  sub + trap drums + Auto-Tune). Bouzouki is the emblematic instrument of
  rebetiko, and remains central in modern trabetiko productions. TikTok
  presence is strong via Greek viral playlists 2026 and Greek trap content.

  USER ROADMAP TARGET: 26 viral cycles deep, 21 languages, 27 voice
  archetypes, 23 regions. v287 adds Greek (22nd language) and Athens (24th
  region). Mediterranean coverage now extends across the eastern arc:
  Cairo/Egypt (v272), Istanbul/Turkey (v278), Tehran/Persia (v284), Athens/
  Greece (v287). Four Mediterranean cycles representing four distinct
  language families (Afro-Asiatic Semitic, Turkic, Indo-European Iranian,
  Indo-European Hellenic) — the catalog now demonstrates fine-grained
  Mediterranean musical-cultural differentiation.

  VOICE DIFFERENTIATION — 28TH orthogonal voice in 28 cycles. Cumulative
  ledger (abbreviated):
    v260-v286: 27 prior voices spanning 21 languages
    v287 — female GREEK MODAL PASSIONATE BELT GREEK (chest-rich Mediterranean
           modal belt with Greek rebetiko-influenced phrasing + emotional
           direct delivery + Greek vowel-rich pronunciation + klisma-style
           melodic turns — fundamentally different from other Mediterranean
           cycles via Greek modal ornament library and chest-rich passion-
           delivery vs Persian tahrir microtonal trill / Arabic mahraganat
           shouting / Turkish makam ornamentation)
  Mediterranean female-vocal differentiation note: v272 mahraganat was
  male, v278 Türk trap was male, v284 Persian was female-mid-high tahrir,
  v287 Greek is female-chest-rich modal-belt. Different female ornament
  system from Persian tahrir (modal-belt vs microtonal-trill). Style +
  exclude_styles block all 27 prior voice characters.

  LANGUAGE — 22nd distinct language. Greek (Latin transliteration — Greek
  script exists but Latin transliteration is standard on social media).
  Lyric vocabulary uses authentic Greek rebetiko-pop: "kardia mou" (my
  heart — iconic Greek emotional address), "Athina" (Athens), "Exarcheia"
  (Athens anarchist neighborhood, rebetiko/trap epicenter), "vrochi"
  (rain), "kafenio" (taverna/café — Greek institution), "kafedaki"
  (little coffee), "tsigaro" (cigarette), "Spotify pezei to tragoudi mas
  akomi" (Spotify still plays our song — modern Greek detail), "edo
  perimeno" (here I wait), "Athina geri, ego den gernao" (Athens grows
  old, I don't grow). Concept: classic Greek heartbreak-and-Athens
  narrative — Exarcheia night, rain, alone at the café, the light in the
  window across the street where you lived two years ago, cold coffee,
  cigarette, Spotify still plays our song, "Athens grows old, I don't,
  here I wait." Evergreen Greek-rebetiko emotional core.

  BPM 116 — fresh in rotation (recent: 78, 82, 86, 88, 90, 92, 95, 96,
  98, 100, 104, 105, 108, 110, 115, 120, 124, 128, 132, 138, 140, 144,
