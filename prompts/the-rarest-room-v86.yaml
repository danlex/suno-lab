notes: "v86 — CRISTAL BASCHET + SUBCONTRABASS SAXOPHONE + PIPE ORGAN. Second uncommon-combination iteration (following v85's waterphone trio). Three rare instruments from three completely different eras and physics. RESEARCH: Cristal Baschet Wikipedia, Handmade Sound, Classic FM's Interstellar theme on Cristal Baschet article, Colossal 2020 feature, MusicConnects. LEARNED: (1) Cristal Baschet was invented in 1952 by brothers Bernard and François Baschet — glass rods are rubbed with wet fingertips, metal rods serve as resonators. Harmonic-rich timbre, 'haunting and celestial', prolonged resonance unlike glass harmonica's decay. Featured in Amelie (Yann Tiersen), La Marche de l'empereur, Traffic, Solaris, Conclave, Testament of Orpheus. (2) Subcontrabass saxophone is the lowest saxophone ever built — extremely rare, Benedikt Eppelsheim built the first modern working one in 1999 based on Adolphe Sax's 1906 patent, only a handful exist worldwide. Used in contemporary avant-garde compositions and rare cameos. IMPROVED: combined cristal baschet (high stratosphere glass), subcontrabass saxophone (sub-bass reed, lower than human voice), pipe organ (bridging register). Three physics: glass friction + reed wind + pipe air. Three eras: 1952 + 1906/1999 + ancient. Three inventors in one imagined room. B-flat minor 54 BPM glacial. Contrast with v85 (all metal rarities) — v86 is three radically different physics. Sources: Wikipedia, ClassicFM, Handmade Sound, Colossal, MusicConnects. 978 chars."
