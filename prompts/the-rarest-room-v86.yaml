style: "CRISTAL BASCHET + SUBCONTRABASS SAXOPHONE + PIPE ORGAN orchestral, celestial and subterranean, slow-building monumental, B-flat minor, 54 BPM, purely instrumental. Three rare instruments from three eras: 1952 Cristal Baschet (glass rods rubbed with wet fingertips, used by Tiersen in Amelie), 1906 subcontrabass saxophone (lowest saxophone built, a handful exist worldwide), ancient pipe organ. Opens with the Cristal Baschet alone — glassy sustained tones in the stratosphere, harmonic-rich and celestial. The subcontrabass saxophone breathes in from the depths — a sub-bass reed lower than any human voice. Pipe organ pedals bridge the two extremes. Strings gather in sustained bows across the middle. French horns swell. At the climax the three rarities sound at once — glass stratosphere, sub-bass reed, pipe organ spanning everything — a texture possible only when three inventors share a room. Modern cinematic audiophile production. No vocals, no electronics, no guitars."
