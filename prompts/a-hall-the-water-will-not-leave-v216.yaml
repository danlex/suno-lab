style: "BELL-HALO TWO-VOICE STRUCTURE fills a vast empty stone hall as floodwater rises
  at dawn, total duration around 3:00. NYCKELHARPA + TENOR SAXOPHONE + MELLOTRON,
  B-flat minor, 123 BPM: nyckelharpa opens alone, bowing only the three tonic-triad
  notes in continuous arpeggiation — no melody, only the halo, sympathetic strings
  shimmering. At 0:25 tenor saxophone enters breathing a slow stepwise diatonic line,
  one note at a time, breathy and lyrical; the halo encircles every step without
  dissonance. Mellotron warms beneath in tape-choir sustain. At 1:10 strings double
  the arpeggiation; density builds without adding harmony — triadic shimmer, luminous
  grief. At 2:00 peak. Silence at 2:05, five bare seconds. At 2:10 halo returns;
  melody re-enters a half-step higher in B minor, the triad glowing in the new key,
  settling to silence by 2:55. No guitars, no vocals, no rock drums, no pipe organ,
  no synthesizers. Score for a flooded hall at dawn."
title: "A Hall the Water Will Not Leave"
lyrics: |
  [Short Instrumental Intro — nyckelharpa halo alone, triadic shimmer in B-flat minor]

  [Tenor Saxophone Enters — slow stepwise diatonic melody, halo encircling every step]

  [Mellotron Warms — tape-choir sustain beneath the two voices]

  [Strings Double the Halo — density builds without added harmony, luminous grief]

  [Peak — full triadic shimmer, still and transparent]

  [Silence]

  [Halo Returns — melody re-enters a half-step higher in B minor]

  [Settling to Silence — triad glowing in the new key]

  [End]
