notes: |
  v216 introduces BELL-HALO TWO-VOICE STRUCTURE as its structural concept — a
  centuries-old compositional form, most fully articulated in 15th-century vocal
  polyphony and revived in late 20th-century minimal sacred writing, in which two
  distinct voices serve two entirely different functions: one voice (the M-voice)
  moves diatonically through a melody, one step at a time; the other voice (the
  T-voice) arpegiates continuously through the notes of the tonic triad alone,
  without following the melody's motion. The triad-voice circles the melody like a
  halo — it is always consonant with whatever note the melody lands on, because the
  melody itself stays within the key, and the triad contains the key's tonal gravity.
  The result is extreme transparency: there is no harmonic ambiguity, no dissonance,
  yet the perpetual triadic shimmer keeps the texture from going static. The
  emotional register is introspective stillness, quiet grief, luminous calm.

  concept_source: Researched bell-halo two-voice structure — the practice of pairing
  a freely moving melodic voice with a continuously arpeggiating tonic-triad voice.
  The form predates functional harmony and reappears in late-20th-century minimalist
  sacred writing; this catalog cannot name specific composers per blocklist rules.
  The key insight: the triad-voice requires no harmonic knowledge — it only knows
  three pitches — yet its constant presence wraps every melodic note in the same
  luminous consonant glow, a structural halo.

  Composer-omission confession: bell-halo two-voice writing has a documented history
  in medieval polyphony and in late-20th-century sacred minimalism that this catalog
  cannot cite by composer name per blocklist rules. The technique itself (not its
  practitioners) is the subject here.

  Duration strategy: tonal (B-flat minor opening → B minor at the return at 2:10, a
  chromatic half-step lift that raises the tonic triad by one semitone and makes the
  halo glow perceptibly brighter — the key shift is audible as a luminous change of
  color rather than a dramatic rupture) + pulse-based (123 BPM, first use in catalog
  — moderate walking pace, fast enough for the arpeggiation to feel like continuous
  shimmer without becoming mechanical) + 3-minute framing per v137+ override.

  Featured trio with gaps:
  - NYCKELHARPA (×4, last v191 — 25-gap): a Swedish bowed-keyed string instrument
    with sympathetic strings that resonate freely beneath the played strings,
    producing a natural shimmer on every note. Here cast as the HALO voice:
    continuous tonic-triad arpeggiation, sympathetic strings amplifying the bell-like
    ring. Rendered as a cinematic bowed-keyed string, not as Scandinavian folk;
    exclude_styles forcibly suppresses folk associations.
  - TENOR SAXOPHONE (×4, last v196 — 20-gap): the MELODY voice. Its breathy low
    register and slow vibrato make it ideal for diatonic stepwise lines; the tone is
    intimate rather than jazzy, deliberate rather than improvisatory — each note
    placed one at a time, the saxophone walking through the minor scale while the
    nyckelharpa halo rings around every step.
  - MELLOTRON (×3, last v143 — 73-gap): the harmonic bed. Tape-choir or string-pad
    setting sustains the tonal foundation beneath the two voices — warm, slightly
    worn, analogue. It does not compete with the halo or melody; it is the room
    temperature, the stone floor, the grey water rising silently.

  Scene anchor: a vast empty stone hall as floodwater rises silently at dawn. The
  stone amplifies every sound — the nyckelharpa halo is the hall's own resonance;
  the tenor saxophone is one person breathing and stepping through the knee-deep
  water; the mellotron is the grey light entering through high windows. The silence
  at 2:05 is the moment the water level reaches the doorway threshold and stops
  moving. The B-minor return at 2:10 is the light brightening, not the water
  receding — luminous grief, not rescue.

  Novelty claims: first BELL-HALO TWO-VOICE STRUCTURE prompt in catalog; 123 BPM
  not previously used in any catalog YAML (new-bpm); B-flat minor to B minor
  chromatic modulation is new; vast-empty-stone-hall-as-floodwater-rises-at-dawn
  scene not previously used; nyckelharpa + tenor saxophone + mellotron trio is new;
  nyckelharpa cast as continuous triadic halo voice (not melody) is new.

