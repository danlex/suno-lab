style: "Symphonic metal operatic ballad — the lovers' deck at dawn, sea-fog lifting, two figures dissolving into rising light. Polished studio mix, Hollywood scoring stage, warm tape saturation. F minor lifting to F# minor at 2:35, 102 BPM. Heldentenor opens alone in baritonal mid-register — dark and pliant — over harp arpeggios and bare strings. Rhythm section drops at 1:00; orchestra and choir swell at 1:30. The heldentenor pushes into full tenorial height at 1:45, cutting through the orchestral mass with dramatic-tenor command. Crotales ring at the peak — cold bell-cymbals above the storm. Half-step lift at 2:35 arrives in harp and strings, not the voice. From 3:00 the orchestra withdraws; the heldentenor returns one octave lower, baritonal and bare. Timpani marks the final descent. Deep low-end definition throughout. Film score for a love-death dawn scene. No growling, no screaming, no synthesizers, no pipe organ, no autotune."

lyrics: |
  [Baritonal opening — strings and harp, 16 bars]
  Ardor — in the sea-mist before light
  Amor meus — the long night holds
  Umbra recedes
  Still one breath

  [Density builds — drums enter, 16 bars]
  In mortem — into this dawn
  Vinculum — the bond unbreaks
  Two becoming one
  Ardor rising through the fog

  [Tenorial push — guitars full strings, 20 bars]
  Aeterna — love beyond the night
  Amoris — heat without end
  We dissolve into the other
  Ardor — burning toward the light

  [Full tutti — heldentenor high sustained, 24 bars]
  Unum — one body one breath
  The same surrender
  Ardor aeterna — burning one

  [Crotales peak — brass sustain, 12 bars]
  Vita — the light opens
  Unum holds

  [Half-step lift — strings harp transform, 20 bars]
  Ardor in mortem — ardor in vita
  Amor — the sea holds nothing now
  We are the light
  Vinculum aeterna — one

  [Octave lower — orchestra withdraws, 16 bars]
  Ardor — umbra — one breath
  Tempus finit — amoris holds
  Mors — vita — unum
  Ardor

  [Timpani descent — final bars, 8 bars]

  [End]

