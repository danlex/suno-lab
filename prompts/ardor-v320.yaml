notes: |
  Symphonic metal operatic ballad: a subgenre in which a classically-trained operatic
  voice is set against the full density of a modern metal rhythm section (distorted
  rhythm guitars, drum kit, bass guitar) with a large symphonic orchestra (full strings,
  male choir) providing harmonic mass. The genre originated in northern Europe in the
  1990s and has become stable Suno v5.5 long-form classifier territory, consistently
  rendering 3:00–4:00+ per v311+v312 validation data (mean 3:52, record 5:04).

  Concept source (researcher): v320 "Ardor" — symphonic metal heldentenor Liebestod
  ballad. Best recipe (v311+v312 mean 3:52) applied with two fresh variables: (1) male
  dramatic heldentenor voice — catalog debut in symphonic metal classifier territory;
  (2) Liebestod emotional concept — the simultaneous union of grief + transcendence +
  erotic into one architecture. F minor → F# minor at 2:35. 102 BPM. Dawn after the
  long night, two figures dissolving into rising light.

  The voice architecture here echoes the great heldentenor tradition of the 19th and
  20th centuries — whose foremost practitioners go unnamed here per catalog discipline.
  The heldentenor combines baritonal depth in the mid-register with full tenorial power
  at the apex, built to penetrate heavy orchestral density without amplification. This
  is architecturally distinct from all 319 prior catalog entries: v311+v312 used female
  dramatic soprano; v313 used male Romantic-opera bass-baritone; v314 used clean tenor;
  v299 used bel canto Italian tenor — none deployed the heldentenor voice type inside
  a symphonic metal classifier.

  Duration strategy: BPM 102 sits in the slow-to-moderate band (90–115 ceiling ~3:30
  per playbook rule 8). Duration argument rests primarily on the classifier lock:
  "Symphonic metal operatic ballad" anchors the first word, exactly matching v311+v312's
  proven classifier. Total lyric bar count: 132 bars across 8 sections + End. At the
  slow-BPM ceiling, this targets 3:00–3:30. Production tokens applied: polished studio
  mix, Hollywood scoring stage, warm tape saturation, deep low-end definition (four
  tokens). Sentence case throughout; atmospheric-first opening; colon-syntax lyrics with
  bar counts for per-section length scaffolding; NO [Silence] metatag (hardened rule per
  feedback_silence_gate_truncates.md). The density build (drums 1:00 → guitars 1:15 →
  full strings+choir 1:30 → tutti 1:45 → half-step lift 2:35 → withdrawal 3:00)
  follows the Liebestod arc without any silence gate.

  The forward-motion arc (density terracing upward) plus the half-step harmonic lift
  at 2:35 gives Suno's classifier a "forward-motion + modulation" cue that correlates
  with longer renders per playbook rule 10. The vocal return one octave lower at 3:00
  is the transformation proof — deeper than the opening, not louder.

  Instruments with catalog gaps:
  - harp (last v250, gap 69 — deep revival): the concert pedal harp, providing
    arpeggiated harmonic color in the opening bars over pizzicato strings, returning
    as part of the half-step lift mechanism at 2:35 when the F → F# minor transformation
    lands in the string-harp texture rather than the voice.
  - crotales (last v244, gap 75 — deep revival): small antique bronze cup-cymbals,
    struck to produce a piercing, pure-tone ring that cuts through any orchestral density;
    deployed at the full-tutti eruption peak (1:45–2:10) as atmospheric bell-punctuation
    above the storm, then silent in the withdrawal section.
  - timpani (last v300, gap 19): concert kettledrums, marking the final descent arc
    (3:00–end) as the orchestra withdraws — rolling softly beneath the heldentenor's
    final baritonal phrases before the terminal cadence.

  Novelty claims: voice-novelty (heldentenor voice type in symphonic metal classifier —
  catalog debut; 59th orthogonal voice architecture, distinct from all 319 prior entries);
  concept-novelty (Liebestod emotional framework — grief + transcendence + erotic in one
  arc, the 4th pole beyond the v316–v318 triptych of grief/transcendence/defiance);
  instrument-revival (harp, gap 69); instrument-revival (crotales, gap 75 — deepest
  revival in this trio); BPM-revival (102 BPM last v291, gap 28); key-revival (F# minor
  last v256, gap 63 — the modulation target is a deep revival); scene-novelty (lovers'
  deck at dawn, sea-fog lifting, Liebestod dissolution — no prior dawn-at-sea love-death
  scene in catalog); best-recipe-application (v311+v312 proven classifier + density bed
  + half-step lift applied with two controlled fresh variables).

