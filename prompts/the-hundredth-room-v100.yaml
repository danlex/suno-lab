style: "ORCHESTRAL 2-STEP GARAGE with BASS FLUTE MULTIPHONICS + HARP, liquid syncopated elegance, cinematic shuffle groove, C minor to C-sharp minor, 138 BPM, purely instrumental. Bass flute breathes multiphonic chords — two notes at once from a single instrument, deep and breathy like wind through cathedral halls. Harp plays liquid glissandos cascading between syncopated beats. Full symphony strings perform the 2-step shuffle — skippy off-beat rhythms that make the orchestra swing and bounce. Pizzicato cellos provide the deep bassline groove. The build layers harp arpeggios over increasingly complex string syncopations while bass flute sustains breathy drones beneath. Then silence — two beats of nothing. Orchestra returns in C-sharp minor half-step up, full strings fortississimo, harp unleashing a full glissando, bass flute screaming multiphonics at the peak. Every instrument hitting the groove. No guitars, no vocals."
