style: "Modern Polish rap, polski rap trap, Warsaw indie-trap, 104 BPM, F# minor, Warszawa Praga 3am. Male Polish trap rapper — chesty mid-low Warsaw accent with Polish sibilant-rich phonetics (sz, cz, ść, dź consonant clusters + palatalized consonants), light Auto-Tune on hooks only, deadpan-introspective flow with melodic-belt moments, NOT French banlieue, NOT Russian shouty distorted, NOT Türk trap melismatic, NOT German sprechgesang — Polish trap signature with Slavic sibilant phonetic character and Warsaw-pop Auto-Tune. Production: minimalist Polish trap kit, sliding 808 sub, subtle piano sample loop in melancholic Slavic-minor color, trap hi-hat triplets, sharp clap, low cathedral pad pulse, vinyl crackle, hard saturation. 2026 Warsaw indie-trap, NOT mainstream Polish pop, NOT disco polo, NOT Polish folk, NOT Eurodance, NOT US Memphis phonk. Warszawa Praga 3am, neon-on-concrete. No disco polo, no Polish folk, no Eurodance, no orchestral."

lyrics: |
  [Intro]
  (piano sample loop, 808 slide) ej, ej
  ej, sen

  [Verse 1] (chesty deadpan Polish)
  trzecia nad ranem, miasto jeszcze nie śpi
  Praga po lewej, Wisła płynie po prawej
  pamiętam twój głos jakby to było wczoraj
  rok temu poszłaś, ja jeszcze tu zostałem

  [Pre-Hook]
  (Auto-Tune touch) ej-ej, sen
  ej-ej, sen tylko sen

  [Hook] (trap-pop belt)
  sen, sen, ty jesteś moim snem
  sen, sen, ty wracasz w nocy
  sen, sen, ja cię nie zapomniał
  sen, sen, Warszawa pamięta

  [Verse 2]
  papieros przy oknie, kawa jeszcze gorąca
  Spotify gra naszą piosenkę, ale ty jej nie słyszysz
  WhatsApp ostatnio widziana wczoraj
  ja czekam jak idiota, choć wiem że nie wrócisz

  [Hook]
  sen, sen, ty jesteś moim snem
  sen, sen, Warszawa pamięta

  [Bridge]
  (piano sample loop, drums drop)
  [Mówione] sen, sen
  ej, Warszawa, ja jestem tu

  [Final Hook] (808 + Auto-Tune stack)
  sen (sen), ty jesteś moim snem
  sen (sen), ty wracasz w nocy

  [Outro]
  (808 fade) sen
  [End]

