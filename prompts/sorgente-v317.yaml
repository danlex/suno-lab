style: "Cinematic orchestral Sardinian cantu a tenore crossover — four male voices rising from limestone at first dawn. Four voices: deep bassu drone, buzzing contra overtones, harmonic mesu oche, pastoral oche lead. Cold ridge, breath visible, four shepherds. Polished studio mix, Hollywood scoring stage, deep low-end definition. E minor lifting to F minor at 2:45, 58 BPM. Bassu and contra open in hollow modal drone — no orchestra, only primordial vibration. Oche enters at 0:40; mesu oche joins; slow-bow strings as bare sustain. All four voices lock at 1:25; French horn swells as one long tone. Without percussion, full density by 2:10. Lift to F minor at 2:45, oche at peak — apotheosis. Orchestra drops at 3:10, bassu and contra alone in decay — the ancient voice outlasts the orchestra. Wide stereo stage, lush ambience. Film score for an ascent-and-return scene. No guitars, no choral walls, no rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Bassu + contra hollow drone, 12 bars]
  Sorgente...
  antigu...
  su tempus...

  [Oche enters pastoral phrase, 12 bars]
  Sorgente de su monte
  boghe antigu de s'alba
  pastores in su ventu
  iscoltàre su tempus

  [Mesu oche joins harmony — strings emerge, 14 bars]
  Sorgente de su core
  boghe chi no morit
  su tempus in su ventu
  pastores sutta s'alba

  [Full 4-voice cantu a tenore — French horn enters, 20 bars]
  Sorgente, sorgente
  boghe de su monte
  antigu, antigu
  su tempus, su tempus
  pastores, pastores
  iscoltàre, iscoltàre

  [Orchestral crescendo — building density, 24 bars]
  Sorgente de su mundu
  boghe chi resurget
  su tempus antigu
  de su monte, de s'alba
  pastores in sa pedra
  sorgente, iscoltàre

  [APOTHEOSIS: half-step lift to F minor, 22 bars]
  Fons aeterna — sorgente
  vox primaeva — boghe antigu
  Fons aeterna, fons aeterna
  sorgente de su tempus
  boghe, boghe, boghe
  antigu, antigu, antigu

  [Orchestra recedes — drone returns alone, 14 bars]
  Sorgente...
  antigu...
  su tempus...
  sorgente...

  [End]

