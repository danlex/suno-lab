style: "Modern Punjabi pop, P-Pop, R&B-infused Punjabi sing-rap, 92 BPM, F# minor, diaspora ballad. Smooth male Punjabi sing-rap — mid-low chest, melodic R&B emotional vulnerability, throaty Punjabi consonants, restrained close-mic in Punjabi with code-switched English lines, NOT autotune-chipmunked, NOT shouty, NOT whispered, NOT relaxed amapiano. Minimalist 2026 AP-Dhillon-zone production: deep 808 sub-bass, sparse hip-hop trap drums with rolling hi-hat, warm Rhodes electric piano chords, subtle dhol accents (NOT full bhangra), occasional tumbi melodic riff, ambient pad bed, sparse strings only in the bridge. Urban diaspora aesthetic — Brampton/Toronto-via-Punjab balcony reflection, late-night drive-home vibe. The vocal carries the weight, production stays out of the way. No bhangra dance floor, no Bollywood orchestration, no traditional folk, no soaring belt, no kawaii, no orchestral, no broadway."

lyrics: |
  [Intro]
  (Rhodes chord, distant)
  [Spoken] pind, pind, mera pind

  [Verse 1]
  do hazaar mile dur, mainu raat di yaad aa
  meri maa di awaaz, mera pind, meri jaan
  city de lights wich, main akela so jaava
  par pind di galiyaan ne, mainu wapas bulava

  [Pre-Hook]
  oh oh, mera pind
  oh oh, meri jaan

  [Hook]
  pind, mera pind, mainu vaapas le chal
  pind, mera pind, jithe meri kahani shuru hoi
  pind, mera pind, papa di chaa di mehek
  pind, mera pind, ghar di yaad hai mainu

  [Verse 2]
  passport stamps te flights, success di kahani
  par dil de andar, ik chhota munda jis nu ghar di pyaas
  buildings te lights, sab kuchh hai par
  maa di lori jiha sukoon nahi milda mainu

  [Hook]
  pind, mera pind, mainu vaapas le chal
  pind, mera pind, jithe meri kahani shuru hoi

  [Bridge]
  (sparse strings enter)
  [Spoken] kade kade socho, ki main ki hoyaan
  ki main ki hoyaan, ki main ki hoyaan

  [Final Hook]
  pind (mera pind), mainu vaapas le chal
  pind (mera pind), papa di chaa di mehek

  [Outro]
  (Rhodes fade) mera pind
  [End]

