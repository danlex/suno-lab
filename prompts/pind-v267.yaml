notes: |
  VIRAL ARM cycle v267 — Modern Punjabi pop / P-Pop. Research-driven
  (MusiCulture, Spardha, Pollywood 2026, Music Ally 2026 Juno noms):
  P-Pop is the 2026 term-of-art for the AP Dhillon / Karan Aujla / Shubh
  / Sidhu Moose Wala wave — minimalist trap-influenced production, R&B
  emotional vulnerability, urban diaspora themes, 85-105 BPM, vocal
  layering experimentation. Global Spotify breakthrough confirmed
  (Karan Aujla + Shubh nominated for 2026 Juno awards; AP Dhillon among
  top-streamed South Asian artists globally). TikTok-viral lane through
  the global Punjabi diaspora.

  USER VALIDATION + LANE EXPANSION: v264 "Tóxico" praise drove the
  Latin/Lusophone push (v264 ES neoperreo, v265 PT funk carioca). v266
  expanded geography to South Africa (amapiano) maintaining viral
  momentum. v267 expands again — South Asia — to keep the language
  rotation moving and prove the viral-arm playbook works across
  geographies, not just Latin/African.

  VOICE DIFFERENTIATION — eighth orthogonal voice in eight cycles:
    v260 — male whisper EN (drift phonk, distorted, dark)
    v261 — soprano belt EN (slap house, arena reverb)
    v262 — husky contralto FR (close-mic intimate)
    v263 — pitched-up kawaii EN (hyperpop, chipmunked)
    v264 — raspy Latina sing-rap ES (autotuned, attitude)
    v265 — shouty Portuguese MC PT (dry close-mic urgency)
    v266 — relaxed amapiano male ZU/XH/EN (casual chest, NOT shouty)
    v267 — smooth Punjabi sing-rap male PUNJABI (melodic R&B vulnerability,
           throaty consonants, restrained close-mic, NOT autotuned-chipmunked,
           NOT shouty, NOT whispered, NOT relaxed-casual)
  The load-bearing phrase pins the register against drift to any of the
  seven prior characters. Both style and exclude_styles explicitly block
  all seven. Third male voice in the catalog (after v260 distorted whisper
  and v266 amapiano casual chest); the first one with R&B melodic emotional
  vulnerability — a genuinely new male archetype.

  LANGUAGE — sixth distinct language in the viral arm. Punjabi with code-
  switched English lines is canonical diaspora P-Pop practice (AP Dhillon
  songs routinely mix Punjabi verses with English hooks). Lyric vocabulary
  uses authentic Punjabi: "pind" (village), "mera pind" (my village),
  "vaapas le chal" (take me back), "ghar di yaad" (homesickness), "maa di
  lori" (mother's lullaby), "papa di chaa" (father's tea). Concept: classic
  P-Pop diaspora narrator — physically successful abroad (passport stamps,
  city lights, buildings) but emotionally tied to the village (mother's
  voice, father's tea, the street where the story began). Genre-canonical
  thematic core.

  BPM 92 — center of the modern P-Pop slow-trap-R&B sweet spot. Fresh
  against recent cycles (recent: 96, 110, 115, 124, 138, 150, 160). Slower
  than amapiano's 115, distinctly slower than the dance-floor viral cycles,
  matches the introspective tempo P-Pop ballads use.

  Key F# minor — fresh against the recent minor rotation (recent: A, D, F,
  Bb, G, C; E major in v263). F# minor is a warm reflective key that walks
  well with Rhodes electric piano and minor-key vocal melodies.

  Production palette pinned: "Brampton/Toronto-via-Punjab golden-hour-on-
  the-balcony energy, late-night reflective drive-home vibe, NOT traditional
  bhangra, NOT Bollywood" — Brampton/Toronto is the Canadian Punjabi
  diaspora hub where AP Dhillon (Brampton-based) built his sound. This
  geographic anchor pins Suno away from the two failure modes (traditional
  bhangra dance-floor and Bollywood orchestration) and toward the urban
  diaspora P-Pop production tradition.

  Dhol and tumbi appear in restrained roles ("subtle dhol accents (NOT full
  bhangra), occasional tumbi melodic riff") — both fresh instruments in the
  catalog rotation, included to anchor Punjabi cultural identity without
  dominating the mix in a bhangra direction.

  Title "Pind" — single Punjabi word for "village," 4 chars, MEME-able,
  thematically genre-canonical (the diaspora-village concept is the
  evergreen P-Pop themecore). Not tied to a specific famous song title.

  Style char target: validated below 1000 via scripts/yaml_field_check.py.
  Blocklist clean (no Dune/desert/Bollywood-artist names; "dhol" and "tumbi"
  are instrument names, not artist names).
