name: "yeye-v524"
version: 524
title: "Nerve524"
instrumental: false
vocal_gender: female

style: "Bright, sun-drenched yé-yé chamber-pop — a vibraphone is the melodic hero, shimmering warm-metal through every bar. Intimate, playful mid-range female lead, genuinely sung with a bright melodic line and a knowing wink: charming, buoyant, never belted. Brushed-drum kit and walking upright bass keep a swing pocket; acoustic guitar, pizzicato strings, and a harpsichord counterline weave the harmony; stacked \"ooh-ooh\" vocals bloom in call-and-response after every hook. G major, 143 BPM. Polished studio mix, warm tape saturation, wide stereo stage. 60s-pop AABA form: two verse-refrains build to the hook, a middle-eight brings a new melody and wry scene, the vibraphone takes a textured break over the swing pocket, then the final refrain returns in full color — vibraphone, woodwinds, strings, harpsichord, stacked vocals. Warm G-major combo cadence to close. No distorted guitars, no pipe organ, no synthesizers, no rock drums, no auto-tune."

lyrics: |
  [Intro: vibraphone states the theme over guitar and brushed kit, buoyant swing pocket, 8 bars]

  [A1: first verse-refrain, intimate vocal, light texture, 16 bars]
  I rehearsed the casual lean against the door
  Then tried it twice and nearly lost the floor
  Smoothed my collar, checked the clock, and then
  I told myself to try the whole thing once again

  I borrowed my nerve from the second cup
  (ooh-ooh, ooh-ooh)
  The one that told me to look up
  (ooh-ooh, ooh-ooh)
  Borrowed my nerve from the second cup
  (ooh-ooh)

  [A2: second verse-refrain, vibraphone and backing vocals fuller, 16 bars]
  You had your jacket on already when I got there
  I said the rain was coming just to make you stay a minute
  You looked at me the way a person looks at weather
  Like you couldn't tell exactly what was in it

  I borrowed my nerve from the second cup
  (ooh-ooh, ooh-ooh)
  The one that told me to look up
  (ooh-ooh, ooh-ooh)
  Borrowed my nerve from the second cup
  (ooh-ooh)

  [Middle-Eight: new melody, wry lyric turn, harpsichord counterline and pizzicato strings color, 12 bars]
  You left your umbrella here again
  (ooh-ooh, ooh-ooh)
  I hung it by the door just like a friend
  (ooh-ooh)
  Now every time it rains I think of how
  You gave me a reason to come back somehow

  [Vibraphone Break: bright textured vibraphone lead over swing pocket and pizzicato strings, full melodic run, 10 bars]

  [A3: final refrain, full color — vibraphone, woodwinds, strings, harpsichord, stacked ooh-ooh vocals, 20 bars]
  I borrowed my nerve from the second cup
  (ooh-ooh, ooh-ooh)
  The one that told me to look up
  (ooh-ooh, ooh-ooh)
  Borrowed my nerve from the second cup
  (ooh-ooh, ooh-ooh)
  Maybe the third cup was luck
  (ooh-ooh)

  [Outro: vibraphone, guitar, and upright bass resolve to a warm bright G-major cadence, ringing close, 8 bars]
  [End]

