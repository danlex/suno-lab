notes: |
  Electronic body music is a genre crystallized in the 1980s at the intersection of Belgian and German industrial dance culture — rigid drum machine patterns at aggressive tempos, confrontational cold vocals, synthetic basslines that repeat without variation, and a central thesis that the human body is indistinguishable from machinery. The aesthetic emerges from post-punk industrial culture stripped to its hardest functional elements. The concept source passed here is "the biometric misclassification thesis": the body's distress signal (sweat) is catalogued by the system as a machine lubricant (coolant) — the body as inventory, its signals as engineering data. The echo of that 1980s Belgian/German tradition is present throughout; no project names or artist names are used per blocklist discipline.

  Duration strategy: 175 BPM places this in the proven duration band where bar counts translate reliably to wall-clock time. The lyric-free mechanical interlude (36 bars) between verse/chorus cycles and verse 2/chorus cycles is the primary duration lever — community-documented as the move that clears 3:00 at this tempo. Last lyric timestamp pushed to approximately 2:40 with a long rigid instrumental outro beginning at 2:50. Total bar count: ~188 bars, targeting 3:00–3:30 wall-clock. Production tokens: polished studio mix, deep low-end definition, wide stereo stage. Sentence case throughout — no ALL-CAPS form labels. Atmospheric-first opening leads with the genre and temperature. Two of three instruments are body voices (prepared piano, subcontrabass saxophone); waterphone is the one permitted spectral pick.

  Trio instruments and roles:
  - Waterphone (gap 13): metallic scrape and ringing decay; provides the inhuman texture that blurs the boundary between machine noise and resonance.
  - Prepared piano (gap 20): percussive detuned rhythmic attacks; replaces what a standard piano would do melodically — here it is purely rhythmic and industrial, locking to the drum machine grid.
  - Subcontrabass saxophone (gap 17): sub-bass drone; the lowest pitched saxophone variant, anchoring the foundation below the synthetic bassline and providing the "coolant" texture in sound — slow, massive, continuous.

  Novelty claims: EBM is a catalog debut genre. 175 BPM is an unused BPM in the catalog. The machine-malfunction escalation climax (stutter-glitch → polyrhythm fracture → modulation as system reboot) avoids the build-strip-half-step-lift formula by framing the key change as a state change rather than a vocal lift. Style char count: 917.

