style: "Electronic body music, industrial dance, cold confrontational machinery at 175 BPM in D-flat minor, modulating to D minor at the system-reboot climax. Waterphone provides tonal scrape and ringing decay bleeding into the grid; prepared piano delivers percussive detuned attacks that ARE the rhythm, not ornament; subcontrabass saxophone anchors a sub-bass drone beneath the synthetic kick. Rigid bassline loops without deviation. Hook delivered flat, no melodic inflection — cold incantation of a cataloguing system. Drum machine locked until stutter-glitch fractures the beat into polyrhythm at 2:00 — malfunction, then reboot at higher voltage as the modulation lands. Sidechain-compressed mix: low-end punch, razor transients, floor pressure. Underscore for an EBM club floor at midnight: bodies logged as inventory, sweat as lubrication data, steel presses marking time. No guitars, no rock drums, no pipe organ, no acoustic warmth, no ambient wash."

