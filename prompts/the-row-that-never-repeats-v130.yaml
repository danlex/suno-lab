notes: "v130 — ORCHESTRAL TWELVE-TONE. Fifth 20th-century avant-garde technique after the canonical four (micropolyphony, minimalism, spectral, aleatoric). Twelve-tone serialism organizes all 12 chromatic pitches into a tone row — each pitch sounds before any repeats. Four row forms: prime (P), retrograde (R), inversion (I), retrograde inversion (RI). Key characteristic: no tonal center, no key hierarchy, all 12 pitches egalitarian. RESEARCH: MasterClass + Wikipedia + Britannica confirm technique. Originator's composer name omitted per blocklist. 'Variations for Orchestra' cited as exemplar. Structure: tone row stays in strict order throughout, can be transposed but not rearranged. INSTRUMENTS: Contrabass (×5, last v97 — **32-VERSION GAP, DEEPEST AVAILABLE AFTER v129's FRENCH HORN (37-gap)**) = lowest bowed string, chromatic lines possible across its full range. Trumpet (×3, last v106, 23-gap) = lyrical brass, can voice chromatic clearly. Vibraphone (×3, last v110, 19-gap) = mallet percussion with motor vibrato, all 12 pitches equally easy. Three voices from different families playing row transformations. NOVELTY: First 12-tone/serialism. 98 BPM = never used. First atonal framing in the repo (no traditional key center). Intellectual rigor / systematic beauty emotion (new territory). Added 'tonal, key-centered' to exclude_styles to prevent Suno from defaulting to tonal harmony. 963 chars."
