name: "the-row-that-never-repeats"
version: 130
style: "ORCHESTRAL TWELVE-TONE film score for a cryptographer-at-dawn scene, total duration 1:00 to 2:00, with CONTRABASS + TRUMPET + VIBRAPHONE, twelve chromatic pitches treated equally in a tone row where no note repeats until all have sounded, atonal chromatic field from C transposed up a half-step, 98 BPM, instrumental. From 0:00 contrabass states the prime row alone — twelve pitches in sequence, each equal. At 0:18 vibraphone plays the retrograde, row backwards. At 0:40 trumpet enters with the inversion, interval direction reversed. At 1:00 full orchestra joins — strings, woodwinds, brass in overlapping row transpositions, no key center, pure chromatic architecture. Silence at 1:25 — the code held unresolved. At 1:28 music returns with the row transposed up a half-step, all three voices fortississimo in retrograde inversion. Ends at 1:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "The Row That Never Repeats"
lyrics: |
  [Short Instrumental Intro]
  [Prime Row]
