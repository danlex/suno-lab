style: "Cinematic orchestral folk anthem, soaring earnest male voice building from intimate verse to a ringing stadium-scale chorus, total duration around 3:00. D major, 109 BPM. Polished studio mix, wide stereo stage, warm tape saturation on strings, deep low-end definition under the orchestral bed. The nyckelharpa carries the haunted signature — keyed-fiddle drone with shimmering tremolo — threading every section; oboe d'amore answers the vocal with a warm alto reed tone; French horn sustains beneath the highest chorus note and swells through the climax. Cinematic percussion drives constant forward momentum — not a slow ballad. The final chorus blooms into a full orchestral density swell: stacked wordless choir aahs, full strings, French horn at peak, nyckelharpa drone layered in a dynamic crescendo — no key change, D major throughout, pure density lift. No guitars, no pipe organ, no drum machine, no synth pads, no trap or EDM beats."
title: "Lantern470"
lyrics: |
  [Intro: nyckelharpa tremolo drone with soft string rise, 6 bars]

  [Verse 1: intimate male voice, sparse strings and oboe d'amore beneath, 12 bars]
  The road went dark before the turn
  I kept my feet on what I knew
  A mile of cold and ice to burn
  Just the faint warmth of something true

  [Pre-Chorus: strings swell, nyckelharpa drone lifts, building forward, 6 bars]
  Still I carried every step
  Through the ice and through the snow
  One thing I will not forget

  [Chorus: full male voice ringing, French horn sustaining, nyckelharpa shimmering, 10 bars]
  I left my lantern on the ice
  So you could find your way to me
  I left my lantern on the ice
  A burning answer, a burning promise
  That I would be where I said I'd be

  [Verse 2: voice pulls back, oboe d'amore leads the reply, 10 bars]
  The cold will not outlast the will
  I've learned what distance really weighs
  To hold a light through dark and still
  Is not a gift — it is a grace

  [Pre-Chorus: mounting urgency, strings thicken, 6 bars]
  Still I carried every step
  Through the ice and through the snow
  One thing I will not forget

  [Chorus: male voice full and ringing, French horn below the held note, 10 bars]
  I left my lantern on the ice
  So you could find your way to me
  I left my lantern on the ice
  A burning answer, a burning promise
  That I would be where I said I'd be

  [Nyckelharpa and French Horn Break: lyric-free instrumental passage, nyckelharpa tremolo over sustained French horn swells and quiet string ostinato, oboe d'amore enters mid-phrase, 20 bars]

  [Bridge: stripped voice over nyckelharpa alone, then oboe d'amore joins, very spare, 8 bars]
  The ice will crack, the season turn
  But not before I see the dawn
  Some things you only know you've earned
  When you find you're still holding on

  [Orchestral Density Swell Climax: voice at full peak, stacked wordless choir aahs swell in, full string section, French horn fortissimo, nyckelharpa drone continuous — dynamic and textural crescendo building to the final held note, D major, 16 bars]
  I left my lantern on the ice
  So you could find your way to me
  I left my lantern on the ice
  A burning answer, a burning promise — (aah, aah)
  That I would be where I said I'd be

  [Coda: wordless choir aahs fade, French horn sustains, nyckelharpa tremolo alone, resolves, 4 bars]

  [End]
