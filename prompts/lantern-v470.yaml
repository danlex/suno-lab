notes: |
  Technique: Cinematic orchestral folk anthem with a density-swell climax (no key modulation). The arc lifts the final chorus via layered textural and dynamic accumulation — stacked wordless choir harmonics, full strings, French horn fortissimo, and continuous nyckelharpa drone — achieving emotional peak through arrangement density rather than pitch transposition or silence-trick. This approach keeps tonal coherence (D major throughout) while delivering the contrast and lift of a modulation-free crescendo.

  Concept source: Endurance, solitude, and hard-won rising — a figure leaving a lantern on ice so another can find their way back. The hook contour specifies a pickup stepwise rise to an octave leap on the title word, held beneath a French horn sustain.

  Composer omission: This echoes the cinematic orchestral folk lineage (Icelandic and Nordic film-scoring tradition, post-millennial folk-anthem craft) without naming any composers.

  Duration strategy: Parametrized colon-lyrics with bar counts (6+12+6+10+10+6+10+20+8+16+4 = ~108 bars at 109 BPM, targeting ~3:00 wall-clock). The mandatory mid-song instrumental break ([Nyckelharpa and French Horn Break], 20 bars, lyric-free) is the primary duration lever — consistent with the v348/v349 learning. Production tokens used: polished studio mix, wide stereo stage, warm tape saturation, deep low-end definition. Sentence case throughout, atmospheric-first opening.

  Instruments:
  - Nyckelharpa (gap ~111 cycles): carries the haunted drone-and-tremolo signature threading every section; enters with a shimmering tremolo descent after the held chorus peak note.
  - Oboe d'amore (gap ~114 cycles): warm alto reed answering the male vocal; leads the reply in verse 2 and joins mid-phrase in the instrumental break.
  - French horn (gap ~42 cycles): cinematic sustained swell beneath the highest chorus note; fortissimo in the density-swell climax.

  Novelty: Cinematic orchestral folk anthem is a fresh lane for the catalog — high-variance contrast to the electronic/groove/roots run v462–v469. Nyckelharpa + oboe d'amore pairing is rare (both instruments carry large version gaps). Density-swell climax (no key change, pure layering) avoids the overused silence-then-half-step cliché. Male voice rebalances after multiple female cycles. BPM 109 in the slow band — duration target is ~3:00, consistent with the slow-BPM ceiling finding (~3:30 max), accepted and appropriate here.

