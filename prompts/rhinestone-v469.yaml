notes: |
  v469 candidate RHINESTONE — hard techno x electroclash, a deliberate high-variance uptempo contrast after an organic/mid-tempo run (v464-v468: vibraphone soul at 110, new-jack swing at 98, bass house at 130, window house at 124, southern soul blues-rock at 82). The last genuinely cold-industrial track in the catalog was several dozen cycles ago.

  GENRE FUSION: hard techno x electroclash is a catalog debut combination — hard techno provides the distorted four-on-the-floor brutalism; electroclash provides the campy-deadpan female persona, trashy sawtooth stab aesthetic, and spoken-tail delivery. Neither genre alone appears in recent catalog in this fusion form.

  PREPARED PIANO AS INDUSTRIAL STAB: prepared piano last appeared at v365 (gap ~104 cycles). Here it operates in pure industrial mode — metallic hammered-string attack used as rhythmic percussive color, not as a melodic/harmonic instrument. This is a new deployment mode for prepared piano in the catalog (previously used in atmospheric/harmonic roles).

  HOOK ARCHITECTURE: "Rhinestone in a wreckage" is built with a specific pitch contour — rising grace-note scoop F#→G# on 'Rhinestone', stepwise fall to E on 'in a', minor-third rise B→C# on 'wreck-age', then a sawtooth stab fires in the silence gap before the deadpan spoken tail "that's the plan" locked to the kick on three flat notes. Voice and kick alternate so they never collide — a conversation between the sung hook and the distorted beat. The tail mutates across choruses: "that's the plan" → "still the plan" → "always was the plan."

  CLIMAX ARC — KICK VAMP TEASE + DENSITY DROP: mid-song the track strips to kick alone (8 bars of nothing but distorted four-on-the-floor), then the full stack slams back simultaneously — kick, analog bass, sawtooth stabs, prepared piano — with a distortion/intensity surge. This is a DENSITY/DISTORTION event, not a key modulation. G-sharp minor throughout, single tonal center, zero half-step lift.

  DURATION LEVER: 142 BPM sits in the proven duration band (130-160). The lyric-free [Stab Breakdown] (~16 bars, ~7s) + [Kick Vamp Tease] (~8 bars, ~3s) + [Hard Drop Return] mid-song (24 bars) provide structural length. Final hook pushed to ~2:45 to pull the render toward 3:00.

  VOCAL: campy-confident, melodically sung, self-possessed and slightly sneering — explicitly NOT rapped or near-spoken. The deadpan spoken tail is a distinct layer (three flat notes on the kick) that contrasts with the sung main hook rather than replacing it.

  Instruments with gaps: DISTORTED FOUR-ON-THE-FLOOR KICK + BUZZING ANALOG BASSLINE (electronic genre anchors, continuous), DETUNED SAWTOOTH SYNTH STABS (off-beat trashy electroclash color), PREPARED PIANO (last used v365, gap 104 cycles — metallic hammered industrial stabs, a new deployment mode).

  Novelty: hard-techno x electroclash fusion is a catalog debut; kick-vamp-tease + density-drop climax arc is new (distinct from modulation or instrument-reveal arcs); prepared piano in industrial-stab mode is a fresh deployment; 142 BPM high-energy uptempo injection after slow/mid run.

  Style char count: 943.

