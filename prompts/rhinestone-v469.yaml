style: |
  Hard techno meets electroclash on a cold industrial floor — peak-time brutalism dressed in campy confidence, total duration around 3:00. G-sharp minor, 142 BPM, polished studio mix with deep low-end definition and wide stereo stage. The distorted four-on-the-floor kick cuts like a blade: every beat a snap-transient, physical and relentless. A buzzing analog bassline locks beneath it, thick and slightly detuned. Detuned sawtooth synth stabs fire on the off-beat — trashy glinting neon snarls against the kick's thud. Prepared piano delivers metallic hammered-string stabs: the track's signature industrial color. The female vocal is sung — coolly melodic, self-possessed, almost sneering — with a deadpan spoken tail after the hook. The climax strips to kick alone for two bars then slams the full stack back with a distortion surge — a density event, not a key change. No reverb wash, no lush synth pads, no guitars, no choir, no acoustic.

lyrics: |
  [Kick and Bass Intro: distorted four-on-the-floor kick enters alone, buzzing analog bassline joins bar 5, sawtooth stabs trickle in bar 7, no vocal, 8 bars]

  [Verse 1: full stack — sung female vocal enters, coolly melodic and self-possessed, 16 bars]
  Cold tile under neon lights
  I know exactly what I cost
  Everybody's counting rubble
  I was never what you lost
  Every room I walk into
  something glints that wasn't there
  Call it cheap, call it obvious —
  darling, I don't care

  [Pre-Chorus: sawtooth stabs double in density, analog bass swells, vocal rises toward the hook, 8 bars]
  You built a wreckage just to prove
  that wreckage can be permanent
  Go ahead, I'll wait

  [Chorus Hook 1: kick and full stack lock in, sung hook with pitch contour F#→G# on 'Rhinestone', stepwise fall E on 'in a', minor-third rise B→C# on 'wreck-age', sawtooth stab fires in silence gap, then deadpan spoken tail locked to kick, 16 bars]
  Rhinestone in a wreckage
  [spoken] that's the plan
  Rhinestone in a wreckage
  [spoken] that's the plan
  Rhinestone in a wreckage
  [spoken] that's the plan
  Still here — still shine — still standing
  [spoken] that's the plan

  [Verse 2: vocal sneer deepens, prepared piano stabs punctuate between lines, 16 bars]
  You said the lights were too much
  I said the dark is the problem
  You catalogued my every flaw
  I framed them and I sold them
  This is not an accident
  this is a point of view
  Every crack's a price tag —
  let me quote it back to you

  [Stab Breakdown: lyric-free — prepared piano metallic stabs lead, sawtooth stabs answer, kick present but dry, no bass, the mix goes skeletal and angular, 16 bars]

  [Kick Vamp Tease: full stack stripped to kick alone — just the distorted four-on-the-floor, nothing else, breath of industrial cold, 8 bars]

  [Hard Drop Return: full stack slams back with distortion surge — kick, analog bass, sawtooth stabs, prepared piano all hit simultaneously, density and distortion event, no key change, 24 bars]
  Rhinestone in a wreckage
  [spoken] still the plan
  Rhinestone in a wreckage
  [spoken] still the plan
  Rhinestone in a wreckage
  [spoken] still the plan
  Cold, bright, impossible —
  [spoken] still the plan

  [Final Hook: vocal pushed late, hook mutates to final deadpan tail, stack holds full intensity, 16 bars]
  Rhinestone in a wreckage
  [spoken] always was the plan
  Rhinestone in a wreckage
  [spoken] always was the plan
  Don't mistake the glint for warmth
  I know what I am
  Rhinestone in a wreckage —
  [spoken] always was the plan

  [Outro: kick and sawtooth stabs alone, prepared piano delivers single final metallic stab, kick fades, 8 bars]

  [End]

