name: "lueur-v329"
version: 329
title: "Lueur"
instrumental: false
vocal_gender: female

style: "Summer pavement cooling at dusk — neon café glow, crêpes and warm asphalt, someone leaning on a scooter. Polished studio mix, wide stereo stage, warm tape saturation on the vocal. French nu-disco vocal pop, breathy intimate French female lead, upbeat four-on-the-floor groove at 107 BPM, B-flat major lifting to B major at the final chorus. Bandoneon breathes wistful warmth between vocal phrases; steelpan rings high with bright syncopated shimmer above the hook; upright bass locks the rubbery groove pocket. Rhodes chords anchor the warm groove bed. Verse 1 bare: bass, Rhodes, vocal. Pre-chorus adds guitar and steelpan. Chorus hits full groove with bandoneon swell and backing harmonies. Breakdown strips to bass and handclaps. Final chorus lifts a half-step, brief string-pad swell, sustained groove fade. Underscore for a Paris dusk café groove scene. No lead guitar, no rock drums, no pipe organ, no synthesizers, no choir."

lyrics: |
  [Couplet 1 — voix et basse, 0:00]
  Tu rentres tard, le soir te garde
  Je t'entends monter l'escalier
  La lumière est douce, elle retarde
  Le moment où tu vas m'embrasser

  [Pré-refrain — guitare et steelpan, 0:28]
  Quelque chose en moi s'allume
  Une lueur sur les toits
  Je veux danser cette nuit
  Reste là, reste avec moi

  [Refrain — groove plein, 0:45]
  Lueur, lueur sur nos visages
  Lueur dans les yeux de la ville
  Danse encore, efface les âges
  Tu me rends fragile

  [Couplet 2 — bandonéon entre, 1:05]
  On comptait les jours, les heures perdues
  Maintenant tu prends ma main
  Et tout le reste disparaît
  Fondu dans le soir sans fin

  [Pont — basse et claquements, 1:35]
  Juste toi, juste moi
  Ce rythme entre nos pas
  Reste, ne pars pas

  [Refrain final — demi-ton, cordes, 1:52]
  Lueur, lueur sur nos visages
  Lueur dans les yeux de la ville
  Danse encore, efface les âges
  Tu me rends fragile
  Tu me rends vivante

  [End]

