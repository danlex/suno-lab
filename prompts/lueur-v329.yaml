notes: |
  Technique: French nu-disco vocal pop — breathy intimate French-language female
  lead vocal over a rubbery four-on-the-floor groove, with the "French touch" production
  lineage: warmth over sheen, wistful phrasing over belt, groove-pocket bass over club
  sidechain. Nu-disco is the dominant 2026 groove trend — 1970s/80s disco warmth recombined
  with modern production clarity and close-miked intimacy. This is the French-language variant
  of that lane.

  Concept source: charts-informed gap in the catalog — every prior French-language cycle
  (v248 cinematic, v253 darkwave, v262 dark electro-chanson) was nocturnal and introspective;
  no upbeat groove-driven French vocal pop has been attempted. This fills the open lane.

  Composer-omission: this song is in conversation with the tradition of French-language
  groove-pop producers whose work defined the late 1990s and 2010s "French touch" — none
  named here per blocklist discipline.

  Style char count: 945. Lyrics char count: 864. Both verified under hard ceilings
  (style ≤950, lyrics ≤1000) via scripts/text_tools.py in-range and count commands.

  Duration strategy: target 2:45–3:10. BPM 107 is in the slow-to-mid band (90–115),
  where Suno caps around 3:30 regardless of bar count. The arc is optimized for emotional
  density rather than maximum length: Verse 1 bare → Pre-chorus → Chorus → Verse 2 →
  Breakdown (bass + handclaps) → Final chorus with half-step lift and string-pad swell →
  sustained groove fade. No [Silence] metatag per feedback_silence_gate_truncates. Colon-syntax
  lyric labels (2–6 words, French descriptors) per feedback_lyrics_balance. Production tokens:
  polished studio mix, wide stereo stage, warm tape saturation. Sentence case throughout;
  no ALL-CAPS form labels. Atmospheric opening front-loads the dusk café scene.

  Featured trio (signature texture over the Rhodes/guitar groove bed):
  - Bandoneon (gap 146, last v182): wistful warm mid-field breath between vocal phrases.
    Body voice — the unexpected warmth register in a groove context, adds the wistful French
    pop phrasing quality without tango connotation.
  - Steelpan (gap 111, last v217): bright syncopated shimmer above the hook, high register
    punctuation on the pre-chorus and chorus. Spectral/bright voice — the one bright-shimmer
    pick permitted per trio rules.
  - Upright bass (gap 57, last v271): rubbery groove-pocket foundation, the physical
    center of the nu-disco feel. Body voice — warm and round, locks with the four-on-the-floor
    pulse without electric-bass hardness.

  Two body voices (bandoneon + upright bass) plus one bright voice (steelpan): satisfies
  the ≥2 body voices rule. Rhodes and jangly guitar are genre-anchor texture, not a fourth
  trio instrument.

  Novelty claims:
  - Technique novelty: French nu-disco vocal pop — zero prior catalog versions; first
    upbeat groove-driven French vocal pop attempt.
  - Trio novelty: bandoneon (gap 146) + steelpan (gap 111) + upright bass (gap 57) —
    all three at significant catalog absences; combination is catalog-unique.
  - Key novelty: B-flat major → B major (half-step lift at final chorus) — not prior in catalog.
  - BPM novelty: 107 BPM — only one prior use at v143 per novelty surface.
  - Language novelty: French-language vocal in an upbeat groove context — distinct from all
    prior French cycles which were nocturnal/introspective.
  - Scene novelty: dusk café scooter scene — warm, upbeat urban Paris, not midnight/rain.

