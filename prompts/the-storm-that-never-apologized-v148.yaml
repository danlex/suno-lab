notes: "COMPLETE APPROACH RESET per user feedback: 'mediocre, feel nothing, match the masters, tornado/cascade/eclipse.' Problems with v143-v147: poetic descriptions that mean nothing musically, exotic instruments Suno can't render well, everything sounds the same bland 'pretty.' Fix: (1) Direct visceral musical language — 'crashing', 'thunderous', 'screaming', 'detonates' (2) Standard orchestra — Suno knows what a full symphony sounds like (3) EXTREME dynamic contrast — solo cello to full orchestra fury (4) Silence as weapon — total cutoff at 2:00 then lone piano = maximum goosebumps (5) Simple inevitable melody, not clever technique. Target: Barber's Adagio climax, Beethoven's 5th opening, Rachmaninoff concerto fury."
