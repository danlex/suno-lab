style: "Tears on a dancefloor, grief becoming flight — euphoric hardstyle vocal anthem at 150 BPM in A-flat minor. Underscore for a heartbroken dancer reclaiming the floor. Distorted pitched reverse-bass kick; orchestral supersaw chords four voices detuned; screech laser sweep as pre-drop signal. Polished studio mix, wide reverb, tight sidechain-pumped low end. Single close-miked belted female vocal, no pitch-shift. Hook \"I danced where you used to be\": stepwise rise Ab4 through scale to Eb5, then a major-sixth leap to Fb5 on \"be\" — held, Fb against Ab-minor in an aching open sixth, melodic peak landing on absence. Climax: reverse-bass kick and low end withdraw entirely for eight bars while the belted hook and supersaw float weightless, then the laser screech fires and the hard kick slams back — the kick's return is the payoff. No guitars, no rock drums, no pipe organ, no chipmunk pitched vocals, no gabber rawstyle."

lyrics: |
  [Kick-Vamp: 0:00]

  [Verse 1: 0:16]
  I still walk the hallway where you stood
  My body turns the corner like it should
  Your coffee cup is dry, I left it there at noon

  [Pre-Drop: laser sweep rising, 0:48]
  Something still moves in the space that you left

  [Chorus: full kick, belted, 1:04]
  I danced where you used to be
  Arms wide in the dark, just me
  I found you in the floor and the walls and the beat

  [Verse 2: 1:36]
  The music has your timing in its bones
  I danced all night to fill the negative space

  [Pre-Drop: 2:08]
  Something still moves in the space that you left

  [Chorus: 2:24]
  I danced where you used to be
  I found you in the floor and the walls and the beat

  [Supersaw Vamp: no vocals, 2:56]

  [Float: kick and low end out, supersaw, 3:22]
  I danced where you used to be

  [Drop Return: screech, kick slams, 3:38]
  I danced where you used to be
  Arms wide in the dark, just me
  I found you in the floor and the walls and the beat
  I danced where you used to be

  [Outro: fade, 4:10]

  [End]

