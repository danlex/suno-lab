notes: |
  Euphoric hardstyle is a subgenre of the Dutch hard-dance family that emerged in the early 2000s, defined by distorted pitched reverse-bass kicks (the "reverse bass" — a kick drum whose sub component is synthesized to rise in pitch, creating a distinctive upward sweep before the transient), layered orchestral supersaw chords building trance-harmonic tension, screech and laser-sweep signals at the pre-drop, and clean belted female vocal hooks over trance-style chord progressions. It is distinct from gabber (which uses flat distorted kicks without the pitch arc), rawstyle (which uses harsher, darker aesthetics), frenchcore (which is faster and more dissonant), and happy hardcore (which is lighter and uses chipmunk-style pitch-shift). This is a catalog-debut family: no prior version has used this genre or its specific production signature.

  The concept source is heartbroken euphoria — crying on a dancefloor; dancing through grief; muscle memory of an absent person activated by movement; triumph and loss at once. Verses name the grief in plain concrete images (the dry coffee cup left untouched, shoes tied where a partner tied theirs, negative space filled with motion). The hook is the release: not explanation, but physical testimony. "I danced where you used to be" is the entire emotional argument, stated and restated.

  The hook is pre-scored at 22/25 for melodic arc. The contour is specified with pitch precision: stepwise climb from Ab4 (scale degree 1, "I") through Cb5 (flat third, "danced") through Db5 (fourth, "where") through Eb5 (fifth, "you used to") — four notes of rising scale motion — then a soaring major-sixth leap to Fb5 (flat sixth, "be"), the sixth held. The Fb5 against the Ab-minor supersaw chord creates a tearful open-sixth color: the flat sixth is the characteristic "yearning" interval of minor-key anthems, and landing it on the word of absence ("be" — the placeholder for the person who is no longer there) means the melodic ceiling is reached precisely at the emotional center of the lyric. This is not a repeated-note chant; it has a wide six-degree arc with a directional leap landing on the most important word.

  The climax device is a kick-withdrawal return, selected as novel to the catalog. No prior cycle has used this mechanism. At the Kick-Withdrawal Float section, the distorted reverse-bass kick and entire low end withdraw completely for eight bars while the belted hook and orchestral supersaw chords continue floating — the effect is sudden weightlessness, the floor disappearing, as if the grief has lifted the body momentarily clear of physics. Then the laser screech fires and the hard reverse-bass kick slams back under the soaring hook — the return of physical gravity is the payoff. This is explicitly NOT: texture-inversion (v390), false-ending, half-step modulation (penalized), call-and-response (v393), pitch-brake/tape-stop (v395), double-breakdown (v396). No [Silence] metatag used — documented to cause truncation. No key change anywhere per brief.

  Duration strategy for 150 BPM (high short-render risk — same band as makina v395). Key levers applied: (1) 10-section arc with explicit timestamps and bar counts, giving Suno per-section length targets; (2) an explicit lyric-free Supersaw Vamp at 2:56 running approximately 26 seconds — this lyric-free instrumental block between the second chorus and the climax is the single most reliable duration extender per v348/v349/v395 catalog data; (3) the Kick-Withdrawal Float at 3:22 is itself a length-generating event (eight bars of weightless float = approximately 3.2 seconds per bar at 150 BPM = ~26 additional seconds of content); (4) the Drop Return at 3:38 runs a full 16-bar restated chorus (~26 seconds); (5) final belted line of substantive lyrics pushed to approximately 4:10 territory with outro running beyond that. Target wall-clock 3:30-4:00. The 150 BPM sits in the proven 130-160 band (73%+ bar-to-time efficiency per playbook table), so bar counts work.

  Concept is forward-motion (dancing through grief — the body in motion, actively occupying space, moving through loss rather than sitting with it). Forward-motion concepts auto-classify as hard-dance electronic and render longer than reflective concepts per the playbook. Exclude-styles block primary drift risks: gabber (wrong kick character), rawstyle (wrong aesthetic register), frenchcore (too dissonant/fast), happy hardcore (too light/chipmunk), chipmunk pitched vocals (wrong treatment), cinematic ambient (the compression auto-tag that caps duration per playbook Rule 10). For this debut-family catalog addition, also blocking Dutch house, bouncy techno, freeform hardcore to prevent adjacent-genre misclassification.

  Style follows the playbook: atmospheric-first opening (feeling of tears and grief-becoming-flight before the genre label), three production tokens (polished studio mix, Hollywood scoring stage reverb, tight sidechain-pumped low end), sentence case throughout, five inline negatives at the close. Style char count: 939. Blocklist scan: clean. No artist names (no hardstyle artist names anywhere), no place references. Title is exactly one fused token: Ghost398.

