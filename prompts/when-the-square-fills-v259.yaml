name: "when-the-square-fills-v259"
version: 259
title: "When the Square Fills"
instrumental: true

style: "Cold shadow at the corner of the square — crowd ten deep, banners snapping, the procession about to round into view. Hollywood scoring stage, Decca-tree wide strings, deep low-end definition. D-flat minor to E major, 160 BPM march-cut. Three body voices: cornet announcing the herald line in clean bright brass, tenor saxophone filling the warm harmonic mass, viola da gamba grounding the bass with anachronistic gravitas. Strings, brass, and woodwinds accumulate — cornet fragments heard around the corner, saxophone thickening the body, viola da gamba below. All voices surge, drums driving — ensemble stops entirely, the last corner not yet turned. E major: cornet leads the full-tutti fanfare, strings, brass, woodwinds, and percussion together, saxophone filling the broad harmonic mass, viola da gamba in the deep bass. Public arrival, collective, ceremonially joyful. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Intro: distant drums and approaching brass over crowd ambience, cornet stating the herald theme in fragments as if heard from around a corner, viola da gamba in quiet bass, 12 bars]
  [Approach: cornet phrases growing louder and more complete, tenor saxophone entering warm beneath, strings joining underneath, viola da gamba stepping forward in the bass, 16 bars]
  [Theme Builds: full string section joins the cornet and saxophone, woodwinds layering into the texture, viola da gamba anchoring the low end, the procession clearly approaching but still out of sight, 24 bars]
  [First Wave: brass choir swells below the cornet, tenor saxophone thickening the harmonic mass, strings pressing forward, woodwinds weaving, viola da gamba steady in D-flat minor, 24 bars]
  [Countermelody: cornet and saxophone in interweaving lines above the string foundation, viola da gamba marking each beat in the bass, the crowd noise building, drums insistent, 16 bars]
  [Second Wave: full ensemble at high density — strings surging, brass choir pushing, woodwinds layering, cornet pressing the herald theme higher, saxophone filling the body, viola da gamba driving the bass, 24 bars]
  [Build: all voices accumulating forward momentum — strings intensifying, brass choir swelling, woodwinds filling every register, cornet ascending, saxophone broadening the harmonic mass, viola da gamba pushing the bass, drums at full drive, the procession rounding the final approach, 40 bars]
  [Silence: full ensemble stops — absolute held breath, crowd holding still, the last corner not yet turned, 8 bars]
  [Drop: cornet leads the full-tutti fanfare into E major as the parade spills into the open square — strings, brass choir, woodwinds, and percussion all together, saxophone filling the broad harmonic mass in joyful fullness, viola da gamba anchoring the deep bass underneath the whole collective weight, the arrival complete and public, 56 bars]
  [Drop Swells: full ensemble sustains the E major theme, strings sweeping, brass choir deepening, woodwinds expanding the texture, cornet carrying the herald line high and bright, saxophone broadening the harmonic body, viola da gamba in the deep bass, collective celebration, 32 bars]
  [Coda: orchestra slowly thins — brass withdraws, woodwinds recede, strings diminish to a held chord, cornet alone on a final clear phrase, saxophone a quiet last breath, viola da gamba one sustained low note, then open air, 16 bars]
  [End]

