notes: |
  Modern cinematic festival-parade arrival — the inward-to-outward release of a procession rounding the corner into the main square. The Build/Silence/Drop architecture (Playbook Move 7) maps directly onto the physical event: Build = the procession approaching just out of sight, Silence = the held breath before the corner, Drop = the parade spilling into the open square in full view. The Drop is full-density TUTTI — cornet, tenor saxophone, viola da gamba, strings, brass, woodwinds, and percussion all present — not an exposed solo restatement. E major fanfare arrival after D-flat minor shadow.

  Concept source: Continued hypothesis test of feedback_drop_density.md. v257 (exposed-Drop, elegiac) → 3:12 mean. v258 (full-density Drop, elegiac) → 3:34 mean. Both used elegiac emotional concepts, which may inherently cap around 3:30. v259 swaps the concept to forward-motion arrival (parade entering a square), keeps full-density Drop, and is designed to test whether the concept itself drives Suno's auto-classification toward sustained cinematic action rather than ambient/meditative. If render hits 4:00+, "forward-motion concept as duration driver" is promoted to playbook rule.

  The technique belongs to the tradition of ceremonial cinematic arrival music — composers whose names are on the blocklist and intentionally omitted. The emotional mechanism is collective public arrival: not individual heroism (v256 was that) but the joyful weight of a whole procession filling the public square. The key arc (D-flat minor shadow → E major warmth, enharmonic relative resolution) gives Suno a clear emotional shape: long cold shadow, sudden warm resolution.

  Duration strategy: 160 BPM sits in the proven 130–160 band (Playbook Move 8 table: bars-to-time efficiency excellent). Total lyric bars: 268, within the 240–280 target range. At 160 BPM, 268 bars predicts approximately 4:00–5:00 wall-clock. Parametrized colon-syntax lyrics with per-section bar counts (Move 1). Production tokens: "Hollywood scoring stage," "Decca-tree wide strings," "deep low-end definition" (Move 2). Sentence case throughout, no ALL-CAPS form labels (Move 3). Atmospheric-first opening (Move 4). Three body voices, zero spectral voices (Move 5). Build 40 bars + Silence 8 bars + Drop 56 bars + Drop Swells 32 bars = 136 bars of the impact stack at ~65% of the total arc (Move 7). Dead-weight superlatives stripped (Move 9). exclude_styles explicitly blocks "cinematic ambient," "intimate chamber," and "elegiac" to prevent drift.

  Trio rationale: three body voices (Move 5 satisfied, zero spectral). Cornet (gap 15, last used v244): the ceremonial-herald voice, announces and leads the fanfare arrival, clean bright brass for public proclamation. Tenor saxophone (gap 15, last used v244): warm harmonic mass, fills the body of the full-ensemble sound, gives the arrival its broad human warmth. Viola da gamba (gap 13, last used v246): anachronistic bass gravitas, the low anchor under the full orchestra, gives the collective arrival its weight and groundedness.

  Key: D-flat minor to E major — enharmonic relative major resolution. D-flat minor = cold waiting shadow (the crowd, the empty square, the approaching drums not yet visible). E major = warm arrival light (the parade in full view, banners aloft, full ensemble in the open square). The half-step-up cliché (v216–v219 overuse) is avoided by using enharmonic resolution across a full third-based key relationship.

  Scene: a festival square, winter morning, crowd already packed deep, banners and confetti in the air, the distant beat of drums growing louder from off-left. The procession has been out of sight around the final corner. The moment of silence is the held breath of ten thousand people. The Drop is when the cornet rounds the corner and the full ensemble spills into the open plaza.

  Style character count: 944.
