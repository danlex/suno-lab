notes: |
  v497 TOURNAMENT WINNER (inline-judged ~85/100; beat sibling candidate A "classic verse/hook song form + strip + vamp + density-return" at ~84 on distinctiveness + catchiness — B's recurring wordless "mm-mm oh-oh" post-chorus earworm is a genuine second hook that grows/stacks [a singable replay driver for our danceable-leaning audience], with verses matching A's writing quality). Lane: UK AFROSWING — never used in v462-v496 (distinct from afrobeats v270 and amapiano); a warm/sultry/danceable MALE melodic lane — strong contrast to v496's fast bright four-on-the-floor machine-house FEMALE.

  HIGH VARIANCE: breathy lightly-autotuned MELODIC MALE (floating/sultry — distinct from every recent male: bossa croon v495, cumbia tenor v493, P-funk warm v489), warm sultry 93 BPM afroswing bounce (breaks from the recent 131/73/153/101/91 cluster), F-sharp MINOR (warm/aching, novelty gap 34), 808/thumb-piano/light-guitar production. Vocal-gender alternation M/F held across v477-v497 (v496 female → v497 male).

  HOOK: "I know your leaving face" (hook-writer 20/25) — coins an ownable emotional compound noun (the micro-expression of someone who has already internally decided to leave). Contour: early 16th-note anticipation pickup ("I KNOW your" before beat 1) → stepwise rise to C# (minor 3rd) on "LEAV-ing" → minor-3rd drop to A on "FACE" landing dead on the snare (beat 3) → light Auto-Tune tail → thumb-piano echo answers. Plus the "mm-mm oh-oh" post-chorus earworm (second hook). Narrative: "You dress like you mean to linger / But your hands give you away"; "So I love you a little louder / For the part you can never stay."

  ARCHITECTURE — hook-forward / post-chorus-earworm form, groove-lift climax (non-modulation): COLD-OPEN hook (breathy, pluck alone, 808 on the repeat) → wordless post-chorus earworm → V1 (melodic sung flow, F#m→A movement) → hook → earworm → V2 → hook → earworm (stacked) → described lyric-free [Guitar and Thumb-Piano Break] (duration lever) → FINAL GROOVE-LIFT (extra pluck lines, fuller 808, doubled vocal, hook + earworm stacked to fullest density) → live-groove outro (thumb-piano + shakers hold, NO cold stop). Dropped the penalized half-step lift; climax by accumulation.

  DURATION GUARD (learnings): NOT a groove-primary one-phrase loop — full melodic sung arc (two 8-line verses + cold-open hook + 3 hook passes + growing earworm) + a described textured break + a live-groove no-cold-stop outro.

  INSTRUMENTS: warm 808 sub-bass + syncopated snare-on-3 + plucked THUMB-PIANO synth (melodic hero / call-and-answer) + light electric guitar texture + shakers. BPM 93 (novelty gap 156, warm afroswing bounce) and F-sharp minor (novelty gap 34) from the novelty surface; dropped its oboe-d'amore suggestion (not afroswing-authentic — the 808/synth-pluck/light-guitar palette is the genre).

  NEGATIVES AUDIT (feedback_negative_prompt_contradiction): does NOT exclude vocals/singing/autotune/808/synth/electronic/bass/electric-guitar (all core). REMOVED "reggae, dancehall" from the drafter's exclude_styles on promotion — afroswing's snare-on-3 bounce is dancehall-derived (the genre began as "afrobashment"), so excluding dancehall would rub against its rhythmic core. Excludes rock/metal/EDM-drop/orchestral/jazz + hard-rap/grime (the harder grime-adjacent edge afroswing's melodic wing avoids) + drift. English only, NO patois/pidgin, no place-names in style/lyrics.

  Style char count: 935.

