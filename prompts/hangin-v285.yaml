  WhatsApp seen, walang sagot
  Spotify playlist mo, may kanta tungkol sayo
  Manila gabi, jeepney busina sa malayo
  hangin lang ang sagot sa tanong ko

  [Hook]
  hangin, hangin, sayo ako lumilipad
  hangin, hangin, dito pa rin ako

  [Bridge]
  (kulintang ping, guitar sustains)
