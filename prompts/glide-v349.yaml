title: "Glide"
instrumental: false
vocal_gender: female

style: |
  Neo-jazz pop with cool late-night electric confidence — bright, charged, feline and precise. Duration 3:00–3:30, sustained by a mid-song soprano-sax groove vamp. Polished studio mix, wide stereo stage, warm tape saturation at 119 BPM in E-flat major. A clean jazz-voiced electric guitar comps warm chord inversions. A vibraphone scatters cool shimmer through the verses — glinting, unhurried. A soprano saxophone holds back until the vibe-switch at 1:15, then steps into a lyric-free groove vamp over walking bass and brushed snare — bright, gliding, insistent. After the vamp the hook re-enters a half-step higher in E major, guitar fills rising, vibraphone ringing brighter. Walking bass and brushed kit roll forward without weight. Neon on wet pavement, a charged walk with nowhere to be — underscore for a cool late-night city-glide scene. No synthesizers, no rock drums, no pipe organ, no smooth jazz, no vocals other than lead.

lyrics: |
  [Intro: guitar comp, 0:00]

  [Verse 1: voice enters, 0:10]
  Turn up the collar, step into the night
  Don't need a map when everything feels right
  The city hums low and I'm running on cool
  Electric and easy, nobody's fool

  [Verse 2: walking bass, brushed snare, 0:38]
  Lights on the avenue bending my way
  Nothing to prove and nothing to say
  I move like I mean it, nothing held back
  Smooth down the middle of my own track

  [Hook: vibraphone shimmer, 1:05]
  I just glide
  let it roll beneath me
  I just glide
  nothing here to stop me now

  [Vibe-switch: soprano sax, walking bass, 1:15]

  [Hook return: E major lift, guitar fills, 1:55]
  I just glide
  let it roll beneath me
  I just glide
  nothing here to stop me now

  [Verse 3: E major, warm vocal, 2:15]
  This is the moment, this is the place
  I own every second, I own every space
  Exactly the feeling I always knew

  [Final hook: full texture, 2:50]
  I just glide
  let it roll beneath me
  I just glide
  nothing here to stop me now

  [Outro: guitar fades, 3:05]

  [End]

