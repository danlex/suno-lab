notes: |
  Technique: Neo-jazz pop vibe-switch — a pop-forward vocal song that drops mid-track
  into an explicit lyric-free instrumental groove vamp, then returns to the hook a
  half-step higher. The vamp is the primary duration lever (confirmed by v348 "Sable"
  which used the same structural move and rendered 3:29; v346 and v347 without explicit
  vamps landed 2:25–2:43). The vibe-switch form is distinct from a standard breakdown:
  the soprano saxophone takes over as melodic lead during the vamp while walking bass
  and brushed snare drive the groove, creating a self-contained cool-jazz interior
  moment within a pop song architecture.

  Concept source: Chart signal from 10k+ play neo-jazz/pop crossover songs — jazz/pop
  fusion winning at scale via accessible hooks + mid-song textural surprise; the
  soprano-sax-first-use debut and vibe-switch structure are the original contributions.

  Composer-omission: This cycle echoes the jazz-inflected pop sensibility of certain
  late-1990s and early-2000s producer-songwriters whose names are omitted per house
  policy — the clean electric guitar comp + vibraphone shimmer + walking-bass groove
  texture is their hallmark. The soprano saxophone as pop melodic lead is rarer and
  distinguishes this from their work.

  Duration strategy: BPM 119 sits in the 115–130 zone where Suno can honor bar counts
  and reach 3:00–3:30. The explicit [Vibe-switch] section at 1:15 mandates a ~40-second
  instrumental passage before the hook return at 1:55. Final vocal timestamp pushed to
  2:50, outro to 3:05, anchoring the render near 3:00–3:30. Production tokens used:
  polished studio mix, wide stereo stage, warm tape saturation. Sentence case throughout.
  Atmospheric-first opening names genre, mood, key, BPM, and duration target in the
  first ~200 chars. Five inline negatives close the style field.

  Trio roles (verified against novelty_surface.json at v348):
  - Soprano saxophone (DEBUT — never used in 348 versions): lyric-free melodic lead
    during the vibe-switch groove vamp at 1:15; bright, direct, gliding tone above
    the walking bass; the sonic payoff of the structural surprise. Gap: 349 (all-time).
  - Vibraphone (last used v337, gap 12): cool shimmer in the verses and hook sections;
    crystalline, unhurried, glinting; brightens and widens at the half-step-up hook
    return in E major, providing the payoff shimmer.
  - Clean jazz-voiced electric guitar (debut in named trio): warm chord inversions
    in the pocket; comping through verses, fills during hook returns; the harmonic
    anchor and rhythm-guitar texture that keeps the song reading as pop not jazz.

  Walking bass and brushed snare are the rhythm bed (mentioned in style, not part of
  the featured trio).

  Novelty: soprano saxophone is an absolute catalog debut (v1–v348). Vibe-switch
  pop form with a named instrumental-section timestamp is new to the catalog. BPM 119
  last used at v214 (gap 135). E-flat major to E major half-step lift is the payoff
  modulation (no [Silence] gate per feedback_silence_gate_truncates). Scene: cool
  late-night electric confidence is a fresh register — distinct from v348 smoky
  magnetism (darker, slower), v346 baritone sax cool (no vocal hook), and v343 amapiano
  warmth. Forward-motion concept (gliding arrival, city-night charged walk) favors
  the 3:00–3:30 render range per the BPM-duration-ceiling playbook rule.

  Style char count: 947 (verified in-range 700–950 via text_tools.py, blocklist clean).
