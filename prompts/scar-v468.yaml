notes: |
  v468 TOURNAMENT WINNER (inline-judged 81/100, tied with sibling Twelve468 at 81; won on a more distinctive/ownable hook and the fresher withheld-harmonica-reveal climax). Southern soul blues-rock is a CATALOG DEBUT — a deliberate high-variance organic pivot after the electronic/groove-heavy, female-skewed run (v463-v467): warm gritty live-band, weathered baritone male, G major, slow-burn 82 BPM shuffle.

  The central conceit is architectural, not just lyrical — the HARMONICA REVEAL. The harmonica is withheld for the entire song and enters only in the final chorus, its first breath the emotional climax, arriving after a hard STRIP to just baritone + resonator slide. A strip-plus-instrument-reveal arc, explicitly distinct from (and avoiding) the half-step key-lift template. No modulation anywhere.

  Trio: RESONATOR SLIDE GUITAR (catalog debut, zero prior uses) is the lead melodic voice, answering the baritone in call-and-response and filling the half-bar gap after the hook's "tenderness" with a soft major-sixth shimmer. HAMMOND ORGAN provides warm swelling fills / harmonic body. HARMONICA (catalog debut) is the withheld reveal. (exclude_styles tightened from the draft — removed bare "electronic"/"synthesizer" which could dampen the electromechanical Hammond; specific synth-pop / synth pads / EDM synths blocks retained.)

  Hook: "Scar tissue holding the tenderness" (hook-writer 22/25) — baritone enters on the repeated G root (grounded), climbs stepwise on "holding the tenderness" with a ragged crack-and-release on "TEN" at the top of comfortable range; resonator answers on the major sixth.

  Duration: 82 BPM shuffle sits in the slow-BPM band (target 3:00-3:30). Levers: a 32-bar lyric-free [Resonator and Organ Break] mid-song (~47s), the [Strip Down] section before the reveal, and the final lyric line pushed late (~2:40).

  Novelty: southern-soul-blues-rock genre debut; resonator slide guitar debut; harmonica debut; withheld-instrument-reveal climax is a new arc type for the catalog.

  Style char count: 943.

