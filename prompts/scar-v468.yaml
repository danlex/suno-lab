title: "Scar468"
instrumental: false
vocal_gender: male

style: |
  Southern soul blues-rock with warm grit and raw humanity, total duration around 3:00, polished studio mix with deep low-end definition and wide stereo stage. Slow-burn driving shuffle at 82 BPM in G major — dry snare backbeat, walking electric bass, an unhurried groove that breathes with the band. A weathered baritone male voice: chest register, slightly ragged at the top of phrases, disarmingly vulnerable and lived-in, no autotune. The lead melodic voice is a resonator slide guitar — metallic shimmer and acoustic warmth — answering the vocal in call-and-response. Hammond organ swells behind the chorus with round, churning fills. The harmonica is withheld entirely until the final chorus: its first breath is the emotional peak, arriving after a stripped bare duet of voice and resonator only. Warm tape saturation and lush acoustic ambience throughout. No synth pads, no EDM synths, no trap drums, no electric distortion, no autotune.

lyrics: |
  [Intro: resonator slide guitar states the G-major theme, call with no answer yet, 8 bars]

  [Verse 1: baritone vocal enters — low, matter-of-fact, 16 bars]
  I came home with something missing
  Found the gap where the warmth used to live
  Tried to fill it with forward motion
  Couldn't take what I wouldn't give

  [Chorus: full band — vocal contour rises stepwise, resonator fills the gap, 16 bars]
  Scar tissue holding the tenderness
  Holding the tenderness in
  Every old wound becomes a witness
  Letting the light back in

  [Verse 2: baritone digs deeper — organ swells low behind, 16 bars]
  You don't ask about the quiet mornings
  The way I hold my coffee cup
  You just sit across the table knowing
  Some things break before they open up

  [Chorus: Hammond organ rises fuller, resonator slide answers hard, 16 bars]
  Scar tissue holding the tenderness
  Holding the tenderness in
  Every old wound becomes a witness
  Letting the light back in

  [Resonator and Organ Break: lyric-free instrumental — slide guitar leads in call-and-response with Hammond organ, dry snare keeping the shuffle, bass walking, 32 bars]

  [Strip Down: voice and resonator slide only — bare, exposed, no drums no organ, 12 bars]
  What the years do they don't ask permission
  What the body keeps the mouth won't say
  But I'm standing in the same light different
  Closer to the place I meant to stay

  [Final Chorus: full band returns and harmonica enters for the first time — its first note is the peak, 20 bars]
  Scar tissue holding the tenderness
  Holding the tenderness in
  Every old wound becomes a witness
  Letting the light — letting it in

  [Outro: harmonica leads, resonator answers, organ fades beneath, 8 bars]

  [End]

