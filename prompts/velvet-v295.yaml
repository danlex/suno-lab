lyrics: |
  [Intro] (Rhodes alone, 0:00-0:30)
  ah, mmm

  [Verse 1 — Solo lead, breathy, 0:30-1:00]
  velvet on my skin, July humid air
  you left at three, I stopped pretending to care
  my mother's records spinning slow downstairs

  [Verse 2 — Lead, fuller groove, 1:00-1:30]
  the city is sweating, somebody's laughing
  I light a cigarette, count my heartbeat
  thirty-one days and I still hear your voice

  [Pre-Hook — subtle pad enters, 1:30-2:00]
  (lead) velvet on my skin
  (backing whispered) ah-ah
  (lead) the night is endless

  [Hook — Lead with sparse pad, 2:00-2:30]
  velvet, velvet, July night velvet
  velvet, velvet, no more pretending
  velvet, velvet, the night is honey

  [Climax — half-step ascent + backing swell, 2:30-3:00]
  velvet, velvet, I am the river
  velvet, velvet, I am the slow burn
  velvet, velvet, I am alive

  [Sustained Plateau, 3:00-3:30]
  velvet... velvet... velvet...
  ah... mmm... I am alive

  [Outro] (Rhodes fade)
  velvet...
  [End]

