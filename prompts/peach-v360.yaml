name: "peach-v360"
version: 360
style: "Candy-brutal bubblegum bass club track in G major at 150 BPM, built for the 2026 PC Music revival. Purpose: pit candy-bright piccolo hook against a hypercompressed 808 sub with extreme sidechain pump — every beat collapses the mix before the next hit. 808 pressure in the chest; master bus clips the high-end hard. Piccolo carries a falling-fifth hook shrill and bright at the top of the mix. Harp delivers sweeping arpeggiated shimmer on offbeats, crystalline and clipped. Cristal baschet marks each chorus arrival with a mid-range bowl-ring, bridging sub and piccolo. Thin bright female vocal rides the gaps. At 2:00 the piccolo drops an octave while the sidechain pump cuts entirely; mix becomes one sustained chord held smooth for eight bars, then pump and upper-octave piccolo return together in a single hit. Tight chamber reverb, warm tape saturation on the 808. No key change at the climax. No guitars, no pipe organ, no live rock drums."
title: "Peach"
lyrics: |
  [Intro: sidechain pump, piccolo hook over 808 sub, 0:00]

  [Verse 1: 0:18]
  Sprayed neon on a sugar wall
  Ate the pink from the waterfall
  Teeth like candy in a traffic jam
  Sticky knuckles, neon gram

  [Chorus: hook, 0:34]
  Bite the neon peach
  Bite the neon peach
  Crack the syrup open, let the color bleed
  Bite the neon peach

  [Verse 2: 0:52]
  Crushed the violet in my palm
  Sugar trauma, saccharine calm
  Painted teeth in ultraviolet
  Swallow hard, don't you die yet

  [Chorus: hook, 1:08]
  Bite the neon peach
  Bite the neon peach
  Crack the syrup open, let the color bleed
  Bite the neon peach

  [Vamp: piccolo and harp, lyric-free sidechain groove, 1:26]

  [Climax: octave-drop piccolo, pump removed, sustained chord eight bars, 2:00]

  [Drop: pump and upper piccolo return together, 2:16]

  [Chorus: final, 2:28]
  Bite the neon peach
  Bite the neon peach
  Crack the syrup open, let the color bleed
  Bite the neon peach

  [Outro: 2:44]
  Neon drips and the sugar dries
  Bite the peach 'til the color dies

  [End]
