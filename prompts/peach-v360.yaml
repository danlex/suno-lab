notes: |
  Bubblegum bass (also called PC Music club or hyperpop-club) is a 2010s-origin UK/London internet-pop subgenre defined by extreme sidechain compression, pitched-up female vocals, hypercompressed 808 sub bass, candy-bright synth leads, and a deliberately overcrowded frequency stack. It was revived in 2025-2026 club culture with harder sub emphasis and more extreme pumping. This is the genre's debut in the catalog (no prior PC Music / bubblegum-bass entry). The concept source: pre-validated hook "bite the neon peach" (21/25 hook score, joint-highest in cycle v360 bracket) built around a rising stepwise G4-A4-B4 then falling perfect fifth B4-E4, with the final word hard-cut to one full beat of gap before the 808 fires. The canon composers working in PC-adjacent hyperpop space go unnamed per blocklist; their approach (pitched-up ultra-compressed candy aesthetics) is echoed here without attribution.

  Duration strategy: 150 BPM falls in the 130-160 proven duration band; bar counts work reliably. Lyric-free vamp from 1:26 to 2:00 (34s) extends the arc past the second chorus. Last lyric line at 2:44. No [Silence] metatag (confirmed truncation risk). Climax is sidechain-removal + octave-drop — not a key change, not a half-step lift. Parametrized colon-lyrics with timestamps, sentence case throughout, atmospheric-first style opening. Production tokens: polished studio mix, wide stereo stage, deep low-end definition, tight chamber reverb, warm tape saturation.

  Trio rationale — 2 body voices + 1 spectral (within limit): Piccolo (body, gap 42 versions since v318) is the candy-bright hook carrier at the top of the frequency stack, the shrill upper register perfectly fitting the PC Music aesthetic. Harp (body, gap 23 versions since v337) delivers sweeping arpeggiated shimmer on offbeats, replacing the usual pitched-up synth arpeggiator with an acoustic analog. Cristal baschet (spectral, gap 13 versions since v347) provides alien overtone wash in the mid-range — its bowl-resonator timbre is architecturally between the 808 sub and the piccolo lead, filling the space without muddying either.

  Novelty: debut genre (bubblegum bass / PC Music — no prior catalog entry); G major used before (v354 most recent, gap 6); 150 BPM new; piccolo gap 42, harp gap 23, cristal baschet gap 13.

  Final style char count: 947.
