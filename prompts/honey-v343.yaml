name: "honey-v343"
version: 343
title: "Honey"
instrumental: false
vocal_gender: female

style: "A slow-rolling hypnotic groove in the amapiano-pop pocket: deep log drum pulsing with warm, unhurried authority, open-chord piano pads voicing lush jazzy 7th and 9th chords, a breathy English vocal floating just above the beat. Polished studio mix, wide stereo stage, warm tape saturation. Clarinet moves in smooth sighing lines over the groove in A-flat major at 109 BPM; upright bass adds organic warmth alongside the log drum; steelpan brings bright mallet shimmer on the hook. Soft shakers and piano stabs lock the pocket tighter when the hook arrives. Mid-song, the groove strips to bare percussion and log drum; the hook returns with layered harmonies as the key lifts a half-step to A major. Underscore for a late-night rooftop scene, warm air, city lights below, two people circling an unspoken truth. No EDM drop, no autotune-pop, no distorted guitars, no aggressive syncopated percussion, no four-on-the-floor house."

lyrics: |
  [Intro — log drum and piano pad, 0:00]
  Low and slow, the beat unrolls
  Nothing rushed, nothing cold

  [Verse 1 — clarinet lead, breathy vocal, 0:18]
  You move like the city forgot to sleep
  Like the light off the water, something deep
  No words between us but the groove says enough
  Slow and low, tender and rough

  [Hook — full pocket, steelpan shimmer, 0:52]
  Pull me under easy
  Let it be
  That low tide feeling
  You and me

  [Verse 2 — upright bass forward, building heat, 1:18]
  Your hands slow the hour, the air goes still
  Log drum keeps the promise, always will
  I don't need the daylight to know what's real
  When the music moves it's all I feel

  [Break — log drum and shakers only, 1:45]
  (groove breathes)

  [Hook return — harmonies, key lifts to A major, 2:10]
  Pull me under easy
  Let it be
  That low tide feeling
  You and me
  Stay a little longer
  Let it breathe
  That slow wave breaking
  Over me

  [Outro — groove fades, steelpan last, 2:44]
  Low and slow
  Low and slow
  [End]

