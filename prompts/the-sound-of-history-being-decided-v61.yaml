style: "Epic cinematic orchestral war score in F minor at 120 BPM, purely instrumental. The sound of ten thousand people marching toward something they believe in more than their own lives. Thundering orchestral percussion — concert bass drum, timpani, and military snare in an unstoppable martial rhythm. Massive low brass plays a war theme so powerful it vibrates in your teeth. String sections surge in unison like an army moving as one body. French horns carry a melody that is somehow both terrifying and noble at the same time. The orchestra builds in relentless waves, each one more overwhelming than the last, brass and strings and percussion all locked together into something monolithic and unstoppable. This is not background music — this is the sound of history being decided. Full symphony orchestra with orchestral percussion, cinematic war score production, maximum power and scale. No electronic sounds, no synthesizers, no guitars, no vocals, no drum kit. F minor, 120 BPM."
title: "The Sound of History Being Decided"
