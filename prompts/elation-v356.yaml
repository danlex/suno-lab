notes: |
  Technique: Melodic piano house is a subgenre of UK house / deep house that places a
  bright, instantly-recognisable piano chord-stab or riff at the centre of the production,
  over a four-on-the-floor kick and warm rolling bassline. The piano riff acts as both the
  hook and the energy anchor; builds and drops are engineered around whether the riff is
  present and in what key. The style peaked in UK clubs in the late 1980s and early 1990s
  and has undergone multiple chart-friendly revivals, each time with updated production
  sheen. The 2024-2026 revival leans into a high-production euphoric sound with melodic
  lead vocals, polished studio mixes, and cinematic key modulations at the drop.

  Concept source: euphoric peak-time piano house anthem with a bright piano riff as the
  centrepiece hook over four-on-the-floor and rolling bassline, soulful female vocal,
  flugelhorn brass swells, oboe d'amore honeyed countermelody, steelpan shimmer at the
  lift, and a half-step modulation (E major to F major) at the drop after a filter-swell
  breakdown.

  Composer-omission: This cycle channels the euphoric piano-house energy of certain
  late-1980s and early-1990s UK house producers and labels whose names are omitted per
  house policy. The flugelhorn, oboe d'amore, and steelpan bring timbral colour those
  productions never employed, making this compositionally distinct.

  Duration strategy: BPM 126 sits near the lower edge of the proven 130-160 band;
  given the vocal-song structure and forward-motion (euphoric arrival/lift concept),
  the playbook targets 3:00-3:30. Duration levers applied: (1) explicit lyric-free
  instrumental vamp at 1:38-2:12 (~34 seconds, naming flugelhorn and oboe d'amore to
  trigger the instrument voices without sung content — hits the 30-50s vamp window),
  (2) last lyric timestamp at 2:48 (well past the 2:40+ target), (3) outro section
  pushes render target past 3:00. No [Silence] metatag used — per feedback, explicit
  [Silence] markup truncates; instead the [Breakdown] strips lyrics to three minimal
  lines over a held pad as a rising filter-swell builds pressure, then the lyric-free
  [Vamp] extends the tension before the Drop. Forward-motion concept (euphoric ascent
  to F-major lift) should drive the auto-classifier toward "euphoric house, dance pop"
  tags rather than "cinematic ambient," supporting the 3:00+ duration floor.
  Production tokens used: polished studio mix, wide stereo stage, warm tape saturation.
  Atmospheric-first opening names genre, mood, key, BPM in the opening sentence.
  Sentence case throughout — no ALL-CAPS form labels. Five inline negatives close style.

  Instrument roles (trio: flugelhorn, oboe d'amore, steelpan):
  - Flugelhorn (body voice, gap 16): warm rounded brass swells in the Breakdown and
    lyric-free Vamp (1:38-2:12); its golden mellow tone is the primary non-piano melodic
    voice through the tension phase, filling the room without cutting through too sharply.
    Returns briefly in the Final Chorus to double the brass colour at the lift. Body voice.
  - Oboe d'amore (body voice, gap 12): honeyed melodic counterline in the Vamp section,
    carrying the main tune where the piano steps back; its woody mid-range warmth offers a
    yearning, slightly plaintive contrast to the euphoric groove underneath. One of the most
    expressive double-reed voices in the orchestral palette. Body voice.
  - Steelpan (body voice, gap 13): enters at the Final Chorus (2:24) after the F-major drop,
    adding bright Caribbean shimmer and sun-drenched overtone sparkle above the full groove;
    its naturally bright upper-register attack complements the piano riff without competing
    with it. Shimmer/colour voice at the lift. Body voice.

  Trio body-voice count: 3 body voices (flugelhorn, oboe d'amore, steelpan). Satisfies
  the >= 2 body voices rule. Zero spectral instruments in trio.

  Novelty claims: Flugelhorn in a piano-house anthem context (gap 16 from v340) is novel.
  Oboe d'amore as a vocal countermelody voice in a dance-music production context (gap 12
  from v344) is an unusual deployment. Steelpan as a "final-lift shimmer" voice at the
  modulation point is a fresh structural use (gap 13 from v343). The trio collectively
  (flugelhorn + oboe d'amore + steelpan) has not appeared together in the catalog. BPM 126
  may be new to the catalog — close to v354's nu-disco 124 BPM but distinct. E major to
  F major half-step lift is a fresh key pair for this catalog.

