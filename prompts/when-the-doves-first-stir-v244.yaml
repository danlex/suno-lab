name: "when-the-doves-first-stir"
version: 244
style: |
  SARABANDE-AND-DOUBLE at a dovecote at first light, total duration around 3:00. CORNET + TENOR SAXOPHONE + CROTALES. A major home, lifting to B-flat major at the tutti peak. 47 BPM stately processional. Neoclassical orchestral chamber music, warm and luminous.

  Part one, sarabande: the CORNET states the theme in slow 3/4, stressed second beat giving it patient dignity, orchestral strings sustaining bare continuo beneath — the light barely begun.

  Part two, the double: same melodic skeleton returns clothed in cascading filigree — passing tones, mordents, turns — as TENOR SAXOPHONE winds a reedy countermelodic line through the ornamentation. Around 2:30 the key lifts by a half-step to B-flat major and CROTALES crown the full tutti with bright high partials, like dust motes catching the dawn as the doves spiral upward into the light.

  No guitars, no vocals, no rock drums, no pipe organ, no synthesizers.
title: "When the Doves First Stir"
