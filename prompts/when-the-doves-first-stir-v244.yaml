notes: |
  TECHNIQUE — Sarabande-and-Double is a paired baroque form: a slow stately dance in 3/4 with characteristic stressed second beat (the sarabande), followed by an immediate restatement of the same melody but every structural note now elaborated into cascading ornaments — the "double." The form dates from 17th–18th century French and English keyboard and lute suites. concept_source: the double is not a variation in the usual sense; it is ornamental enrichment of an unchanged melodic skeleton, meaning the listener recognizes the tune while the texture transforms completely. No composer names cited per blocklist.

  DURATION DEFENSE — The sarabande-and-double structure supplies a continuous melodic line for the full 3 minutes: the theme is stated bare in part 1, then continuously ornamented through part 2, never stopping. The CORNET (warm centered brass) is the body voice that carries the melody across both halves. Full orchestra (strings as continuo in part 1, woodwinds + brass + CROTALES joining in part 2) ensures timbral mass without the arc collapsing. The slow 47 BPM is the sarabande's contract — form-correct and essential to the dignity of the processional.

  TRIO ROLES AND GAPS:
  - CORNET ×232, last v232 — 12-gap revival; body voice; states sarabande theme bare, then carries it ornamented through the double.
  - TENOR SAXOPHONE ×230, last v230 — 14-gap revival; middle reedy voice; joins the double with countermelodic ornamental winding.
  - CROTALES — CATALOG DEBUT (never used); high partials mallet percussion; enters at the tutti peak (~2:30) like dust motes catching the dawn light, crowning the full ensemble with bright crystalline shimmer.

  KEY ARC — A major (noble dawn brightness, the sarabande's home) lifts by a half-step to B-flat major at the double's tutti peak (~2:30). The warmth shift maps to the ornamentation breaking into full bloom.
  BPM — 47, form-correct for sarabande (traditional range 40–60). New BPM for the catalog.

  SCENE — Stone dovecote at the edge of a country estate, first light slanting through the cupola windows. The keeper's slow patient ascent up the spiral stair (sarabande) becomes the doves lifting into spiraling flight as the light grows (double). New scene — not used in recent versions.

  LYRICS NOTE — Bare structural form labels only per the LYRICS RULE (2026-05-31). No descriptive prose, no instrument names inside brackets. 9 sections.

  STYLE CHAR COUNT — 912.
