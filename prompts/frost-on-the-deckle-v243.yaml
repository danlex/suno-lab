notes: |
  TECHNIQUE — BARCAROLLE-TO-GRAND-FINALE: a compound-duple (6/8 or 12/8) form built on a continuous rocking ostinato that underpins the entire duration; a lyric arch-shaped A melody contrasts with a chromatic B section, returns in full orchestral doubling, and escalates to a tutti finale with a half-step key lift. The form is rooted in 19th-century song-without-words tradition but here stripped of any Venetian association and framed as industrial labor music.

  CONCEPT SOURCE: rocking 6/8 ostinato as a duration-defense mechanism — continuous motion gives Suno no built-in rest point to trigger early fade. Following v242's hocket truncation on structural rests, this barcarolle approach keeps the rhythmic engine running unbroken, forcing the model to sustain through the full 3:00 arc.

  COMPOSER OMISSION CONFESSION: Several composers famous for barcarolles and compound-duple cantilenas — including those who wrote piano barcarolles, Venetian boat-songs, and Songs Without Words — are blocked by house rules and cannot be named. This prompt takes the form on its own terms.

  DURATION STRATEGY: continuous rocking ostinato (strings → low brass → tutti) acts as the pulse anchor. Tonal strategy: D-flat minor home key provides brooding warmth, half-step lift to D minor at the finale provides the climactic brightness without a jarring leap. BPM 161 is moderate-flowing in 6/8 (each dotted-quarter pulse = ~72 feels), sustaining a singing tempo throughout.

  TRIO ROLES (with gaps):
  - BASS TROMBONE ×5, last v231 — 12-gap; body voice, low pedal sustaining through chromatic shifts, carries the ostinato into the finale.
  - GLASS MARIMBA ×4, last v219 — 24-gap; top-voice crystalline tone, marks the cantilena's high points, rides over the tutti in the finale.
  - PREPARED PIANO ×5, last v228 — 15-gap; middle voice, muted rocking 6/8 figuration with subtle prepared-string buzzing, the engine of the A section.

  NOVELTY CLAIMS: first BARCAROLLE-TO-GRAND-FINALE technique in the catalog. BPM 161 is unused in recent runs (recent: 158, 159). Paper-mill-at-first-frost scene is new. All three instruments are in deep revival (gaps 12, 24, 15).

  LYRICS RULE APPLIED: bare structural form labels only inside brackets — no instrument names, no scene words, no descriptive prose. All descriptive content lives in the style field. Sections: Intro / Cantilena A / Cantilena Continues / B — Chromatic Turn / B Develops / A Returns Tutti / Grand Finale / Coda / End (9 sections).

