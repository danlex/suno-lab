notes: "v102 — ORCHESTRAL GRIME. New genre for synthesis era. RESEARCH: Spotify UK Grime 2026 playlist (140 BPM essentials), Grime Wiki (complex breakbeats, synth/string/brass stabs at 140 BPM), InstrumentHeritage erhu guide, Bachtrack erhu emotional interview, Shen Yun East-West fusion orchestra. LEARNED: (1) Grime = 140 BPM UK genre with dark aggressive energy, brass stabs, synth stabs — 'urban menace' in electronic form. (2) Erhu produces 'extraordinarily wide range from sweet whispers to anguished cries' — 4000-year-old Chinese two-stringed fiddle, soul-stirring. Used in film scores and cross-genre collaborations globally. (3) Grime's brass stab tradition maps perfectly to orchestral brass writing. IMPROVED: Orchestral grime (never done, dark aggressive 140 BPM) + erhu (anguished cry quality matches grime's intensity, never used, East-West bridge) + bass trombone (lowest brass, menacing growl for grime's dark low-end). Concept: 'where the concrete remembers' — urban orchestral menace meets ancient Chinese sorrow. Bb minor→B minor. 942 chars."
