style: "ORCHESTRAL GRIME with ERHU + BASS TROMBONE, dark cinematic aggression, urban orchestral menace, B-flat minor to B minor, 140 BPM, purely instrumental. Erhu cries a piercing melody above the chaos — Chinese two-stringed fiddle wailing with anguished intensity from four thousand years of history. Bass trombone growls in the lowest register, each note a warning that shakes the floor. Full symphony strings play aggressive staccato stabs at 140 BPM — dark energy performed by fifty bowed instruments in unison. Brass punctuates with sharp rhythmic hits on every second beat. The build layers erhu over increasingly intense string stabs while bass trombone descends chromatically into sub-bass territory. Then silence — one bar of nothing. Orchestra detonates in B minor half-step up, erhu screaming at highest pitch, bass trombone fortississimo, full brass and strings at maximum attack. Urban orchestral warfare. No guitars, no vocals."
