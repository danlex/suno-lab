style: "ORCHESTRAL SPECTRAL film score for a cathedral-bell-decay scene, total duration 1:00 to 2:00, with SPINET + BOWED VIBRAPHONE + MUSICAL SAW, overtone-rich harmonies derived from the partials inside each fundamental tone, E-flat major to E major, 86 BPM, instrumental. From 0:00 spinet enters alone — plucked keyboard striking a single note whose overtones shimmer above. At 0:18 bowed vibraphone rises, metallic bars bowed into pure harmonic sustain, each overtone a separate voice. At 0:40 musical saw adds microtonal glissandi, bending pitch between the partials. At 1:00 orchestra joins — strings playing only the 2nd, 3rd, 5th, 7th partials, crystalline overtone chords. Silence at 1:25 — overtones hang in the air. At 1:28 music returns in E major half-step up, all three voices fortississimo. Ends at 1:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
