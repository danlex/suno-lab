notes: "v128 — ORCHESTRAL SPECTRAL. Third 20th-century avant-garde technique after v126 micropolyphony and v127 minimalism. Spectral music derives harmonic structure from analyzing the overtone series of fundamental frequencies — chords are literally built from the partials (2nd, 3rd, 5th, 7th harmonics) of a fundamental note. Emerged in Paris 1970s as alternative to serialism. Uses microtonal tuning to access the non-equal-tempered overtone series. RESEARCH: Wikipedia Spectral Music + Grokipedia + Fineberg 'Basics of Spectral' confirm technique. Key technique: additive instrumental synthesis (instruments play discrete components of a sound). Aesthetic not dogma — flexible. INSTRUMENTS: Spinet (NEVER USED — first use in 127 prior prompts) = smaller harpsichord variant with bright, plucked overtones. Bowed vibraphone (v99, 28-version gap — DEEPEST currently available revival) = metallic bars bowed into pure harmonic sustain, reveals individual overtones. Musical saw (NEVER USED — first use) = bowed saw blade, haunting microtonal glissandi, accesses non-equal-tempered pitches. All three instruments chosen for their rich overtone content. TWO FIRST-USES in one prompt! NOVELTY: First spectral technique. First spinet. First musical saw. 86 BPM = never used. Eb major → E major both relatively underused. Wonder/revelation emotion (new territory). 953 chars."
