notes: |
  v467 CANDIDATE "WINDOW" — French-touch filter house × city-pop. A major, 124 BPM.

  TECHNIQUE — FILTER-AS-FORM (progressive brightening): The low-pass filter is not a production effect but the structural arc itself. The mix opens progressively across the whole song — approximately 30% at verse 1, 50% at the pre-chorus, 65% at chorus 1, 40-80% sweep during the instrumental break, 70-85% through verse 2 and chorus 2, held at 85% through the build, and then FULL OPEN at the final chorus. That single bloom to full brightness IS the climax — no key modulation, no half-step lift, no silence trick. This is the catalog's first use of filter-as-form as the primary climax device (vs. filter as incidental production texture). The technique has roots in French-touch DJ performance practice (live filter sweeps as structural dramaturgy) applied to a full song arc rather than a club set.

  CONCEPT SOURCE: French-touch filter house (chopped rhythm-guitar loops under heavy low-pass sweeps, as pioneered by late-90s Parisian club producers) × city-pop (Japanese-influenced lush major-seventh harmony, breathy soulful female vocal, warm electric piano, pre-dawn romantic ease). The cross is a catalog debut — the closest prior work was disco-inflected v390s cycles, but never with city-pop harmony or this filter-arc structure.

  COMPOSER OMISSION: The filter-sweep-as-DJ-performance lineage is well-documented in late-90s French house production; no specific names are cited per blocklist discipline.

  HIGH-VARIANCE CONTRAST: Five straight minor-key ships (v462 E minor, v463 D minor, v464 B-flat minor, v465 F minor, v466 E-flat minor). Window467 deliberately breaks to A major — bright, hedonistic, sunlit-romance register. The emotional mood (easy joy, golden-hour warmth) is also fresh against the catalog's recent run of edgy/dark/intense cycles.

  TRIO:
  - Filtered disco guitar chop (gap ~111 versions): the French-touch heartbeat — a late-seventies rhythm-guitar loop chopped and played under progressive low-pass filter sweeps. Not a conventional guitar part; the filter is inseparable from the timbre.
  - Sidechain-pumped warm bass (gap ~111 versions): four-on-the-floor pumping bass locked to the kick, the rhythmic glue that defines French-touch floor feel.
  - Flugelhorn (gap ~111 versions): warm golden countermelody instrument; rounder and softer than trumpet, slightly darker than flugelhorn's brassy cousins, providing the fresh signature timbre over the city-pop chord changes. Delivers the mid-song solo in the 32-bar instrumental break.

  HOOK CONTOUR: "leave the window warm for me" — lazy descending triplet arc (A→F#→E→D#) in eighth-note triplets against the straight 124 BPM kick grid (cross-rhythm tension), resolving on "warm for me" with a rising step to a sustained major third held over the sidechain pump release. The triplet-against-four feel is the fingerprint.

  DURATION LEVER: Explicit 32-bar lyric-free [Filtered Guitar and Flugelhorn Break] mid-song (~35-45s at 124 BPM). Final lyric line lands late in the final chorus (~2:40+ target). 124 BPM is in the proven 130-160 duration band (slightly below but close), supporting ~3:00 render.

  Style char count: 946.

