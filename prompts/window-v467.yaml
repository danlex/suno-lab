style: |
  Sun-drenched French-touch filter house fused with city-pop warmth — bright, hedonistic, four-on-the-floor for golden-hour dance floors. A major, 124 BPM, total duration around 3:00. Polished studio mix, wide stereo stage, warm tape saturation. The low-pass filter opens progressively across the whole arc — dark at the open, gradually clearing, arriving at one euphoric full-open bloom on the final chorus. Progressive filter automation is the climax, not a key change. A chopped late-seventies rhythm-guitar loop churns under heavy filter sweeps for the French-touch heartbeat. Sidechain-pumped warm bass locks four-on-the-floor, glittering hi-hats above. Flugelhorn delivers warm golden countermelodies over lush major-seventh and add-ninth city-pop chords on electric piano. Warm breathy female vocal, effortless and cool, sings a lazy descending triplet hook against the straight kick. No trap, no drill, no rap, no pipe organ, no distortion.

