notes: |
  TECHNIQUE: The lament-bass ground is a Baroque structural device in which a short descending chromatic tetrachord — typically four to five pitches descending from tonic through chromatic passing tones to the dominant — is repeated continuously in the bass throughout the entire composition (six to eight cycles). Above this fixed gravitational line the upper voices vary freely in texture, density, and harmonic strain, creating inexhaustible structural tension as the bass never stops descending while the melody above strains upward. The device reached its height in 17th-century English and Italian vocal lament forms; it is used here as a purely instrumental formal engine, stripped of all vocal and period-instrument associations.

  CONCEPT SOURCE: The descending chromatic tetrachord as repeating bass ostinato generates continuous motion-against-stasis drama — the bass descent is "gravity" and the upper voices are "resistance." Cycle-by-cycle orchestrational accumulation (solo → strings → woodwinds → brass → tutti → dissolution) maps directly onto the seven-cycle arc, giving Suno clear structural signals without relying on silence-before-climax.

  COMPOSER OMISSION: Several 17th-century composers central to the lament-bass tradition cannot be named under this catalog's blocklist rules. Their omission is intentional and acknowledged.

  DURATION STRATEGY: Target 2:30–3:30 (cue ~3:00) per v137+ override. BARYTON is the body voice — its low bowed weight provides a continuous foundation the model can follow through all seven cycles. The cycle-by-cycle accumulation (each cycle ~22–25 seconds) forces narrative continuity: solo → strings → winds → mbira → brass → tutti → dissolution. No silence-before-climax is used; structural climax is cycle 6 tutti density, emotional resolution is cycle 7's return to solo baryton. The bass tetrachord never stops, giving the model a rhythmic/harmonic anchor for the full 2:50–3:00 duration.

  KEY DECISION: G-sharp minor home for cycles 1–5. At cycle 6 (2:05) the bass shifts a half-step up to A minor — a powerful surprise within an "inexorable" form, where the descent that seemed locked forever suddenly arrives a semitone higher and blazes with the tutti. The tetrachord continues its chromatic descent in A minor throughout cycle 6, then cycle 7 strips back to baryton alone finishing in A minor (the gardener at the end of the path, the day declared).

  MBIRA GUARD: Mbira is described exclusively as "brittle metal-tine accents" and "thumb-plucked metal tine" throughout. No African, kalimba, trance, world, ethnic, folk, traditional, or spiritual language appears anywhere. The exclude_styles field explicitly blocks African, ethnic, folk, traditional, spiritual, and trance. This guard is enforced at both the prompt-language level and the exclusion level.

  FEATURED TRIO:
  - BARYTON (bowed strings, novelty_surface shows last v184, but v229 actually used baryton in trio — true gap is ~12 versions; novelty_surface data was stale): THE BODY VOICE. A viola-da-gamba-family instrument with sympathetic strings that vibrate beneath the bow-played upper strings, producing a resonant shimmering halo. It carries the descending tetrachord throughout all seven cycles — the gravitational anchor of the entire piece.
  - BASS FLUTE (woodwinds, last v226, gap 15 — ×15): joins cycle 3. The bass flute's low-register breathy tone provides a cool, earthy countermelody — the sound of humid air moving through the conservatory as the sun climbs.
  - MBIRA (metallic idiophones, last v214, gap 27 — ×27): joins cycle 4. Described as brittle thumb-plucked metal tine — its dry, percussive attack provides accents above the tetrachord without any cultural coding.

  NOVELTY CLAIMS:
  - BARYTON: bowed strings, nominal gap ~12 (v229 to v241) — true cycle revival; novelty_surface showed stale v184 entry
  - BASS FLUTE: woodwinds, last v226, gap 15 (×15)
  - MBIRA: metallic idiophones, last v214, gap 27 (×27 — deepest revival in this trio)
  - BPM 158: unused in catalog (157 taken by v240, 156 by v239; 158 is new — verified against novelty_surface.json)
  - Technique: LAMENT-BASS GROUND as formal principle — first use in catalog
  - Scene: Victorian glasshouse (botanical conservatory) at sunrise — first use in catalog
  - Trio: baryton + bass flute + mbira — new combination, never assembled
  - Key arc: G-sharp minor → A minor (half-step lift embedded in bass-ground ostinato) — new key pairing

