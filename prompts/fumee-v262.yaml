name: "fumee-v262"
version: 262
title: "Fumée"

style: "French dark electro-pop, husky low-register French female contralto, 96 BPM, D minor, late-night intimate. Spoken-sung not belted — breathy close-mic chest-voice, warm tape saturation on the vocal, smoke-and-shadow timbre sitting low in the mix. Sparse arrangement: muted Rhodes-style electric piano, minimal vinyl crackle texture, deep sub-bass under a near-empty beat, tight chamber reverb on the vocal. Paris nocturne — fenêtres allumées de l'autre côté, pluie sur les pavés, deux heures du matin, fumée et silence. The vocal stays intimate and conversational throughout: no rise to a chorus belt, no arena reverb, no doubling stacks — single voice, close, restrained. Sub-bass and sparse Rhodes carry the harmonic weight while the contralto speaks almost beneath her breath. No big-room dance, no cabaret singer, no soaring belt, no accordion lead, no traditional French chanson, no broadway."

lyrics: |
  [Intro]
  mmh, mmh, mmh

  [Verse 1]
  deux heures du matin, la ville se tait
