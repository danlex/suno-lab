notes: "v65 — GLADIATOR ELYSIUM. Homecoming, reunion, afterlife. Not death-as-sadness but death-as-arrival. Solo OBOE — first time, Gladiator's signature instrument. 'Fields stretching to the horizon.' 'Warm wind through tall grass.' 'Being held by someone who will never let go.' Cello countermelody under oboe. Bb major — warm, noble. 92 BPM. 943 chars."
