style: "Warm amber club light at two in the morning, the kind that makes everyone look beautiful — UK garage and 2-step groove with gritty sub-bass, a Rhodes electric piano firing syncopated chord stabs off the beat, tubular bell chimes ringing like the last call, and handpan tones sitting warm under the kick. Bouncing swung 2-step pattern, deliberate and weightless — the kick never drops four-on-the-floor, it lands sideways, pulling you into the pocket. Female vocal lead with short sung phrases chopped and pitched into stuttering rhythmic hooks, phrases sliced and re-glued on the offbeat so the melody becomes percussion. Polished studio mix, deep low-end, wide stereo. C-sharp minor lifts to D minor at the final hook. 133 BPM. At 1:45 the groove breathes lyric-free — Rhodes and kick only. Last vocal near 2:50. Underscore for a late-night club reunion scene. No guitars, no vocals shouting, no rock drums, no pipe organ, no synthesizers."

