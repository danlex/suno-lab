title: "Tóxico"
instrumental: false
vocal_gender: female

style: "Neoperreo, dembow, Latin trap, 110 BPM, Bb minor, club-ready underground. Raspy mid-register Latina female sing-rap delivery, glossy autotune coating, percussive choppy syllabic flow, attitude-forward conversational hooks, mid-low chest placement — not soaring, not whispered, not pitched-up. Distorted 808 sub-bass, stripped dembow groove (boom-ch-boom-chick), crisp digital hi-hat triplets, off-beat synth stabs, midrange lead synth on the hook, vinyl crackle, sidechain pump on the drop. Lo-fi DIY club aesthetic — internet-native neoperreo production palette, NOT polished mainstream radio reggaeton. Sweaty basement club at 3am, neon graffiti lighting, queer-feminist body-positive perreo energy. No mainstream radio polish, no soaring melodic belt, no husky contralto, no pitched-up chipmunked vocal, no orchestral strings, no broadway."

lyrics: |
  [Intro]
  uh, uh, uh (rrrah)
  [Spoken] dale

  [Verse 1]
  llamas a las tres y media, ya yo sé
  dices que cambiaste, ya yo sé
  pero el cuerpo recuerda lo que la boca no
  yo bloqueé tu número y aún así llegó

  [Pre-Hook]
  no, no, no, no (bésame no)
  no, no, no, no

  [Hook]
  tóxico, tóxico, tu boca tóxica
  tóxico, tóxico, tu beso me intoxica
  tóxico, tóxico, vete pa' tu casa
  tóxico, tóxico, antes que amanezca

  [Verse 2]
  tú escribes "te extraño" a las cuatro y diez
  yo leo y no contesto, lo hago otra vez
  corazón dice quédate, cabeza dice corre
  cuerpo no decide, cuerpo siempre ofrece

  [Hook]
  tóxico, tóxico, tu boca tóxica
  tóxico, tóxico, tu beso me intoxica
  tóxico, tóxico, vete pa' tu casa
  tóxico, tóxico, antes que amanezca

  [Bridge]
  [Spoken] dale, perrea sola
  yo no necesito a nadie (a nadie)
  yo no necesito a nadie

  [Final Hook]
  tóxico (tóxico), tóxico (tóxico)
  vete pa' tu casa, antes que amanezca
  perrea sola, perrea sola

  [Outro]
  uh, uh, uh
  [End]

