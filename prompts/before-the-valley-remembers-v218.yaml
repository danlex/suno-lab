name: "before-the-valley-remembers"
version: 218
style: "GRANULAR SHIMMER CLOUD over a high mountain pass at first light, total duration
  around 3:00. CIMBALOM + BOWED VIBRAPHONE + DUDUK, C-sharp minor, 125 BPM: at 0:00
  cimbalom strikes fragment into drifting hammered-string haze — no melody, only
  dissolving texture that breathes. Bowed vibraphone holds the high ceiling,
  crystalline overtones in cold mist. At 0:45 the duduk rises: one clear breathy
  voice, mournful and searching, climbing above the dissolving texture — cinematic
  solo wind, not folk. At 1:30 the cloud deepens as the duduk peaks. At 2:00 the
  shimmer strips to near-silence; duduk holds one note alone, five bare seconds. At
  2:10 the cloud returns transformed — brighter, higher, half-step up in D minor,
  carrying the melody the duduk introduced, fortississimo. By 2:45 the haze settles
  and fades. Underscore for a figure dissolving into cold morning fog. No guitars,
  no rock drums, no vocals, no pipe organ, no synthesizers."
title: "Where the Valley Loses the Light"
lyrics: |
  [Short Instrumental Intro — cimbalom strikes dissolving into shimmer cloud, no melody]

  [Bowed Vibraphone Sustains — crystalline overtone ceiling, drifting breath-like haze]

  [Duduk Rises from the Cloud — single clear voice, mournful and searching]

  [Duduk Climbs — cloud deepens beneath, maximum contrast of voice against dissolving haze]

  [Peak — full shimmer cloud and solo duduk at the summit]

  [Silence — duduk alone on one note, five bare seconds]

  [Cloud Returns Transformed — half-step up in D minor, brighter register, fortississimo]

  [Haze Settles and Fades]

  [End]
instrumental: true
exclude_styles: "Arabic, tribal, world music, acoustic guitar, rock, gentle, lo-fi,
  vocals, singing, pipe organ, electronic, EDM, synthesizer, zen meditation, new age,
