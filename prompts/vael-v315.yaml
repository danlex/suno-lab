style: "Cinematic atmospheric post-classical contralto vocalise, a voice carrying invented phonetic syllables over deep cello pedal drone — coastal cave at low tide, basalt walls channeling sea breath, candlelight on wet stone. Underscore for a placeless ritual scene, long-form. Polished studio mix, wide stereo stage, warm tape saturation. G minor lifting to Ab minor at 2:20 half-step modulation, 88 BPM. A dramatic contralto opens at 0:00 alone, syllables placeless and ancient — no real language, no bel canto runs — a slow frame drum pulse enters at 0:45 drawing rhythm forward and hurdy-gurdy wheel-drone settles beneath like stone. At 1:30 the density trough: cor anglais mirrors the contralto's last phrase, completing the open melodic line. The half-step lift at 2:20 returns the full texture transformed. Deep low-end definition, Hollywood scoring stage. No guitars, no real-language lyrics, no choral ensemble, no synthesizers, no pipe organ."

