notes: |
  Vael is an invented placeless word — no real-language anchor, vaguely
  suggestive of Celtic/Nordic/Slavic sound without belonging to any of those
  traditions. The title itself enacts the song's central technique: invented
  phonetic language that carries feeling without lexical meaning.

  The technique explored here is glossolalic-adjacent vocalise architecture:
  a dramatic contralto delivering self-invented phonetic syllables — not
  wordless Aa/Oo vowels, not any real language — as the PRIMARY melodic
  instrument. The tradition this echoes most directly (unnamed per catalog
  discipline) is the late-1980s and 1990s lineage of singers who invented
  their own phonetic "languages" for recording, producing music that felt
  ancient, placeless, and spiritually resonant without belonging to any
  specific culture. The most prominent of those practitioners is not named
  here. The approach is distinct from standard vocalise (which uses real
  vowels and solfège syllables) and from world-music real-language chant.

  Concept source (researcher): "Glossolalic contralto vocalise × cinematic
  atmospheric post-classical. Voice as primary melodic instrument carrying
  invented syllables — no real lexicon, no real-language anchor. UNTESTED
  long-form classifier territory: invented-phonetic-language vocalise lineage.
  55th orthogonal voice. Predicted 3:20-3:50 band if classifier engages as
  cinematic post-classical extended-form."

  Duration strategy: BPM 88 sits in the slow band (playbook rule 8 BPM ceiling
  ~3:30 for ≤115 BPM). Total lyric bar count is 110 bars across 8 sections —
  targeting the slow-BPM ceiling of 3:00–3:30. The classifier argument is the
  primary duration driver: "cinematic atmospheric post-classical contralto
  vocalise" anchors the opening sentence to prime the classifier before any
  instrument description. No [Silence] metatag per hardened rule
  (feedback_silence_gate_truncates.md) — density trough achieved by label
  instruction ("strip to near-trough") without explicit silence markup. The
  half-step lift G minor → Ab minor at 2:20 uses modulation as frisson driver
  instead of silence-gate. Production tokens applied: polished studio mix,
  wide stereo stage, warm tape saturation, deep low-end definition, Hollywood
  scoring stage (5 tokens, playbook rule 2 compliant). Sentence case throughout;
  atmospheric-first opening; colon-syntax lyrics with bar counts for per-section
  length scaffolding.

  Trio instruments:
  - cor anglais (mid-range double-reed oboe family — last v303, gap 12): enters
    at the density trough to mirror the contralto's final phrase before the
    half-step lift; the warm, slightly nasal timbre of the cor anglais is
    specifically suited to completing a melodic phrase the voice has left open —
    it functions as the contralto's shadow instrument throughout.
  - frame drum (Persian-Mediterranean shallow tunable membrane drum — last v290,
    gap 25): enters at 0:45 to establish slow ritual pulse beneath the invented
    syllables; the frame drum avoids the Western kit aesthetic and keeps the
    rhythmic world placeless and ancient-feeling, consistent with the invented-
    language architecture.
  - hurdy-gurdy (mechanical bowed-wheel drone instrument — last v247, gap 68,
    DEEP REVIVAL): provides continuous pedal-wheel drone beneath the frame drum
    pulse; the hurdy-gurdy's characteristic drone-with-melody capability echoes
    the contralto's sustained-tone approach; at gap 68 this is one of the
    deepest single-instrument revivals in the catalog's current run.

  Voice architecture: dramatic contralto (or deep mezzo-soprano) as primary
  melodic instrument throughout. The invented phonetic syllables — Vael,
  moneth, aerya, soluen, nara, iloha, noem, saval, treya, mavih, velae,
  moreneh — are constructed using open vowels (a/e/o) and soft consonants
  (l/n/m/r/v/s/h) with no real-word intersections in English, Latin, Greek,
  Italian, or any other language verified against common vocabulary. They
  sound coherent as a "language" but carry no lexical meaning. This is
  architecturally distinct from all 54 prior catalog voices: no prior cycle
  used invented-phonetic-language architecture; every prior vocal cycle used
  either real language, Aa/Oo vocalise vowels, or was instrumental.

  The density layer (deep cello pedal drone + distant French horn in the final
  third) is named only in the style field as scene descriptors, not as standalone
  trio instruments — the trio remains cor anglais, frame drum, hurdy-gurdy.

  Novelty claims: technique-novelty (invented-phonetic-language contralto
  vocalise — classifier boundary test, first in 314 prior versions);
  voice-novelty (dramatic contralto as primary melodic instrument, no prior
  catalog voice used this architecture — catalog has soprano many times,
  mezzo at v298, tenor at v299/v314, bass-baritone v313, but no true contralto
  protagonist); instrument-revival (hurdy-gurdy gap 68 — deep revival from v247,
  one of the longest single-instrument gaps in the current run); scene-novelty
  (coastal cave at low tide, basalt walls, candlelight on wet stone — no prior
  catalog entry uses this specific atmospheric geography); BPM-fresh (88 BPM
  last v271, gap 44); key-fresh (G minor last v298, gap 17); modulation
  (G minor → Ab minor half-step lift at 2:20).

  Classifier risk: "invented phonetic language" has no reliable classifier
  precedent in Suno v5.5 training data. The mitigation is the cinematic-
  atmospheric-post-classical anchor in the first sentence — attempting to
  prime the long-form classifier before the voice description introduces the
  unfamiliar phonetic territory. If the classifier misreads as world-music
  (blocked in exclude_styles) or as experimental-noise, the lesson advances
  the classifier map. Predicted band: 3:20–3:50 if cinematic post-classical
  reads; 2:30–3:10 if classifier is uncertain.

  Final style char count: 945.

