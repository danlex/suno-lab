style: "Film score for Tuvan steppe dawn — frost on the grass, Sayan mountains a dark silhouette, yurt fires cold. A kargyraa throat-singer opens alone at 0:00: sub-bass chest drone on D, overtone partials whistling above simultaneously — the voice is a chord, not a note. 68 BPM, D minor; key lifts to E-flat minor at climax. Polished studio mix, deep low-end definition, lush acoustic ambience of open plain air. A morin khuur horsehead fiddle enters at 0:38 on the root, finds the overtone, threads nasal abrasive timbre between the kargyraa partials. A bowed vibraphone joins at 1:22, long bell-tone sustain arcing across the octave. Trio swell crests at 2:20 — all three in slow unison convergence, crescendo by accumulation, not spike — then fiddle and vibraphone recede, kargyraa alone holds the final overtone to 3:00. Wide stereo stage, warm tape saturation on the fiddle. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Kargyraa drone: sub-bass D, overtone partials ascending, 8 bars]
  хову...
  тыва...

  [Drone breath opens: harmonic series wide, 8 bars]
  хову...
  одар...
  ат...

  [Morin khuur enters: horsehead fiddle on root D, 8 bars]
  хову, ат
  одар, тайга
  тыва, хову
  ат, одар

  [Fiddle overtone divergence: rises to F, kargyraa holds D, 10 bars]
  Саяны, тайга
  хову, ие
  хаа, тыва
  одар, хова

  [Vibraphone enters high: bell-tone sustain, 8 bars]
  хову...
  хеме...
  тайга...

  [Trio call-response: drone, fiddle, bell-arc, 12 bars]
  хову, одар
  ат, тайга
  Саяны, хова
  тыва, ие

  [Layered unison swell: all three converging, 16 bars]
  хову! одар!
  тайга, Саяны!
  ат, хаа
  ие, тыва
  хову, хова
  одар, тайга

  [Plateau: sustained overtone, voices full, 10 bars]
  хову...
  тыва...
  Саяны...

  [Withdrawal: fiddle and vibraphone recede, 8 bars]
  хову...
  одар...

  [Held overtone fade: kargyraa alone, decays, 6 bars]
  хову...

  [End]

