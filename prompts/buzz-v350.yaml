notes: |
  Technique: Psychedelic-soul funk groove vamp as duration lever — a danceable
  uptempo vocal song that drops mid-track to a lyric-free electric sitar solo over
  the tuba bassline and rhythm alone (the groove vamp at 1:30, ~35 seconds), then
  returns with the full arrangement lifting a half-step from D-flat major to D major
  at 2:10. The explicit groove vamp section is the structural duration anchor,
  confirmed working in v348 (3:29) and v349 (3:04) which used the same mid-song
  instrumental vamp move. The half-step lift at the return is the payoff modulation —
  no [Silence] gate used, per feedback_silence_gate_truncates.

  Concept source: 10k+ play chart signal analysis — danceable uptempo R&B-funk
  grooves with warm psychedelic textures are winning at scale. The tresillo-flavored
  syncopated pocket is the proven danceable rhythm at this BPM range. Electric sitar
  (catalog debut) and NOLA-funk tuba bassline are the original novel contributions.

  Composer-omission: This cycle echoes the warm psychedelic-soul-funk sensibility of
  certain late-1960s and early-1970s studio sessions whose architects are omitted per
  house policy — the electric sitar over a punchy brass-band bassline with a warm
  keyboard comp is a hallmark of that era's psychedelic soul recordings. The featured
  trio reframes those textures for a modern danceable groove with a forward-motion
  emotional register.

  Duration strategy: BPM 102 sits in the 90–115 slow-tempo zone where Suno caps
  around 3:30 regardless of bar count. The duration target is 3:00–3:30, accepted as
  the ceiling for this tempo. The explicit groove vamp at 1:30 is the primary duration
  lever — it forces Suno to sustain the instrumental section before the vocal return,
  adding ~35 seconds. Final vocal timestamp pushed to 2:50, outro to 3:05, anchoring
  the render near 3:10. Production tokens used: polished studio mix, wide stereo stage,
  warm tape saturation. Sentence case throughout. Atmospheric-first opening names genre,
  mood, key, BPM, and duration target in the first ~200 chars. Five inline negatives
  close the style field. The forward-motion emotional register (sunlit, danceable,
  feel-good swagger) favors the 3:00–3:30 render range per the concept-type duration
  playbook rule.

  Trio instrument roles (verified against novelty_surface.json at v349):
  - Electric sitar (CATALOG DEBUT — never used in 349 previous versions): the buzzing
    metallic-pluck hook voice; warm mid-range with overtone-rich psychedelic shimmer,
    distinct from acoustic sitar (no raga, no Indian classical framing — psychedelic-soul
    funk context only); solos during the groove vamp at 1:30 as the central melodic
    payoff. Gap: 350 (debut, all-time first use).
  - Tuba (last used v334, gap = 15): NOLA-funk danceable bassline — punchy, low and
    round, inescapably moving; the harmonic and rhythmic anchor of the groove; keeps the
    bass register warm and brass-flavored rather than electronic. Gap: 15.
  - Wurlitzer electric piano (last featured use v294 as accent, gap ~55): syncopated
    chord comp in the pocket; warm analog bounce; the textural glue between the sitar
    hook and the tuba groove; confirmed fresh at gap ~55 versions. Retained (not swapped)
    because its tone is the correct warm-analog-funk keyboard for this concept. Gap: ~55.

  Novelty claims: Electric sitar is an absolute catalog debut (v1–v349, zero prior uses).
  Psychedelic-soul-funk genre is new to this catalog. Groove-vamp as named explicit
  lyric-free section is a technique continuation from v348–v349. BPM 102 last used at
  v320 (gap 30). D-flat major last used at v242 (gap 107) — very fresh key. Scene:
  sunlit danceable psychedelic-soul swagger is a register not previously used in this
  catalog's recent era (distinct from v349 cool electric confidence, v348 smoky chamber,
  v346 grown soul warmth).

