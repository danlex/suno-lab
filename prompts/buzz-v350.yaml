style: |
  Sunlit psychedelic-soul funk — hip-swaying tresillo groove, feel-good swagger, warm and danceable, duration 3:10. Polished studio mix, wide stereo, warm tape saturation. D-flat major, 102 BPM. An electric sitar opens with a buzzing resin-bright pluck — warm mid-range shimmer, overtone-rich and psychedelic, the hook voice throughout. A tuba lays down a punchy NOLA-funk bassline, low, round, irresistible. A Wurlitzer electric piano comps syncopated chords in the pocket, analog bounce. At 1:30 the song strips bare — electric sitar solos over the tuba and rhythm alone, bright runs above the brass pulse, a 35-second groove vamp. After the vamp the full arrangement returns, lifting a half-step to D major at 2:10. Final section near 2:50, warm groove fade near 3:10. Afternoon sun on bare shoulders, pavement warm underfoot — underscore for a sunlit feel-good dance scene. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers.

