notes: |
  VIRAL ARM cycle v283 — Modern Mor Lam Sing / Thai-Isan dance pop.
  Research-driven (Melodigging Mor Lam Sing, Thailand Foundation,
  BucketListly): Mor Lam Sing is the high-energy dance variant of
  traditional Mor Lam (Isan northeastern Thai folk-pop). Canonical
  130-160 BPM, signature khaen (mouth organ) + phin (Isan lute) riffs
  over modern band arrangement (drum kit, electric bass, keys). Rapid
  improvisational melismatic vocal with traditional lam-tang ornaments.
  Lamyai Haithongkham is the canonical contemporary Mor Lam Sing artist
  with active TikTok presence. "Sing" in the genre name means
  speed/dance-driven format.

  USER ROADMAP TARGET: 22 viral cycles deep, 17 languages, 23 voice
  archetypes, 19 regions. v283 adds Thai (18th language, 60M speakers)
  and Khon Kaen / Isan / Thailand as the 20th distinct region. SE Asia
  now has THREE distinct cycles: v273 Indonesian dangdut (Surabaya,
  pelog scale, sob ballad) + v280 Vietnamese Vinahouse (Saigon, six-
  tone husky whisper-belt) + v283 Thai Mor Lam Sing (Khon Kaen, Isan
  5-tone modal melismatic). Three distinct SE Asian music traditions
  represented — different tonal systems, different ornament libraries,
  different production traditions.

  VOICE DIFFERENTIATION — 24TH orthogonal voice in 24 cycles. Cumulative
  ledger (abbreviated):
    v260-v282: 23 prior voices spanning 17 languages
    v283 — female THAI MOR LAM SING NASAL MELISMATIC THAI (bright nasal
           melismatic belt + Isan 5-tone modal glissandos + rapid lam-tang
           ornaments + Thai tonal-language inflections + party-energetic
           dance delivery — Mor Lam Sing Isan signature distinct from
           prior female melismatic voices via 5-tone modal system + lam-
           tang ornament library)
  v273 vs v280 vs v283 female-SE-Asian-melismatic differentiation note:
  three female SE Asian voices now, all distinct on melodic-system axis —
  v273 Indonesian dangdut (pelog scale, cengkok ornaments, Auto-Tune sob),
  v280 Vietnamese Vinahouse (six-tone husky whisper-belt, electronic club),
  v283 Thai Mor Lam Sing (5-tone modal, lam-tang ornaments, khaen-phin
  acoustic-modern fusion). Style + exclude_styles block all 23 prior
  voice characters.

  LANGUAGE — 18th distinct language. Thai (Latin transliteration —
  Thai script is hard for Suno's classifier; Thai pop on TikTok often
  uses Latin transliteration). Lyric vocabulary uses authentic Mor Lam
  Sing: "sabai" (relaxed/well — iconic Thai concept), "kheun nee"
  (tonight), "Khon Kaen" (the Isan provincial capital — Mor Lam Sing
  epicenter), "som tam ped ped" (spicy papaya salad), "beer yen yen"
  (cold beer), "phin ti, khaen mua" (phin plays, khaen drums), "jangwah
  Isan" (Isan rhythm), "mai pen rai" (no problem — iconic Thai phrase),
  "baan rao" (our home). Concept: classic Mor Lam Sing dance-floor
  narrative — middle of the night, Khon Kaen still party, friends from
  Bangkok visiting, papaya salad and beer, phin and khaen playing,
  "tonight is sabai, no problems, Khon Kaen is our home." Evergreen
  Isan party-and-pride emotional core.

  BPM 145 — fresh in rotation. Within Mor Lam Sing canonical 130-160
  range. Distinct from v265 funk carioca (150), v260 drift phonk (138).

  Key B minor — first reuse of B minor since v268 (15 cycles ago).
  Walks well with khaen modal color (the khaen has a fixed pentatonic
  drone that pairs cleanly with minor-key Western pop).

  Production palette pinned: "signature khaen (Isan mouth organ) riffs
  + phin (Isan three-string lute) melodic interplay + modern Thai-pop
  drum kit + electric bass walking + keyboard modal pad + rapid
  interlocking percussive ostinatos + luk-thung-Thai-country-pop accent
  + vinyl crackle + party-bright mix." Geographic + visual anchor:
  "Khon Kaen night market party." Negatives explicitly block piphat
  ensemble, classical Thai, luk thung slow ballad, mainstream Thai pop,
  Cambodian khmer pop — five adjacent failure modes the Suno classifier
  could drift toward.

  Title "Sabai" — single Thai word for relaxed/well/contentment, 5
  chars, MEME-able (internationally recognizable Thai concept), iconic
  Thai dance-pop emotional register.

  Style char target: validated below 1000 via scripts/yaml_field_check.py.
  Blocklist clean (no Lamyai Haithongkham, Bonnadol, Phatcharaphol, Lao
  Sing, Sumeth, or other Mor Lam Sing artist names in style field —
