notes: |
  TECHNIQUE: Stile concitato (the "agitated style") is a Baroque compositional doctrine, codified in the early 17th century, that distinguishes between contrasting emotional states — concitato (warlike, turbulent: rapid repeated notes at high speed, tremolo fury) and molle (soft, lyrical: slow, long-tone stillness) — and uses hard cuts between them rather than gradual dynamic shaping. The structural engine is violent affective switching, not crescendo or decrescendo, so each return feels transformed rather than merely louder or softer.

  CONCEPT SOURCE: Rather than applying this doctrine to the traditional string-tremolo fury vehicle it was built for, this prompt reassigns the roles to a delicate trio. BASS FLUTE (breathy low register, flutter-tongue for concitato, slow aching tone for molle), CELESTA (rapid repeated-note figures for concitato, icy sustained partials for molle), and GLOCKENSPIEL (fast mallet tremolo rolls for concitato, sparse single strikes for molle) together carry the affective switching. Orchestral strings support and amplify but do not lead. A delicate-instrument reading of a battle doctrine — this is the core novelty.

  COMPOSER OMISSION: The principal historical figure associated with this doctrine has been omitted per the hard blocklist. All historical claims reference the technique itself, not its originator.

  DURATION STRATEGY: Target 2:30–3:30 (cue ~3:00) per the v137+ override. Arc uses tonal contrast (molle in C minor at 0:00, first concitato at 0:45, molle collapse at 1:25, second concitato at 1:50 lifting to C-sharp minor for the fused finale) and pulse-based intensity (146 BPM throughout, with trio attack rates creating the perceived speed differential between states). The half-step modulation to C-sharp minor is folded into the second concitato wave rather than a separate silence trick — fury and key lift arrive simultaneously, making the grief feel more desperate. Final texture from 2:30 refuses resolution — both states suspended to fade.

