style: "STILE CONCITATO ARC, scriptorium-before-candles-fail, total duration around 3:00. C minor to C-sharp minor, 146 BPM. BASS FLUTE + CELESTA + GLOCKENSPIEL over agitated strings. Built on violent affective switching — molle stillness hard-cut to concitato fury, not crescendo. Opens 0:00 in molle: BASS FLUTE breathes a slow aching line, CELESTA holds icy sustains, GLOCKENSPIEL drops sparse strikes like a quill on parchment. First concitato at 0:45: CELESTA rapid repeated notes, GLOCKENSPIEL tremolo rolls, BASS FLUTE flutter-tonguing in bursts. Hard collapse at 1:25 — BASS FLUTE alone, slower and graver. Second concitato at 1:50 lifts to C-sharp minor: GLOCKENSPIEL hammers fast figures while CELESTA carries the aching molle line. Final texture from 2:30 holds both states — agitation unresolved, softness never restored. Underscore for a scriptorium at candle-end. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."

lyrics: |
  [Short Instrumental Intro]

  [Bass Flute Opens — Slow Molle Aching Line]

  [Celesta and Glockenspiel Enter — Sparse, Like Candlelight]

  [First Concitato Eruption at 0:45 — Rapid Repeated Notes and Tremolo Fury]

  [Hard Collapse at 1:25 — Bass Flute Alone, Graver and Slower]

  [Second Concitato Wave at 1:50 — C-sharp Minor, Fury Fused with Grief]

  [Both States Held at 2:30 — Agitation and Stillness at Once]

  [Unresolved Fade — Neither Fury Nor Stillness Wins]

  [End]

