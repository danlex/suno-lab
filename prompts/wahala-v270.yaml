style: "Afrobeats, Nigerian Afro-fusion, smooth modern Afropop, 105 BPM, F minor, Lagos rooftop sunset. Male falsetto-mix Nigerian vocal — smooth high-tenor with Pidgin and Yoruba inflection, head-voice falsetto on hooks, chest-falsetto blend on verses, melodic R&B phrasing with Afrobeats syncopation, NOT chest-only amapiano, NOT Punjabi mid-register, NOT drift-phonk whisper — explicitly FALSETTO register. Production: Yoruba talking drum gùn-gùn rolling under the groove, sparse log drum, electric piano with tape saturation, deep 808 sub, dancehall-influenced kick, shaker on every off-beat, muted guitar licks, sax pad swells in the bridge, vocal ad-libs ('eh-eh', 'ah-ah', 'oya'). 2026 Afrobeats-without-borders aesthetic — calming, emotionally deep, NOT aggressive trap-afro, NOT mainstream radio pop. Lagos rooftop golden hour, palm-tree breeze. No EDM, no belt, no kawaii, no female group, no shouty MC, no orchestral."

lyrics: |
  [Intro]
  (talking drum tease) eh-eh, eh-eh
  ah-ah, oya

  [Verse 1] (falsetto-chest blend)
  baby no dey worry, leave wahala for tomorrow
  shake your body, leave the sorrow on the floor
  the night don sweet, moon don rise above Lagos
  hold my hand make we dance, no question why

  [Pre-Hook]
  (falsetto floats) oh-oh, oh-oh
  no wahala, no wahala

  [Hook] (pure falsetto)
  wahala, leave am for outside
  wahala, when the music dey play
  wahala, baby move your waist
  wahala, no go far away

  [Verse 2]
  city dey loud but the rhythm dey soft
  every kasala fade when your hips dey loft
  na me and you, na the bass and the drum
  wahala go come, but the night never done

  [Hook]
  wahala, leave am for outside
  wahala, when the music dey play

  [Bridge]
  (sax swells, talking drum)
  [Spoken] oya now, oya now
  baby just dey vibe

  [Final Hook] (stacked falsetto)
  wahala (eh-eh), leave am outside
  wahala (ah-ah), music dey play

  [Outro]
  (drums fade) wahala
  [End]

