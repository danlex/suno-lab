name: "effigy561-v561"
version: 561
title: "Effigy561"
instrumental: true

style: "A ritual dance in a vast resonant stone hall, the air between stamped chords wide and physical. 118 BPM — unhurried, every accent given full weight; the force in rhythmic unpredictability and harmonic clash, not speed. A hard, dry piano hammers alternating C major and F-sharp major triads in the same register, a tritone apart, never resolving. Timpani and bass drum trade single blows, each held a full beat before the next. Off-beat brass stabs land unpredictably in shifting 5/8 and 7/8 meters. Short modal folk cells pass between oboe and clarinets; piccolo sustains dry staccato tritones above the piano. The orchestration keeps changing who plays, so every line stays legible — inner woodwinds audible above the brass, polyphonic not homophonic, never a wash. Pizzicato and col-legno strings get exposed bars. Glockenspiel bites the downbeats. Polished studio mix, wide stereo stage, deep low end. No vocals, no electric guitars, no drum kit, no synthesizers."

lyrics: |
  [Stirring: piano alone hammers the bitonal ostinato — C major against F-sharp major — low strings beneath, oboe folk cell, 16 bars]

  [The Dance: timpani and bass drum trade single blows, off-beat brass stabs, 5/8 shifting to 7/8, folk cell in clarinets, 24 bars]

  [Bare Interlock: piano and pizzicato strings only, each line exposed, the tritone grind naked, 20 bars]

  [Muted Return: brass re-enters muted, folk cell between oboe and piccolo, timpani weighting the irregular pulse, 24 bars]

  [Full Color: brass unmuted, full percussion, the piano drops out — new weight, glockenspiel cutting the downbeats, 24 bars]

  [Grand Pause: full ensemble cuts; only tam-tam resonance and a low string sustain continue four bars, then fade — space wide, physical, 4 bars]

  [The Return: the bitonal ostinato returns total but fully weighted, folk cell hurled by winds over hammered piano, every layer still legible, the peak, 40 bars]

  [Cut-Off: one weighted stamped chord, then abrupt end, 2 bars]

  [End]

exclude_styles: "vocals, singing, choir, electric guitar, acoustic guitar, rock, metal, drum kit, rock drums, EDM, house, techno, dubstep, synthesizer, lo-fi, new age, ambient, muzak, free jazz, atonal, experimental noise, Arabic, tribal, world music, pipe organ, cinematic ambient, elegiac, intimate chamber"

notes: |
  v561 is a direct answer to v560's radical restraint and to a prior critique that the piece "does not say anything." v560 was solo piano at 52 BPM, pianissimo, withheld and still. v561 is its savage opposite: a full orchestra at 134 BPM driven by a rhythmically ferocious, bitonal, asymmetrically stamped ritual energy. The structural idiom evoked here — without naming its originators — is the primal, early-twentieth-century rupture with Romantic consonance: bitonality as harmonic identity (two brilliant major triads grinding a tritone apart, glittering and brutal), irregular stamping asymmetric meter (5/8 and 7/8 shifting), polyrhythmic layering with each strand audible, short modal folk-derived incantatory cells passed between instruments, and vivid primary orchestral color (hard piano, shrieking winds, snarling brass, huge percussion, col-legno strings). This is the idiom of one major early modernist composer whose name is withheld per blocklist discipline, refracted through the interpretive philosophy of a conducting perfectionist also unnamed — his hallmark being transparency even at full force, measured weight over speed, and structural inevitability. The piece is a living organism, not a string of effects: six stages of gathering ritual force, a real Silence (4 bars, nothing), then the Drop as brutal culminating return. Build/Silence/Drop stack applied per 2026-06 playbook. BPM 134 is in the proven 130–160 duration band; forward-motion concept (ritual arriving at primal peak) targets 3:30–4:00+ render. Style is 945 chars, sentence case throughout, atmospheric-first, three production tokens (polished studio mix, Hollywood scoring stage, wide stereo stage + deep low-end definition). Prominent piano is the body-voice engine; the ensemble is full orchestra — no instrument in the trio framing (this is a full-orchestra prompt, not a three-instrument trio). Exclude_styles verified to contain none of: piano, keys, strings, brass, woodwinds, percussion, orchestra, timpani.

