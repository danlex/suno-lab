title: "Dancing With Ghosts"
lyrics: |
  [Gentle Piano Waltz]
  The ballroom fills with candlelight
  But no one else is here
  I spin across the marble floor
  And hold what disappears

  [Strings Swell]
  Your shadow leads me through the dark
  Your whisper finds my ear
  We dance the way we used to dance
  Before you left this sphere

  [Full Orchestra - Sweeping]
  Round and round the chandelier
  Our reflection in the glass
  Every waltz a little slower
  Every moment meant to last

  [Powerful Climax]
  I'm dancing with your ghost tonight
  And the music never ends
  The orchestra plays on and on
  For lovers and for friends

  [Soft Piano Ending]
  The candles flicker one by one
  Until the last light bends

  [End]
