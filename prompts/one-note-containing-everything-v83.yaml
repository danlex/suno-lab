notes: "v83 — SPECTRAL MUSIC. Third research-driven iteration. Source: Gerard Grisey (1946-1998) and Tristan Murail, French spectralist school, IRCAM Paris 1970s. The spectral approach dissects sounds into their overtones/partials and orchestrates each partial on a different instrument — the orchestra becomes one giant analog synthesizer filter bank. Grisey's Partiels (1975) is the canonical example: he analyzed the spectrogram of a trombone low E2, then orchestrated each harmonic as a separate instrument. The result is a single tone that contains twenty timbres simultaneously. Key quote from Murail: 'music is ultimately sound evolving in time' — process-based, not motif-based. Applied to cinematic scale this becomes monumentally different from every previous iteration: no melody, no harmony in the classical sense, just one tone being dissected and amplified across the orchestra. 48 BPM glacial — the fundamental doesn't move, but the timbre slowly unfurls. Evolution: v82 was classical orchestration wisdom (Rimsky 1913); v83 is post-classical orchestration philosophy (Grisey 1975). Dramatic shift. Sources: Spectral music Wikipedia; Hasegawa on Grisey and the nature of harmony; Donaldson 2021 MTO paper. 976 chars."
