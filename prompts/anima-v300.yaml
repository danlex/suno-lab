lyrics: |
  [Intro] (solo grand piano arpeggios, 0:00-0:30)
  (no vocals)

  [Verse 1 — Male tenor sotto voce, 0:30-1:00]
  anima mia, dove sei adesso
  il vento porta il tuo silenzio
  ho camminato lungo la riva
  cercando la luce che eri tu

  [Verse 2 — Female soprano, cello joins, 1:00-1:30]
  lumen aeternum, fiamma viva
  anima nostra, eterna riva
  per montem cantamus
  per noctem perduramus

  [Pre-Hook — Duet call-response, 1:30-2:00]
  (tenor) anima, lumen
  (soprano) aeternum, viva
  (tenor) anima nostra

  [Build — duet harmony rising, 2:00-2:30]
  anima, anima, ascendere
  lumen, lumen, illuminare
  per noctem aeternam, anima perdurat

  [Climax — UNISON fortissimo, 2:30-3:00]
  ANIMA! ANIMA! lumen aeternum!
  ANIMA! ANIMA! eterno amore!
  ANIMA in tenebris, anima vincit

  [Sustained Plateau, 3:00-3:30]
  (duet) anima... lumen... eternum...
  anima nostra, aeterna
  vincit anima

  [Outro] (orchestral wash + piano fade)
  anima...
  [End]

