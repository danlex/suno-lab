notes: |
  TECHNIQUE — SICILIANO-TO-CABALETTA: The siciliano is a Baroque-era dance/aria form in slow compound meter (6/8 or 12/8), characterized by a gentle dotted-rhythm lilt and minor-key melancholy; it was a standard slow movement type from the 17th–18th centuries. The cabaletta is a fast-paced concluding section of a multi-tempo operatic aria, marked by uniform-rhythm tutti momentum and a brilliant major-mode character; it originates in early 19th-century Italian operatic practice. This prompt fuses the two into a purely orchestral arc — no singers, no operatic framing — making the form-contrast itself the drama. No operatic composer names are cited per blocklist; the structural logic stands on its own.

  CONCEPT SOURCE: Caller-designed two-part arc where Part 1 (~0:00–1:30) is a slow 6/8 lament in E-flat minor with sparse-lush orchestration and viola da gamba as solo voice; Part 2 (~1:30–2:55) is a fast 154 BPM gallop in G-flat major (relative major) with marimba locking the pulse and ophicleide carrying the theme. The hard tempo pivot at 1:30 — no silence, no fade — is the structural climax. No half-step modulation is used; the relative-major turn (same key signature, opposite emotional character) is the form-correct device.

  KEY DECISION: E-flat minor → G-flat major is a relative-major pivot (they share the same six-flat key signature). This is NOT a half-step modulation and deliberately avoids the silence-before-climax + half-step formula used in v234/v236. The cabaletta's brightness comes from the modal inversion, not from chromatic shock.

  DURATION DEFENSE: v234 and v236 both reached 3:00+ with full-orchestra dramatic arcs. This concept enforces similar duration via the cabaletta's tutti rhythm-lock and explicit timestamps: siciliano 0:00–1:30, pivot at 1:30, cabaletta 1:30–2:45, final chord 2:55. Dense lyric metatags (1–2 sentences each) and explicit full-orchestra scoring signal Suno to sustain the arc.

  TRIO ROLES AND GAPS (verified against prompts/):
    - VIOLA DA GAMBA (bowed_strings): last used v224, gap 13. Carries the siciliano lament line in long lyric bowed phrases; reappears in the cabaletta as eighth-note rhythmic foundation in the bass register.
    - MARIMBA (mallet_perc): last used v219, gap 18. Locks the cabaletta pulse with rolls and double-stops; drives the gallop forward from the first moment of the pivot.
    - OPHICLEIDE (keyed_brass): last used v229, gap 8. Delivers the cabaletta's major-mode theme in broad dark conical-bore strokes; its low-brass color contrasts with the marimba's brightness.

  NOVELTY CLAIMS: First use of SICILIANO-TO-CABALETTA form as an orchestral prompt technique in this catalog. 154 BPM is a new tempo for this project. Relative-major pivot (E-flat minor → G-flat major) as climax device rather than half-step modulation is new. Shipwreck coast at low tide is a new scene. All three trio instruments are deep-catalog revivals.

