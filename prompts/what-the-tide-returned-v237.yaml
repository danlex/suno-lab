title: "What the Tide Returned"
instrumental: true

style: "Monumental cinematic orchestral SICILIANO-TO-CABALETTA in E-flat minor to G-flat major, total duration around 3:00, 154 BPM. Trio leads: VIOLA DA GAMBA, OPHICLEIDE, MARIMBA. Part one: slow 6/8 lament from 0:00, viola da gamba carrying a long mourning line over a rocking string-bed in E-flat minor; full orchestra murmurs but holds its weight. At 1:30 a hard tempo lock — no fade, no silence — the ensemble snaps to strict 154 BPM and the key turns to G-flat major, an emotional inversion bright as sudden sunlight. The cabaletta gallops: marimba rolls lock the pulse; ophicleide delivers the theme in dark conical-bore brass strokes; viola da gamba pumps rhythmic foundation alongside full strings and brass. Density builds register by register to a tutti by 2:45 and settles on a final chord at 2:55. Scored in modern dramatic orchestral color — not period pastiche. No guitars, no vocals, no rock drums, no synthesizers, no pipe organ."

lyrics: |
  [Short Instrumental Intro]
  The wrecked hull half-buried in wet sand at first light; gulls circle overhead as water retreats.

  [Viola Da Gamba Opens the Lament]
  Viola da gamba begins alone in E-flat minor, its long bowed phrases rising and falling like a mourner walking the shore; the siciliano's 6/8 lilt sways gently beneath.

  [String Bed Murmurs Underneath]
  Low strings provide a rocking figuration; woodwinds breathe in half-light; the orchestra holds its full weight in reserve, letting the lament speak at its own pace.

  [Orchestra Thickens the Lament]
  Horns and cellos enter in quiet parallel motion; the siciliano deepens, the shore stretching long and grey; something glints in the retreating water, barely visible.

  [Hard Tempo Lock — Pivot to Cabaletta]
  At 1:30 the ensemble locks into strict 154 BPM without a breath of silence; the key turns instantly to G-flat major — the same key signature, a completely different world; the gallop begins.

  [Marimba Locks the Pulse]
  Marimba rolls and double-stops drive the cabaletta rhythm forward; full strings and brass join immediately; the figure that glinted in the sand is now in hand and the running has started.

  [Ophicleide Carries the Cabaletta Theme]
  Ophicleide states the new major-mode theme in broad dark conical-bore strokes over the galloping rhythm; full woodwinds double the line an octave up; the shore recedes behind.

  [Full Tutti Escalation]
  Every section of the orchestra engages; register climbs measure by measure; marimba doubles speed; viola da gamba pumps eighth-note foundation in the bass; the salvaged thing is held high.

  [Unison Tutti Statement]
  By 2:45 the full orchestra drives to a unison statement of the cabaletta theme, fortissimo across all registers; nothing held back; the coast, the wreck, the tide all left behind.

  [Settle on Final Chord]
  The gallop releases into a broad G-flat major chord at 2:55; full orchestra sustains, then lets go.

  [End]

