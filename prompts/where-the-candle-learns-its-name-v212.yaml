name: "where-the-candle-learns-its-name"
version: 212
style: "WOODWIND MULTIPHONICS TEXTURAL ENGINE at a candlelit scriptorium in deep winter, total duration around 3:00. SUBCONTRABASS SAXOPHONE + CLAVICHORD + CRYSTAL MARIMBA unfold a haunting arc in F-flat major at 109 BPM: subcontrabass saxophone opens alone, breathing low multiphonic shimmer — two tones at once, diffuse and trembling like candlelight. At 0:30 crystal marimba enters, each stroke ringing into cold air, fragile resonance beneath the shimmer. At 1:00 clavichord touches the aching center, whisper-soft pads barely pressing the strings — the three voices converge. At 1:30 a second multiphonic layer deepens the haze. At 2:00 clavichord descends four notes, barely heard. At 2:20 the multiphonics dissolve to a single clean tone — key lifts to F major: clarity out of shimmer, a candle finding its flame. At 2:45 the clean tone fades to silence. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers. Score for winter vigil."
title: "Where the Candle Learns Its Name"
lyrics: |
  [Short Instrumental Intro — subcontrabass saxophone multiphonic shimmer alone]

  [Crystal Marimba Enters — fragile resonance beneath the shimmer]

  [Clavichord Touches the Aching Center — three voices converge]

  [Second Multiphonic Layer — haze deepens]

  [Clavichord Descending Phrase — barely heard]

  [Multiphonics Dissolve — single clean tone, key lifts to F major]

  [Clean Tone Fades to Silence]

  [End]
