notes: |
  Technique: Downtempo chamber-groove with extended instrumental vamp. This form
  strips a low-BPM, bass-forward groove pulse down to acoustic chamber instrumentation —
  no electronics, no samples, no processed beats. The defining structural move is an
  explicit, labeled instrumental groove-vamp section in the lyrics lasting ~32–48 bars
  at 76 BPM, which forces Suno to traverse the vamp rather than skip to a quick ending.
  This is the primary duration lever for a slow-BPM vocal song: texture accumulation
  over time rather than verse-chorus cycling.

  Concept source: Chart signal = groove-pulse + intimate slow-burn confidence;
  novel element = downtempo chamber-groove with an extended sustaining vamp to fix
  the short-render problem that plagues slow-BPM vocal cycles.

  Composer-omission: This cycle echoes the texture-over-melody philosophy of
  certain 1990s producers whose names are omitted per house policy — the
  groove-first, voice-as-texture approach and use of low-register bowed strings
  over sub-bass drone are their hallmark.

  Duration strategy: BPM 76 falls in the slow-BPM ceiling zone (~3:30 max);
  the explicit [Instrumental groove vamp] section from 1:32 to ~2:20 (~48 bars at
  76 BPM) gives Suno a structural mandate to sustain. Final vocal timestamp pushed
  to 2:50 and outro to 3:10 to anchor the render near the 3:00–3:40 target.
  Production tokens used: polished studio mix, deep low-end definition, wide stereo
  stage, warm tape saturation, reverb-washed chamber strings. Sentence case throughout.
  Atmospheric-first opening names the key, BPM, and duration target in the first 200
  chars. Five inline negatives at style close.

  Trio roles and gaps (verified against novelty_surface.json at v347):
  - Baryton (last used v254, gap 93): bowed baroque bass viol with sympathetic strings;
    sul ponticello for grit, arco for warmth; the bass-forward groove engine and harmonic
    anchor. Deep revival.
  - Glockenspiel (last used v333, gap 14): crystalline bell glints over the dark groove;
    cool, precise, restrained; the luminous counterpoint to the baryton's darkness.
  - Subcontrabass saxophone (last used v256, gap 91): deep breathy sub-bass drone;
    pulses and withdraws beneath the groove, felt more than heard; never a melodic lead.
    Deep revival.

  Novelty: downtempo chamber-groove form is new to catalog. BPM 76 matches slow-burn
  genre requirement. Key E-flat minor to E minor half-step lift is the payoff moment
  after the groove vamp. Scene: smoky cool nocturnal groove, a cool-magnetism register
  not previously used (catalog has longing, wonder, ceremony, joy — not this).

  Instrument body-voice check: baryton = body voice (bowed string); glockenspiel =
  spectral; subcontrabass saxophone = body voice (aerophone). Two body voices satisfied.

