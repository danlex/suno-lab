title: "Sable"
instrumental: false
vocal_gender: female

style: |
  Slow downtempo chamber-groove in E-flat minor, shifting to E minor at the melodic return — smoky, magnetic, nocturnal. Duration target 3:00–3:40, sustaining by texture accumulation. Polished studio mix, deep low-end definition, wide stereo stage at 76 BPM. Low, breathy, confident female voice — intimate and cool, never operatic. The groove engine is a baryton bowed sul ponticello for grit, arco for warmth, sympathetic strings humming beneath every phrase. Over that dark foundation, a glockenspiel drops crystalline bell glints — cool, precise, occasional. A subcontrabass saxophone breathes as sub-bass drone, deep and withdrawing, felt more than heard. Brushed percussion and reverb-washed chamber strings underneath, warm tape saturation. Late-night room, amber low, air cool and still — underscore for a slow-burn entrance scene, a presence filling the dark. No guitars, no rock drums, no synthesizers, no pipe organ, no swell.

lyrics: |
  [Intro: baryton drone, sax pulse, 0:00]

  [Verse 1: voice enters, glockenspiel glints, 0:18]
  You move like the dark moves
  when the lights don't come on
  I stay where the low notes
  keep pulling me along

  [Verse 2: baryton arco, brushed percussion, 0:48]
  You don't need to say it
  I already know
  the pull is in the gravity
  the cool undertow

  [Hook: glockenspiel brightens, 1:16]
  Sable, sable
  slow and certain
  sable, sable
  behind the curtain

  [Instrumental groove vamp, 1:32]

  [Groove rise: baryton arco, glockenspiel crystalline, 2:04]

  [Verse 3: E minor lift, voice returns, 2:24]
  Still here in the half-light
  still warm at the edge
  nothing I need to prove
  nothing left to pledge

  [Hook return: full texture, 2:50]
  Sable, sable
  slow and certain
  sable, sable
  behind the curtain

  [Outro fade: groove dissolves, 3:10]

  [End]

