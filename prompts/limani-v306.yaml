notes: |
  v306 "Limani" — Greek rebetiko cinematic ballad. ABSOLUTE CATALOG DEBUT:
  zero Greek-language entries and zero bouzouki / bağlama / riq instruments
  across all 305 prior versions. 36th distinct language (Greek). 47th
  orthogonal voice (Greek demotic male baritone with heterophonic vocal-
  instrument unison-drift and Hijaz-mode ornaments).

  TECHNIQUE: Heterophonic unison-drift is a core feature of rebetiko and
  Greek demotic music: the vocalist and the lead melodic instrument (here
  bouzouki) play or sing the SAME melodic line simultaneously, but each
  with their own natural ornamentation, microtonal tuning, and rhythmic
  flexibility. The two voices never lock into exact unison — they hover
  a comma apart, creating a warm, slightly shimmering beating resonance
  that is the acoustic signature of the tradition. When the human voice
  enters over an already-established bouzouki line, the drift begins
  immediately: the vocalist ornaments long vowels with microtonal slides
  (characteristic of Greek demotic inflection), slightly anticipates or
  delays phrase turns, and never adopts the clean straight tone of Western
  art-song. The result is not harmony (both voices are on the same pitch
  class) and not unison (they are measurably apart) — it is the third
  thing: heterophonic drift.

  The Hijaz mode (B-D-D#-F#-A spelling in B minor context) provides the
  raised third (D#/Eb) that colors each phrase with the Mediterranean
  modal ache characteristic of rebetiko — distinct from plain natural minor,
  giving the melody its characteristic augmented second between the second
  and raised third degree.

  CONCEPT SOURCE: Greek rebetiko heterophonic vocal-instrument unison-drift
  with Hijaz mode inflection, 1920s Piraeus port at dusk, trio of bouzouki +
  bağlama + riq frame drum. The heterophonic drift technique was not used in
  any prior cycle across 305 versions.

  COMPOSER OMISSION CONFESSION: This concept draws on a mid-20th century
  urban Greek working-class musical tradition whose most iconic recording
  artists and the port-city (Piraeus, Thessaloniki, Smyrna) style they
  developed are withheld per artist-name blocklist discipline. The
  heterophonic vocal-instrument drift is the instrument — no individual
  compositional voice is named. The exclude_styles list blocks proper-noun-
  adjacent tags (Zorba tourist cliché, Greek laïká pop, taverna sing-along)
  to prevent auto-classifier artist-match drift.

  DURATION STRATEGY: BPM 82 = slow-BPM territory (<=115 caps at ~3:30 per
  v254 BPM-ceiling data). Target 3:00–3:30. Not fighting the ceiling —
  optimizing emotional density via heterophonic layer accumulation. Playbook
  moves applied:
  - Parametrized colon-lyrics with bar counts per section (9 sections)
  - Production tokens: "polished studio mix", "deep low-end definition",
    "lush acoustic ambience", "wide stereo stage", "warm tape saturation"
    (5 tokens — maximum density)
  - Trio voice analysis: bouzouki (plucked string body resonator — body
    voice), bağlama (plucked string body resonator — body voice), riq (frame
    drum body resonator — body voice). ALL THREE are body voices; zero
    spectral picks in this trio. Exceeds >=2 body voice requirement.
  - Sentence case throughout style, no ALL-CAPS form labels
  - Atmospheric-first opening (Piraeus port at dusk before production
    tokens or BPM)
  - No [Silence] metatag anywhere — hardened rule per v290+v303+v304+v305
    cross-genre confirmation; arc uses additive layering and reverse-
    simplification coda instead
  - Total lyric bars: approximately 78 bars at 82 BPM targeting 3:00–3:15
    wall clock; consistent with slow-BPM ceiling (3:30 max)
  - Vocal enters at second section (bars 17–24), allowing instruments to
    establish the heterophonic texture before drift begins
  - Arc: bouzouki + bağlama duet alone (8+8=16 bars) → voice enters with
    heterophonic drift (8+10=18 bars) → low strings + riq join texture
    (10+8=18 bars) → bouzouki solo ascent (10 bars) → final unison reunion
    (10 bars) → unresolved VII outro (6 bars) = 78 bars total
  - Unresolved VII chord (A major over B minor tonic) as ending: avoids the
    silence+half-step-up cliché overused v216–v219; the harmonic suspension
    is the arc's emotional conclusion

  INSTRUMENTS:
  - Bouzouki (catalog debut, gap 306 cycles): 8-string Greek long-neck lute
    in courses of two, metallic nasal tone with bright sustain on plucked
    notes. The primary melodic voice of the rebetiko tradition — its timbre
    is recognizably Greek, cutting through without masking the voice. Opens
    the duet alone, rides the heterophonic drift with the voice, solos with
    an ornamental ascending fourth at 2:00, and rejoins the final unison
    reunion. First appearance in 305-version catalog.
  - Bağlama (catalog debut, gap 306 cycles): smaller, higher-pitched fretted
    cousin of the bouzouki, with a drier and slightly more nasal tone. In the
    opening duet, provides a second voice on the same melodic line — also a
    comma apart from the bouzouki, creating a layered three-way drift once the
    vocal enters. Functions as inner harmonic texture rather than counterpoint.
    First appearance in 305-version catalog.
  - Riq (catalog debut, gap 306 cycles): Egyptian/Greek small frame drum
    (approximately 20 cm diameter) with metal jingles mounted in the wooden
    frame. In rebetiko, the riq marks the zeibekiko/hasapiko downbeat with a
    dry tap — never dominant percussion, more like a breath-accent. Enters when
    the low pizzicato strings join, provides the zeibekiko downbeat pulse from
    that point through the final reunion. First appearance in 305-version
    catalog.

  VOICE DIFFERENTIATION — 47th orthogonal voice. Greek demotic male baritone
  with heterophonic vocal-instrument unison-drift: chest-mid register (G2–G4),
  mournful quality, ornamental microtonal slides on long-vowel sustains, no
  Western vibrato or straight classical tone production. Distinct from all 46
  prior voices via: (1) heterophonic drift — voice and bouzouki play the same
  melody simultaneously but measurably apart, creating a beating resonance that
  is neither unison nor harmony; (2) Greek demotic ornament style — microtonal
  slides on long vowels (αυ, ευ, ου, αι clusters), not melisma and not
  straight tone; (3) Hijaz mode — the raised third degree colors both the
  vocal line and the instrumental phrase with modal ache foreign to any prior
  voice in the catalog; (4) Greek origin — zero prior Greek-language entries
  across 305 versions.

  LANGUAGE: Greek (Ελληνικά) — 36th distinct language. Vocabulary used:
  "λιμάνι" (limani / harbor, port — central rebetiko trope), "Πειραιάς"
  (Piraeus — the port city, geographic anchor), "θάλασσα" (thalassa / sea),
  "βάρκα" (varka / boat), "αύριο" (avrio / tomorrow), "αγάπη" (agapi / love),
  "ψυχή" (psyhi / soul), "ξενιτιά" (xenitia / exile, being far from home),
  "νύχτα" (nyhta / night), "μακριά" (makria / far away), "βαριά" (varia /
  heavy — as in heavy sea, heavy heart). Concept: 1920s Piraeus port at dusk,
  exile and longing, the sea remembers, the harbour never sleeps. Words used
  as breath-anchors on sustained long vowels, consistent with demotic ornament
  architecture.

  BLOCK RATIONALE: exclude_styles blocks all identity-adjacent classifier
