style: "Film score for 1920s Piraeus harbour scene — salt air, fishing boats, mangas in the taverna. Mournful ~3:00 arc of exile and longing. Bouzouki and bağlama open alone at 0:00: same melody a comma apart, dry heterophonic unison, warm beating resonance. 82 BPM, B minor, Hijaz mode — raised third giving each phrase a humid ache. Polished studio mix, deep low-end definition, lush acoustic ambience of harbour stone. Greek demotic male baritone enters at 0:50, chest voice riding the bouzouki in heterophonic drift, microtonal slides on long vowels, no Western vibrato. Low pizzicato strings join; riq frame drum marks downbeats, light jingles, nothing dominant. Bouzouki solo at 2:00, ornamental fourth held on penultimate. Voice and full texture reunite on unresolved VII — A major over B minor tonic, harbour still open. Wide stereo stage, warm tape saturation. No guitars, no rock drums, no pipe organ, no synthesizers, no electronic percussion."

