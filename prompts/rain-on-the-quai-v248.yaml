notes: |
  New playbook moves applied (all five from experiments/suno_2026_research.md):

  1. NO CAPS FORM LABELS. Previous cycles used "CONCERT MARCH WITH TRIO", "FRENCH HORN + HURDY GURDY + CELESTA" in all-caps throughout the style field. The research file documents that Suno v5.5's tokenizer treats ALL-CAPS as emphasis tokens that compete against musical descriptors, and specifically that "CAPO" matched the German rapper CAPO in v246, injecting German Rap/Hip Hop into the style tags. This prompt uses sentence-case throughout, all instruments in lowercase.

  2. PRODUCTION-MIX TOKENS. Three tokens drawn from the research file's "what actually renders in Suno v5.5" list: "polished studio mix", "Decca-tree wide strings", "warm tape saturation", "wide stereo stage", "deep low-end definition", "lush acoustic room ambience" — six total, woven into the opening sentence and the mid-field. These are directive rather than descriptive (the research file is explicit: "Suno does not default to high quality. Explicit production direction matters").

  3. PARAMETRIZED BRACKET LYRICS WITH COLON CONTENT. Previous cycles (v243–v247) used bare labels like "[Fanfare Intro]" with no content — the research file identifies this as the root cause of ~2:00–2:30 durations: each empty bracket renders ~15s, 9 brackets = ~2:15. This prompt uses the Blake Crosley colon syntax: "[Solo Accordion: single melodic line, legato phrasing, A minor, 8 bars]". Each bracket now carries instrument names, dynamic descriptors, bar counts, and key labels — giving Suno rendering targets per section. Instrument names inside the colon content are explicitly permitted per the research finding.

  4. TWO BODY VOICES MINIMUM. v247 featured French Horn (body) + Hurdy Gurdy (spectral) + Celesta (spectral) — 1 body + 2 spectral voices — and landed 1:49/2:02. This prompt uses accordion + harp + clarinet, all three substantial body instruments with pluck/attack/bellows character. Research correlates all-substantial trios (v234/v238) with 3:00+ durations.

  5. ATMOSPHERIC-FIRST PROSE. The style field opens with "Late-night Parisian neoclassical cinematic" — mood/place/feel — before any form label or technique name. The research found this structure outperforms technical-first by +23% (50-song NL-vs-JSON experiment). The form arc is embedded in prose, not declared as a heading.

  FRENCH DIRECTION: accordion (catalog debut), harp (last v238, gap 10), clarinet (last v239, gap 9). All three are evocatively French — accordion is the chanson voice, harp adds the salon halo, clarinet provides the woodwind warmth of the bal-musette tradition without naming it. Scene: 2am Paris, rain on the quai, the café nearly closed, the trio playing for themselves. No French composer or performer names appear per blocklist.

  Composer-omission note: French composers most associated with this textural language cannot be named under the blocklist rule. No composer names appear anywhere in this prompt.

  Duration strategy: 132 BPM sits in the proven 130–160 band. Ten parametrized brackets with bar counts (8+8+8+16+8+16+16+8+8 = 96 bars at 132 BPM = ~2:54 at 4/4). Duration anchor phrase "three-minute extended arrangement" in style. Tonal clarity: A minor throughout the opening, lifting to F major (relative major) at the bridge — the warmth-out-of-shadow modulation the caller specified. All three voices sustain continuously with no spectral dropouts.

  Novelty claims: accordion is a catalog debut (never used in any of v1–v247). 132 BPM never used before. Harp last v238 (gap 10). Clarinet last v239 (gap 9). Rain-on-quai / Parisian café scene is new. French cinematic chanson without vocals is a technique-new designation.

