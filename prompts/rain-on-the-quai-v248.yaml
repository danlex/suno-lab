title: "Rain on the Quai"
instrumental: true

style: "Late-night Parisian neoclassical cinematic, polished studio mix with Decca-tree wide strings and warm tape saturation, 132 BPM, A minor to F major. Accordion carries the melodic voice, bellows-driven warmth evoking an empty café while rain taps the glass. Harp rolls arpeggiated chords beneath, plucked attacks marking the pulse. Clarinet adds a low-register countermelody — warm and plaintive, winding through the harmony as if completing what the accordion left open. Full string section: deep cellos sustaining the foundation, violas adding inner warmth, violins rising into the upper air at the bloom. Wide stereo stage, deep low-end definition, lush acoustic room ambience, three-minute extended arrangement. Opens on solo accordion, harp joining after eight bars, clarinet entering last. All three voices gather as the key lifts to F major, strings blooming to full warmth. No guitars, no vocals, no rock drums, no synthesizers, no pipe organ."

lyrics: |
  [Solo Accordion: single melodic line, legato phrasing, A minor, 8 bars]
  [Harp Joins: arpeggiated chords beneath accordion melody, pulse established, 8 bars]
  [Clarinet Enters: low-register countermelody weaves against accordion, 8 bars]
  [Trio Develops: all three voices intertwining, strings add warmth below, 16 bars]
  [Build: string section swells, harmony thickening toward the bridge, 8 bars]
  [Bridge — F Major: key lifts to F major, clarinet holds long tones, accordion ornaments, 16 bars]
  [Full Bloom: strings at full warmth, all three voices in consonant accord, 16 bars]
  [Gradual Withdrawal: harp and clarinet recede, accordion returns to opening phrase, 8 bars]
  [Final Cadence: single sustained accordion chord, low cello pizzicato, fade, 8 bars]
  [End]

