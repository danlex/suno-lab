  Et tout le reste s'éloigne

  [Refrain 1 — mellotron, bloom, 1:00]
  C'est du velours, c'est toi le matin
  C'est du velours, cette heure qui prend fin
  Ne pars pas encore, reste une seconde
  C'est du velours, ta façon d'être au monde

  [Couplet 2 — hautbois d'amour, 1:28]
  La fenêtre ouverte, la ville s'éveille
  Tu souris sans raison, je te souris
  C'est tout, c'est la vie

  [Pont — piano, fredonné, 2:00]
  Hm-hm-hm, hm-hm

  [Refrain final — violoncelle, demi-ton, 2:28]
  C'est du velours, c'est toi le matin
  C'est du velours, cette heure qui prend fin
  Ne pars pas encore, reste une seconde
  C'est du velours, ta façon d'être au monde
  Hm...

  [End]

