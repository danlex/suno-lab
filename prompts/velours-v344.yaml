style: "A late-morning window left open, linen curtain lifting on warm air — the feeling of wanting nothing to change. Polished studio mix, warm tape saturation on the vocal, lush acoustic ambience. Nouvelle chanson-pop, intimate French female vocal half-spoken and tender, finger-picked nylon guitar and brushed snare on the bed, warm sub-bass pulse entering quietly. At 114 BPM in D major: oboe d'amore traces a plaintive vocal-adjacent line between phrases; mellotron string-choir pad lifts each chorus into a warm bloom; cello enters on the final chorus with a singing counterline as the key lifts to E-flat major. Voice stays conversational — near-whispered, never belted. Piano arpeggio shadows the bridge, vocal humming. Final chorus tapers to a single sustained note. Underscore for a quiet kitchen scene, morning light on a wooden table, two cups of coffee. No EDM drop, no autotune, no brass section, no drum machine, no cathedral reverb."

lyrics: |
  [Intro — guitare, 0:00]

  [Couplet 1 — voix et guitare, 0:12]
  Tu es là dans la lumière du matin
  La tasse entre tes mains, le regard loin
  Je ne dis rien, je regarde, c'est bien
  Ce moment qui ne pèse presque rien

  [Pré-refrain — basse entre, 0:40]
  Quelque chose de doux m'envahit
