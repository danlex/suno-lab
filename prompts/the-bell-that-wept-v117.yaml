notes: "v117 — GOTHIC SYMPHONIC NEOCLASSICAL. Directly addresses the user's Evanescence reference: 'intimate vulnerable opening → raw emotional power → soaring climax.' Translated to instruments: glockenspiel = innocent vulnerability (the 'My Immortal' piano opening equivalent), erhu = raw emotional cry (the vocal power equivalent), bandoneon = dark gothic grandeur (the symphonic sweep equivalent). This is NOT just an instrument showcase — it's the Evanescence emotional arc stripped to its bones and re-instrumented with underused voices. RESEARCH: Long Island Entertainment review of Liz Luceris 'Hommage à Byron' (2026) — bridges neoclassical orchestration and cinematic gothic with rare emotional intimacy. Wikipedia neoclassical dark wave — uses orchestral components for ethereal/dramatic/melancholy atmosphere. Midnight Syndicate — symphonic soundtracks to imaginary films, genre-defying gothic instrumental. LEARNED: (1) Gothic symphonic neoclassical is a live 2026 genre with active practitioners. The fusion of classical orchestration + gothic darkness + emotional intimacy is exactly what v117 aims for. (2) Bandoneon (novelty_surface reports NEVER used but was in v105 — bug in keyword extraction, will fix). Regardless: bellows instrument with breathing quality, raw emotional sighs, Argentine tango heritage repurposed for gothic darkness. (3) Erhu (v102, 14 versions ago) = Chinese 2-string bowed instrument, called the 'Chinese violin' — deeply expressive, weeping quality. Added 'Chinese folk' to exclude_styles to prevent Eastern Asian folk triggering. (4) Glockenspiel (v83, 33 versions ago, deepest revival this cycle) = metallic bells, innocent crystalline tone, massive contrast against dark gothic atmosphere. Used as the 'innocence' voice in the dark-to-devastation arc. DURATION: continues v115-v116 approach (tighter language + [End] metatag). 906 chars."
