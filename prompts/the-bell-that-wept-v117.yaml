style: "GOTHIC SYMPHONIC NEOCLASSICAL film score for a candlelit grief scene, total duration 1:40 to 1:55 (ends at 1:55, never longer), with BANDONEON + ERHU + GLOCKENSPIEL, dark emotional intimacy becoming cathedral-scale devastation, C-sharp minor to D minor, 76 BPM, instrumental. From 0:00 glockenspiel enters alone — innocent bell tones trembling in darkness, each strike ringing through cathedral silence. At 0:20 erhu rises, Chinese bowed string weeping a raw emotional cry, every note a wound refusing to close. At 0:45 bandoneon breathes in with gothic tango darkness, bellows sighing like a cathedral mourning itself. Chamber strings swell at 1:05, low brass deepening the foundation. Silence at 1:20 — three beats where everything stops. At 1:23 music returns in D minor half-step up, all three voices over full orchestra fortississimo. Ends at 1:55. No guitars, no vocals, no rock drums, no pipe organ."
