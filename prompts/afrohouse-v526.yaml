notes: >
  Cycle v526 — Afro house x melodic techno, warm and groove-first. Tournament
  winner over Candidate B (afro-ritual male, Body526) and Candidate C (UK garage,
  Bethnal526). Chosen for highest chart signal (afro house = 2026 Sound of the
  Year, 778% growth) and maximal four-on-the-floor danceability, matching our
  proven house/dance engagement lane.


  HOOK: "Garde mes os, je m'en vais" (keep my bones, I'm leaving) — three
  staccato repeated-note stabs on Ab ('garde — mes — os') triplet-hocketed
  against the shaker, BALAFON accent on 'os', then a wide ascending minor-sixth
  leap (Ab to F) on 'je m'en vais' held over the kick.


  NOVELTY: BALAFON as melodic hero is a deep revival (last used v186, ~340
  versions ago). Paired with a FILTER-SWEPT ANALOG BASS SYNTH and a HYPNOTIC
  MINOR-KEY SYNTH ARPEGGIO — three voices in distinct bands. Filter-sweep-to-full-
  brightness is the climax mechanism, non-modulation. No silence+half-step-up.


  DURATION LEVER: explicit lyric-free [Groove vamp] and [Instrumental Break]
  in the middle; final chorus pushed late (~2:40). Target render 3:15-3:45.


  LYRICS TRIMMED from the drafter's 1717-char version to fit the 1000-char gate
  (concise 2-6 word bracket labels per the lyrics-balance rule); hook, both
  verses, and the mid-song vamp preserved.

