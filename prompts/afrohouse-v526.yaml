name: "afrohouse-v526"
version: 526
style: >
  Pre-dawn warmth on a packed dancefloor — the moment of release, not grief.
  Afro house meets melodic techno, polished studio mix, deep low-end definition,
  wide stereo stage. A-flat minor, 122 BPM. The balafon carries the melodic hero
  line, its bright marimba-timber cutting through a filter-swept analog bass synth
  that opens slowly from dark to luminous, while a hypnotic minor-key synth
  arpeggio locks to the four-on-the-floor kick below. Tribal shakers and congas
  pulse through every section, long-sustain warm pads swell beneath the groove
  plateau. A female vocalist sings with genuine emotive depth — French phrases,
  wide minor-sixth leaps, staccato repeated-note stabs triplet-hocketed against
  the shaker. Density climax at 2:15 via filter opening to full brightness and
  pad swell, no key change — purely groove-driven forward motion. No guitars,
  no pipe organ, no rock drums, no ambient drone washes, no spoken word monotone.

title: "Os526"

lyrics: |
  [Intro — shaker, filtered bass]

  [Bass hook — filter-swept bass, congas]

  [Balafon — melody over arpeggio]

  [Verse 1]
  Le ciel blanchit, je vois clair
  Tu danses encore dans mes veines
  J'ai marché jusqu'à l'aube pieds nus
  Quelque chose en moi s'est ouvert

  [Pre-Chorus — arpeggio tightens]

  [Chorus — four-on-the-floor drop]
  Garde mes os
  Je m'en vais
  Garde mes os
  Je m'en vais
  Garde mes os — je m'en vais

  [Groove vamp — balafon, arpeggio, no vocals]

  [Verse 2]
  Le jour n'existe pas encore
  Mais tes bras ont la mémoire
  Je laisse tout ce qui pesait
  Sur ce plancher qui tremble

  [Pre-Chorus — pad swell rising]

  [Chorus]
  Garde mes os
  Je m'en vais
  Garde mes os
  Je m'en vais
  Garde mes os — je m'en vais

  [Instrumental Break — balafon vamp, congas free, no vocals]

  [Filter Rise — pad density swells]

  [Climax — tutti groove, full brightness]

  [Final Chorus]
  Garde mes os
  Je m'en vais
  Garde mes os — je m'en vais

  [Outro — shakers return, balafon trails]

  [End]

instrumental: false
vocal_gender: female

