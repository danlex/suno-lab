notes: |
  Melodic techno is a subgenre of techno (typically 120–135 BPM) defined by tonal coherence — sustained wide analog pad chords, looping 16th-note arpeggio cascades, a recurring lead synth motif, and four-to-the-floor kick — producing a hypnotic, forward-driven, emotionally open texture distinct from percussive or industrial techno. The genre became a vehicle for cinematic emotional weight in electronic music through the Berlin scene, without naming any practitioners.

  Concept source: the last human lighthouse keeper on the final night before automation replaces him — watching the beam sweep the dark one last time, farewell to a lifetime of solitary unrewarded duty. The hook phrase "turning for no one" distills the paradox: duty without audience, rotation without witness. Pitch contour: descending gravity-arc — G4 'turning' (fifth), F4 'for' (fourth), Eb4 'no' (minor third), C4 'one' (root, sustained) — legato even quarter-notes against the driving 16th-note arpeggio bed.

  This echoes a generation of European melodic-techno composers who turned the genre toward emotional depth and wide-screen pathos — unnamed per blocklist discipline.

  Duration strategy: parametrized colon-syntax sections with bar counts (8+16+8+16+8+32+12+16+8 = 124 bars at 126 BPM, targeting ~3:20–3:45). The [Dense Groove] 32-bar mid-section is kick-live and arpeggio-continuous — not ambient, not sparse — applying the v527 lesson. Final hook pushed late (~75% of arc). Production tokens: polished studio mix, deep low-end definition, wide stereo stage.

  Negative-prompt audit: exclude_styles does NOT contain "vocals," "singing," "electronic," or "synthesizer." Inline negatives cover guitars, rock drums, pipe organ, acoustic instruments, shouted vocals — none contradict the synth-vocal bed.

  Novelty: melodic-techno + lighthouse-keeper farewell scene unused in catalog. "Turning for no one" hook with descending-gravity pitch contour and duty-without-audience paradox is new. 126 BPM unused in recent catalog.

