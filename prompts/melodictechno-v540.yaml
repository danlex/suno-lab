style: "Melodic techno at the edge of grief — the last watch kept by a man who knows the machine takes over at dawn, cold sea air and a rotating beam and thirty years condensed to one night. Hypnotic, elegiac, cinematic, 126 BPM in C minor. Four-to-the-floor kick holds the pulse while 16th-note analog arpeggio cascades spiral without pause, wide pad chords breathing underneath in long slow sweeps. A single aching lead synth motif descends the minor scale, returning each verse. A male voice sings with quiet gravity — legato phrases in even quarter-notes against the relentless 16th-note bed, restraint carrying all the weight. Polished studio mix, deep low-end definition, wide stereo stage. Dense and continuously driven — arpeggios never stop, kick stays live through every section. No guitars, no rock drums, no pipe organ, no acoustic instruments, no shouted vocals."

lyrics: |
  [Intro: arpeggio, motif, 8 bars]

  [Verse 1: 16 bars]
  Thirty years and a clockwork sea
  Every night I wind the lens, it winds me
  The ships stopped coming, the light stayed on
  I kept the record, kept the dawn

  [Hook 1: 8 bars]
  Turning for no one
  Turning for no one
  The beam goes out and comes back round
  Turning for no one

  [Verse 2: pads rise, 16 bars]
  Tonight I climb the stairs one last time
  Count the steps the way I always have
  The lens knows nothing of what follows
  Only the arc, the turn, the path

  [Hook 2: 8 bars]
  Turning for no one
  Turning for no one
  The dark between the sweeps runs wide
  Turning for no one

  [Dense Groove: arpeggio, kick, 32 bars]

  [Verse 3: 12 bars]
  The ships stopped needing me years back
  I kept the light by pact
  Tonight I wind the lens one last time
  Let the circuit learn the climb

  [Final Hook: 16 bars]
  Turning for no one
  Turning for no one
  The slow descent from G to C
  Turning for no one
  Turning for no one
  The beam sweeps on indifferent

  [Outro: 8 bars]

  [End]

