notes: "v131 — ORCHESTRAL STOCHASTIC. Sixth 20th-century avant-garde technique after micropolyphony (v126), minimalism (v127), spectral (v128), aleatoric (v129), twelve-tone (v130). Stochastic = probability-density composition: pitches/durations/timbres emerge from statistical distributions (Gaussian, Poisson, Markov chains) rather than deterministic writing. RESEARCH: Pithoprakta (1955-56) and Achorripsis (1957) were foundational orchestral works modeling large-scale sonic behavior via probability — 'clouds of sound' formalism, kinetic-theory-of-gases applied to orchestration. Composer name omitted per blocklist. KEY LESSON FROM v130: atonal framing shortened Suno output durations (all clips <1:00). Fix: use tonal framing (E minor → F minor) while keeping stochastic textural language. Added 'atonal' to exclude_styles. INSTRUMENTS: Prepared piano (×2, last v95 — **36-VERSION GAP, DEEPEST REVIVAL OF THIS SESSION after v129's 37-gap french horn**) = inside-the-piano muted hammers, percussive pointillistic attacks perfect for probability scatter. Contrabass clarinet (×2, last v97 — 34-gap) = lowest woodwind, chromatic microtonal drift across wide range. Tuba (×2, last v104 — 27-gap) = deep brass gravitational field anchoring statistical clouds. Three deep revivals in one trio = rarest palette since session began. NOVELTY: First stochastic. 94 BPM = never used. F minor key (×? check). Mathematical-beauty / emergent-form emotion. Tonal framing preserved to avoid v130 duration collapse. 943 chars."
