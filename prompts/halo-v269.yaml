  every hour a question I do not understand
  you became the answer, simple as the dawn
  said my name like water, said my name and gone

  [Hook]
  halo, halo, falling slow
  halo, halo, oh oh oh

  [Bridge]
  (sparse Rhodes solo, no drums)
  [Whispered] do not let me go
  do not let me go

  [Final Hook] (full break returns)
  halo (halo), falling slow
  halo (halo), soft and low
  halo (halo), oh oh oh

  [Outro]
  (filter close, vinyl click)
