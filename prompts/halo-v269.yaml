style: "Liquid drum and bass, 2026 understated wave, 174 BPM, E minor, atmospheric immersive. Ethereal high-airy female solo vocal — breathy mid-high soprano with long reverb tail, UNDERSTATED not anthemic, restrained close-mic phrasing that complements the breakbeat instead of overpowering it, melancholic melodic lines, no chorus belt, no arena power, no doubled stack, NOT husky contralto, NOT kawaii pitched-up, NOT female group harmony, NOT shouty MC, NOT autotuned sing-rap. Production palette: clean Amen breakbeat with crisp open hat splash, deep rolling reese-style sub-bass, lush Rhodes-like atmospheric pad layers, sparse piano chord stabs, light filter sweeps, wide reverb tail on the vocal, glittery delay throws between phrases. 2026 liquid wave — soulful and immersive, NOT 2025 anthem-toplines, NOT jump-up neuro mosh. Late-night rolling — Hospital / SHOGUN lineage, soft sunrise floor. No big-room EDM drop, no jungle ragga MC, no orchestral, no broadway."

