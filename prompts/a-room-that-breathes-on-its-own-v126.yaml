notes: "v126 — ORCHESTRAL MICROPOLYPHONY HORROR. First move beyond classical architectural forms (15 classical forms now complete) into 20th century avant-garde technique. Micropolyphony = dense stack of independent voices sliding through narrow intervals, creating a nearly static but slowly evolving cloud of sound with no audible melody. The technique creates 'otherworldly atmospheres' — used in horror film scoring (The Shining) and sci-fi (2001: A Space Odyssey). RESEARCH: Wikipedia + Britannica + Second Inversion confirm micropolyphony as the technique's name. 'Individual instruments slide along a narrow range' producing 'dense and rich stack of pitches' with individual voices 'hidden in a complex web of sound.' Now called 'sonorism' as a movement. Contemporary horror film scoring continues to use this technique. INSTRUMENTS: Clavichord (v113, 12-version gap) = extremely quiet keyboard, close intimate sound like thinking-inside-the-skull. Viola da gamba (v113, 12-version gap) = Renaissance 6-string bowed instrument, frets, haunting ghostly quality. Mellotron (v116, 9-version gap) = 1960s tape-playback keyboard with detuned, decaying quality. Three instruments from three eras (Renaissance / Renaissance / 1960s) fused into contemporary horror. NOVELTY: First micropolyphony. First horror genre. 68 BPM = never used. Ab minor (×1) = near-virgin key. New emotional territory: terror/dread (distinct from recent obsessive/meditative/noir/nostalgic). 972 chars."
