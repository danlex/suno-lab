name: "a-room-that-breathes-on-its-own"
version: 126
style: "ORCHESTRAL MICROPOLYPHONY HORROR film score for a haunted-room scene, total duration 1:00 to 2:00, with CLAVICHORD + VIOLA DA GAMBA + MELLOTRON, many independent voices forming a shifting cloud of sound with no clear melody, A-flat minor to A minor, 68 BPM, instrumental. From 0:00 clavichord enters alone — quiet intimate keyboard clicking in close darkness, each note heard from inside the skull. At 0:18 viola da gamba rises beneath, ghostly Renaissance bowed strings sliding, never resolving. At 0:40 mellotron adds warped tape strings, decaying, three haunted layers breathing together. At 1:00 full orchestra joins — dense string clusters, woodwinds sliding through narrow intervals, no single melody discernible. Silence at 1:25 — the breathing stops. At 1:28 music returns in A minor half-step up, all three voices fortississimo over orchestra. Ends at 1:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "A Room That Breathes On Its Own"
lyrics: |
  [Short Instrumental Intro]
  [Close Darkness]
  [Ghost Enters]
  [Warped Layers]
  [Micropolyphonic Cloud]
  [Silence]
  [Bloom of Dread]
  [End]
