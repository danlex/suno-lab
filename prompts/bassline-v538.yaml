notes: |
  UK bassline (also called bassline house or Sheffield bassline) is a dense, fast-paced UK underground genre sitting between UK garage and house — typically 135–145 BPM, built on a characteristically squelching mid-range organ-bass riff that wobbles and gurgles over a sub-bass floor, four-to-the-floor kick with a skippy syncopated snare drawn from 2-step garage's DNA. The topline vocal tradition is male and charismatic — colloquial, not belted, riding the rhythm with playful swagger rather than soul power.

  Concept source: a silver-tongued Friday-night chancer who talks his way past every bouncer in the city — pure charm-swagger, the night bending to him. The ownable hook "bought the bouncer breakfast" places four sixteenth-note alliterative B-consonants on F-F-Ab-Bb (bought-the-BOUN-cer), then 'BREAK-fast' as a dotted-eighth + sixteenth landing on the AND of beat 3 — a skip-syncopation fingerprint that mirrors the genre's skippy garage edge. Three B-consonants reinforce the rhythmic snap.

  This echoes Sheffield and Leeds bassline producers who codified the genre's organ-bass squelch and MC-swagger topline tradition in the mid-2000s — without naming any of those practitioners.

  Duration strategy: parametrized colon-syntax sections with bar counts (8+16+8+12+8+32+12+16+8 = 120 bars at 140 BPM, targeting ~3:30). The 32-bar [Dense Groove] mid-song instrumental is explicitly dense — organ-bass squelch and four-to-the-floor driving the floor — not ambient or sparse, per the v527 lesson that sparse vamps truncate hard. Final hook pushed to ~80% of the arc. Production tokens used: polished studio mix, deep low-end definition, wide stereo stage. Style 935 chars, sentence case, atmospheric-first opening.

  Negative-prompt audit: does NOT exclude synthesizers, electronic, vocals, or bass. The organ-bass and sub-bass are the core synth instruments of the genre; excluding them would destroy the sound. Excludes genre drift only (grime, drill, trap, dubstep, rock, orchestral, ambient, country, trance).

  Instruments: wobbling organ-bass (genre-defining squelch, mid-range rhythmic anchor), gurgling snapping sub-bass (low-end floor, round downbeat attack), four-to-the-floor kick with skippy garage-edge snare and rolling hi-hat (rhythmic chassis). Dense continuous groove — no spectral instruments.

  Novelty: UK bassline house is unused in the catalog (distinct lane from UK garage v537). BPM 140 is unused. F minor unused in recent catalog. Friday-night bouncer charm-swagger scene is unused.

