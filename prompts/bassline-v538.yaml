style: "Silver-tongued Friday-night charm pours through a gurgling wobbling organ-bass — UK bassline house, 140 BPM, F minor, dense and relentlessly danceable. Polished studio mix, deep low-end definition, wide stereo stage. Four-to-the-floor kick anchors the main pulse while a skippy garage-edge snare lifts on the syncopated 16th; the organ-bass wobbles in a mid-range squelch, sub-bass gurgling beneath with a round snapping attack on every downbeat. A cocky male topline rides the bounce with playful swagger — conversational, charismatic, never belted — the hook phrase landing on a syncopated skip that mirrors the genre's skippy fingerprint. Bright staccato organ stabs punctuate the upper register; rolling hi-hat patterns drill the 16th grid with garage urgency; a mid-song beat-driven groove section keeps the floor locked tight without letting up. No guitars, no rock drums, no pipe organ, no acoustic instruments, no ambient pads."

