style: "ORCHESTRAL GLITCH film score for a memory-corrupting scene, total duration 1:40 to 1:55 (ends at 1:55, never longer), with KORA + SUBCONTRABASS SAXOPHONE + CELESTA, digital artifacts fracturing organic beauty, B-flat minor to B minor, 95 BPM, instrumental. From 0:00 kora enters alone — West African 21-string harp cascading shimmering arpeggios through digital stutter. At 0:20 celesta joins, crystalline bell fragments sparkling above the kora with granular processing. At 0:40 subcontrabass saxophone enters beneath, the deepest woodwind rumbling like a digitally fractured earthquake. At 1:00 full orchestra swells while glitch processing stutters all three voices into broken beauty. Silence at 1:20 — three beats of corrupted void. At 1:23 music returns in B minor half-step up, kora cascading, saxophone rumbling, celesta sparkling, all through glitch haze fortississimo. Ends at 1:55. No guitars, no vocals, no rock drums, no pipe organ."
title: "What Happens When the Music Breaks"
