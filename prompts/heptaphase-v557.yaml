style: "Seven pianos in a seven-sided mirrored planetarium, spread hard-left to hard-right. Deep concert grand: far left, sub-bass reinforced, heavy staccato low ostinato in four — gravitational anchor. Upright piano: left, percussive woody syncopation in three. Felt piano: left-centre, soft damped triplets. Prepared piano: centre, metallic buzzing cell in five, industrial bite. Tack piano: right-centre, detuned barrelhouse jangle in six. Toy piano: right, tiny crystalline high plink in seven. Bright concert grand: far right, rapid glittering cascade. Seven tonal centers spread across the octave, polytonal, never settling. All seven orbits drift toward a total eclipse, nearly slamming onto one shared thunderous downbeat at peak density, then shatter apart. 140 BPM. Close-mic'd percussive transients, heavy sub-bass on the deep grand, punchy polished studio mix, wide stereo stage. No guitars, no vocals, no drum kit, no synths, no strings."

lyrics: |
  [Seven Enter: all seven cells stacking, seven keys at once, immediate density, 16 bars]

  [First Drift: orbits circling, polytonal shimmer intensifying, sub-bass thickening, 28 bars]

  [Near-Eclipse: orbits tighten toward alignment, collision imminent, scatter apart — the fake-out, 12 bars]

  [Shatter Apart: full re-divergence, each piano back to its own key and rhythm, 20 bars]

  [Rebuild: seven cells remount tension, cross-rhythms interlocking, metallic buzz and barrelhouse jangle pressing hard, 40 bars]

  [Suspended: lone deep grand note rings low, sub-bass cut, one held breath, 3 bars]

  [Total Eclipse: all seven pianos slam onto one shared thunderous downbeat — sub-bass and toy piano top together, peak density — then shatter apart, 56 bars]

  [Seven Orbits: seven cells drift unsynced, unresolved, each in its own key, ending mid-motion, 28 bars]

  [End]

