notes: "v133 — ORCHESTRAL ISORHYTHM. Medieval technique (14th-century Ars Nova era) where rhythm pattern (talea) and pitch pattern (color) have different lengths so they overlap and realign over time. First tried from this era — all prior forms were Classical/Baroque/Renaissance or 20th-century. RESEARCH: Talea/color structure, Ars Nova period. Composer names (Machaut, de Vitry, Berg, Messiaen, Cage, Crumb) omitted per blocklist. Modern revival in 20th-century minimalism (phase-shifting). DURATION STRATEGY: After v130 atonal (all clips <1:00) and v132 microtonal (0:28/0:13), explicitly excluded 'microtonal, quarter-tone, atonal' in exclude_styles and used tonal framing (Bb minor → B minor) plus rhythmic/pulse-based language — v131 stochastic proved tonal+pulse can deliver 1:57. INSTRUMENTS: Glockenspiel (×2, last v117 — 16-gap) = crystalline mallet strikes, ideal for talea articulation. Handpan (×2, last v116 — 17-gap) = dome metal with natural pulse cycle, 9-pulse pattern. Contrabassoon (×2, last v119 — 14-gap) = deep woodwind holding long pitch cycle. Three cycles of different lengths (6, 4, 9) phasing. NOVELTY: First isorhythm. 74 BPM = never used. Bb minor key established. Clockwork / inevitability emotion. 915 chars."
