style: "ORCHESTRAL ISORHYTHM film score for a clockwork-tower-at-midnight scene, total duration 1:00 to 2:00, with GLOCKENSPIEL + HANDPAN + CONTRABASSOON, medieval structure where a rhythm cycle (talea) and pitch cycle (color) of different lengths overlap until they realign, B-flat minor to B minor, 74 BPM, instrumental. From 0:00 contrabassoon enters alone, six-note pitch cycle in long held tones. At 0:20 glockenspiel joins with a four-note rhythm cycle, crystalline strikes marking the talea. At 0:45 handpan rises, nine-pulse cycle on dome metal, three cycles phasing. At 1:10 full orchestra enters, strings doubling the color, brass doubling the talea, woodwinds in augmentation. Peak 1:20 when all three cycles align. Silence at 1:25 — four seconds. At 1:30 music returns in B minor half-step up, fortississimo, all cycles locked. Ends at 1:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "The Cycles Realign at Midnight"
lyrics: |
  [Short Instrumental Intro]
  [Six-Note Pitch Cycle]
  [Four-Note Talea]
  [Nine-Pulse Handpan]
  [Orchestra Locks]
  [Silence]
  [Return Half-Step Up]
  [End]
