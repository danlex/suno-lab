style: "ORCHESTRAL CACCIA film score for a hunters-crossing-winter-meadow scene, total duration around 3:00, with BOWED VIBRAPHONE + TENOR SAXOPHONE + MELLOTRON, 14th-century Trecento canon of two voices chasing over a long-note tenor, G-sharp minor to A minor, 107 BPM, instrumental. From 0:00 mellotron breathes a low tenor drone, tape-flute warmth under frost-lit air. At 0:25 bowed vibraphone enters with the canonic subject, shimmering bars ringing the chase into open space. At 1:00 tenor saxophone answers one beat behind, warm reed against cold metal, canon locking into pursuit. At 2:00 strings tremolando and low horns press the orchestra beneath, woodwinds doubling the voices as the hunt thickens. Silence at 2:10, six seconds held as the quarry vanishes. At 2:15 the canon returns in A minor fortississimo, half-step up, stretto compressed, mellotron sustained. Ends at 2:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
