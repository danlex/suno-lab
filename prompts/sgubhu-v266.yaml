style: "Amapiano, South African house, log drum dance, 115 BPM, C minor, township groove. Male spoken-sung amapiano vocal — relaxed low-mid conversational delivery, casual chest-voice in mixed Zulu / Xhosa / English (kasi-English), NOT shouty, NOT heavily autotuned, NOT whispered, NOT belted. Signature log drum bouncing in the gaps between four-on-the-floor kicks, syncopated against the kick. Soft warm pads, sax-pad chord stabs, constant rolling shaker pushing the groove, vinyl rim-click percussion, deep sub-bass under the log drum. Joburg township aesthetic — Yanos piano session at golden hour, friends-on-the-stoep energy, NOT polished radio Afropop. Loose dance-club bounce, breathing space, no busy fills. No EDM drops, no soaring belt, no husky contralto, no pitched-up kawaii, no raspy Latina sing-rap, no shouty MC, no whispered drift-phonk, no orchestral, no broadway."

lyrics: |
  [Intro]
  (log drum tease)
  [Spoken] yebo, yebo
  asambe

  [Verse 1]
  ngiyazi, ngiyazi the weekend is here
  amapiano playing, asikhethi nothing to fear
  put the bottle on the stoep, friends are coming through
  sun is going down, the sky is changing blue

  [Pre-Hook]
  oh oh oh oh (sgubhu)
  oh oh oh oh

  [Hook]
  sgubhu, sgubhu, beat dey calling me
  sgubhu, sgubhu, township melody
  sgubhu, sgubhu, asambe with me
  sgubhu, sgubhu, until we cannot see

  [Verse 2]
  no boss no clock, only piano in my chest
  every kick, every log drum, every shaker is a test
  Mzansi sun is setting and the night is just begun
  hold my hand sister, asambe, run

  [Hook]
  sgubhu, sgubhu, beat dey calling me
  sgubhu, sgubhu, township melody

  [Bridge]
  (log drum solo) [Spoken] yo yo, listen up
  the piano never stops, the piano never sleeps
  oh oh oh oh

  [Final Hook]
  sgubhu (sgubhu), beat dey calling me
  sgubhu (sgubhu), asambe with me

  [Outro]
  (log drum fade)
  yebo
  [End]

