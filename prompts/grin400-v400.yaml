style: "Swagger strutting into the room with a grin already on — guaracha meets funk-brass at 130 BPM in G major, bright and self-assured from bar one. Underscore for a woman claiming the room. Son clave two-three drives congas and timbales over a four-on-the-floor kick; the pocket locks tighter each verse, never builds and drops. Trumpet jabs and trombone glisses are the hook-carrying voice, not a synth lead — staccato call-and-response with a chesty conversational female vocal, mid register G3 to D5, cocky rather than belted. Hook: \"Teeth out, chérie\" — G3 root on \"Teeth,\" fifth up to D4 on \"out,\" stepwise E4–D4 landing on \"ché-rie\"; brass answers jabs D4–G4 then a trombone gliss D4 down to G3 — interplay is the fingerprint. Climax: additive brass-stack with double-time timbale descarga, groove unbroken. No guitars, no rock drums, no pipe organ, no synthesizer leads, no reggaeton."

