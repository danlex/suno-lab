notes: |
  Guaracha is a syncopated Cuban dance genre rooted in the son tradition, characterized by a driving four-on-the-floor kick underpinned by clave-derived conga and timbale patterns, call-and-response vocal structures, and melodic brass punctuation. It is the rhythmic ancestor of salsa's more celebratory, faster end — distinct from salsa romantica (which is slower and sentiment-driven), cumbia (which uses a different clave base and Caribbean coastal feel), and reggaeton (which uses the dembow). Funk-brass as a production layer grafts the American horn-section tradition — staccato trumpet jabs and trombone glisses as rhythmic melodic hooks rather than textural pads — directly onto the guaracha chassis. This family is a catalog debut: no prior version has combined these two traditions.

  Concept source: swagger and reckless joy — "cocky, self-assured, struts into the room, having a blast and knowing it, a little cheeky." Verses are concrete first-person physical swagger detail (chin up, coat on the chair, moving slow on purpose). The "chérie" in the hook is directed inward — mirror-talk before walking into the room, giving the speaker an interior life rather than a hype-shout at a crowd. The French word is permitted under the English/French-only language rule and gives the hook a wry, private-joke tone.

  The hook "Teeth out, chérie" is pre-scored at 21/25 as a call-and-response. Pitch contour: G3 on "Teeth" (root, grounded, chest register) — sharp perfect-fifth leap to D4 on "out" (the rhythmic pop, syncopated on the "and" of beat 2, snapping to beat 3) — relaxed stepwise E4–D4 landing across "ché-rie" (off-beat 3 into 4, a cheeky exhale). Brass response: two staccato trumpet jabs D4–G4 (ascending fourth, eighth-note pair on the off-beats) then a trombone gliss D4 down to G3 (descending fifth, smearing to beat 1). Her fifth up, brass fifth down — complementary intervals in opposite directions, the interplay is the fingerprint. This is a true call-and-response, not a hook restated in unison.

  Formula break confirmed on all four axes: (1) TONALITY — G major throughout, deliberately ending a run of five consecutive dark-minor tracks (v393 Ab minor, v395 F# minor, v396 B minor, v397 A minor, v398 Ab minor); (2) VOCAL — chesty conversational non-belt mid-register (G3–D5), not euphoric soaring; (3) STRUCTURE — constant-groove verse-chorus with groove sharpening on each return, NO build-strip-drop arc; (4) TIMBRE — real trumpet and trombone as the signature hook-carrying instruments inside the electronic bed, not a synth lead.

  Climax device: mambo shout-chorus with additive brass-stack and double-time timbale descarga. At the Shout Chorus section the brass builds polyphonically: trumpet line enters first, then trombone counter-line stacks above it, then a third harmony voice joins — interlocking lines creating additive polyphony. Simultaneously the timbales and congas shift to double-time descarga (twice the rhythmic density), accelerating the groove without dropping it. The vocal hook is sung in stacked harmony on top of this full brass-percussion mass. The groove never stops; there is no silence, no key change (G major throughout), no half-step modulation. This is explicitly not: texture-inversion (v390), false-ending, half-step modulation, call-and-response-as-climax, pitch-brake/tape-stop (v395), double-breakdown (v396), bass-filter-sunrise, kick-withdrawal-return (v398), octave-lift. No [Silence] metatag.

  Duration strategy for 130 BPM (proven safe band, ~73% bar-to-time efficiency). 10-section arc. The Montuno Vamp at 32 bars is an explicit lyric-free percussion-and-brass block between the second chorus and the shout-chorus climax — per v348/v349/v395 catalog data, this is the single most reliable duration extender. The Shout Chorus runs 48 bars (additive layering requires time to land all three brass entries plus the double-time acceleration). Final sung line in the Final Hook pushed to approximately 2:45+. Target wall-clock 3:00–3:30.

  Concept is forward-motion (strutting in, self-assertion, reckless joy — active, physical, present-tense swagger rather than reflection). Per the playbook, forward-motion concepts with constant groove and 130+ BPM auto-classify as danceable Latin or funk and render longer than reflective concepts. Exclude-styles block primary drift: salsa romantica, reggaeton, cumbia, Latin trap, mariachi (instrument confusion), Spanish-language vocals (language rule), cinematic ambient (compression auto-tag), sad ballad, belted anthem, euphoric EDM (all formula-repeat archetypes we are escaping).

  Style follows the playbook: atmospheric-first opening (feeling of swagger before genre label), three production tokens (polished studio mix, deep low-end definition, wide stereo stage), sentence case throughout, five inline negatives at the close. Style char count: 892. Blocklist scan: clean. No artist names anywhere (no salsa performers named). Title is exactly one fused token: Grin400.

