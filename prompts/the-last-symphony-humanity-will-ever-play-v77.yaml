style: "APOCALYPTIC orchestral hardcore hybrid, F# minor, 210 BPM, purely instrumental. Angerfist meets Hans Zimmer producing the soundtrack to the end of civilization. Distorted hardcore kick drum at maximum distortion hammers at 210 BPM — the kick IS the bass, crushing everything in its path. Over this sonic assault, a FULL SYMPHONY ORCHESTRA performs like it is trying to survive the beat — strings in impossible thirty-second note tremolos, brass blasting heroic anthems that cut through the distortion, timpani doubling every kick. Screaming lead synths in the high register play operatic melodies while detuned acid bass lines growl underneath. Pipe organ adds cathedral weight. The orchestra never stops fighting the kick, and the kick never lets up. Multiple BRAAAM hits between kick clusters. At the climax everything detonates — 210 BPM orchestral chaos at maximum intensity. The sound of the last symphony humanity will ever play. Modern hardcore production. No vocals, no guitars."
title: "The Last Symphony Humanity Will Ever Play"
