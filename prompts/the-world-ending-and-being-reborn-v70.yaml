style: "MONUMENTAL cinematic orchestral, G minor, 100 BPM, purely instrumental. Zimmer-scale. Dune-scale. Music that physically punches you in the chest. Opens with a devastating BRAAAM — massive brass cluster and timpani hit together so loud the room shakes, then immediate silence. Out of that silence, a low cello drone hums with menacing power. Pipe organ enters from underneath like tectonic plates shifting. String tremolos erupt — 40 violins in shivering unison, building tension so unbearable your pulse syncs to the music. Another BRAAAM. Brass plays a theme so heavy and slow it feels like gods arguing. Orchestra crashes in overlapping waves, each bigger than the last, timpani rolling like thunder that will not stop. Full symphonic detonation at the climax — every instrument screaming the same chord. This is not background music. This is the sound of the world ending and being reborn. No electronic sounds, no synthesizers, no guitars, no vocals."
title: "The World Ending and Being Reborn"
