notes: |
  RITORNELLO FORM is a Baroque structural principle in which a full-ensemble refrain
  (the ritornello) alternates with contrasting solo episodes; the refrain recurs in
  different keys across the piece and its final return in the home tonic functions as
  the structural climax — no silence beat or half-step modulation required, because
  the homecoming itself supplies the resolution. This form was widespread in the
  early eighteenth century, shaping concerti, arias, and overtures across European
  courts and churches. Research for this version focused on the contrast dynamic
  between a dense tutti refrain and exposed solo voices pushing harmonically outward
  through successive episodes, then collapsing back to the home key with relief.
  Composer names are intentionally omitted per project blocklist.

  ROLE ASSIGNMENT: the orchestra (strings + low brass) carries the tutti ritornello
  refrain — ceremonial, locked, march-like. The featured trio are the SOLO EPISODE
  voices exclusively. CONTRABASS CLARINET (last v210, gap ×17) — sub-bass organic
  breath, leads Episode 1, drives the harmonic search toward the dominant. ONDES
  MARTENOT (last v211, gap ×16) — electromagnetic shimmer and swooping melodic line,
  leads Episode 2, drifts into the relative major. MUSIC BOX (last v209, gap ×18) —
  brittle clockwork intimacy, joins Episode 3 beside the other two, counting the last
  minutes before dawn. All three get exposed moments across the three episodes.

  KEY DECISION: staying in D-flat minor for the entire arc. D minor is heavily used in
  the catalog; D-flat minor is rarer and its flat-side tonality fits the lamplight scene
  — a slightly muffled, domestic darkness. The ritornello homecoming to D-flat minor at
  2:20 is the climax. No modulation trick needed.

  DURATION STRATEGY: tonal anchor (D-flat minor, orchestral strings + low brass) plus
  pulse anchor (143 BPM march, unhurried but forward-moving) framed in the 3-min arc
  per v137+ override. BPM 143 is unused in the recent catalog (137/139/141/142/146
  taken).

  NOVELTY: first RITORNELLO FORM technique in the catalog. Trio represents three deep
  revivals — contrabass clarinet (17-gap), ondes martenot (16-gap), music box (18-gap).
  143 BPM is new. D-flat minor is underused. Scene (archivist at last lamp before dawn)
  is new.

  STYLE CHAR COUNT: 938 (within 850–950 target).
