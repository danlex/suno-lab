  [Contrabass clarinet drone intro, 8 bars]

  [Soprano enters sparse strings, 16 bars]
  Ash on the stone floor
  Ember still glowing
  The dome holds the silence
  Before the walls fall

  [Rhythm section drops full choir added, 24 bars]
  Rise above the burning
  Rise above the ash
  Cathedral breathing fire
  Stone will not forget
  Rise above the burning
  Speak into the flame

  [Verse climbs tubular bells mark endings, 20 bars]
  Voice alone in the nave
  The choir fills behind
  Snow of ash falling
  Still I stand and I sing
  Above the ruin
  Above the light

  [Ondes martenot cello — intimacy trough, 12 bars]
  Alone here
  One voice in the heat
  One note held to the sky

  [Full return half-step lift F minor, 32 bars]
  Rise above the burning
  Rise above the ash
  Cathedral breathing fire
  Stone will not forget
  Rise above the burning
  Rise above the fall
  Snow of ash eternal
  Above the dark above the light
  Above the ash above the flame
  Rise

  [Tubular bells final ring, 8 bars]
  Above the ash

  [End]

