style: "Film score for a cathedral-fire scene — a soprano riding the surge as stone walls glow and ash falls like snow through the broken dome at dusk. Symphonic metal operatic ballad, polished studio mix, Hollywood scoring stage, wide stereo stage. E minor, lifting to F minor at 2:40, 98 BPM. Contrabass clarinet anchors a low-menace drone from 0:00; ondes martenot threads a spectral shimmer through the mix from 0:30; tubular bells ring at phrase endings and mark each arc summit. Full metal rhythm section and lush orchestral mass drive the surge from 1:15 beneath the classically-trained soprano, who rides above the storm with controlled legato power and high register command. Modulation at 2:40 lifts the final section a half-step to F minor with the soprano at full height. Warm tape saturation on the guitar-orchestra blend, deep low-end definition throughout. No growling, no screaming, no synthesizer pads, no autotune, no hip-hop production."

