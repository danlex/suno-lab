name: "fog-around-a-mountain"
version: 75
style: "Ambient orchestral electronic, A minor, 60 BPM, purely instrumental. Max Richter meets Brian Eno meets Hans Zimmer. The sound of time slowing down. Opens with a deep analog synth pad — warm, textural, breathing — stretched across the entire spectrum. A solo cello plays a simple four-note phrase, sustained and mournful, with delicate tape saturation giving it analog warmth. Subtle granular synth textures shimmer in the high frequencies like dust motes in sunlight. Strings gather slowly beneath the cello in swelling waves. A distant gated reverb piano plays isolated notes that hang in the air forever. The electronic elements never dominate — they weave around the orchestra like fog around a mountain. No beats, no kick, just slow ambient drift building to a meditative peak where strings, pads, and piano sustain one shimmering chord. Modern neoclassical ambient electronic, audiophile production, maximum weight in minimum movement. No vocals, no guitars."
title: "Fog Around a Mountain"
lyrics: ""
instrumental: true
exclude_styles: "vocals, singing, beats, drums, kick, bass drop, Arabic, tribal, world music, acoustic guitar, rock, pop"
notes: "v75 — AMBIENT ORCHESTRAL ELECTRONIC. The opposite of v70-74 fusion chaos. Max Richter + Brian Eno + Zimmer. 60 BPM (slowest in a while). NO beats, NO kick. Analog synth pads, granular textures, tape-saturated cello, gated reverb piano. 'Electronic elements weave around the orchestra like fog around a mountain.' Maximum emotional weight in minimum movement. A minor. 963 chars."
