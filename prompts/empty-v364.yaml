style: "Chrome and static at 2 a.m., a cold mirrored afterparty where glamour runs without warmth. Electroclash, early-2000s art-school detachment — 132 BPM, C major, four-on-the-floor kick zero reverb, gated snare dry on two and four, cheap digital arpeggios above a cold Minimoog-style bassline. Female vocal deadpan talk-sung, every syllable clipped to the grid — affect a machine reading its own output. Bowed vibraphone traces slow sustained tones between vocal lines, spectral and cold. Bass flute moves in low breathy phrases beneath the grid, air and mass combined. Wagner tuba holds long brass undertones, close and weighty, the sole gravity in the frame. Track stays stripped through a 24-bar mid-song vamp where only bass flute and wagner tuba sustain alone; at the climax every layer arrives simultaneously from near-nothing. Built for a cold chrome afterparty; dry reverb. No guitars, no rock drums, no pipe organ, no synthesizers, no strings."

title: "Empty"

