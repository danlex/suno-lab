notes: |
  Electroclash is an early-2000s hybrid genre fusing the analog austerity of early electro and
  new wave with the ironic, art-school affect of post-punk performance — four-on-the-floor kick
  with zero reverb, cheap digital arpeggios, cold Minimoog-style basslines, and a deadpan
  talk-sung female vocal that treats emotion as a diagnostic output rather than an expression.
  The genre was a deliberate reaction to the over-produced sincerity of late-1990s pop: surface
  over depth, circuit over heart, posture as content. Concept source: the cold mirrored
  afterparty as a chrome machine — android glamour at 2 a.m., "calibrated, empty" as the
  self-report of a person who has optimized every signal except the one that would prove they
  are present. This echoes mid-2000s European electro artists whose names are intentionally
  omitted from this draft per blocklist policy.

  Hook mechanics: "Calibrated, empty" — four even eighth notes on cal-i-brat-ed (no melodic
  accent, machine-gun cluster, beats 1-and-2-and), a hard half-beat rest, then a major-third
  descent C→A across "emp-ty" landing as two quarter notes on beats 3-4, with "ty" dead-spoken
  at the bottom. The contour reads as an android's self-diagnosis: clinical, flat, then
  descending to resignation. Repeated deadpan across three chorus passes; the third pass at
  2:45 arrives inside the texture-explosion climax where every layer (bowed vibraphone, bass
  flute, wagner tuba, kick, arpeggios) converges simultaneously from near-nothing — sudden mass
  without key change, not the half-step-lift cliché.

  Genre novelty: electroclash is a catalog debut across all 363 prior versions. No prior entry
  uses this genre tag or this vocal affect (flat-affect talk-sung over four-on-the-floor with
  art-school irony as the primary aesthetic posture).

  Duration strategy: BPM 132 sits firmly in the proven 130–160 duration band. Parametrized
  colon-syntax sections with timestamps and bar counts scaffold the render. The 24-bar Vamp at
  1:45 (~44s lyric-free) provides the explicit mid-song instrumental window that pushed v348
  and v349 past 3:00. Last vocal timestamp is 2:45–3:10 (Chorus 3 / Drop), Outro at 3:15 —
  targeting ~3:20–3:40 render. Production tokens used: wide stereo stage, polished studio mix,
  tight chamber reverb. Sentence case throughout; atmospheric-first opening (the scene within
  the first 90 chars). No ALL-CAPS form labels.

  Trio — 2 body voices + 1 spectral (playbook compliant, ≤1 spectral):

  - Bowed vibraphone (last used v341, gap = 23): the spectral pick. Bowing metal bars of a
    vibraphone produces a slow, ghostly sustain without attack transients — in an electroclash
    context it functions as cold spatial atmosphere, filling the sterile chrome room with a
    non-human shimmer. The one-spectral ceiling is not breached; this is the single allowed
    ethereal voice.

  - Bass flute (last used v336, gap = 28): body voice. The bass flute's breathy low-register
    tone (C3–C4 fundamental range) sits between the kick and the Minimoog bassline, adding
    human breath to a machine-cold texture. Its air-to-tone ratio is high — it sounds organic
    and slightly imperfect, the one vulnerable element in an otherwise synthetic frame.

  - Wagner tuba (last used v313, gap = 51): body voice. The wagner tuba is a hybrid brass
    instrument (conical bore, played on a French horn mouthpiece) with a darker, more covered
    tone than a French horn — less brilliant, more burdened. At long sustained tones it acts
    as low-register gravity: the weight under the chrome, the mass that makes the eventual
    texture-explosion physically inevitable.

  Novelty claims:
  - Genre: electroclash — catalog debut across all 363 prior versions.
  - Climax mechanism: texture-explosion (near-nothing → simultaneous all-layer convergence,
    no key change, no half-step lift) — distinct from the silence-before-climax and
    half-step-modulation templates flagged as overused in the judge rubric.
  - Hook "Calibrated, empty": Android self-diagnosis contour (machine-gun cluster → major-third
    descent → dead-spoken bottom), emotionally specific, ownable.
  - French lyric integration ("La façade — vide inside"): Euro-cool electroclash register,
    mixed EN/FR per language rule.
  - Bowed vibraphone + bass flute + wagner tuba trio: no prior combination in catalog.
  - Wagner tuba gap = 51 versions — highest gap in this trio.
  - BPM 132: previously used (v66, v146, v248, v268, v357) — not a new BPM.

  Style char count: 940 (verified in-range 700–950).
  Lyrics char count: 998 (verified under 1000-char Suno hard limit).

