notes: "v72 — ORCHESTRAL DNB. Building on v70 (house 200) and v71 (trance 138). 174 BPM — classic drum and bass tempo. Amen-break pattern. Reese bass. Full symphony orchestra racing at 174 BPM on top. Pendulum + Zimmer. 'Running faster than physics should allow.' F minor. Multiple drops. 974 chars."
