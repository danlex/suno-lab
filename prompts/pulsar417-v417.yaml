name: "pulsar417-v417"
version: 417
title: "Pulsar417"
instrumental: false
vocal_gender: male

style: "Dreamy psychedelic pop and synth-wave at 76 BPM in B minor, slow, hypnotic and haunted. Hypnotic analog synthesizers in heavy hall reverb, warm 1970s tape saturation, a lush spacey soundscape, round sub-bass, and crisp compressed drums with long reverb tails over a soft steady pulse — like a slow lighthouse sweep or a distant heartbeat that never misses a beat. An ethereal male falsetto floats at the front, tender but resolute, drenched in reverb and delay, singing a catchy hook with quiet defiance. The feeling: a collapsed dead star — a pulsar — still spinning, still sending its beam in perfect time long after everyone wrote its ending; persistence, defiance, haunted pride. Intimate close verses, choruses opening into a wide shimmering wash, a hushed falsetto bridge, then a final chorus of layered harmonies decaying into reverb. No rock guitars, no aggressive drop, no rap, no harsh autotune, no four-on-the-floor club beat. 76 BPM, B minor."

lyrics: |
  [Intro]
  Still spinning
  Still on time

  [Verse 1]
  They marked me gone
  On an old star chart
  Crossed me off the sky
  Called it the end
  But I fell into something
  Small and dense and sure
  A heart too heavy to hold
  Still beating, still pure

  [Pre-Chorus]
  Every fraction of a second
  I send it out again

  [Chorus]
  I'm a pulsar, I'm a pulsar
  Dead and keeping time
  You can bury the light
  But you can't bury the rhythm — it's mine
  I'm a pulsar, I'm a pulsar
  Spinning in the black
  You wrote me an ending
  And I answer back, I answer back

  [Verse 2]
  No one has to hear it
  For the beat to be true
  I don't turn for the mirror
  I don't turn for you
  A lighthouse over nothing
  On a shore with no name
  Still I sweep, still I flash
  Still exactly the same

  [Bridge]
  Faster than grief
  Steadier than fear
  The dead can still be
  The most alive thing here

  [Final Chorus]
  I'm a pulsar, I'm a pulsar
  Dead and keeping time
  You can bury the light
  But you can't bury the rhythm — it's mine

  [Outro]
  Still spinning
  Still on time

exclude_styles: "rock, heavy metal, aggressive EDM drop, big room, four-on-the-floor, rap, hip hop, drum and bass, hardstyle, techno, harsh autotune, country, folk, orchestral"

notes: |
  Loved-style series (v415+): dreamy psychedelic-pop / synth-wave (Blackhole/Afterglow world). Slow, ethereal male falsetto, heavy reverb, 1970s tape saturation, lush spacey, catchy-but-deep, spare cosmic lyrics. Drafted directly (no fast-viral pipeline / no danceability gate).

  Theme: PULSAR — a collapsed dead star still spinning and beaming in perfect time long after it was written off; persistence after "death." Emotion (deliberate mood-variance): DEFIANCE / haunted pride — resolute, hypnotic, a little proud and lonely — distinct from Afterglow (melancholy loss), Orbit (warm love), Nova (ecstatic awe). Subtle steady pulse (lighthouse/heartbeat) evokes the pulsar without becoming a club beat. Catchy hook "I'm a pulsar, I'm a pulsar / dead and keeping time... you can't bury the rhythm — it's mine."

  B minor (fresh vs Afterglow A / Orbit E / Nova Db), 76 BPM. Publish both clips public.

