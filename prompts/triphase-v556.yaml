name: "triphase-v556"
version: 556
title: "Triphase556"
instrumental: true

style: "Three grand pianos inside a mirrored elevator shaft at night, each locked in its lane: Piano 1 left-panned, heavy syncopated low ostinato in four — sub-reinforced, percussive bite, the gravitational anchor; Piano 2 centre, rolling triplet figure in three — midrange rhythmic engine, relentless; Piano 3 right-panned, rapid quintuplet sparkle in five — high-register glitter scattering above. Three tonal centers a third apart — D, F, A-flat — polytonal, kaleidoscopic, never settling. Wide stereo stage, close-mic'd transient attack, heavy sub-bass on Piano 1, punchy polished studio mix. At 140 BPM the three cells phase in and out: a First Approach pulls the orbits near-collision — fake-out, they tear apart. Re-divergence rebuilds tension. The Final Eclipse drives all three onto one thunderous shared downbeat at peak density and sub-bass, then tears apart into unresolved drift. No guitars, no vocals, no drum kit, no synths, no strings."

lyrics: |
  [Three Cells Enter: staggered entry, low four, mid three, high five — separate keys, dense immediately, 12 bars]

  [First Approach: orbits tighten, polytonal shimmer intensifies, sub-bass thickening, 20 bars]

  [Near-Eclipse: orbits almost lock — collision imminent — scatter apart, the fake-out, 8 bars]

  [Tear Apart: full re-divergence, each piano snaps back to its own key and rhythm, 16 bars]

  [Re-Diverge: three cells rebuild independence, tension remounting harder, 20 bars]

  [Build: cross-rhythms interlock, sub-bass swelling, all three tonal centers pressing toward collision, 28 bars]

  [Suspended: lone low piano note ringing, sub-bass cut, one held breath, 3 bars]

  [Final Eclipse: all three pianos slam onto one thunderous shared downbeat — peak sub-bass — then tear apart, 24 bars]

  [Still Orbiting: three cells drift unsynced, unresolved, ending mid-motion, 16 bars]

  [End]

