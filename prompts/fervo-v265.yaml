  The load-bearing phrase: "shouty assertive female MC delivery — percussive
  Portuguese flow, party-leader call-and-response, dry close-mic urgency,
  conversational shout-rap, NO melodic singing, NO autotune sweetening, NO
  sing-rap." Triple negative pins the register against drift back to v264's
  autotuned sing-rap. Style + exclude_styles both block all five prior voice
  characters explicitly.

  Lyrical authenticity: Portuguese funk carioca vocabulary throughout —
  "fervo" (party/heat), "desce até o chão" (canonical baile dance call),
  "joga joga joga" (shout-rap MC tag), "olha o tambor" (genre-canonical
  attention call), "tamborzão" named in the bridge. Concept: female narrator
  owns the dance floor — body autonomy, no permission needed, "o fervo é meu"
  (the party is mine). Sits in the empowered-female funk carioca tradition
  (Tati Quebra Barraco lineage) without naming any artist.

  BPM 150 + tamborzão rationale: this is the TikTok-viral end of the genre.
  Classic 130 BPM is the safer floor but the 150 BPM variant is where
  motovlog edits, dance-clip remixes, and meme-loop virality actually live in
  2026. The style field names "funk 150 BPM" explicitly to push Suno into
  the modern variant rather than the dated 2008-era classic.

  Production palette pinned: "Lo-fi DIY favela soundsystem aesthetic —
  distorted, peak-limited, mono-leaning low end, designed to hit on a
  sound-truck rig at street-block volume." This is the load-bearing
  aesthetic descriptor that keeps Suno in the underground favela zone
  rather than the polished Anitta/major-label radio zone. Mainstream pop
