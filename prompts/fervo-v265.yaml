style: "Funk carioca, baile funk, tamborzão, 150 BPM, G minor, Rio favela street party. Shouty assertive female MC delivery — percussive Portuguese flow, party-leader call-and-response, dry close-mic urgency, conversational shout-rap, NO melodic singing, NO autotune sweetening, NO sing-rap. Hard syncopated tamborzão drum kit: heavy surdo-like 808 kick on the down, snappy claps, layered tambor hits, tom fills, off-beat cowbell accents, classic baile siren stabs, gritty overdriven sub-bass. Chopped vocal tag samples and breath grunts as percussion. Lo-fi DIY favela soundsystem aesthetic — distorted, peak-limited, mono-leaning low end, designed to hit on a sound-truck rig at street-block volume. Bloco de carnaval energy at 2am, motovlog-clip ready, TikTok-edit ready. No mainstream pop polish, no raspy autotuned Latina sing-rap, no soaring melodic belt, no husky contralto, no pitched-up kawaii, no orchestral, no salsa, no reggaeton, no dembow."

lyrics: |
  [Intro]
  (siren ascending)
  [Spoken] olha o fervo, olha o fervo
  joga joga joga

  [Drop]
  desce, desce, desce até o chão
  joga, joga, joga sem parar
  desce, desce, desce até o chão
  o fervo é meu, o fervo é meu

  [Verse 1]
  três da manhã, o som não para
  o baile começou, ninguém vai pra casa
  bota a mão pro alto, mostra que tu sabe
  bota o pé no chão, dança que dança

  [Hook]
  o fervo é meu (é meu, é meu)
  ninguém vai me parar
  o fervo é meu (é meu, é meu)
  ninguém vai me parar

  [Drop]
  desce, desce até o chão
  joga, joga sem parar

  [Verse 2]
  meu corpo é meu, meu passo é meu
  quem mandou sentar fui eu, sou eu
  não vim pra agradar, vim pra dominar
  o baile é meu palco, meu lugar

  [Hook]
  o fervo é meu (é meu, é meu)
  ninguém vai me parar

  [Bridge]
  (siren) tamborzão!
  [Spoken] olha o tambor
  joga joga joga

  [Final Drop]
  desce até o chão (desce!)
  joga sem parar (joga!)
  o fervo é meu, o fervo é meu

  [Outro]
  (siren descending)
  [End]

