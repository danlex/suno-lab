style: "ORCHESTRAL THEME AND VARIATIONS film score for a witness-testimony scene, total duration 1:00 to 2:00, with THEREMIN + TUBULAR BELLS + CONTRABASSOON, three voices telling one melody through different timbres, F-sharp minor to G minor, 62 BPM, instrumental. From 0:00 theremin enters alone — hovering melody stated without touch, eerie and floating in mid-air. At 0:20 tubular bells take the theme, ceremonial chimes transforming each note from ghostly to sacred. At 0:45 contrabassoon descends with the same melody, lowest woodwind rumbling the theme into dark earth. At 1:10 all three layer the theme together while chamber strings weave between them. Silence at 1:20 — three beats of void. At 1:23 music returns in G minor half-step up, theremin soaring, bells ringing, contrabassoon thundering, full orchestra fortississimo. Ends at 1:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "The Same Story Told Three Ways"
lyrics: |
  [Short Instrumental Intro]
  [Theme]
