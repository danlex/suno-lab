exclude_styles: "Arabic, tribal, world music, rock, metal, lo-fi hip hop, EDM, electronic, pipe organ, drum machine, trap, trap hi-hats, 808, synthesizer bass, autotune, new age, zen meditation, free jazz, atonal, microtonal, quarter-tone, turntablism, mumble rap, grime"
notes: |
  Jazz-rap meets neo-soul is the structural conceit: the song alternates between a fully SUNG chorus (with precise melodic contour — two equal notes on "Borrowed," a minor-third step up to a held blue note on "light" over a maj9 chord, stepwise descent on "but it's mine," muted trumpet answering in the gap) and a genuinely RAPPED verse in a smooth conscious baritone cadence. This sung/rap structural split — not a single-mode track — is the form novelty for cycle v473. The concept source: introspective self-worth, roots, and path, delivered in the jazz-rap × neo-soul register that borrows from late-90s conscious rap and early-00s neo-soul live-band traditions without naming any composer or performer.

  Duration strategy: 88 BPM at E-flat major puts us in the slow-BPM ceiling band (~3:30 max), so the playbook move is an explicit lyric-free [Jazz Piano Solo] vamp (~32 bars, ~25-30 seconds at 88 BPM) as the primary duration lever, plus a final lyric line deep in the arrangement. No key modulation — the climax is density and register (muted trumpet doubles the hook melody in the final chorus, cor anglais sustains a countermelody above). Production tokens: polished studio mix, deep low-end definition, wide stereo stage. Sentence case throughout. Atmospheric-first opening.

  Instrument roles and novelty: Walking upright bass (gap ~116 cycles) is the rhythmic and harmonic anchor, providing the groove that makes the rapped verses breathe. Wurlitzer electric piano (gap ~116 cycles) comps warm maj9 voicings throughout — it is the harmonic soul of the track and emphatically NOT a synthesizer. Cor anglais (gap ~116 cycles) is the signature fresh color — warm, reedy, slightly nasal, sitting in the upper-mid register where it can float as a countermelody above the baritone without fighting the voice. Muted trumpet stabs punctuate band hits and return in the final chorus to double the hook melody, lifting the register without a key change. Brushed snare keeps time loose and acoustic.

  Novelty claims: jazz-rap × neo-soul live-band form is unused in the catalog; sung/rap structural split is a new architecture; cor anglais as soul-band signature color has not appeared in this role; male baritone rebalances a recent female/electronic run; 88 BPM at E-flat major is unused. Style char count: 879.
