name: "Borrowed473"
version: 473
style: "Warm late-night live band — walking upright bass and brushed snare breathing between every line. Jazz-rap meets neo-soul in E-flat major at 88 BPM, a male baritone singing the hook with full-throated soul then rapping verses in a smooth conscious cadence over a spare groove. Wurlitzer electric piano comps in a maj9 pocket, cor anglais adds a warm reedy countermelody that surprises and settles, muted trumpet stabs punctuate the band hits. Polished studio mix with deep low-end definition and wide stereo stage. Total duration around 3:00. The sung hook carries a blue-note lean on \"light,\" descends softly on \"but it's mine,\" and the muted trumpet bends up in the gap after. Final chorus returns fuller with trumpet doubling the hook melody — density and register as the climax, no key change needed. No drum machine, no 808, no synthesizer bass, no autotune, no trap hi-hats."
title: "Borrowed473"
lyrics: |
  [Sung Intro Hook: baritone solo with Wurlitzer, 8 bars]
  Borrowed light, but it's mine
  Something real in this borrowed life — still mine

  [Rapped Verse 1: walking upright bass, brushed snare, piano comp, 16 bars]
  Started with nothing but the sound of my own breathing
  Somewhere between the leaving and the reason for believing
  People hand you mirrors, say "here, look at what you're worth"
  I gave those mirrors back — been digging since the dirt
  Read the room wrong, read the room right
  Either way the lesson leaves a mark by morning light
  Roots run deep where nobody came to plant them
  Grew from what was borrowed — never asked permission, never thanked them

  [Sung Chorus: full live band, cor anglais countermelody, 8 bars]
  Borrowed light, but it's mine
  Every crack let something through the line
  Borrowed light, but it's mine
  And I'm standing where I chose to stand this time

  [Rapped Verse 2: sparse groove, Wurlitzer comping, 16 bars]
  I've been counting all the voices that were never meant for me
  The noise of other people's certainties
  You can wear a borrowed confidence like it's a second skin
  Or you can learn to trust the quiet place you carry deep within
  No one hands you your arrival — you just notice you've arrived
  Look around and see the evidence of everything you've survived
  Worth is not a number that somebody else decides
  Walk your own meridian — the compass always guides

  [Sung Chorus: full band, muted trumpet stabs, 8 bars]
  Borrowed light, but it's mine
  Every crack let something through the line
  Borrowed light, but it's mine
  And I'm standing where I chose to stand this time

  [Jazz Piano Solo: Wurlitzer and cor anglais, walking upright bass, 32 bars]

  [Final Sung Chorus: fuller, muted trumpet doubles hook melody, baritone higher, 8 bars]
  Borrowed light, but it's mine
  Every crack let something through the line
  Borrowed light, but it's mine
  And I carry it — I carry it — it's mine

  [Outro: cor anglais fades, single low upright bass note, 4 bars]
  (it's mine)

  [End]
instrumental: false
