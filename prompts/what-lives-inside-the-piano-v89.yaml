notes: "v89 — PREPARED/MODIFIED STANDARD INSTRUMENTS. Ninth axis of experimentation. RESEARCH: Wikipedia prepared piano, Smithsonian on Cage, MasterClass 2026 guide, Cage Sonatas and Interludes performer's guide. LEARNED: (1) John Cage pioneered prepared piano in 1940 — bolts, screws, rubber, felt placed on/between strings transform the piano into an entirely new instrument. (2) Henry Cowell before Cage did 'string piano' — reaching inside to pluck/sweep/scrape strings directly. (3) Key timbral insight: upper register preparations create 'darkened, ethereal timbre' while lower register becomes 'strikingly percussive.' (4) Sonatas and Interludes (1948) is the masterwork: 20 pieces exploring the prepared piano's full range. IMPROVED: the innovation axis is PHYSICAL MODIFICATION of standard instruments — not unusual instruments (v85-86), not unusual techniques (v87), not unusual tuning (v88), but physically altering the instruments themselves. Combined three: prepared piano (objects in strings), bowed crotales (percussion played with a string bow), contrabass harmonics (string played at harmonic nodes). All three are standard orchestral instruments used in ways their builders never intended — 'the hidden voice inside every instrument.' F-sharp minor 44 BPM meditative. Sources: Wikipedia, Smithsonian 2019, MasterClass 2026, Seattle Piano Teacher performer's guide. 964 chars."
