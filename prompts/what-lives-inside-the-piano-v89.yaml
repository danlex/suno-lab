name: "what-lives-inside-the-piano"
version: 89
style: "PREPARED PIANO + BOWED CROTALES + CONTRABASS HARMONICS orchestral, ethereal and percussive, meditative, F-sharp minor, 44 BPM, purely instrumental. Three standard instruments played non-standard ways: a prepared piano with bolts and rubber between strings (Cage technique — upper register darkened and ethereal, lower register percussive), bowed crotales (small bronze discs bowed with a cello bow for crystalline sustained tones), contrabass natural harmonics (lightest touch producing glass-like overtones two octaves above). Opens with the prepared piano alone — a single note in the high register sounding like a bell buried in felt. Bowed crotales enter with a shimmering sustained tone. Contrabass harmonics float above in ghostly octaves. String orchestra enters in long sustained bows beneath. The three hidden voices sing together — a texture no standard performance produces. Modern cinematic audiophile production. No vocals, no electronics, no guitars."
title: "What Lives Inside the Piano"
