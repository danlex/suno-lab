notes: |
  UK 2-step garage is a late-1990s London genre defined by its shuffled 4/4 kick pattern — the kick displaces to just before beat three rather than landing on it, creating the lurching forward motion that distinguishes 2-step from straight house. The groove is built around a warm sub-bass root hold, off-beat soul-vocal chops, and a skippy snare placement, with melodic content delivered through pitched vocal samples and singer hooks rather than instrumental leads.

  Concept source: two people texting across a sleeping city at 4am, each typing and deleting "come over" — the hesitation turning to yes. The ownable hook "Say the street name" uses three repeated tonic notes (G4) with a descending minor third on 'name' (G4→Eb4); the female echo enters a beat-and-a-half later transposed up a minor third (Bb4→G4), creating an unresolved G-minor sixth between the two voices that mirrors the song's sexual tension.

  This echoes the garage producers who built the genre's 2-step grammar and its tradition of pairing male MC calls with female vocal hook answers — without naming any of those practitioners.

  Duration strategy: parametrized colon-syntax sections with bar counts (8+16+8+12+8+32+12+16+8 = 120 bars at 134 BPM targets ~3:30). The 32-bar [Beat Drop] mid-song instrumental is explicitly dense and beat-driven — not ambient, not stripped — per the v527 lesson that sparse mid-song vamps truncate hard. Final hook pushed late in the arc. Production tokens used: polished studio mix, deep low-end definition, wide stereo stage. Style 948 chars, sentence case throughout, atmospheric-first opening.

  Duet architecture: [Male] tags open each call phrase, [Female] tags answer a beat-and-a-half late; [Both] tags appear at convergence moments (Hook 2 resolution, Final Hook climax). vocal_gender is set to male so Suno's toggle honors the opening voice; [Female] tags in the lyrics instruct the call-and-response swap.

  Negative-prompt audit: does NOT exclude synthesizers, electronic, vocals, or bass (this is a vocal electronic groove track). Excludes genre drift only (grime, drill, trap, rock, metal, orchestral, ambient, country).

  Instruments: warm sub-bass (groove anchor, round low-end), chopped soul-vocal stabs (off-beat rhythmic/melodic fill), shuffled 2-step garage drums (skip-kick 2-step pattern, genre signature). All three are body voices — no spectral instruments in this trio.

  Novelty: UK 2-step garage duet call-and-response is unused in the catalog. BPM 134 in the proven duration band. G minor. Scene (4am pre-dawn city texting hesitation) is unused.

