style: "Two voices texting across a sleeping city at 4am, a shuffled 2-step groove pulling them closer before sunrise — UK garage, warm and soulful, romantic tension in every syncopated beat. Polished studio mix, deep low-end definition, wide stereo stage. G minor, 134 BPM. Warm sub-bass locks the root on every bar with round resonant weight; chopped soul-vocal stabs punctuate the off-beats, each chop a word not yet said; shuffled 2-step garage drums swing with the characteristic skip, snare lifting on the mid-beat 16th, kick landing just before beat three. The male voice opens each call — pentatonic, unhurried, hook syllable on the syncopated 16th before beat three; female voice answers a beat-and-a-half late, transposed up a minor third, her reply turning the call unresolved, a sixth between the voices hanging in the air. Dense continuous groove throughout, no strip. No guitars, no rock drums, no pipe organ, no heavy metal, no ambient fade."

