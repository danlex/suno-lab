lyrics: |
  [Intro]
  (piano sample loop, 808 slide) eh, eh
  ouais, ouais

  [Verse 1] (chesty deadpan banlieue)
  quatre heures, la cité dort pas
  les vieux dorment, les jeunes traînent
  j'ai grandi entre les tours, béton est ma mère
  les rêves trop loin, quartier trop proche

  [Pre-Hook]
  eh-eh, la cité
  ouais-ouais, la cité

  [Hook] (drill-rap)
  la cité, c'est ma vie
  la cité, c'est mon sang
  la cité, je ne pars pas
  la cité, c'est ma famille

  [Verse 2]
  RER B vers Paris, le matin je remonte
  costume sur l'épaule, le code switch
  ils me regardent, ils ne savent pas
  je rentre le soir, le 93 me rappelle

  [Hook]
  la cité, c'est ma vie
  la cité, c'est ma famille

  [Bridge]
  (piano loop, drums drop)
  [Spoken] le 93 reste le 93
  la cité reste la cité

  [Final Hook] (808 + Auto-Tune)
  la cité (la cité), c'est ma vie
  la cité (la cité), c'est mon sang

  [Outro]
  (808 fade) la cité
  [End]

