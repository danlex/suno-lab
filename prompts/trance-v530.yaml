style: "The last night of summer over a festival field, violet dawn bleeding in while the crowd still moves — uplifting vocal trance at full density, polished studio mix with deep low-end definition and wide stereo stage. B minor, 140 BPM. Euphoric supersaw lead stacks detuned oscillators chopping on every sixteenth-note lock; rolling trance bassline drives a sidechained pulse that never drops even through breakdown; shimmering arps cycle sixteenth-note patterns that cascade and keep the texture continuously full. White-noise risers build pressure into every drop, gated reverb crashes land on the four. A soaring female voice belts the hook with genuine melodic lift — descending fifth on the first word, a major-seventh climb held four beats on the second. Wide stereo stage on the arps, warm tape saturation on the pads, Decca-tree imaging on the supersaw layers. No guitars, no acoustic drums, no pipe organ, no live instruments, no rap."

lyrics: |
  [Intro: supersaw arps building, 8 bars]

  [Verse 1: bassline enters, female vocal, 16 bars]
  Grass still wet beneath my feet
  We stayed until the field turned gold
  Your face the last thing the night knew
  Every light we made our own

  [Pre-Chorus: riser building, 8 bars]
  The sky is turning
  I can feel it coming through

  [Drop 1: full supersaws, belted hook, 16 bars]
  Violet sky
  Violet sky
  Violet sky
  Violet sky

  [Verse 2: arps and bassline full, 16 bars]
  We ran the hours down to bone
  And left our names inside the air
  The morning coming for us all
  But not yet, not yet, stay right there

  [Pre-Chorus 2: riser builds, 8 bars]
  The sky is turning
  I can feel it coming through

  [Breakdown: arps and bass moving, 16 bars]
  (arps rolling, pads breathing)

  [Build: supersaws stacking, riser, 8 bars]

  [Drop 2: full supersaws, gated crashes, 24 bars]
  Violet sky
  Violet sky
  Violet sky
  Violet sky

  [Outro: arps cascade, vocal holds, 8 bars]
  Violet sky — stay

  [End]

