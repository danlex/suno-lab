notes: |
  Uplifting vocal trance constructed around the ownable two-syllable hook "Violet sky" — a descending perfect fifth on the first syllable and a major-seventh climb held four beats on the second, locked to the 16th-note supersaw chop at 140 BPM. The scene is the last night of a summer festival: violet pre-dawn sky, bittersweet euphoria of the crowd still together as the night ends, the specific emotional texture of collective loss and beauty overlapping.

  Duration strategy: the arc is intro → verse → pre-chorus → full drop → second verse → pre-chorus → breakdown (arps and bass kept MOVING, not exposed or silent — v527 lesson: sparse mid-song sections truncate) → build riser → bigger drop → outro. The breakdown deliberately retains arps and rolling bassline to prevent the silence-gate truncation failure mode. Final belted hook lands at approximately 2:40+ for a target of 3:15–3:45. The mid-song Drop 1 section (~30-40s) is full and beat-driven, not stripped, to keep density high throughout.

  Playbook moves applied: parametrized colon-lyrics with bar counts (each bracket has label: descriptor, N bars); production-mix tokens in style (polished studio mix, deep low-end definition, wide stereo stage, warm tape saturation, Decca-tree imaging); sentence case throughout; atmospheric-first opening (festival field violet dawn before genre label); five inline negatives at end of style.

  Trio: EUPHORIC SUPERSAW LEAD (thick detuned oscillator stacks chopping on every 16th lock — the melody carrier and drop anchor); ROLLING TRANCE BASSLINE (sidechained pulse maintaining rhythmic and harmonic drive even under the breakdown — the duration lever); SHIMMERING ARPS (cascading 16th-note patterns filling the mid-range continuously — prevent sparse-section truncation). All three are electronic-native — no spectral body-voice concern applies in the trance lane.

  Key: B minor, non-modulation arc (parallel-major lift acceptable on the final drop but not mandated). BPM: 140, proven duration band for 3:15–3:45 wall-clock.

  Novelty: the "Violet sky" hook contour (P5 descent + M7 leap held four beats) is melodically specific and ownable. The breakdown-stays-dense instruction directly addresses the v527 truncation failure. Festival pre-dawn scene (bittersweet euphoria, last-night-of-summer) is not a standard trance lyric frame.

