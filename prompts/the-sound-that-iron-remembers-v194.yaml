notes: "v194: NAIL VIOLIN first use — 1740s friction idiophone, iron nails bowed with horsehair creating sustained glassy metallic wail. Subcontrabass saxophone (gap=53, deepest woodwind), cristal baschet (gap=50, glass friction rods). All three produce sustained tones through friction/breath — three completely different mechanisms creating otherworldly sustains. 79 BPM unused. F# minor → G minor half-step up. Theme: the memory stored in metal — what iron remembers from the forge, the blacksmith's hammer, the anvil."
