notes: "v137 — ORCHESTRAL ORGANUM. Medieval polyphonic technique — organum parallelum, parallel voices moving in perfect consonant intervals (4ths, 5ths, octaves) above/below a cantus firmus. Notre Dame school (1160-1250), Léonin and Pérotin developed three- and four-voice organum (organum triplum, quadruplum) from earlier two-voice parallel motion. **First ~3-minute song (duration cap lifted per user request).** Composer names omitted per blocklist. DURATION: Full 3-min arc — 0:25 / 1:00 / 2:00 / silence 2:10 / return 2:15 / end 2:50. INSTRUMENTS: Harpsichord (×2, last v121 — 16-gap) = Baroque-era plucked keyboard standing in for medieval keyboard, clean attack ideal for parallel-voice articulation. Hardanger fiddle (×2, last v124 — 13-gap) = Norwegian bowed string with sympathetic resonance strings, sustaining voice. Added 'Scandinavian folk' to exclude_styles to prevent folk-music drift. Marimba (×2, last v121 — 16-gap) = pitched wooden mallet, clean percussive lower voice. All three can move in strict parallel motion clearly. NOVELTY: First organum. 72 BPM = never used. G minor well-established but still resonant. Forest-at-dawn = novel image. Sacred/still/resonant emotion. 933 chars."
