name: "the-forest-that-sings-in-fifths"
version: 137
style: "ORCHESTRAL ORGANUM film score for a snow-silent-forest-clearing-at-dawn scene, total duration around 3:00, with HARPSICHORD + HARDANGER FIDDLE + MARIMBA, medieval parallel-voice polyphony where three lines move in consonant 4ths, 5ths, octaves, G minor to A-flat minor, 72 BPM, instrumental. From 0:00 harpsichord alone states a plainchant-shaped melody, slow and measured. At 0:25 hardanger fiddle joins five notes higher in strict parallel, sympathetic strings resonating. At 1:00 marimba enters an octave below, wooden pulses on every strong beat, three voices locked in consonant motion. At 2:00 orchestra enters, strings doubling the organum, woodwinds sustaining the drone, brass in parallel 5ths. Silence at 2:10 — five seconds of forest stillness. At 2:15 music returns in A-flat minor half-step up, fortississimo, parallel motion preserved. Ends at 2:50. No guitars, no vocals, no rock drums, no pipe organ, no synthesizers."
title: "The Forest That Sings in Fifths"
lyrics: |
  [Short Instrumental Intro]
  [Plainchant Alone]
  [Parallel Voice Five Notes Higher]
  [Octave Below Wooden Pulse]
  [Three-Voice Consonance]
  [Orchestral Organum Bloom]
  [Peak Consonance]
  [Silence]
  [Return Half-Step Up]
  [End]
