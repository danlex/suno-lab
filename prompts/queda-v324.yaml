notes: |
  Latin sad-trap is a 2024-2026 streaming phenomenon defined by the collision of
  trap production architecture — rolling 808 sub-bass, sparse snare on beat three,
  half-time BPM feel — with intimate romantic-confessional vocal delivery and
  minor-key cinematic string textures. The genre owns the breakup and absence
  emotional register on short-form platforms, with documented 29% Spotify royalty
  growth in the Latin streaming segment through 2025-2026. Its distinguishing formal
  feature is brevity by design: the TikTok hook-to-verse structure targets 2:30-2:45
  wall-clock, not 3:00+. Duration short-form is genre-appropriate, not a failure.

  Concept source (researcher): v324 "Queda" — Latin sad-trap ballad × cinematic
  strings. Deliberate VIRAL PIVOT after eight monumental cycles (v316-v323). The
  absent person as compositional premise: "what remains is the smoke of what you
  were." 2am apartment, blue TV light, half-empty glass — the scene is the lyric.

  Composer-omission: this cycle inhabits a production territory defined by a small
  number of Latin urban artists whose catalog names are withheld per discipline.
  Their shared sonic grammar — 808 anchor, intimate spoken-sung delivery, weeping
  solo string over minimal trap percussion — is cited here as genre context without
  attribution.

  Duration strategy: this is an explicit VIRAL ARM cycle per feedback_viral_arm.md.
  The playbook's duration-maximizing constraints (240+ bar counts, Build/Silence/Drop
  stack, BPM 130-160 for 4:00+ targets) are SUSPENDED for this cycle. Target is
  2:30-2:45 — TikTok form factor. Latin sad-trap classifier caps at ~2:45 by genre
  convention; accepting that ceiling is correct here, not a bug. BPM 88 reads as
  ~44 BPM half-time feel, appropriate to slow-heavy grief pulse. G minor provides
  the minor-key heartbreak palette. The final chorus half-step lift (implied G minor
  to A-flat minor) is the sole modulation — the classic sad-trap emotional release
  point. NO [Silence] metatag per feedback_silence_gate_truncates.md. Colon-syntax
  lyrics with 2-6 word descriptor labels per feedback_lyrics_balance.md; timestamps
  in brackets for Suno's timing anchors. Production tokens applied: warm tape
  saturation, deep low-end definition, polished studio mix (three tokens, playbook
  rule 2). Sentence case throughout. Atmospheric-first opening anchors "Latin
  sad-trap ballad cinematic" in the first clause — fresh viral classifier territory.
  Rule overrides from feedback_viral_arm.md: instrumental false, 808 and trap
  percussion allowed, exclude_styles replaces standard cinematic list with
  genre-correct negatives.

  Instruments with catalog gaps:
  - 808 sub-bass (production body voice; last in trap context v297, gap 27; in
    Latin sad-trap context: catalog debut framing): the rolling sub-frequency
    foundation that defines the genre. Not a melodic instrument — it pulses with
    the half-time feel, carries weight without filling space. Opens the track before
    any other element except the acoustic guitar intro hit. The genre anchor.
  - cello solo (string body voice; last as solo lead v178, gap 146 — deep revival
    in this emotional register): the weeping melodic voice. Not supporting strings
    — the cello IS the melody when the voice rests, bending phrases and sustaining
    grief. Enters at 0:25 as foreshadowing, rises to full weeping lead at chorus,
    lifts a half-step in the final chorus. The emotional center of the arrangement.
  - acoustic guitar fingerpicked (texture body voice; last v178 era, gap ~146;
    in this intimate dry role: fresh framing): opens the track alone for 8 seconds
    before the 808 enters — this establishes the intimate scale before the trap
    pulse arrives. Drops out for verse 2 (stripped-down moment), returns in final
    chorus for fullness. Texture not rhythm; never strums.

  Vocal direction: male tenor in Latin-American Spanish, Bad-Bunny-territory
  phonetics (not Spain Castilian). Verse register: half-spoken, conversational,
  near-talking — the emotional rawness of not-quite-singing. Chorus register: lifted,
  emotionally strained, not pop-processed. Bridge register: near-whispered, almost
  spoken word. This is the 63rd orthogonal vocal architecture in the catalog —
  distinct from v320 heldentenor (dramatic operatic), v322 countertenor (falsetto),
  v313 bass-baritone (Romantic-opera), v314 clean tenor (post-black metal), v299
  bel canto Italian tenor, v323 lyric soprano sustained. None used Spanish-language
  intimate-raw sad-trap register.

  Novelty claims: genre-novelty (Latin sad-trap ballad — first use of this specific
  sub-genre in the catalog; v260 drift phonk was the only prior viral-arm entry);
  voice-novelty (63rd orthogonal vocal architecture: male tenor, Spanish-language,
  half-spoken conversational verses, lifted-but-not-operatic chorus, near-whispered
  bridge — zero prior catalog occurrence of this register stack); BPM-revival (88
  BPM last used v271, gap 53 — fresh); key-revival (G minor last v298, gap 26 —
  fresh); scene-novelty (2am apartment, blue TV light, absent person as spatial
  presence — no prior catalog scene with this architecture of domestic grief);
  concept-novelty (viral-arm Latin sad-trap with cinematic cello lead — only second
  viral-arm cycle in catalog history after v260).

