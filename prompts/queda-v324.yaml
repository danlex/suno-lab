title: "Queda"
instrumental: false
vocal_gender: male

style: "Latin sad-trap ballad cinematic — a small apartment at 2am, blue TV light on the wall, the absence shaped like a person. Warm tape saturation, deep low-end definition, polished studio mix. G minor, 88 BPM half-time pulse. Rolling 808 sub-bass anchors the low end; fingerpicked acoustic guitar opens alone, dry and close. Solo cello enters as the weeping melodic voice — the emotional lead, not accompaniment — bending phrases as if breathing through grief. Male tenor in a half-spoken register for the verses, voice lifted at the chorus without operatic weight, nearly whispered at the bridge. Sparse trap snare on beat three only, no hi-hat rolls, no dembow kick. String pad swell at chorus only. Final chorus lifts a half-step, cello rises with it, song ends on a held chord fading into the room. Short-form Latin trap ballad, 2:30-2:45. No guitars as lead, no English vocals, no pipe organ, no synthesizer lead, no rock drums."

lyrics: |
  [Guitar and 808 intro, 0:00-0:08]

  [Verse 1 — half-spoken, 0:08-0:40]
  Cierro los ojos y sigues aquí
  tu voz en el cuarto, el humo y el fin
  la noche me pesa sin ti, sin ti
  el vacío que dejaste en mí

  [Cello sustain at 0:25]
  queda el dolor
  queda el amor que ya no está

  [Chorus 1 — cello swell, doubled vocal, 0:40-1:10]
  Solo queda el humo de lo que fuiste
  las luces apagadas y el frío que persiste
  te fuiste, te fuiste
  y la lluvia no perdona lo que existe
  queda — queda — queda

  [Verse 2 — stripped, 808 and voice, 1:10-1:40]
  camino el silencio buscando señales
  cenizas de noches y voces que duelen
  soledad que no cabe en palabras normales
  amor que se quiebra — se pierde, se muere

  [Bridge — near-whispered, 1:40-2:00]
  ya no estás
  una sola palabra
  queda

  [Final chorus — half-step lift, 2:00-2:35]
  Solo queda el humo de lo que fuiste
  las luces apagadas y el frío que persiste
  te fuiste, te fuiste
  y la lluvia no perdona lo que existe
  queda — queda — queda

  [Held chord fade]

  [End]

